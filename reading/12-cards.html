<style>
:root{--bg:#f7f8f5;--card:#fff;--ink:#20332f;--muted:#5d6e69;--line:#dfe5e1;--acc:#176c63;--acc2:#e3f1ec;--s0:#c2453a;--s1:#e7a93b;--s2:#2e9b6a;--s9:#d7ddd9}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
a{color:var(--acc);text-decoration:none}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.tile h2 small{font-size:13px;color:var(--muted);font-weight:400}

.stat b{color:var(--ink)}

.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{display:inline-flex;align-items:center;gap:4px;border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px;background:var(--acc);color:#fff;border:0;cursor:pointer}
.btn.ghost{background:var(--acc2);color:var(--acc)}
.decks{display:flex;flex-direction:column;gap:6px}
.deck{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:#f4f7f5;color:var(--ink)}
.deck:hover{background:var(--acc2)}
.deck b{flex:1;font-weight:600;font-size:14px}
.deck span{font-size:12.5px;color:var(--muted)}
.deck span.due{color:var(--s0);font-weight:600}
.browse{margin-top:22px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.tabs button,.chips button,.subtabs button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on,.subtabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.tools input{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;background:#fff}
.chips,.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs{margin:8px 0 2px}
.groups{columns:2 420px;column-gap:14px}
details{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;padding:4px 0}
summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;align-items:center;gap:8px}

summary span{font-size:12.5px;color:var(--muted)}
summary .bar{width:70px;flex:none}
ol{list-style:none;margin:0;padding:0 6px 6px}

li .tag{flex:none;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-top:3px}
li .due{flex:none;font-size:11.5px;color:var(--s0);margin-top:3px}
.empty{color:var(--muted);padding:20px 4px}
.legend{font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}

疏，通用硬件无法直接加速，需要专门的稀疏算子或特定稀疏模式支持", "理解"]]}, {"name": "对齐与分布式推理", "items": [["g7-9", "MoE 的路由怎样工作？负载不均衡会造成什么后果，怎样缓解？", "MoE 把前馈层替换成多个专家，路由网络对每个 token 计算各专家的打分，取 top-k 个激活并按归一化权重加权求和", "必背"], ["g7-10", "数据并行、张量并行、流水线并行、专家并行各切分什么？怎样组合？", "数据并行切分样本，每张卡持有完整模型副本，反向后对梯度做全归约，通信量与参数量成正比", "必背"], ["g7-11", "prefill 和 decode 阶段的瓶颈分别是什么？连续批处理为什么有效？", "prefill 一次处理整个提示，矩阵乘法规模大，算力利用率高，受算力限制", "必背"], ["g7-12", "投机解码为什么能加速？它会改变输出分布吗？", "草稿模型快速生成若干候选 token，目标模型对这几个位置做一次并行前向即可拿到全部位置的概率，再逐位置做接受或拒绝判定", "必背"]]}, {"name": "生成模型", "items": [["g9-9", "无分类器引导（CFG）怎样工作？引导强度越大越好吗？", "训练时以一定概率丢弃条件，使同一模型同时学会条件生成和无条件生成", "必背"], ["g9-14", "DDPM 的前向与反向过程是什么？预测噪声、预测原图、预测速度三种参数化有什么区别？", "前向过程按预定方差表逐步加高斯噪声，任意步的边缘分布可以闭式写出，训练时可直接采样任意时刻而不必迭代", "必背"]]}, {"name": "多模态与 RAG", "items": [["g1-7", "RAG、微调和工具调用怎样选择？", "RAG 在回答时检索外部资料，适合知识更新快、需要来源或访问私有文档的任务", "必背"]]}, {"name": "强化学习与 Agent", "items": [["g1-6", "Agent、Workflow 和普通 LLM 调用有什么区别？", "普通 LLM 调用主要根据输入生成输出，Workflow 用预定义的代码路径组织模型和工具，Agent 则让模型结合环境反馈动态选择下一步动作", "必背"]]}]}, {"id": "general", "emo": "📚", "name": "通用八股", "desc": "机器学习、深度学习、大模型高频题", "groups": [{"name": "机器学习与评估", "items": [["g1-1", "交叉熵、负对数似然与 KL 散度有什么关系？", "交叉熵是在目标分布下，对预测概率取负对数后的平均", "必背"], ["g1-2", "Precision、Recall、F1、macro-F1 与 AUC 分别衡量什么？", "精确率回答预测为正的样本有多少是真的，召回率回答真实正例找回了多少，F1 是两者的调和平均", "必背"], ["g1-3", "训练、验证、测试集各做什么，反复用验证集会有什么问题？", "训练集用于拟合参数，验证集用于选择超参数、数据策略和早停位置，测试集用于流程确定后的最终评价", "必背"], ["g1-4", "怎样求伯努利参数的极大似然估计，MLE 与 MAP 有何区别？", "先假设各次观测独立、成功概率都为 p", "必背"], ["g1-8", "线性回归与逻辑回归的输出、损失和假设有什么区别？", "线性回归用特征的线性组合预测连续值，常通过最小化平方误差拟合", "必背"], ["g1-9", "基准污染指什么？怎样检测和缓解？", "污染指测试集内容以某种形式出现在训练数据中，导致评测分数虚高", "理解"], ["g3-8", "决策树怎样选分裂，信息增益、Gini 与剪枝是什么？", "决策树在每个节点比较候选特征和阈值，选择能降低目标不纯度或回归误差的划分，再递归处理子节点", "必背"], ["g4-8", "随机森林和 GBDT 分别怎样集成，为什么不能混称？", "随机森林在样本和特征上引入随机性，训练多棵树后平均或投票，常用于降低高方差树模型的方差", "必背"], ["g5-8", "类别不平衡怎样处理，为什么高准确率不代表模型有效？", "先看业务中的正负定义、错误代价与真实类比例", "必背"], ["g7-7", "XGBoost 如何利用一阶和二阶信息，怎样处理复杂度和缺失值？", "XGBoost 在当前模型附近对损失做二阶展开，用样本的一阶梯度和 Hessian 汇总计算叶子权重及分裂收益，并加入树复杂度和叶权重正则", "必背"], ["gm-8", "特征值分解和奇异值分解有什么区别？SVD 的几何意义是什么？", "特征分解只适用可对角化方阵，SVD 对任意矩阵是旋转、缩放、再旋转", "高频"], ["gm-9", "PCA 和 SVD 是什么关系？为什么实际实现常用 SVD 求主成分？", "对中心化数据做 SVD，右奇异向量就是主成分方向", "必背"], ["gm-10", "KD-Tree 怎样加速 KNN 的最近邻搜索？为什么在高维数据上会失效？", "按维度中位数递归切分，回溯时用到超平面的距离剪枝", "高频"], ["gm-11", "KNN 常用哪些距离度量？各适合什么数据？", "闵可夫斯基族 p 取 1、2、无穷，文本向量用余弦", "高频"], ["gm-12", "KNN 和 K-Means 都有一个 K，它们有什么区别？", "KNN 有监督，K 是邻居数，K-Means 无监督，K 是簇数", "高频"], ["gm-13", "最小二乘的闭式解是什么？几何意义是什么，什么时候解不唯一？", "正规方程 XᵀXw = Xᵀy，预测是 y 在列空间上的正交投影", "必背"], ["gm-14", "为什么说最小二乘等价于高斯噪声下的极大似然估计？换成 MAE 对应什么噪声？", "高斯对数似然只剩平方误差项，拉普拉斯噪声对应绝对误差", "高频"], ["gm-15", "Ridge 回归的闭式解是什么？为什么能缓解多重共线性，它对应什么先验？", "XᵀX 加 λI 后必可逆，等价于零均值高斯先验下的 MAP", "必背"], ["gm-16", "为什么 Lasso 能得到稀疏解，而 Ridge 只把系数压小却不为零？", "L1 菱形约束的顶点在坐标轴上，零点次梯度区间能吸收小梯度", "必背"], ["gm-17", "ElasticNet 解决了 Lasso 的哪些问题？", "L1 加 L2，相关特征成组保留，特征多于样本时不受 n 个上限", "高频"], ["gm-18", "多重共线性对线性模型有什么影响？怎么检测和处理？", "系数方差膨胀、符号可能反常，用 VIF 检测，用正则或删并特征处理", "高频"], ["gm-19", "极大似然估计一定是无偏的吗？样本方差为什么要除以 n − 1？", "MLE 一般有偏但渐近无偏，高斯方差的 MLE 除以 n 会低估", "理解"], ["gm-20", "逻辑回归的系数怎么解释？什么是对数几率？", "线性部分预测对数几率，系数取指数就是优势比", "高频"], ["gm-21", "多分类时用 Softmax 回归和训练 K 个一对多的逻辑回归有什么区别？", "Softmax 输出互斥且和为一，一对多各自独立，适合多标签", "高频"], ["gm-22", "逻辑回归和 SVM 有什么区别？各自适合什么场景？", "LR 用对数损失输出概率，SVM 用合页损失只由支持向量决定", "必背"], ["gm-23", "判别式模型和生成式模型有什么区别？朴素贝叶斯和逻辑回归分别属于哪一类？", "判别式直接建模 P(y|x)，生成式建模联合分布再用贝叶斯公式", "必背"], ["gm-24", "朴素贝叶斯的原理是什么？条件独立假设不成立时，为什么分类效果仍然不错？", "后验正比于先验乘各特征似然之积，最大后验的类别对了就分对", "必背"], ["gm-25", "朴素贝叶斯为什么需要拉普拉斯平滑？平滑后的概率怎么计算？", "零计数会让整个后验为零，分子加 α、分母加 α 乘取值数", "必背"], ["gm-26", "高斯、多项式和伯努利朴素贝叶斯有什么区别？各用在什么数据上？", "连续值用高斯，计数用多项式，出现与否用伯努利", "高频"], ["gm-27", "SVM 的原始问题是什么？怎样推导出对偶问题，为什么要转到对偶求解？", "最小化 ½‖w‖²，代入拉格朗日驻点条件得到只含内积的对偶", "必背"], ["gm-28", "SVM 的 KKT 条件说明了什么？哪些样本是支持向量？", "互补松弛使 α 大于零的样本恰好在间隔边界上或越界", "必背"], ["gm-29", "什么样的函数可以作为核函数？RBF 核的 γ 和惩罚系数 C 怎样影响模型？", "核矩阵对任意样本集都半正定，γ 大边界复杂，C 大越界惩罚重", "高频"], ["gm-30", "SMO 算法怎样求解 SVM 的对偶问题？为什么每次要选两个变量？", "等式约束要求至少同时改两个乘子，两变量子问题有闭式解", "理解"], ["gm-31", "ID3、C4.5 和 CART 三种决策树有什么区别？", "ID3 信息增益多叉，C4.5 增益比可剪枝，CART 用基尼二叉且能回归", "必背"], ["gm-32", "CART 分类树和回归树分别怎样选择切分点？基尼指数和熵有什么关系？", "分类最小化加权基尼，回归最小化两侧平方误差和，叶子输出均值", "高频"], ["gm-33", "决策树的预剪枝和后剪枝有什么区别？CART 的代价复杂度剪枝怎样做？", "预剪枝提前停，后剪枝先长满再剪，CART 最小化误差加 α 乘叶子数", "高频"], ["gm-34", "决策树怎样处理缺失值？C4.5 和 CART 的做法有什么不同？", "C4.5 按非缺失比例折算增益并按权重分流，CART 用代理分裂", "理解"], ["gm-35", "AdaBoost 的样本权重和学习器权重怎样更新？", "错误率越低学习器权重越大，错分样本权重乘 e 的 α 次方", "必背"], ["gm-36", "AdaBoost 和 GBDT 有什么区别？为什么说 AdaBoost 对噪声敏感？", "AdaBoost 是指数损失下的前向分步，改样本权重，GBDT 拟合负梯度", "高频"], ["gm-37", "Bagging 为什么能降低方差？为什么基学习器要选深树这类低偏差、高方差的模型？", "T 个相关系数为 ρ 的模型取平均，方差下限是 ρσ²", "高频"], ["gm-38", "平方损失下的偏差方差分解怎么推导？分解成立需要什么条件？", "加减期望预测后展开，交叉项期望为零，剩偏差平方、方差、噪声", "高频"], ["gm-39", "怎样用学习曲线判断模型是高偏差还是高方差？增加数据一定有用吗？", "两条曲线都高且贴近是高偏差，间隙大是高方差，加数据只对后者有效", "高频"], ["gm-40", "癌症筛查、垃圾邮件过滤、欺诈检测和推荐排序分别应该重点看什么指标？", "漏报代价高看召回，误报代价高看精确率，排序看 AUC 或 NDCG", "必背"], ["gm-41", "AUC 怎样用排序直接计算？为什么 AUC 不受正负样本比例影响？", "正样本秩和减去 M(M+1) 的一半，再除以正负样本对数", "高频"], ["gm-42", "ROC 曲线和 PR 曲线有什么区别？正负样本极不平衡时应该看哪个？", "ROC 的 FPR 分母是全部负例，负例极多时变化小，PR 对稀少正例更敏感", "必背"], ["gm-43", "F1 为什么用调和平均？F-beta 中的 β 怎么选？", "调和平均靠近较小值，β 大于 1 偏召回，小于 1 偏精确率", "高频"], ["gm-44", "K-Means++ 是怎样选初始中心的？为什么比随机初始化好？", "按到最近已选中心距离的平方成比例抽样，让初始中心彼此分散", "高频"], ["gm-45", "K-Means 一定会收敛吗？它和高斯混合模型是什么关系？", "每步不增大簇内平方和且划分有限，必收敛到局部最优，是硬分配的 EM", "高频"], ["gm-46", "K-Means 的 K 怎么选？肘部法则和 Gap 统计量分别怎么用？", "看簇内平方和下降的拐点，或与均匀参考数据比较紧凑程度的差距", "高频"], ["gm-47", "DBSCAN 的原理是什么？核心点、边界点和噪声点怎样定义，参数怎么选？", "eps 邻域内点数不少于 MinPts 为核心点，密度可达的点连成一簇", "必背"], ["gm-48", "层次聚类怎样工作？单链接、全链接、平均链接和 Ward 链接有什么区别？", "凝聚式每步合并最近的两簇，链接方式决定簇间距离怎么算", "必背"], ["gm-49", "轮廓系数怎样计算？取值代表什么，有什么局限？", "最近邻簇平均距离 b 减簇内平均距离 a，再除以两者较大值", "高频"], ["go-22", "pass@k 怎样计算？为什么要用无偏估计？maj@k 又是什么？", "每题采 n 个样本数出 c 个正确，用组合数算至少一个正确的概率", "高频"], ["gi-31", "怎样证明 RL 之后的效果提升来自强化学习本身，而不是多训练了步数或数据？", "用同数据同算力的 SFT 做对照，比较 pass@k 曲线和分布外表现", "理解"], ["gi-40", "如何系统地评估一个大模型？", "按能力维度建评测集，自动指标、评判模型与人工结合，再看效率、鲁棒性和线上指标", "必背"], ["gi-41", "构建一个评测基准（benchmark）时需要考虑哪些因素？", "覆盖目标能力、难度有梯度、答案可验证、防污染、有区分度、评测协议固定", "高频"], ["gi-42", "GSM8K、MATH、HumanEval、HellaSwag、IFEval 这些常见基准分别测什么？", "小学应用题、竞赛数学、函数补全、常识续写选择、可程序检查的指令遵循", "高频"], ["gi-43", "用大模型做评判（LLM-as-a-Judge）时，怎样验证评判结果本身可靠？", "和人工标注比一致率，查交换顺序与重复评判的自洽性，用对照样本测偏置", "高频"], ["gi-44", "大模型评测分数波动很大，怎样让评测结果更稳定？", "固定协议、多次采样取平均、扩大题量、评判用零温度、报告置信区间", "高频"], ["gi-45", "代码生成能力怎么评估？pass@k 怎么计算？", "跑单元测试判对错，每题采样 n 次后用组合数无偏估计 pass@k", "高频"], ["gi-46", "大模型上线后的效果明显比离线评测差，怎么排查？", "依次查输入分布偏移、提示与模板一致性、推理配置、上下游链路和评测集代表性", "必背"], ["gi-48", "KL 散度对称吗？用单峰高斯 Q 拟合双峰分布 P 时，最小化 KL(P‖Q) 和 KL(Q‖P) 结果有什么不同？", "不对称，前向 KL 覆盖所有峰得到宽分布，反向 KL 集中在一个峰上", "高频"]]}, {"name": "深度学习基础", "items": [["gd-1", "感知机的模型和学习规则是什么？为什么单层感知机解决不了异或问题？", "感知机用一个超平面分两类，异或线性不可分，单层做不到", "高频"], ["gd-2", "万能近似定理说了什么？既然单隐层网络就能逼近任意连续函数，为什么还要用深层网络？", "单隐层够宽即可逼近，深层用更少参数表示同样复杂的函数", "高频"], ["gd-3", "Sigmoid、Tanh 和 ReLU 各有什么优缺点？为什么隐藏层现在多用 ReLU 类激活？", "Sigmoid 饱和且非零中心，Tanh 零中心仍饱和，ReLU 不饱和但会死亡", "必背"], ["gd-4", "什么是死亡 ReLU？Leaky ReLU、PReLU 和 ELU 怎样缓解它？", "输入长期为负则梯度恒为零，给负区间一个非零斜率即可缓解", "高频"], ["gd-5", "自动微分的前向模式和反向模式有什么区别？深度学习为什么用反向模式？", "前向模式一次求一个输入方向的导数，反向模式一次得到全部参数梯度", "高频"], ["gd-6", "静态计算图和动态计算图有什么区别？PyTorch 的计算图是怎样构建的？", "静态图先定义后执行便于编译优化，动态图边执行边建图便于调试", "高频"], ["gd-7", "一个变量在计算图里被多处使用时，它的梯度怎样计算？PyTorch 为什么每步都要调用 zero_grad？", "多条路径的梯度相加，PyTorch 默认累加 grad，所以每步要先清零", "理解"], ["gd-8", "model.eval()、torch.no_grad() 和 detach() 分别起什么作用？", "eval 切换层的行为，no_grad 不建图，detach 把张量从图上切下", "高频"], ["gd-9", "张量的 stride 是什么？transpose、view、reshape 和广播怎样利用 stride？", "stride 是每一维走一步跨过的元素数，改 stride 即可免拷贝变形", "理解"], ["gd-12", "Softmax 有哪些性质？它和 Sigmoid 是什么关系？多标签分类应该用哪一个？", "互斥类别用 Softmax，两类即 Sigmoid，多标签逐个 Sigmoid", "必背"], ["gd-13", "Softmax 的雅可比矩阵是什么？它与交叉熵组合后，对 logits 的梯度为什么化简成 ŷ − y？", "雅可比为 diag(ŷ) − ŷŷᵀ，与交叉熵的 ŷ 倒数相乘抵消得 ŷ − y", "理解"], ["gd-14", "标签平滑是什么？它为什么能缓解模型过度自信？", "把 one-hot 换成与均匀分布的混合，防止 logits 无限增大", "高频"], ["gd-15", "卷积层的参数量和计算量怎么算？", "参数量 C_out·C_in·K² 加偏置，计算量再乘输出尺寸 H′·W′", "必背"], ["gd-16", "卷积和池化的输出尺寸怎么算？padding 和 stride 分别起什么作用？", "输出边长为 H + 2P − K 除以 S 向下取整再加 1", "必背"], ["gd-17", "什么是感受野？怎样计算？为什么用两个 3×3 卷积代替一个 5×5 卷积？", "感受野是输出单元依赖的输入区域，堆小 、长期记忆与上下文压缩如何区分？", "短期记忆保存当前任务的消息、计划和工具状态，通常进入上下文或任务状态", "必背"], ["g3-9", "RLHF 的完整流程包含哪几个模型？各自的作用和显存开销是什么？", "标准 PPO 流程涉及四个模型", "必背"], ["g3-10", "可验证奖励的强化学习（RLVR）适用于什么场景？", "RLVR 用规则或程序直接判定正确性作为奖励，例如数学答案比对、代码单元测试、格式校验", "必背"], ["g3-11", "过程奖励模型和结果奖励模型有什么区别？各自怎样标注？", "结果奖励只对最终输出打分，标注成本低，但对长推理链只能提供稀疏信号，无法指出错在哪一步", "理解"], ["g6-6", "Agent 为什么要记录 trace，应该评价哪些指标？", "最终答案成功率能说明任务是否完成，却不能解释失败发生在哪一步", "必背"], ["g6-7", "什么是提示注入，Agent 应如何保护工具权限？", "提示注入是把恶意指令混入用户输入、网页、检索文档或工具返回，诱导模型偏离原任务或越权操作", "必背"], ["g7-6", "Agent 链路很慢，如何判断该并行、缓存还是减少调用？", "先按 trace 拆分模型推理、工具执行、网络和等待时间，再画出真实依赖", "必背"], ["g8-1", "什么时候用多 Agent，为什么多个角色不一定更好？", "它能隔离上下文并利用不同工具，但增加通信、重复工作和状态一致性成本", "必背"], ["gt-44", "状态价值、动作价值和优势函数是什么关系？贝尔曼最优方程是什么？", "V 是 Q 按策略加权平均，Q 是即时奖励加折扣后继 V，A 等于 Q 减 V", "必背"], ["gt-45", "策略迭代和价值迭代有什么区别？", "策略迭代交替完整评估与贪心改进，价值迭代直接反复做最优贝尔曼更新", "高频"], ["gt-46", "蒙特卡洛方法和时序差分方法在估计价值时有什么区别？", "蒙特卡洛等整条轨迹用真实回报，无偏高方差，TD 用下一步估计自举，有偏低方差", "必背"], ["gt-47", "SARSA 和 Q-learning 有什么区别？为什么一个是同策略一个是异策略？", "SARSA 用实际执行的下一动作，Q-learning 用下一状态的最大 Q 值", "必背"], ["gt-48", "强化学习算法有哪几种常见的分类方式？", "在线与离线、同策略与异策略、基于模型与无模型、基于价值与基于策略", "高频"], ["gt-49", "策略梯度定理说了什么？REINFORCE 怎样估计梯度？", "梯度等于 Q 值乘对数概率梯度的期望，REINFORCE 用蒙特卡洛回报代替 Q", "必背"], ["gt-50", "策略梯度中减去基线为什么能降低方差而不引入偏差？", "基线只依赖状态，乘对数概率梯度的期望为零，却能缩小系数幅度", "高频"], ["gt-51", "Actor-Critic 中 Critic 怎样训练？为什么可以用 TD 误差估计优势？", "Critic 用 TD 目标回归 V，V 准确时 TD 误差的期望等于优势", "高频"], ["gt-52", "GAE 是怎样估计优势的？λ 起什么作用？", "TD 误差按 γλ 指数加权求和，λ 调节偏差与方差", "必背"], ["gt-53", "TRPO 怎样限制策略更新幅度？PPO 的两个版本怎样简化它？", "TRPO 用 KL 信赖域，PPO 改成 KL 惩罚或裁剪比率", "高频"], ["gt-54", "把大模型生成建模成强化学习问题时，状态、动作、转移和奖励分别是什么？", "状态是提示加已生成前缀，动作是下一个 token，转移确定，奖励稀疏在末尾", "高频"], ["go-27", "Zero-shot-CoT 和 Few-shot-CoT 有什么区别？Zero-shot-CoT 为什么要调用两次模型？", "少样本靠带推理的示例，零样本加一句提示词，第二次调用抽答案", "高频"], ["go-28", "Self-Consistency 是怎样提升思维链效果的？它适用于什么任务？", "温度采样多条推理路径，对最终答案多数投票", "必背"], ["go-29", "Tree of Thoughts 包含哪几个组成部分？它和 CoT、CoT-SC、GoT 有什么区别？", "拆思考步骤、生成候选、评估状态、BFS 或 DFS 搜索，可回溯", "高频"], ["go-30", "Self-Refine 是怎样工作的？它在什么情况下效果差？", "同一模型生成、给反馈、按反馈修改，循环到停止条件", "高频"], ["go-31", "Reflexion 和 Self-Refine 有什么区别？它的“语言强化”是什么意思？", "跨多次尝试，用环境反馈写反思存入记忆，下次读取，不更新权重", "高频"], ["go-32", "Agent 的规划模块有哪些做法？先规划后执行和 ReAct 交替执行有什么区别？", "子目标分解，先规划后执行或边想边做，外接规划器，失败后重规划", "必背"], ["go-33", "Anthropic 总结的五种 Agent 工作流模式是什么？各适合什么场景？", "提示链、路由、并行、协调者与工作者、评估与优化循环", "高频"], ["go-34", "基于大模型的 Agent 和传统强化学习 Agent 有什么区别？", "输入从向量变为文本，策略从小网络变为预训练模型，动作变为文本", "理解"], ["go-35", "怎样用强化学习训练模型主动调用搜索或代码工具？为什么要对工具返回的内容做损失掩码？", "策略输出检索标记，环境插入结果，规则奖励，工具输出不计损失", "高频"], ["go-36", "自动提示词优化有哪些代表方法？OPRO、APE、EvoPrompt 的思路有什么不同？", "提示不可导，用 LLM 提候选、开发集评分、迭代保留高分提示", "理解"], ["go-37", "上下文学习的示例怎样选择和排序？", "按语义相似选近邻并兼顾多样性，可训练检索器，顺序要验证", "高频"], ["gi-25", "有多个奖励信号（如正确性、格式、安全、有用性）时，强化学习中怎样融合？", "各奖励先归一化再加权，必须满足的条件做硬约束，并分别监控分项奖励", "高频"], ["gi-26", "强化学习的奖励用规则还是奖励模型？没有验证器的开放任务怎样获得奖励信号？", "能验证就用规则，不能验证就用奖励模型、带评分细则的生成式评判或伪标签", "必背"], ["gi-27", "大模型强化学习训练时，主要监控哪些指标来判断训练是否健康？", "奖励与验证集、KL、熵、回答长度、clip 比例和梯度范数，再加样例抽查", "必背"], ["gi-28", "强化学习训练中奖励一直不涨，应该怎么排查？", "依次查奖励函数、数据难度、采样配置、实现细节和学习率", "高频"], ["gi-30", "强化学习的训练题目怎么按难度筛选？GRPO 中组内全对或全错的题目怎么处理？", "保留通过率在 0 和 1 之间的题，零优势组过滤补采，简单题降权不全删", "高频"], ["gi-53", "怎样让模型稳定输出合法的 JSON 或工具调用格式？", "约束解码保证语法合法，执行前做 schema 校验和修复，选错工具靠检索和训练", "高频"], ["gi-54", "Agent 可用的工具有上千个时，怎样让工具调用又快又准？", "先检索少量候选工具再让模型选，工具分层组织，描述规范化并用数据微调", "高频"], ["gi-55", "Function Call 的训练数据怎么构造？训练时要注意什么？", "定义 schema，合成请求与调用，执行校验后 SFT，再用执行结果做 RL", "高频"], ["gi-56", "Agent 强化学习和单轮推理任务的强化学习最大的不同是什么？", "多轮交互，屏蔽观测 token，奖励稀疏、信用分配难，rollout 需异步", "高频"]]}, {"name": "多模态与 RAG", "items": [["g1-7", "RAG、微调和工具调用怎样选择？", "RAG 在回答时检索外部资料，适合知识更新快、需要来源或访问私有文档的任务", "必背"], ["g5-1", "InfoNCE 为什么是交叉熵，温度与负样本怎样影响学习？", "InfoNCE 将一个查询对应的正样本视为正确类别，把候选相似度当成分类 logits，所以可以用交叉熵提高正例相对概率", "必背"], ["g5-2", "CLIP 怎样对齐图像和文本，错误配对和多个正例怎么办？", "这类方法用不同编码器处理两种模态，再投影到共同的表示空间，通常归一化后计算相似度，通过配对监督拉高正确组合相对其他组合的分数", "必背"], ["g5-3", "掩码建模、因果建模与对比预训练的目标有何区别？", "掩码建模隐藏部分输入，让模型利用可见上下文恢复缺失内容，BERT 预测被选 token，MAE 重建图像被掩码部分", "必背"], ["g5-4", "为什么不能只按一个相似度分数清洗多模态预训练数据？", "相似度主要反映某个编码器认可的语义关系，并不完整代表事实正确性、声音质量、时间对齐和覆盖度", "必背"], ["g5-5", "多模态编码器怎样接入 LLM，投影层与 Q-Former 有何区别？", "常见结构先用模态编码器得到特征，再通过连接器映射到语言模型能处理的表示", "必背"], ["g5-6", "一个 RAG 系统从文档到答案包含哪些关键步骤？", "离线先解析文档、清理结构、切分片段并保存来源和权限元数据，再建立稀疏或向量索引", "必背"], ["g5-7", "怎样分别评价 RAG 的检索和生成，失败时怎样定位？", "检索侧检查相关文档是否召回以及排名，可用召回、MRR 或 NDCG", "必背"], ["g5-10", "SigLIP 相比 CLIP 改了什么？为什么小批量下更有优势？", "CLIP 用 softmax 形式的对比损失，归一化项要在整个批次上计算，因此需要极大批量才能提供足够的负样本，且分布式训练需要跨卡收集全部特征", "理解"], ["go-38", "RAG 的文本分块有哪些策略？各自的优缺点是什么？", "固定长度加重叠、递归分隔符、语义分块、按结构、命题级分块", "必背"], ["go-39", "RAG 检索前有哪些查询改写方法？HyDE、Step-Back、RAG-Fusion 分别怎么做？", "结合历史改写、多查询、拆子问题、退一步抽象、生成假设文档", "必背"], ["go-40", "为什么 RAG 要做稀疏与稠密混合检索？两路结果怎样融合？", "BM25 管精确词和编号，向量管语义改写，用加权或 RRF 融合", "必背"], ["go-41", "召回之后为什么还要重排？双塔编码器和交叉编码器有什么区别？", "双塔可预算向量、快但无交互，交叉编码器拼接打分、准但慢", "高频"], ["go-42", "GraphRAG 的流程是什么？它解决普通向量 RAG 的什么问题，代价是什么？", "LLM 抽实体关系建图，社区检测写摘要，全局问题汇总社区摘要", "高频"], ["go-43", "RAG 中“小块检索、大块生成”有哪些实现方式？", "句子窗口、父文档检索、自动合并、多向量索引", "高频"], ["go-44", "什么是自适应检索？Self-RAG 和 FLARE 怎样决定何时检索？", "按需检索，Self-RAG 用反思标记，FLARE 遇低置信 token 检索", "理解"], ["go-45", "检索到的噪声文档和文档位置会怎样影响 RAG 的生成？怎样缓解？", "中间位置利用率最低呈 U 形，相关但不含答案的干扰文档危害最大", "高频"], ["go-46", "不依赖外部检索时，推理阶段有哪些减少幻觉的方法？CoVe 和 DoLa 怎样做？", "CoVe 先答再出验证问题独立作答后修正，DoLa 用层间 logits 差解码", "理解"], ["go-47", "Deep Search 和 Deep Research 与普通 RAG 有什么区别？", "RAG 检索一次，Deep Search 多轮搜读，Deep Research 写报告", "高频"], ["gi-51", "输入文本超过模型上下文长度时有哪些处理办法？长上下文模型和 RAG 怎么选？", "分块汇总、RAG 检索、上下文压缩、扩窗加长文本训练，按是否需要全局信息选择", "必背"], ["gi-52", "RAG 里的向量召回模型和重排模型（reranker）有什么区别？为什么要分两阶段？", "召回用双塔分别编码可预计算，重排用交叉编码逐对打分，更准但更慢", "高频"], ["gi-57", "怎样确认多模态模型真的依据图像作答，而不是靠文本先验猜答案？", "做去图、换图对照实验看准确率变化，平衡训练数据并构造反事实样本", "理解"]]}, {"name": "生成模型", "items": [["g9-2", "残差向量量化（RVQ）怎样工作？相比单码本有什么优势？", "单码本要达到 N 比特精度需要 2 的 N 次方个条目，参数量与查找开销随比特数指数增长", "必背"], ["g9-3", "向量量化不可导，训练时梯度怎样回传？", "用直通估计", "必背"], ["g9-5", "FSQ 相比 RVQ 有什么不同？为什么有人用它替代 VQ？", "有限标量量化不维护显式码本，而是把隐向量投影到很低的维度，对每个维度做固定网格的标量四舍五入，隐式码本大小等于各维度取值数的连乘", "理解"], ["g9-9", "无分类器引导（CFG）怎样工作？引导强度越大越好吗？", "训练时以一定概率丢弃条件，使同一模型同时学会条件生成和无条件生成", "必背"], ["g9-14", "DDPM 的前向与反向过程是什么？预测噪声、预测原图、预测速度三种参数化有什么区别？", "前向过程按预定方差表逐步加高斯噪声，任意步的边缘分布可以闭式写出，训练时可直接采样任意时刻而不必迭代", "必背"], ["g9-15", "DiT 相比 UNet 有什么优势？条件怎样注入？", "DiT 把隐空间切成 patch 序列用 Transformer 处理，去掉了 UNet 的卷积归纳偏置", "理解"], ["g9-16", "VAE、VQ-VAE、VQGAN 的关系是什么？", "VAE 学习连续隐变量的后验分布，用重参数化技巧采样，损失为重建误差加隐分布与先验的 KL 散度", "理解"], ["gd-43", "GAN 的目标函数是什么？判别器最优时生成器实际在优化什么？", "极小极大博弈，判别器最优时生成器最小化与真实分布的 JS 散度", "必背"], ["gd-44", "GAN 为什么训练不稳定？模式崩塌是什么，怎样缓解？", "博弈难收敛、分布不重叠时梯度消失，生成器只覆盖少数模式", "必背"], ["gd-45", "WGAN 改进了什么？为什么 Wasserstein 距离比 JS 散度更适合训练 GAN？", "改用推土机距离，分布不重叠仍有梯度，判别器须满足 1-Lipschitz", "高频"], ["gd-46", "VAE 的 ELBO 怎样推导？它和真实对数似然 log p(x) 相差多少？", "ELBO 与 log p(x) 之差是近似后验到真实后验的 KL 散度", "理解"], ["gd-47", "VAE 生成的样本为什么偏模糊？后验坍缩是什么，怎样缓解？", "高斯似然等于逐像素 MSE 取条件均值而模糊，强解码器忽略隐变量导致坍缩", "高频"], ["gd-48", "GAN、VAE、扩散模型和自回归模型各有什么优缺点？", "GAN 快而清晰但不稳，VAE 稳但模糊，扩散质量高但慢，自回归可算似然", "高频"]]}, {"name": "主流模型与推理模型", "items": [["go-1", "BERT 的 MLM 为什么把选中的词按 80%、10%、10% 三种方式处理？NSP 任务是什么？", "选中 15% 的词，八成换 MASK、一成换随机词、一成不变", "必背"], ["go-2", "RoBERTa 相对 BERT 做了哪些改进？去掉 NSP 为什么没有让效果变差？", "去 NSP、动态掩码、更大批量更多数据更长训练、字节级 BPE", "高频"], ["go-3", "T5 和 BART 都是编码器-解码器预训练模型，它们的去噪目标有什么区别？", "T5 用哨兵替换片段只预测被删部分，BART 多种破坏后重建整段原文", "高频"], ["go-4", "GPT-1、GPT-2、GPT-3 在结构和使用范式上各有什么变化？", "预训练加微调，到零样本提示，再到少样本上下文学习", "必背"], ["go-5", "LLaMA 相对原始 Transformer 做了哪些结构改动？各自解决什么问题？", "仅解码器，Pre-RMSNorm、SwiGLU、RoPE、去偏置，数字拆分", "必背"], ["go-6", "Llama 2 和 Llama 3 相对上一代分别改了什么？", "Llama 2 加 GQA，Llama 3 换 128K 词表、15T 数据", "高频"], ["go-7", "Llama 2 的 RLHF 里拒绝采样微调和 PPO 怎样配合？为什么奖励模型要迭代更新？", "每个提示采 K 个回答取奖励最高者微调，多轮迭代，后期叠加 PPO", "高频"], ["go-8", "Llama 3 对 DPO 损失做了哪两处修改？分别解决什么问题？", "损失中屏蔽格式 token，再加 chosen 回答的 NLL 正则项", "理解"], ["go-9", "GLM 的自回归空白填充目标是怎样构造的？为什么对话模型更多采用纯因果解码器？", "Part A 双向可见，Part B 乱序片段自回归生成，配二维位置编码", "理解"], ["go-10", "Qwen 系列从 Qwen1 到 Qwen3 在结构上有哪些主要变化？", "Qwen1 不共享嵌入，Qwen2 起 GQA，Qwen3 用 QK-Norm", "高频"], ["go-11", "Qwen3 怎样在一个模型里同时支持思考模式和非思考模式？", "长 CoT 冷启动、推理 RL、思考模式融合、通用 RL 四阶段", "高频"], ["go-12", "PaLM 在结构上做了哪些改动？z-loss 是什么，为什么能提升训练稳定性？", "并行注意力与前馈、MQA、共享嵌入、去偏置，z-loss 压住 log Z 为增量，只训练这两个小矩阵", "定义"], ["d63", "什么是 QLoRA？", "把基座量化到 4 比特并冻结，在其上做 LoRA 训练", "定义"], ["d64", "什么是 Adapter 与 Prefix-tuning？", "Adapter 在层间插入小瓶颈模块，Prefix-tuning 在每层注意力前拼接可学习的前缀键值", "定义"]]}, {"name": "推理", "items": [["d65", "什么是 量化 PTQ 与 QAT？", "PTQ 在训练好的模型上直接定量化参数，QAT 在训练中插入伪量化让模型适应误差", "定义"], ["d66", "什么是 知识蒸馏？", "让学生拟合教师的软分布或教师生成的数据", "定义"], ["d67", "什么是 KV 缓存？", "把已生成位置的键和值缓存下来，解码新 token 时只算当前位置", "定义"], ["d68", "什么是 prefill 与 decode？", "prefill 一次并行处理整个提示，decode 逐个生成 token", "定义"], ["d69", "什么是 投机解码 Speculative Decoding？", "小模型或额外预测头先起草若干 token，大模型一次并行校验，按接受采样决定保留多少", "定义"], ["d70", "什么是 连续批处理 Continuous Batching？", "在每个解码步动态加入新请求、移出已完成请求，而不是等整批结束", "定义"]]}, {"name": "序列", "items": [["d71", "什么是 状态空间模型 SSM？", "用一个线性递推的隐状态压缩历史，输出由隐状态线性读出", "定义"], ["d72", "什么是 Mamba 与选择性 SSM？", "让 SSM 的状态转移参数依赖当前输入，从而能按内容决定记住还是遗忘", "定义"], ["d73", "什么是 GatedDeltaNet？", "带门控的 delta 规则线性注意力，状态更新时既做衰减也做定向写入", "定义"], ["d74", "什么是 RNN、LSTM、GRU？", "按时间步递推隐状态。LSTM 用输入门、遗忘门、输出门加细胞状态缓解梯度消失，GRU 合并为更新门与重置门", "定义"], ["d75", "什么是 多 token 预测 MTP？", "训练时一次预测未来多个位置而不是只预测下一个", "定义"]]}, {"name": "解码", "items": [["d76", "什么是 贪心、束搜索与采样？", "贪心每步取概率最大的 token，束搜索保留得分最高的若干条候选序列，采样按概率随机抽，温度调节分布尖锐程度，top-k 只在前 k 个里抽，top-p 只在累计概率达到 p 的最小集合里抽", "定义"]]}, {"name": "生成", "items": [["d77", "什么是 VAE？", "编码器输出隐分布参数，重参数化采样后解码，损失是重建误差加隐分布与先验的 KL", "定义"], ["d78", "什么是 VQ-VAE 与 VQGAN？", "把连续隐向量替换成码本里最近的码字，得到离散隐表示。VQGAN 在此基础上加对抗与感知损失", "定义"], ["d79", "什么是 GAN？", "生成器与判别器对抗训练，生成器骗过判别器，判别器区分真假", "定义"], ["d80", "什么是 扩散模型 DDPM？", "前向按方差表逐步加高斯噪声，反向学习逐步去噪", "定义"], ["d81", "什么是 DDIM？", "把采样改成确定性的非马尔可夫过程，允许跳步", "定义"], ["d82", "什么是 流匹配 Flow Matching？", "直接回归连接噪声分布与数据分布的概率路径速度场", "定义"], ["d83", "什么是 DiT 扩散 Transformer？", "把隐空间切成 patch 序列，用 Transformer 替代 UNet 做去噪主干", "定义"], ["d84", "什么是 CFG 无分类器引导？", "训练时随机丢弃条件，采样时把条件预测与无条件预测做外推", "定义"]]}]}]}}</script>
<script>
(() => {

  const bgAll = [...new Set(D.bg.decks.flatMap(dk => items(dk.groups).map(x => x[0])))], sb = summary(SETS.bg, bgAll);
  document.getElementById('tiles').innerHTML = `
    <div class="tile"><h2>🧩 LeetCode 热题 100 <small>${sl.n} 题</small></h2><p>上滑换题、左滑看图解和讲解、右滑默写核对。06 背诵本有逐步动画和逐行背诵。</p>${bar(sl)}${statTxt(sl)}<div class="btns"><a class="btn" href="09-swipe.html">开始刷题</a><a class="btn ghost" href="06-hot100.html">背诵本</a></div></div>
    <div class="tile"><h2>🎓 论文面试卡 <small>${sp.n} 张</small></h2><p>五篇论文各 18 张问答，挖空复述关键数字，每张配音频，可以连播。</p>${bar(sp)}${statTxt(sp)}<div class="btns"><a class="btn" href="10-papers.html">开始刷卡</a></div></div>
    <div class="tile"><h2>🧠 八股速记 <small>${sb.n} 张</small></h2>${bar(sb)}${statTxt(sb)}<div class="decks">${deckRows}</div></div>`;
  // 题目清单
  let tab = get('hub-tab-v1', 'bg'), deck = get('hub-deck-v1', 'job'), filt = 'all', q = '';
  const FILTS = [['all', '全部'], ['due', '今天待复习'], ['new', '还没刷过'], ['s0', '不会'], ['s1', '模糊'], ['s2', '熟练']];
  const paintTabs = () => {
    document.getElementById('tabs').innerHTML = [['bg', `🧠 八股速记 ${sb.n}`], ['lc', `🧩 LeetCode ${sl.n}`], ['pp', `🎓 论文面试卡 ${sp.n}`]].map(([k, t]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${t}</button>`).join('');
    document.getElementById('subtabs').innerHTML = tab === 'bg' ? D.bg.decks.map(dk => `<button data-deck="${dk.id}" class="${dk.id === deck ? 'on' : ''}">${dk.emo} ${esc(dk.name)}</button>`).join('') : '';
    document.getElementById('chips').innerHTML = FILTS.map(([k, t]) => `<button data-f="${k}" class="${k === filt ? 'on' : ''}">${t}</button>`).join('');
  };
  const paintList = () => {
    const S = SETS[tab], gs = tab === 'bg' ? (D.bg.decks.find(d => d.id === deck) || D.bg.decks[0]).groups : D[tab].groups, kw = q.trim().toLowerCase();
    const ok = (it, g) => {
      const s = S.st[it[0]];
      if (filt === 'due' && !due(S, it[0])) return false;
      if (filt === 'new' && s !== undefined) return false;
      if (filt[0] === 's' && s !== +filt[1]) return false;
      return !kw || (it[1] + ' ' + it[2] + ' ' + g.name).toLowerCase().includes(kw);
    };
    let html = '', shown = 0;
    gs.forEach(g => {
      const vis = g.items.filter(it => ok(it, g)); if (!vis.length) return;
      shown += vis.length;
      const sm = summary(S, g.items.map(x => x[0]));
      html += `<details open><summary><b>${esc(g.name)}</b><span>${sm.c[2]}/${sm.n} 熟练</span>${bar(sm)}</summary><ol>${vis.map(it => { const s = S.st[it[0]]; return `<li><a href="${S.link(it[0], deck)}"><i class="dot ${s === undefined ? '' : 's' + s}"></i><span class="t"><b>${esc(it[1])}</b>${it[2] ? `<small>${esc(it[2])}</small>` : ''}</span>${due(S, it[0]) ? '<span class="due">待复习</span>' : ''}${it[3] ? `<span class="tag">${esc(it[3])}</span>` : ''}</a></li>`; }).join('')}</ol></details>`;
    });
    document.getElementById('groups').innerHTML = html || '<p class="empty">当前筛选下没有题目。</p>';
  };
  const paint = () => { paintTabs(); paintList(); };
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; put('hub-tab-v1', tab); paint(); return; }
    const d = e.target.closest('[data-deck]'); if (d) { deck = d.dataset.deck; put('hub-deck-v1', deck); paint(); return; }
    const f = e.target.closest('[data-f]'); if (f) { filt = f.dataset.f; paint(); }
  });
  document.getElementById('q').addEventListener('input', e => { q = e.target.value; paintList(); });
  // 从卡片页返回时刷新进度
  addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
  paint();
})();
</script><script src="progress-sync.js?v=f72896d04546"></script></body></html>
