<style>
:root{--bg:#f7f8f5;--card:#fff;--ink:#20332f;--muted:#5d6e69;--line:#dfe5e1;--acc:#176c63;--acc2:#e3f1ec;--s0:#c2453a;--s1:#e7a93b;--s2:#2e9b6a;--s9:#d7ddd9}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
a{color:var(--acc);text-decoration:none}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top a.home{font-size:14px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px}

.sub{color:var(--muted);font-size:14px;margin:0 0 14px}

.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px}
.tile h2{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
.tile h2 small{font-size:13px;color:var(--muted);font-weight:400}
.tile p{margin:0;color:var(--muted);font-size:13.5px}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--s9)}
.bar i{display:block;height:100%}
.bar .b2{background:var(--s2)}.bar .b1{background:var(--s1)}.bar .b0{background:var(--s0)}
.stat{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.stat b{color:var(--ink)}
.stat .due{color:var(--s0);font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{display:inline-flex;align-items:center;gap:4px;border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px;background:var(--acc);color:#fff;border:0;cursor:pointer}
.btn.ghost{background:var(--acc2);color:var(--acc)}
.decks{display:flex;flex-direction:column;gap:6px}
.deck{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:#f4f7f5;color:var(--ink)}
.deck:hover{background:var(--acc2)}
.deck b{flex:1;font-weight:600;font-size:14px}
.deck span{font-size:12.5px;color:var(--muted)}
.deck span.due{color:var(--s0);font-weight:600}
.browse{margin-top:22px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.tabs button,.chips button,.subtabs button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on,.subtabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.tools input{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;background:#fff}
.chips,.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs{margin:8px 0 2px}
.groups{columns:2 420px;column-gap:14px}
details{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;padding:4px 0}
summary{list-style:none;cursor:pointer;padding:8px 12px;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary b{flex:1;font-size:15px}
summary span{font-size:12.5px;color:var(--muted)}
summary .bar{width:70px;flex:none}
ol{list-style:none;margin:0;padding:0 6px 6px}
li a{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:9px;color:var(--ink)}
li a:hover{background:#f1f5f2}
li .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--s9)}
li .dot.s2{background:var(--s2)}li .dot.s1{background:var(--s1)}li .dot.s0{background:var(--s0)}
li .t{flex:1;min-width:0}
li .t b{font-weight:600;font-size:14.5px}
li .t small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
li .tag{flex:none;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-top:3px}
li .due{flex:none;font-size:11.5px;color:var(--s0);margin-top:3px}
.empty{color:var(--muted);padding:20px 4px}
.legend{font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
@media (max-width:860px){.tiles{grid-template-columns:1fr}.groups{columns:1}h1{font-size:23px}}

？", "决策树在每个节点比较候选特征和阈值，选择能降低目标不纯度或回归误差的划分，再递归处理子节点", "必背"], ["g4-8", "随机森林和 GBDT 分别怎样集成，为什么不能混称？", "随机森林在样本和特征上引入随机性，训练多棵树后平均或投票，常用于降低高方差树模型的方差", "必背"], ["g5-8", "类别不平衡怎样处理，为什么高准确率不代表模型有效？", "先看业务中的正负定义、错误代价与真实类比例", "必背"], ["g7-7", "XGBoost 如何利用一阶和二阶信息，怎样处理复杂度和缺失值？", "XGBoost 在当前模型附近对损失做二阶展开，用样本的一阶梯度和 Hessian 汇总计算叶子权重及分裂收益，并加入树复杂度和叶权重正则", "必背"]]}, {"name": "Transformer 与注意力", "items": [["g1-5", "Tokenization 为什么影响成本，BPE 怎样构造子词？", "分词把文本映射成离散 token 序列，再供模型查表得到嵌入", "必背"], ["g4-1", "Self-attention、cross-attention 和多头注意力怎样区分？", "注意力用 Q 与 K 的相似度生成权重，再对 V 加权", "必背"], ["g4-2", "为何除以根号 d，mask 与稳定 softmax 怎样处理？", "在分量近似独立、均值为零且方差相近的简化条件下，点积方差会随维度增加", "必背"], ["g4-3", "LayerNorm 与 BatchNorm 的统计维度和训练推理行为有何区别？", "BatchNorm 通常对每个通道沿批量及相应空间维统计，训练时用当前批统计并维护运行统计，常规推理使用运行均值与方差", "必背"], ["g4-4", "Attention 的开销是什么，FlashAttention 和 KV cache 优化哪里？", "对长度为 T、隐藏维为 D 的标准全注意力，两个主要矩阵乘法有二次序列长度项，直接保存注意力矩阵也需要二次空间", "必背"], ["g4-5", "为什么需要位置编码，RoPE 怎样使注意力含有相对位置？", "没有位置等信号的自注意力，对输入的共同置换具有等变性，不能仅凭内容区分排列", "必背"], ["g4-6", "MHA、MQA、GQA 如何影响 KV cache，prefill 与 decode 有何区别？", "MHA 为每个查询头配独立的键值头，MQA 让所有查询头共享一组键值，GQA 则把查询头分组，每组共享键值", "必背"], ["g4-7", "Greedy、temperature、top-k、top-p 和 beam search 有何区别？", "Greedy 每步选概率最大 token", "必背"], ["g4-9", "完整讲一遍 Transformer 的结构与数据流。", "原论文是编码器解码器结构", "必背"], ["g4-10", "Transformer 的参数量怎么估？7B 这个数是怎么来的？", "按层算", "必背"], ["g4-11", "多头注意力的头数与头维怎么选？头是不是越多越好？", "隐维固定时，头数乘头维等于隐维，两者此消彼长", "理解"], ["g4-12", "RMSNorm 相比 LayerNorm 省了什么？为什么现代大模型普遍用 Pre-Norm 加 RMSNorm？", "LayerNorm 先减均值再除以标准差，然后做缩放和平移", "必背"], ["g4-13", "SwiGLU 相比 ReLU 和 GELU 好在哪？为什么中间维度要取三分之八倍？", "SwiGLU 是门控线性单元的一种，把输入分别过两个线性层，一路经 Swish 激活作为门控，与另一路逐元素相乘，再过第三个线性层", "必背"], ["g4-14", "MLA（多头隐注意力）怎样压缩 KV 缓存？和 GQA 有什么区别？", "GQA 让多个查询头共享同一组键值头，缓存量按分组数缩减，是对头数的直接削减，会损失一部分表达多样性", "理解"], ["g4-15", "位置编码外推为什么会失效？NTK 缩放与 YaRN 分别怎样解决？", "RoPE 各维度对应不同频率，训练时模型只见过训练长度内的相位范围", "必背"], ["g4-16", "稀疏注意力有哪几类做法？DeepSeek NSA 的思路是什么？", "按稀疏模式来源分三类", "理解"]]}, {"name": "强化学习与 Agent", "items": [["g1-6", "Agent、Workflow 和普通 LLM 调用有什么区别？", "普通 LLM 调用主要根据输入生成输出，Workflow 用预定义的代码路径组织模型和工具，Agent 则让模型结合环境反馈动态选择下一步动作", "必背"], ["g2-5", "ReAct 的循环是什么，和单纯写思维链有什么区别？", "ReAct 把任务推理与行动交替组织", "必背"], ["g2-6", "一个可靠的工具 schema 应包含什么，JSON 合法就能执行吗？", "工具定义要写清名称、用途、适用边界、参数类型、必填项、单位、枚举和返回值", "必背"], ["g2-7", "模型发起工具调用后，执行器需要负责哪些事情？", "模型负责提出动作，执行器负责把动作变成受控的真实操作", "必背"], ["g3-1", "如何把一个数据准备任务写成 MDP？", "MDP 用状态、动作、转移和奖励描述序列决策，再通过折扣或有限时域定义累计收益", "必背"], ["g3-2", "经验回放、目标网络与 Double DQN 分别解决什么问题？", "经验回放把历史转移存起来随机抽取，降低相邻样本相关性并提高利用率", "必背"], ["g3-3", "Dueling、Double 与两阶段动作结构有什么区别？", "Dueling 是价值网络的参数化方式，把状态整体好坏与各动作相对优势分开建模，再组合成 Q 值", "必背"], ["g3-4", "如何处理稀疏奖励，为什么预算约束不能只靠惩罚？", "稀疏反馈可以用较低成本的中间评价或奖励塑形补充，例如用局部证据引导，再周期性测代理模型，最终用真实任务收益验收", "必背"], ["g3-5", "Agent 怎样判断结束，如何控制死循环和预算？", "结束条件应在任务开始时定义，包括目标完成、不可恢复失败、需要补充信息和预算耗尽", "必背"], ["g3-6", "工具调用超时后为什么不能直接重试，幂等如何设计？", "超时只表示没有及时收到结果，不代表服务端没有执行", "必背"], ["g3-7", "Agent 的短期记忆、长期记忆与上下文压缩如何区分？", "短期记忆保存当前任务的消息、计划和工具状态，通常进入上下文或任务状态", "必背"], ["g3-9", "RLHF 的完整流程包含哪几个模型？各自的作用和显存开销是什么？", "标准 PPO 流程涉及四个模型", "必背"], ["g3-10", "可验证奖励的强化学习（RLVR）适用于什么场景？", "RLVR 用规则或程序直接判定正确性作为奖励，例如数学答案比对、代码单元测试、格式校验", "必背"], ["g3-11", "过程奖励模型和结果奖励模型有什么区别？各自怎样标注？", "结果奖励只对最终输出打分，标注成本低，但对长推理链只能提供稀疏信号，无法指出错在哪一步", "理解"], ["g6-6", "Agent 为什么要记录 trace，应该评价哪些指标？", "最终答案成功率能说明任务是否完成，却不能解释失败发生在哪一步", "必背"], ["g6-7", "什么是提示注入，Agent 应如何保护工具权限？", "提示注入是把恶意指令混入用户输入、网页、检索文档或工具返回，诱导模型偏离原任务或越权操作", "必背"], ["g7-6", "Agent 链路很慢，如何判断该并行、缓存还是减少调用？", "先按 trace 拆分模型推理、工具执行、网络和等待时间，再画出真实依赖", "必背"], ["g8-1", "什么时候用多 Agent，为什么多个角色不一定更好？", "它能隔离上下文并利用不同工具，但增加通信、重复工作和状态一致性成本", "必背"]]}, {"name": "多模态与 RAG", "items": [["g1-7", "RAG、微调和工具调用怎样选择？", "RAG 在回答时检索外部资料，适合知识更新快、需要来源或访问私有文档的任务", "必背"], ["g5-1", "InfoNCE 为什么是交叉熵，温度与负样本怎样影响学习？", "InfoNCE 将一个查询对应的正样本视为正确类别，把候选相似度当成分类 logits，所以可以用交叉熵提高正例相对概率", "必背"], ["g5-2", "CLIP 怎样对齐图像和文本，错误配对和多个正例怎么办？", "这类方法用不同编码器处理两种模态，再投影到共同的表示空间，通常归一化后计算相似度，通过配对监督拉高正确组合相对其他组合的分数", "必背"], ["g5-3", "掩码建模、因果建模与对比预训练的目标有何区别？", "掩码建模隐藏部分输入，让模型利用可见上下文恢复缺失内容，BERT 预测被选 token，MAE 重建图像被掩码部分", "必背"], ["g5-4", "为什么不能只按一个相似度分数清洗多模态预训练数据？", "相似度主要反映某个编码器认可的语义关系，并不完整代表事实正确性、声音质量、时间对齐和覆盖度", "必背"], ["g5-5", "多模态编码器怎样接入 LLM，投影层与 Q-Former 有何区别？", "常见结构先用模态编码器得到特征，再通过连接器映射到语言模型能处理的表示", "必背"], ["g5-6", "一个 RAG 系统从文档到答案包含哪些关键步骤？", "离线先解析文档、清理结构、切分片段并保存来源和权限元数据，再建立稀疏或向量索引", "必背"], ["g5-7", "怎样分别评价 RAG 的检索和生成，失败时怎样定位？", "检索侧检查相关文档是否召回以及排名，可用召回、MRR 或 NDCG", "必背"], ["g5-10", "SigLIP 相比 CLIP 改了什么？为什么小批量下更有优势？", "CLIP 用 softmax 形式的对比损失，归一化项要在整个批次上计算，因此需要极大批量才能提供足够的负样本，且分布式训练需要跨卡收集全部特征", "理解"]]}, {"name": "优化与训练", "items": [["g2-1", "logistic 交叉熵对参数与输入的梯度分别是什么？", "设线性输出为权重与输入的内积加偏置，经过 sigmoid 得到正类概率 p", "必背"], ["g2-2", "非均匀采样为什么需要重要性权重，梯度范数采样在什么条件下有效？", "假设目标是全部样本梯度的平均，而每次按非均匀概率抽一个样本", "必背"], ["g2-3", "SGD、Adam 与 AdamW 的主要区别是什么？", "SGD 沿当前小批量梯度更新，动量版本会累积方向", "必背"], ["g2-4", "过拟合与 loss NaN 应怎样分别排查？", "训练损失下降而验证变差时，先确认划分、评价流程和训练验证模式，再看样本量、标签噪声与分布差异，之后尝试早停、正则或数据改进", "必背"], ["g2-8", "偏差方差与正则化如何解释，L1、L2 和 Dropout 有何不同？", "偏差描述学习方法平均预测与真实规律的差距，方差描述它对训练样本变化的敏感性", "必背"], ["g2-9", "训练和推理的计算量怎么估？6N 是怎么来的？", "把参数量记作 N", "必背"], ["g2-10", "混合精度训练为什么需要损失缩放？bf16 和 fp16 怎样选？", "fp16 的指数位只有 5 位，可表示的最小正规数约为十的负五次方量级，反向传播中小梯度容易下溢为零，训练停滞", "必背"], ["g2-11", "学习率预热和余弦衰减各起什么作用？批大小变化时学习率怎样调？", "预热在训练初期用较小学习率线性升到峰值，此时参数随机、梯度方向噪声大，直接用大学习率容易让自适应优化器的二阶矩估计失真并发散", "理解"], ["g2-12", "梯度裁剪解决什么问题？按范数裁剪和按值裁剪有什么区别？", "解决梯度爆炸", "理解"]]}, {"name": "微调与压缩", "items": [["g6-1", "ICL、SFT 与预训练有什么区别，示范数据如何形成训练目标？", "预训练通常用较大范围的数据学习通用能力，SFT 用带示范输出的数据继续更新参数，让行为适配任务或指令", "必背"], ["g6-2", "LoRA 的数学形式、参数量和局限是什么？", "LoRA 冻结预训练权重，用两个低秩矩阵的乘积表示更新，再把这个更新加到原线性映射上", "必背"], ["g6-3", "训练和推理显存由什么构成，各种节省方法影响哪部分？", "训练显存至少包括模型权重、前向保留的激活、梯度和优化器状态，还可能有高精度副本、临时工作区与通信缓冲", "必背"], ["g6-4", "加权交叉熵如何定义，删除与降权有什么关系？", "样本加权交叉熵先计算每条记录的损失，再乘非负权重，最后按权重和归一化", "必背"], ["g6-5", "PPL 怎样计算，为什么 SFT loss 不能用固定阈值判断好坏？", "困惑度是有效预测 token 的平均负对数似然取指数，计算时要固定 tokenizer、文本、上下文窗口和哪些位置计入损失", "必背"], ["g6-8", "什么是 teacher forcing？它带来的曝光偏差怎么缓解？", "训练时解码器每个位置的输入用的是真实前缀而不是模型自己上一步的输出，这叫 teacher forcing", "理解"], ["g6-9", "SFT 数据的质量和数量哪个更重要？怎样做数据筛选？", "在指令微调阶段质量明显更重要", "理解"], ["g6-10", "训练后量化和量化感知训练有什么区别？GPTQ 与 AWQ 的思路是什么？", "训练后量化直接在已训练模型上确定量化参数，只需少量校准数据，成本低但低比特下精度损失明显", "必背"], ["g6-11", "知识蒸馏有哪几种形式？温度起什么作用？", "响应蒸馏让学生拟合教师的软标签概率分布，软标签包含类间相似结构，信息量大于硬标签", "理解"], ["g6-12", "结构化剪枝和非结构化剪枝的取舍是什么？", "非结构化剪枝按权重重要性逐元素置零，理论压缩率高，但产生不规则稀疏，通用硬件无法直接加速，需要专门的稀疏算子或特定稀疏模式支持", "理解"]]}, {"name": "对齐与分布式推理", "items": [["g6-13", "大模型作为评判者有哪些系统性偏置？", "位置偏置指对先出现的候选打分偏高，缓解办法是交换顺序各评一次取平均", "理解"], ["g7-1", "有 SFT 为什么还做偏好优化，怎样选择 SFT、DPO 或在线 RL？", "SFT 学习示范输出，适合把明确的任务格式和正确行为教给模型，但单个示范未必表达多个可接受答案之间的偏好", "必背"], ["g7-2", "PPO 的概率比率、优势与 clip 目标分别起什么作用？", "PPO 用当前策略相对于收集样本的旧策略的概率比率，对优势进行加权更新", "必背"], ["g7-3", "DPO 的参考策略、偏好对与损失怎样解释？", "DPO 对同一提示下的优选和劣选回答，比较它们相对于参考策略的序列对数概率提升，再用逻辑损失推动优选回答占优", "必背"], ["g7-4", "GRPO 怎样构造组内优势，奖励怎样避免被投机利用？", "GRPO 对同一提示采样多条输出，利用组内奖励的相对位置构造优势，减少对独立价值模型的依赖", "必背"], ["g7-5", "old policy、reference、reward model 与 critic 的角色分别是什么？", "old policy 是生成本批训练样本的策略，用于计算新旧动作概率比", "必背"], ["g7-8", "KV 缓存占多少显存？给个算例。", "每个 token 在每一层要存键和值两份，每份是键值头数乘以头维", "必背"], ["g7-9", "MoE 的路由怎样工作？负载不均衡会造成什么后果，怎样缓解？", "MoE 把前馈层替换成多个专家，路由网络对每个 token 计算各专家的打分，取 top-k 个激活并按归一化权重加权求和", "必背"], ["g7-10", "数据并行、张量并行、流水线并行、专家并行各切分什么？怎样组合？", "数据并行切分样本，每张卡持有完整模型副本，反向后对梯度做全归约，通信量与参数量成正比", "必背"], ["g7-11", "prefill 和 decode 阶段的瓶颈分别是什么？连续批处理为什么有效？", "prefill 一次处理整个提示，矩阵乘法规模大，算力利用率高，受算力限制", "必背"], ["g7-12", "投机解码为什么能加速？它会改变输出分布吗？", "草稿模型快速生成若干候选 token，目标模型对这几个位置做一次并行前向即可拿到全部位置的概率，再逐位置做接受或拒绝判定", "必背"]]}, {"name": "生成模型", "items": [["g9-2", "残差向量量化（RVQ）怎样工作？相比单码本有什么优势？", "单码本要达到 N 比特精度需要 2 的 N 次方个条目，参数量与查找开销随比特数指数增长", "必背"], ["g9-3", "向量量化不可导，训练时梯度怎样回传？", "用直通估计", "必背"], ["g9-5", "FSQ 相比 RVQ 有什么不同？为什么有人用它替代 VQ？", "有限标量量化不维护显式码本，而是把隐向量投影到很低的维度，对每个维度做固定网格的标量四舍五入，隐式码本大小等于各维度取值数的连乘", "理解"], ["g9-9", "无分类器引导（CFG）怎样工作？引导强度越大越好吗？", "训练时以一定概率丢弃条件，使同一模型同时学会条件生成和无条件生成", "必背"], ["g9-14", "DDPM 的前向与反向过程是什么？预测噪声、预测原图、预测速度三种参数化有什么区别？", "前向过程按预定方差表逐步加高斯噪声，任意步的边缘分布可以闭式写出，训练时可直接采样任意时刻而不必迭代", "必背"], ["g9-15", "DiT 相比 UNet 有什么优势？条件怎样注入？", "DiT 把隐空间切成 patch 序列用 Transformer 处理，去掉了 UNet 的卷积归纳偏置", "理解"], ["g9-16", "VAE、VQ-VAE、VQGAN 的关系是什么？", "VAE 学习连续隐变量的后验分布，用重参数化技巧采样，损失为重建误差加隐分布与先验的 KL 散度", "理解"]]}]}, {"id": "defs", "emo": "📖", "name": "基础定义", "desc": "一句定义加一句区别", "groups": [{"name": "分词", "items": [["d1", "什么是 BPE？", "从字符或字节出发，反复统计相邻符号对的频次，把最高频的一对合并成新符号，直到词表达到目标大小", "定义"]]}, {"name": "评估", "items": [["d2", "什么是 困惑度 PPL？", "对数似然取负后按 token 平均再取指数，衡量模型对文本的预测不确定性", "定义"], ["d3", "什么是 BLEU 与 ROUGE？", "BLEU 看生成里有多少 n-gram 出现在参考里（偏准确率），ROUGE 看参考里有多少被生成覆盖（偏召回）", "定义"], ["d4", "什么是 检索指标 mAP、Recall@K、MRR？", "mAP 衡量整体排序质量，Recall@K 看前 K 个里召回了多少相关项，MRR 是第一个正确结果排名倒数的平均", "定义"], ["d5", "什么是 LLM-as-judge？", "用大模型给生成结果打分或做成对比较", "定义"]]}, {"name": "数据", "items": [["d6", "什么是 去重？", "精确去重用哈希或指纹，近重复用嵌入近邻或 MinHash", "定义"], ["d7", "什么是 配比 Data Mixture？", "不同来源、领域、质量档在训练集里的混合比例", "定义"], ["d8", "什么是 课程学习？", "按难度或质量排序，先易后难或先高质量后全量", "定义"], ["d9", "什么是 数据选择？", "在预算约束下挑选对下游任务收益最大的子集", "定义"], ["d10", "什么是 长尾分布？", "少数类别占据大部分样本，多数类别样本极少", "定义"]]}, {"name": "归一化", "items": [["d11", "什么是 LayerNorm 与 BatchNorm？", "LayerNorm 在单个样本的特征维上算均值方差，BatchNorm 在批次维上算并维护滑动统计", "定义"], ["d12", "什么是 RMSNorm？", "只用均方根缩放，去掉减均值与平移", "定义"], ["d13", "什么是 Pre-Norm 与 Post-Norm？", "Pre-Norm 把归一化放在子层输入侧，Post-Norm 放在残差相加之后", "定义"]]}, {"name": "激活", "items": [["d14", "什么是 GELU、Swish、SwiGLU？", "GELU 用高斯累积分布做平滑门控，Swish 是输入乘自身 sigmoid，SwiGLU 是用 Swish 做门的门控线性单元", "定义"]]}, {"name": "架构", "items": [["d15", "什么是 残差连接？", "把子层输出与输入相加再传给下一层", "定义"], ["d16", "什么是 三种 Transformer 形态？", "Encoder-only 双向编码适合理解，代表 BERT，Decoder-only 因果解码适合生成，代表 GPT，Encoder-Decoder 先编码输入再用交叉注意力解码，代表 T5", "定义"], ["d17", "什么是 MoE 混合专家？", "把前馈层换成多个专家，路由网络为每个 token 选 top-k 个专家激活并加权求和", "定义"]]}, {"name": "正则", "items": [["d18", "什么是 Dropout 与权重衰减？", "Dropout 训练时随机置零一部分激活，权重衰减在损失里加参数范数惩罚", "定义"]]}, {"name": "优化", "items": [["d19", "什么是 Adam 与 AdamW？", "Adam 用梯度的一阶矩与二阶矩做逐参数自适应步长，AdamW 把权重衰减从梯度里分离，直接作用在参数上", "定义"]]}, {"name": "训练", "items": [["d20", "什么是 混合精度 fp16 与 bf16？", "前向与反向用 16 位浮点计算，主权重与优化器状态保留 32 位副本", "定义"], ["d21", "什么是 预训练 Pre-training？", "在大规模无标注语料上做自监督学习，目标通常是预测下一个 token", "定义"], ["d22", "什么是 SFT 监督微调？", "在指令与回答配对数据上做有监督的下一 token 预测，通常只在回答部分计算损失", "定义"], ["d23", "什么是 ICL 上下文学习？", "在提示里给几个示例，模型不更新参数就能完成新任务", "定义"], ["d24", "什么是 CoT 思维链？", "让模型先写推理步骤再给答案", "定义"], ["d25", "什么是 RLHF？", "用人类偏好数据训奖励模型，再用 PPO 优化策略，同时用 KL 惩罚约束不偏离参考策略", "定义"], ["d26", "什么是 DPO 直接偏好优化？", "跳过奖励模型，直接在偏好对上优化一个由策略与参考策略对数比构成的损失", "定义"], ["d27", "什么是 GRPO 组相对策略优化？", "对同一提示采样一组回复，用组内奖励的标准化值当优势，去掉价值模型", "定义"], ["d28", "什么是 RLVR 可验证奖励强化学习？", "奖励由规则或程序直接判定，例如答案比对、单元测试、格式校验", "定义"], ["d29", "什么是 奖励投机 Reward Hacking？", "策略找到提高奖励模型分数但实际质量下降的捷径", "定义"], ["d30", "什么是 Scaling Law？", "模型损失随参数量、数据量与计算量按幂律下降", "定义"], ["d31", "什么是 灾难性遗忘？", "在新任务上微调后，模型在旧任务上的能力明显下降", "定义"], ["d32", "什么是 数据、张量、流水线并行与 ZeRO？", "数据并行切样本，张量并行切层内矩阵，流水线并行按层切模型，ZeRO 在数据并行内依次切优化器状态、梯度与参数", "定义"]]}, {"name": "注意力", "items": [["d33", "什么是 全注意力 Full Attention？", "每个位置的查询与序列里所有位置的键做点积，softmax 归一化后对值加权求和", "定义"], ["d34", "什么是 自注意力与交叉注意力？", "自注意力的查询、键、值来自同一序列，交叉注意力的查询来自一个序列，键和值来自另一个序列", "定义"], ["d35", "什么是 因果与双向？", "因果注意力用上三角掩码禁止看未来位置，双向注意力不加掩码", "定义"], ["d36", "什么是 MHA 多头？", "把隐维切成 h 份，每份独立做注意力，再拼接后线性投影", "定义"], ["d37", "什么是 MQA 与 GQA？", "MQA 让所有查询头共享一组键值头，GQA 折中，每组查询头共享一组键值头", "定义"], ["d38", "什么是 MLA 多头隐注意力？", "把键值先投影到低维隐空间，缓存只存隐向量，用时再上投影还原各头键值", "定义"], ["d39", "什么是 滑动窗口 Sliding Window？", "每个位置只看固定长度窗口内的历史，复杂度与序列长度成线性", "定义"], ["d40", "什么是 稀疏注意力 Sparse Attention？", "只计算注意力矩阵里的一部分位置，其余视为零", "定义"], ["d41", "什么是 线性注意力 Linear Attention？", "用核函数替换 softmax，利用矩阵乘法结合律先算键值外积再与查询相乘，复杂度降为线性", "定义"], ["d42", "什么是 混合注意力 Hybrid Attention？", "在同一模型里按层交替使用线性注意力与全注意力，多数层走线性，少数层走全注意力", "定义"], ["d43", "什么是 Gated Attention 门控注意力？", "在注意力输出上乘一个由输入算出的 sigmoid 门，控制该路信息通过多少", "定义"], ["d44", "什么是 FlashAttention？", "分块计算注意力并在片上累加，不把完整的注意力矩阵写回显存", "定义"], ["d45", "什么是 PagedAttention？", "把 KV 缓存切成固定大小的块，用页表索引，按需分配", "定义"]]}, {"name": "位置", "items": [["d46", "什么是 绝对与可学习位置编码？", "给每个位置一个固定或可学习的向量，加到词嵌入上", "定义"], ["d47", "什么是 正弦位置编码？", "用不同频率的正余弦函数生成位置向量", "定义"], ["d48", "什么是 RoPE 旋转位置编码？", "把查询和键按位置做二维平面旋转，使点积只依赖相对位置差", "定义"], ["d49", "什么是 ALiBi？", "不加位置向量，直接在 <script>
(() => {
  const D = JSON.parse(document.getElementById('data').textContent);

  const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const day = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
  const SETS = {
    lc: { name: 'LeetCode 热题 100', emo: '🧩', st: get('hot100-status-v1', {}), srs: get('swipe-srs-v1', {}), link: id => '09-swipe.html?id=' + encodeURIComponent(id) },
    pp: { name: '论文面试卡', emo: '🎓', st: get('paper-status-v1', {}), srs: get('paper-srs-v1', {}), link: id => '10-papers.html?id=' + encodeURIComponent(id) },
    bg: { name: '八股速记', emo: '🧠', st: get('bagu-status-v1', {}), srs: get('bagu-srs-v1', {}), link: (id, deck) => '11-bagu.html?deck=' + deck + '&id=' + encodeURIComponent(id) }
  };
  const due = (S, id) => { const r = S.srs[id]; if (r) return r.d <= day; const s = S.st[id]; return s === 0 || s === 1; };
  const items = gs => gs.flatMap(g => g.items);
  const summary = (S, ids) => { const c = [0, 0, 0, 0]; let d = 0; ids.forEach(id => { const s = S.st[id]; c[s === 2 ? 2 : s === 1 ? 1 : s === 0 ? 0 : 3]++; if (due(S, id)) d++; }); return { c, d, n: ids.length }; };
  const bar = ({ c, n }) => `<div class="bar">${[2, 1, 0].map(k => `<i class="b${k}" style="width:${n ? c[k] / n * 100 : 0}%"></i>`).join('')}</div>`;
  const statTxt = ({ c, d, n }) => `<div class="stat"><span>共 <b>${n}</b></span><span>熟练 <b>${c[2]}</b></span><span>模糊 <b>${c[1]}</b></span><span>不会 <b>${c[0]}</b></span>${d ? `<span class="due">今天待复习 ${d}</span>` : '<span>今天没有待复习</span>'}</div>`;
  // 顶部三个卡组
  const lcIds = items(D.lc.groups).map(x => x[0]), ppIds = items(D.pp.groups).map(x => x[0]);
  const sl = summary(SETS.lc, lcIds), sp = summary(SETS.pp, ppIds);

  const bgAll = [...new Set(D.bg.decks.flatMap(dk => items(dk.groups).map(x => x[0])))], sb = summary(SETS.bg, bgAll);
  document.getElementById('tiles').innerHTML = `
    <div class="tile"><h2>🧩 LeetCode 热题 100 <small>${sl.n} 题</small></h2><p>上滑换题、左滑看图解和讲解、右滑默写核对。06 背诵本有逐步动画和逐行背诵。</p>${bar(sl)}${statTxt(sl)}<div class="btns"><a class="btn" href="09-swipe.html">开始刷题</a><a class="btn ghost" href="06-hot100.html">背诵本</a></div></div>
    <div class="tile"><h2>🎓 论文面试卡 <small>${sp.n} 张</small></h2><p>五篇论文各 18 张问答，挖空复述关键数字，每张配音频，可以连播。</p>${bar(sp)}${statTxt(sp)}<div class="btns"><a class="btn" href="10-papers.html">开始刷卡</a></div></div>
    <div class="tile"><h2>🧠 八股速记 <small>${sb.n} 张</small></h2>${bar(sb)}${statTxt(sb)}<div class="decks">${deckRows}</div></div>`;
  // 题目清单
  let tab = get('hub-tab-v1', 'bg'), deck = get('hub-deck-v1', 'job'), filt = 'all', q = '';

  };

      if (filt[0] === 's' && s !== +filt[1]) return false;

    };
    let html = '', shown = 0;
    gs.forEach(g => {
      const vis = g.items.filter(it => ok(it, g)); if (!vis.length) return;
      shown += vis.length;
      const sm = summary(S, g.items.map(x => x[0]));
      html += `<details open><summary><b>${esc(g.name)}</b><span>${sm.c[2]}/${sm.n} 熟练</span>${bar(sm)}</summary><ol>${vis.map(it => { const s = S.st[it[0]]; return `<li><a href="${S.link(it[0], deck)}"><i class="dot ${s === undefined ? '' : 's' + s}"></i><span class="t"><b>${esc(it[1])}</b>${it[2] ? `<small>${esc(it[2])}</small>` : ''}</span>${due(S, it[0]) ? '<span class="due">待复习</span>' : ''}${it[3] ? `<span class="tag">${esc(it[3])}</span>` : ''}</a></li>`; }).join('')}</ol></details>`;
    });
    document.getElementById('groups').innerHTML = html || '<p class="empty">当前筛选下没有题目。</p>';
  };
  const paint = () => { paintTabs(); paintList(); };
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; put('hub-tab-v1', tab); paint(); return; }
    const d = e.target.closest('[data-deck]'); if (d) { deck = d.dataset.deck; put('hub-deck-v1', deck); paint(); return; }
    const f = e.target.closest('[data-f]'); if (f) { filt = f.dataset.f; paint(); }
  });
  document.getElementById('q').addEventListener('input', e => { q = e.target.value; paintList(); });
  // 从卡片页返回时刷新进度
  addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
  paint();
})();
</script></body></html>
