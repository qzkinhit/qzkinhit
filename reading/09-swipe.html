  const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
  let day = LS.get('swipe-day-v1', { d: '', ids: [] });
  if (day.d !== today()) day = { d: today(), ids: [] };
  const drafts = LS.get('swipe-draft-v1', {});

  // ---------- order ----------
  function buildOrder(c) {
    const ids = ALL.filter(id => {
      const p = D.probs[id], s = ST.get(id);
      if (c.cats.length && !c.cats.includes(p.cat)) return false;
      if (c.filter === 'weak' && s === 2) return false;
      if (c.filter === 'wrong' && !(s === 0 || s === 1)) return false;
      if (c.filter === 'ali' && !p.ali) return false;
      if (c.filter === 'must' && !p.must) return false;
      return true;
    });
    if (c.order === 'rand') for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    return ids;
  }
  function savePos() { LS.set('swipe-pos-v1', { key: cfgKey(cfg), order, pos: cur }); }
  function start(resume, jumpId) {
    const saved = LS.get('swipe-pos-v1', null);
    if (resume && saved && saved.key === cfgKey(cfg) && Array.isArray(saved.order) && saved.order.length && saved.order.every(id => D.probs[id])) {
      order = saved.order; cur = Math.min(saved.pos || 0, order.length);
    } else { order = buildOrder(cfg); cur = 0; }
    if (jumpId && D.probs[jumpId]) {
      if (!order.includes(jumpId)) { cfg = Object.assign(cfg, { order: 'seq', filter: 'all', cats: [] }); LS.set('swipe-cfg-v1', cfg); order = buildOrder(cfg); }
      cur = order.indexOf(jumpId);
    }
    renderFeed();
  }

  // ---------- feed ----------
  let ready = false;
  const io = new IntersectionObserver(es => {
    if (!ready) return;
    es.forEach(e => { if (e.isIntersecting && e.intersectionRatio >= 0.6) setCur(+e.target.dataset.k); });
  }, { root: feed, threshold: [0.6] });
  function renderFeed() {
    ready = false; io.disconnect(); feed.innerHTML = '';
    order.forEach((id, k) => {
      const s = document.createElement('section');
      s.className = 'slide'; s.dataset.k = k; s.style.setProperty('--h', HUE[D.probs[id].cat] ?? 200);
      feed.appendChild(s);
    });
    const end = document.createElement('section');
    end.className = 'slide endslide'; end.dataset.k = order.length; end.style.setProperty('--h', 160);
    feed.appendChild(end);
    [...feed.children].forEach(s => io.observe(s));
    ensure(cur);
    feed.scrollTop = cur * feed.clientHeight;
    setCur(cur, true);
    requestAnimationFrame(() => { ready = true; });
  }
  const slideAt = k => feed.children[k];
  function ensure(k) { for (let j = k - 1; j <= k + 2; j++) if (j >= 0 && j < order.length) fill(slideAt(j)); }
  function setCur(k, force) {
    if (k === cur && !force) return;
    const old = slideAt(cur); if (old) old.classList.remove('in');
    cur = k; ensure(k);
    const sl = slideAt(k);
    if (sl) { sl.classList.remove('in'); void sl.offsetWidth; sl.classList.add('in'); }
    if (k === order.length) paintEnd();
    paintTabs(sl && sl.dataset.pane !== undefined ? +sl.dataset.pane : 1);
    paintStats(); savePos();
  }
  const next = () => feed.scrollTo({ top: Math.min(order.length, cur + 1) * feed.clientHeight, behavior: 'smooth' });
  const prev = () => feed.scrollTo({ top: Math.max(0, cur - 1) * feed.clientHeight, behavior: 'smooth' });
  function jump(k) { feed.scrollTop = k * feed.clientHeight; ensure(k); setCur(k); }

  // ---------- panes ----------
  function paneMain(p) {
    const s = ST.get(p.id);
    return `<div class="pane pmain"><div class="bigemo">${EMO[p.cat] || '⭐'}</div><div class="mscroll"><div class="card">
      <div class="chips"><span class="chip">${EMO[p.cat] || '⭐'} ${esc(p.cat)}</span><span class="chip d-${p.diff}">${p.diff}</span>${p.must ? '<span class="chip must">必写</span>' : ''}${p.ali ? `<span class="chip ali">阿里高频 ×${p.ali}</span>` : ''}</div>
      <h2><span class="no">${esc(p.no || p.id)}</span>${esc(p.title)}</h2>
      <p class="desc">${esc(p.desc)}</p>
      <div class="ex"><div><b>例子</b><code>${esc(p.viz.ex)}</code></div><div><b>输出</b><code>${esc(p.viz.out)}</code></div></div>
      <div class="think">先想 30 秒。想出来了就去默写核对，没有思路就去看解析和图解。</div>
    </div></div>
    <div class="rail">${[2, 1, 0].map(v => `<button class="rb${s === v ? ' on' : ''}" data-s="${v}"><span>${FACES[v]}</span><i>${NAMES[v]}</i></button>`).join('')}<a class="rb" href="${p.url}" target="_blank" rel="noopener"><span>✍</span><i>力扣</i></a></div>
    <div class="edge"><button data-go="0">‹ 默写</button><span class="up">↑ 上滑下一题</span><button data-go="2">解析 ›</button></div></div>`;
  }
  function paneExplain(p) {
    return `<div class="pane pexp"><div class="card">
      <div class="phd"><button data-go="1">‹ 题目</button><b>解析</b><span></span></div>
      <div class="hookbig">💡 ${esc(p.hook)}</div>
      ${TPL[p.cat] ? `<div class="tpl"><b>${EMO[p.cat] || ''} ${esc(p.cat)}套路</b>　${esc(TPL[p.cat])}</div>` : ''}
      <div class="sec"><b>图解（自动播放，可以手动翻步）</b><div class="anim vizbox"></div></div>
      <div class="sec"><b>思路</b><p>${esc(p.idea)}</p></div>
      <div class="cx"><div><b>时间</b>${esc(p.viz.t)}</div><div><b>空间</b>${esc(p.viz.s)}</div></div>
      ${p.edge ? `<div class="sec"><b>边界</b><p>${esc(p.edge)}</p></div>` : ''}
      <div class="foot"><button class="big" data-go="0">去默写核对</button><button class="big ghost" data-next>下一题 ↓</button></div>
    </div></div>`;
  }
  function paneRecall(p) {
    const s = ST.get(p.id);
    return `<div class="pane prec"><div class="card">
      <div class="phd"><span></span><b>默写</b><button data-go="1">题目 ›</button></div>
      <details class="hint"><summary>卡住了就看一眼钩子</summary><p>💡 ${esc(p.hook)}</p></details>
      <textarea class="draft" placeholder="在这里默写代码，写完点“核对”，会逐行标出写对和漏掉的地方。也可以在纸上写，再逐行揭开答案。" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
      <div class="btns"><button class="big" data-chk>核对</button><a class="big lc" href="${p.url}" target="_blank" rel="noopener">✍ 去力扣默写</a></div>
      <div class="ansbar"><b>答案</b><span class="cnt"></span><button data-rv="next">揭开一行</button><button data-rv="all">全部</button><button data-rv="reset">盖住</button></div>
      <div class="ans">${CN.codeHTML(p.code)}</div>
      <div class="score"></div>
      <div class="grade"><span>核对完了，这题掌握得怎样</span>${[0, 1, 2].map(v => `<button data-g="${v}" class="${s === v ? 'on' : ''}">${FACES[v]} ${NAMES[v]}</button>`).join('')}</div>
      <button class="big ghost nextbtn" data-next style="width:100%">下一题 ↓</button>
    </div></div>`;
  }
  function fill(sl) {
    if (!sl || sl.dataset.f) return;
    sl.dataset.f = 1;
    const p = D.probs[order[+sl.dataset.k]];
    sl.innerHTML = `<div class="hx">${paneRecall(p)}${paneMain(p)}${paneExplain(p)}</div>`;
    const hx = sl.querySelector('.hx');
    hx.scrollLeft = hx.clientWidth; sl.dataset.pane = 1;
    const ta = sl.querySelector('.draft');
    ta.value = drafts[p.id] || '';
    ta.addEventListener('input', () => { drafts[p.id] = ta.value; if (!ta.value) delete drafts[p.id]; LS.set('swipe-draft-v1', drafts); });
    ta.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); const a = ta.selectionStart; ta.setRangeText('    ', a, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); } });
    const lines = [...sl.querySelectorAll('.ans .ln')], codeLines = p.code.split('\n');
    let shown = 0;
    const cnt = sl.querySelector('.ansbar .cnt');
    const paintAns = () => { lines.forEach((l, i) => { l.classList.toggle('hide', i >= shown); l.classList.toggle('cur', i === shown - 1 && shown < lines.length); }); cnt.textContent = `${shown} / ${lines.length}`; };
    const rv = {
      next() { do { shown = Math.min(lines.length, shown + 1); } while (shown < lines.length && !lines[shown - 1].textContent.trim()); paintAns(); },
      all() { shown = lines.length; paintAns(); },
      reset() { shown = 0; lines.forEach(l => l.classList.remove('hit', 'near', 'miss')); sl.querySelector('.score').innerHTML = ''; paintAns(); }
    };
    sl._rv = rv; paintAns();
    let t = null;
    hx.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(() => paneChanged(sl, p), 90); }, { passive: true });
    sl.addEventListener('click', e => {
      const g = e.target.closest('[data-go]'); if (g) return goPane(sl, +g.dataset.go);
      if (e.target.closest('[data-next]')) return next();
      const rb = e.target.closest('.rb[data-s]'); if (rb) return mark(p.id, +rb.dataset.s, sl, 'main', rb);
      const gb = e.target.closest('[data-g]'); if (gb) return mark(p.id, +gb.dataset.g, sl, 'rec', gb);
      const r = e.target.closest('[data-rv]'); if (r) return rv[r.dataset.rv]();
      if (e.target.closest('.ans pre')) return rv.next();
      if (e.target.closest('[data-chk]')) return check(sl, ta, lines, codeLines);
    });
  }
  function paneChanged(sl, p) {
    const hx = sl.querySelector('.hx'), i = Math.round(hx.scrollLeft / hx.clientWidth);
    if (+sl.dataset.pane === i) return;
    sl.dataset.pane = i;
    if (+sl.dataset.k === cur) paintTabs(i);
    if (i === 2 && !sl._viz) {
      sl._viz = 1;
      const box = sl.querySelector('.vizbox');
      VZ.mount(box, p.viz);
      setTimeout(() => { const b = box.querySelector('[data-a=play]'); if (b) b.click(); }, 450);
    }
  }
  function goPane(sl, i) { const hx = sl.querySelector('.hx'); if (hx) hx.scrollTo({ left: i * hx.clientWidth, behavior: 'smooth' }); }
  const norm = l => l.replace(/#.*/, '').replace(/\s+/g, '');
  function sim(a, b) {
    if (a === b) return 1;
    const m = a.length, n = b.length; if (!m || !n) return 0;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const row = [i];
      for (let j = 1; j <= n; j++) row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = row;
    }
    return 1 - prev[n] / Math.max(m, n);
  }
  function check(sl, ta, lines, codeLines) {
    if (!ta.value.trim()) { toast('先写一点再核对'); ta.focus(); return; }
    const pool = ta.value.split('\n').map(norm).filter(Boolean), used = pool.map(() => false);
    let hit = 0, near = 0, tot = 0;
    sl._rv.all();
    lines.forEach((ln, i) => {
      ln.classList.remove('hit', 'near', 'miss', 'cur');
      const n = norm(codeLines[i] || ''); if (!n) return;
      tot++;
      let k = pool.findIndex((x, q) => !used[q] && x === n);
      if (k >= 0) { used[k] = true; hit++; ln.classList.add('hit'); return; }
      let best = -1, bs = 0;
      pool.forEach((x, q) => { if (!used[q]) { const s = sim(x, n); if (s > bs) { bs = s; best = q; } } });
      if (best >= 0 && bs >= 0.75) { used[best] = true; near++; ln.classList.add('near'); } else ln.classList.add('miss');
    });
    const pct = tot ? Math.round(100 * (hit + 0.7 * near) / tot) : 0;
    const msg = pct >= 90 ? '基本全对，可以标熟练' : pct >= 60 ? '主体写出来了，黄色行写法接近，红色行再看一遍' : '红色行是没写到或写得不一样的，看完解析再写一遍';
    sl.querySelector('.score').innerHTML = `<span class="pct">${pct}%</span>完全一致 ${hit} 行，接近 ${near} 行，共 ${tot} 行。${msg}`;
    if (pct >= 90) burst(sl.querySelector('[data-chk]'), 2);
    sl.querySelector('.score').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // ---------- marking ----------
  function mark(id, s, sl, where, btn) {
    ST.set(id, s); session[id] = s;
    const before = day.ids.length;
    if (!day.ids.includes(id)) day.ids.push(id);
    LS.set('swipe-day-v1', day);
    streak = s === 2 ? streak + 1 : 0;
    sl.querySelectorAll('.rb[data-s]').forEach(b => b.classList.toggle('on', +b.dataset.s === s));
    sl.querySelectorAll('[data-g]').forEach(b => b.classList.toggle('on', +b.dataset.g === s));
    burst(btn, s);
    try { navigator.vibrate && navigator.vibrate(s === 2 ? [12, 40, 12] : 12); } catch (e) {}
    paintStats(s === 2 && streak >= 2);
    if (before < cfg.goal && day.ids.length >= cfg.goal) { setTimeout(() => { toast(`🎯 今日 ${cfg.goal} 题目标完成`); confetti(); }, 300); }
    if (where === 'main') {
      if (s === 2) { toast(streak >= 2 ? `🔥 连续熟练 ${streak} 题` : '💪 熟练 +1，下一题'); setTimeout(next, 650); }
      else if (s === 1) { toast('🤔 记为模糊，先默写一遍'); setTimeout(() => goPane(sl, 0), 500); }
      else { toast('😵 记为不会，先看解析和图解'); setTimeout(() => goPane(sl, 2), 500); }
    } else {
      toast(s === 2 ? (streak >= 2 ? `🔥 连续熟练 ${streak} 题` : '💪 熟练 +1') : s === 1 ? '🤔 记为模糊，之后再刷' : '😵 记为不会，之后再刷');
      setTimeout(next, 650);
    }
  }
  const FLY = [['😵', '📖', '💧'], ['🤔', '💭', '✏️'], ['💪', '✨', '🎉', '⭐']];
  function burst(el, s) {
    if (!el) return;
    const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    for (let i = 0; i < (s === 2 ? 10 : 6); i++) {
      const f = document.createElement('span');
      f.className = 'fly'; f.textContent = FLY[s][i % FLY[s].length];
      f.style.left = (x - 12) + 'px'; f.style.top = (y - 14) + 'px';
      f.style.setProperty('--dx', (Math.random() * 160 - 110) + 'px');
      f.style.setProperty('--dy', (-60 - Math.random() * 140) + 'px');
      f.style.setProperty('--rot', (Math.random() * 80 - 40) + 'deg');
      document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
    }
  }
  function confetti() {
    const W = innerWidth;
    for (let i = 0; i < 28; i++) {
      const f = document.createElement('span');
      f.className = 'fly'; f.textContent = ['🎉', '✨', '🎊', '⭐', '💪'][i % 5];
      f.style.left = (W / 2 - 12) + 'px'; f.style.top = (innerHeight * 0.45) + 'px';
      f.style.setProperty('--dx', (Math.random() * W - W / 2) + 'px');
      f.style.setProperty('--dy', (-120 - Math.random() * 260) + 'px');
      f.style.setProperty('--rot', (Math.random() * 180 - 90) + 'deg');
      f.style.animationDuration = (0.9 + Math.random() * 0.6) + 's';
      document.body.appendChild(f); setTimeout(() => f.remove(), 1600);
    }
  }
  let tt = null;
  function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1300); }

  // ---------- top bar ----------
  function paintTabs(i) { document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', +b.dataset.p === i)); }
  function paintStats(pop) {
    const n = order.length;
    $('#top .bar i').style.width = n ? (100 * Math.min(cur, n) / n) + '%' : '0';
    $('#pos').textContent = n ? (cur < n ? `第 ${cur + 1} / ${n} 题` : '本轮完成') : '没有题';
    const f = $('#fire');
    f.textContent = streak >= 2 ? `🔥${streak}` : '';
    if (pop) { f.classList.remove('pop'); void f.offsetWidth; f.classList.add('pop'); }
    $('#today').textContent = `今日 ${day.ids.length} / ${cfg.goal}`;
  }
  document.getElementById('tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const sl = slideAt(cur); if (sl && sl.querySelector('.hx')) goPane(sl, +b.dataset.p);
  });

  // ---------- end slide ----------
  function paintEnd() {
    const sl = slideAt(order.length); if (!sl) return;
    const c = [0, 0, 0]; Object.values(session).forEach(s => c[s]++);
    const body = order.length
      ? `<div style="font-size:46px">🎉</div><h2>这一轮刷完了</h2><p>本轮 ${order.length} 题，这次一共标记了 ${c[0] + c[1] + c[2]} 题</p>
         <div class="endstats"><div><b>${c[2]}</b>💪 熟练</div><div><b>${c[1]}</b>🤔 模糊</div><div><b>${c[0]}</b>😵 不会</div></div>
         <button class="big" data-end="rand">再来一轮，打乱顺序</button><button class="big ghost" data-end="weak">只刷还没熟练的</button><button class="big ghost" data-end="top">回到第一题</button>`
      : `<div style="font-size:46px">🫙</div><h2>没有符合条件的题</h2><p>当前的范围筛选下一题都没有，换个设置试试。</p><button class="big" data-end="set">打开设置</button>`;
    sl.innerHTML = `<div class="pane"><div class="card">${body}</div></div>`;
  }
  feed.addEventListener('click', e => {
    const b = e.target.closest('[data-end]'); if (!b) return;
    const v = b.dataset.end;
    if (v === 'top') return jump(0);
    if (v === 'set') return openSheet();
    cfg = Object.assign({}, cfg, v === 'rand' ? { order: 'rand' } : { filter: 'weak' });
    LS.set('swipe-cfg-v1', cfg); start(false);
  });

  // ---------- settings sheet ----------
  let tmp = null;
  function openSheet() {
    tmp = JSON.parse(JSON.stringify(cfg));
    const sh = $('#sheet');
    const opt = (k, v, label) => `<button data-k="${k}" data-v="${v}" class="${String(tmp[k]) === String(v) ? 'on' : ''}">${label}</button>`;
    const counts = Object.fromEntries(CATS.map(c => [c, ALL.filter(id => D.probs[id].cat === c).length]));
    sh.querySelector('.body').innerHTML = `<div class="grab"></div><h3>刷题设置</h3>
      <div class="srow"><b>顺序</b><div class="opts">${opt('order', 'seq', '分类顺序')}${opt('order', 'rand', '随机打乱')}</div></div>
      <div class="srow"><b>范围</b><div class="opts">${opt('filter', 'all', '全部')}${opt('filter', 'weak', '还没熟练')}${opt('filter', 'wrong', '不会和模糊')}${opt('filter', 'ali', '阿里高频')}${opt('filter', 'must', '必写')}</div></div>
      <div class="srow"><b>分类</b><div class="opts">${CATS.map(c => `<button data-cat="${esc(c)}" class="${tmp.cats.includes(c) ? 'on' : ''}">${EMO[c] || ''} ${esc(c)} ${counts[c]}</button>`).join('')}<span style="font-size:12px;color:var(--muted);align-self:center">不选就是全部分类</span></div></div>
      <div class="srow"><b>每日目标</b><div class="opts">${[10, 20, 30, 50].map(g => opt('goal', g, g + ' 题')).join('')}</div></div>
      <button class="big" id="apply" style="width:100%;background:#176c63;margin-top:6px">按这个设置开刷</button>
      <h3>本轮题目（点一下直接跳过去）</h3>
      <div class="legend"><span><i style="background:#cfeedd"></i>熟练</span><span><i style="background:#fbeccb"></i>模糊</span><span><i style="background:#f8d9d5"></i>不会</span><span><i style="background:#eceff0"></i>未标</span></div>
      <div class="map">${order.map((id, k) => { const s = ST.get(id); return `<button data-j="${k}" class="${s !== undefined ? 's' + s : ''}${k === cur ? ' cur' : ''}" title="${esc(D.probs[id].title)}">${esc(D.probs[id].no ? '剑' : id)}</button>`; }).join('')}</div>
      <p style="font-size:12px;color:var(--muted);margin:12px 0 0">熟练程度和背诵本页面共用，在这里标的状态，回到背诵本也能看到。默写草稿保存在这个浏览器里。</p>`;
    sh.classList.add('on');
  }
  function closeSheet() { $('#sheet').classList.remove('on'); }
  $('#sheet').addEventListener('click', e => {
    if (e.target.id === 'sheet') return closeSheet();
    const o = e.target.closest('[data-k]');
    if (o) { const k = o.dataset.k; tmp[k] = k === 'goal' ? +o.dataset.v : o.dataset.v; o.parentNode.querySelectorAll(`[data-k="${k}"]`).forEach(b => b.classList.toggle('on', b === o)); return; }
    const c = e.target.closest('[data-cat]');
    if (c) { const v = c.dataset.cat; tmp.cats = tmp.cats.includes(v) ? tmp.cats.filter(x => x !== v) : tmp.cats.concat(v); c.classList.toggle('on'); return; }
    const j = e.target.closest('[data-j]');
    if (j) { closeSheet(); return jump(+j.dataset.j); }
    if (e.target.id === 'apply') {
      const changed = cfgKey(tmp) !== cfgKey(cfg) || tmp.order === 'rand';
      cfg = tmp; LS.set('swipe-cfg-v1', cfg); closeSheet();
      if (changed) { start(false); toast(order.length ? `本轮 ${order.length} 题，开刷` : '没有符合条件的题'); } else paintStats();
    }
  });
  $('#gear').addEventListener('click', openSheet);

  // ---------- guide ----------
  const guide = $('#guide');
  const showGuide = () => guide.classList.add('on');
  $('#gok').addEventListener('click', () => { guide.classList.remove('on'); LS.set('swipe-guide-v1', 1); });
  $('#help').addEventListener('click', showGuide);
  if (!LS.get('swipe-guide-v1', 0)) showGuide();

  // ---------- keyboard and resize ----------
  document.addEventListener('keydown', e => {
    if (/input|textarea|select/i.test(e.target.tagName)) return;
    if ($('#sheet').classList.contains('on')) { if (e.key === 'Escape') closeSheet(); return; }
    const sl = slideAt(cur), pane = sl && sl.dataset.pane !== undefined ? +sl.dataset.pane : 1;
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowLeft' && sl && sl.querySelector('.hx')) { e.preventDefault(); goPane(sl, Math.max(0, pane - 1)); }
    else if (e.key === 'ArrowRight' && sl && sl.querySelector('.hx')) { e.preventDefault(); goPane(sl, Math.min(2, pane + 1)); }
    else if (e.key === ' ' && sl && sl._rv && pane === 0) { e.preventDefault(); sl._rv.next(); }
    else if (/^[123]$/.test(e.key) && sl && sl.querySelector('.hx')) { const s = [0, 1, 2][+e.key - 1]; mark(order[cur], s, sl, pane === 0 ? 'rec' : 'main', sl.querySelector(`.rb[data-s="${s}"]`)); }
  });
  let rt = null;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      ready = false;
      feed.querySelectorAll('.slide[data-f]').forEach(sl => { const hx = sl.querySelector('.hx'); hx.scrollLeft = (+sl.dataset.pane || 0) * hx.clientWidth; });
      feed.scrollTop = cur * feed.clientHeight;
      requestAnimationFrame(() => { ready = true; });
    }, 120);
  });

  const qid = new URLSearchParams(location.search).get('id');
  start(true, qid);
})();
</script>
</body></html>
