<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f13"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Hot 100 刷题模式</title><style>:root{--bg:#f7f8f5;--paper:#fff;--ink:#20332f;--muted:#5a6a65;--line:#d9dfd7;--acc:#176c63;--acc2:#e3f0ec;--easy:#2f8a5b;--mid:#b07a14;--hard:#b4443c;--code:#f3f5f1;--warn:#fbf1e2;--warnink:#8a5413;--blue:#2c5d8f;--blue2:#e6eef7;--red2:#f8e3e1}
button.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;cursor:pointer}
button.btn:hover{border-color:var(--acc)}
button.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.hidden{display:none!important}
pre.code{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 0;margin:10px 0;overflow:auto;font:13.2px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;counter-reset:ln}
pre.code .ln{display:block;padding:0 12px 0 46px;position:relative;white-space:pre}
pre.code .ln::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:34px;text-align:right;color:#a7b2ac}
pre.code .ln.cur{background:#fff6d6}
pre.code .ln.hide{color:transparent;text-shadow:none}
pre.code .ln.hide *{color:transparent!important}
pre.code .ln.hide::after{content:"";position:absolute;left:46px;right:14px;top:50%;border-top:2px dashed #c9d2cb}
.tk-k{color:#8a3fb0;font-weight:600}
.tk-s{color:#2f7d32}
.tk-c{color:#8a968f;font-style:italic}
.tk-n{color:#b0560e}
.tk-b{color:#1f5fa8}
.tk-f{color:#0e6e8c}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px;background:#fff}
.anim .ah{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.anim .ah b{font-size:14.5px}
.stage{min-height:120px;overflow-x:auto}
.arr{display:flex;gap:4px;align-items:flex-end;padding:22px 2px 20px;position:relative}
.cell{min-width:36px;height:36px;border:1px solid #b9c4bd;border-radius:6px;display:flex;align-items:center;justify-content:center;font:14px ui-monospace,Menlo,monospace;background:#fff;position:relative;transition:background .2s}
.cell.bar{align-items:flex-end;padding-bottom:2px;border-radius:4px 4px 0 0}
.cell.hl{background:#ffe9a8;border-color:#d1a52a}
.cell.in{background:var(--acc2);border-color:var(--acc)}
.cell.dim{opacity:.35}
.cell.ok{background:#d9efe0;border-color:var(--easy)}
.cell.bad{background:var(--red2);border-color:var(--hard)}
.cell .idx{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10.5px;color:#9aa69f}
.cell .ptr{position:absolute;top:-20px;left:-6px;right:-6px;text-align:center;font-size:11px;font-weight:700;color:var(--hard);white-space:nowrap}
.grid{display:inline-grid;gap:3px;padding:6px}
.grid .cell{min-width:34px;height:34px}
.vars{display:flex;flex-wrap:wrap;gap:6px 10px;margin:6px 0;font:13px ui-monospace,Menlo,monospace}
.vars span{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.note{font-size:14px;margin-top:6px;min-height:22px}
.ll{display:flex;align-items:center;gap:0;padding:26px 4px 10px;flex-wrap:wrap}
.ll .node{min-width:38px;height:34px;border:1.5px solid var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;font:14px ui-monospace,Menlo,monospace;background:#fff;position:relative}
.ll .arrow{width:34px;text-align:center;color:var(--muted);font-size:18px}
.ll .arrow.rev{color:var(--hard)}
.ll .node .ptr{position:absolute;top:-20px;left:-10px;right:-10px;text-align:center;font-size:11px;font-weight:700;color:var(--hard);white-space:nowrap}
html,body{height:100%;margin:0;background:#0d0f13;overscroll-behavior:none}
body{font:15px/1.65 system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#111}
#feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar,.hx::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;
  background:radial-gradient(120% 70% at 15% 0%,hsl(var(--h) 80% 64% / .95),transparent 62%),linear-gradient(165deg,hsl(var(--h) 62% 44%),hsl(calc(var(--h) + 45) 58% 20%))}
.hx{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.pane{flex:0 0 100%;height:100%;box-sizing:border-box;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) 12px 70px;-webkit-overflow-scrolling:touch}
.prec,.pexp{overscroll-behavior-y:contain;padding-bottom:28px}
.card{background:rgba(255,255,255,.97);border-radius:22px;padding:16px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.slide.in .pmain .card{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
/* top bar */
#top{position:absolute;left:0;right:0;top:0;z-index:20;padding:calc(6px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));color:#fff;pointer-events:none}
#top>*{pointer-events:auto}
#top .r1{display:flex;align-items:center;gap:6px}
#top a.back,#top .ib{color:#fff;text-decoration:none;font-size:15px;background:rgba(255,255,255,.16);border:0;border-radius:999px;height:32px;min-width:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
#tabs{flex:1;display:flex;justify-content:center;gap:18px}
#tabs button{background:none;border:0;color:rgba(255,255,255,.62);font:600 16px/1 inherit;padding:6px 0 7px;position:relative;cursor:pointer;transition:color .2s}
#tabs button.on{color:#fff}
#tabs button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:3px;border-radius:2px;background:#fff}
#top .bar{height:3px;background:rgba(255,255,255,.22);border-radius:2px;margin:8px 2px 4px;overflow:hidden}
#top .bar i{display:block;height:100%;width:0;background:#fff;transition:width .3s}
#top .r2{display:flex;justify-content:space-between;font-size:12px;opacity:.92;padding:0 2px}
#top .fire{display:inline-block}
#top .fire.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.6)}}
/* main pane */
.pmain{position:relative;overflow:hidden;padding:0}
.mscroll{position:relative;z-index:2;height:100%;box-sizing:border-box;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) 12px 70px}
.pmain .card{margin-right:62px}
.bigemo{position:absolute;left:-18px;bottom:60px;font-size:150px;line-height:1;opacity:.22;transform:rotate(-14deg);pointer-events:none;z-index:1;filter:saturate(.6)}
.slide.in .bigemo{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:rotate(-8deg) translateY(-10px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{font-size:12px;border-radius:999px;padding:1px 9px;background:#eef2ee;color:#3b4b46;white-space:nowrap}
.chip.d-简单{background:#e1f2e8;color:var(--easy)}
.chip.d-中等{background:#f8eedb;color:var(--mid)}
.chip.d-困难{background:#f8e3e1;color:var(--hard)}
.chip.must{background:var(--hard);color:#fff}
.chip.ali{background:#fde9dc;color:#c2521b}
.pmain h2{font-size:22px;line-height:1.35;margin:4px 0 8px}
.pmain h2 .no{display:inline-block;font-size:13px;color:#fff;background:hsl(var(--h) 55% 42%);border-radius:7px;padding:1px 7px;margin-right:8px;vertical-align:3px}
.desc{margin:0 0 10px;font-size:15.5px}
.ex{background:#f3f5f1;border-radius:12px;padding:8px 11px;font-size:13.5px}
.ex div{display:flex;gap:8px;align-items:baseline}
.ex b{flex:0 0 auto;font-size:12.5px;color:var(--muted)}
.ex code{font:13px/1.55 ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.think{margin-top:12px;font-size:13.5px;color:var(--muted);border-left:3px solid hsl(var(--h) 60% 50%);padding-left:9px}
.rail{position:absolute;right:8px;bottom:84px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:5}
.rb{display:flex;flex-direction:column;align-items:center;background:none;border:0;color:#fff;text-decoration:none;cursor:pointer;padding:0}
.rb span{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;font-size:25px;transition:transform .15s,background .2s,box-shadow .2s}
.rb i{font-style:normal;font-size:11.5px;margin-top:3px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.rb:active span{transform:scale(.88)}
.rb.on span{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.edge{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;z-index:4}
.edge button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:999px;padding:7px 14px;font:600 14px/1 inherit;cursor:pointer;backdrop-filter:blur(4px)}
.edge .up{color:#fff;font-size:12.5px;opacity:.85;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
/* explain / recall */
.phd{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 10px}
.phd b{font-size:16px}
.phd button,.phd span{min-width:64px}
.phd button{background:#eef2ee;border:0;border-radius:999px;padding:4px 10px;font:13px inherit;color:var(--ink);cursor:pointer}
.phd span{display:inline-block}
.hookbig{background:linear-gradient(135deg,#fff3c4,#ffe28a);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:600;line-height:1.55;margin-bottom:10px}
.tpl{font-size:13.5px;background:#eef4f1;border-radius:10px;padding:8px 10px;margin-bottom:10px}
.sec{margin:10px 0}
.sec>b{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.sec p{margin:0}
.cx{display:grid;gap:6px;margin:10px 0}
.cx div{background:#f3f5f1;border-radius:10px;padding:7px 10px;font-size:13.5px}
.cx b{color:hsl(var(--h) 55% 38%);margin-right:6px}
.foot{display:flex;gap:8px;margin-top:14px}
.big{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;background:hsl(var(--h) 58% 40%);color:#fff;border:0;border-radius:14px;padding:11px 12px;font:600 15px/1.2 inherit;text-decoration:none;cursor:pointer}
.big.ghost{background:#eef2ee;color:var(--ink)}
.big.lc{background:#1f2328}
.big:active{transform:scale(.97)}
.hint{background:#fff8e1;border-radius:10px;padding:7px 10px;font-size:13.5px;margin-bottom:10px}
.hint summary{cursor:pointer;color:#8a5413}
.hint p{margin:6px 0 0;font-weight:600}
.draft{display:block;width:100%;box-sizing:border-box;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:10px;font:16px/1.5 ui-monospace,Menlo,monospace;background:#fbfcfa;resize:vertical;tab-size:4}
.draft:focus{outline:2px solid hsl(var(--h) 60% 50%);border-color:transparent}
.btns{display:flex;gap:8px;margin:10px 0}
.ansbar{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.ansbar b{font-size:14px;margin-right:auto}
.ansbar .cnt{font-size:12px;color:var(--muted)}
.ansbar button{background:#eef2ee;border:0;border-radius:999px;padding:4px 11px;font:13px inherit;color:var(--ink);cursor:pointer}
.ansbar button[data-rv=next]{background:hsl(var(--h) 58% 40%);color:#fff}
.pane pre.code{font-size:12.2px;margin:8px 0;cursor:pointer}
.pane pre.code .ln{white-space:pre-wrap;overflow-wrap:anywhere;padding:0 10px 0 32px}
.pane pre.code .ln::before{width:24px}
.pane pre.code .ln.hide::after{left:32px}
.pane pre.code .ln.hit{background:#dff3e6}
.pane pre.code .ln.miss{background:#fbe1de}
.pane pre.code .ln.near{background:#fdf1cc}
.score{font-size:14px;margin:4px 0 0;min-height:4px}
.score .pct{font-size:22px;font-weight:700;color:hsl(var(--h) 55% 38%);margin-right:6px}
.grade{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.grade span{width:100%;font-size:13px;color:var(--muted)}
.grade button{flex:1;background:#f3f5f1;border:0;border-radius:12px;padding:10px 4px;font:600 14px inherit;cursor:pointer}
.grade button:active{transform:scale(.95)}
.grade button.on{background:hsl(var(--h) 58% 40%);color:#fff}
.nextbtn{margin-top:10px}
/* demo inside panes */
.pane .anim{padding:10px;margin:6px 0;border-radius:12px}
.pane .stage{overflow:hidden;min-height:0}
.pane .stage svg{height:auto}
.pane .arr{gap:3px;padding:22px 0 18px}
.pane .arr .cell{flex:1 1 0;min-width:15px;max-width:44px;padding:0 1px;font-size:12px;overflow:visible}
.pane .grid .cell{min-width:26px;height:28px;font-size:12px}
.pane .ll .node{min-width:30px;height:30px;font-size:13px}
.pane .ll .arrow{width:16px;font-size:14px}
.pane .anim .ah{gap:6px}
.pane .anim .ah code{font-size:12.5px;overflow-wrap:anywhere}
.pane .anim .ah b{font-size:13px}
.pane .anim .ah .btn{padding:4px 10px;font-size:13px}
.pane .note{font-size:13.5px}
.pane .vizbox .grid{row-gap:16px;padding-top:16px}
/* end slide */
.endslide .pane{display:flex;align-items:center}
.endslide .card{width:100%;text-align:center}
.endslide h2{font-size:24px;margin:6px 0}
.endstats{display:flex;justify-content:center;gap:16px;margin:14px 0;font-size:14px}
.endstats div{display:flex;flex-direction:column;align-items:center}
.endstats b{font-size:26px}
.endslide .big{width:100%;margin-top:8px}
/* sheet */
#sheet{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none}
#sheet.on{display:block}
#sheet .body{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:#d4dad5;margin:4px auto 8px}
#sheet h3{font-size:16px;margin:10px 0 8px}
.srow{display:flex;align-items:flex-start;gap:10px;margin:10px 0}
.srow>b{flex:0 0 58px;font-size:14px;padding-top:5px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{background:#f1f4f1;border:1px solid transparent;border-radius:999px;padding:5px 11px;font:13.5px inherit;cursor:pointer;color:var(--ink)}
.opts button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.map button{height:34px;border:0;border-radius:8px;font:12px ui-monospace,Menlo,monospace;background:#eceff0;color:#4b5853;cursor:pointer}
.map button.s2{background:#cfeedd;color:#1f6b45}
.map button.s1{background:#fbeccb;color:#8a5f0a}
.map button.s0{background:#f8d9d5;color:#9b3129}
.map button.cur{outline:2px solid var(--ink)}
.legend{display:flex;gap:10px;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* guide */
#guide{position:absolute;inset:0;z-index:50;background:rgba(10,12,16,.78);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
#guide.on{display:flex}
#guide .gbox{background:#fff;border-radius:22px;padding:18px 18px 16px;width:100%;max-width:380px}
#guide h3{margin:0 0 10px;font-size:19px;text-align:center}
.g{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #eef1ee;font-size:14.5px}
.g:last-of-type{border-bottom:0}
.g .hand{flex:0 0 44px;height:44px;border-radius:12px;background:#f2f5f2;display:flex;align-items:center;justify-content:center;font-size:24px}
.g .hand span{display:inline-block}
.g .hand.up span{animation:gu 1.4s ease-in-out infinite}
.g .hand.left span{animation:gl 1.4s ease-in-out infinite}
.g .hand.right span{animation:gr 1.4s ease-in-out infinite}
@keyframes gu{0%,100%{transform:translateY(7px)}50%{transform:translateY(-7px)}}
@keyframes gl{0%,100%{transform:translateX(7px)}50%{transform:translateX(-7px)}}
@keyframes gr{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
.g small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
#guide .big{width:100%;margin-top:12px;background:#176c63}
/* toast and burst */
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);z-index:60;background:rgba(20,22,26,.86);color:#fff;border-radius:16px;padding:10px 18px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.fly{position:fixed;z-index:70;font-size:24px;pointer-events:none;animation:fly .95s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--rot))}}
/* desktop side hints */
#side{display:none}
@media (min-width:900px){
  #side{display:block;position:fixed;left:calc(50% + 260px);top:50%;transform:translateY(-50%);color:#cfd6d2;font-size:13.5px;line-height:2}
  #side .kbd{background:#2a2f36;border:1px solid #3a4048;border-radius:5px;padding:0 6px;color:#fff;font:12px ui-monospace,Menlo,monospace}
  #app{border-left:1px solid #222;border-right:1px solid #222}
}
@media (prefers-reduced-motion:reduce){.slide.in .pmain .card,.edge .up,.g .hand span{animation:none}}
</style></head><body>
<div id="app">
<div id="top"><div class="r1"><a class="back" href="06-hot100.html" title="回到背诵本">‹</a><div id="tabs"><button data-p="0">默写</button><button data-p="1" class="on">题目</button><button data-p="2">解析</button></div><button class="ib" id="help" title="玩法">?</button><button class="ib" id="gear" title="设置">⚙</button></div>
<div class="bar"><i></i></div><div class="r2"><span id="pos"></span><span><span id="fire" class="fire"></span> <span id="today"></span></span></div></div>

<div id="sheet"><div class="body"></div></div>
<div id="guide"><div class="gbox"><h3>刷题模式怎么玩</h3>
<div class="g"><span class="hand up"><span>👆</span></span><div><b>上滑</b> 换下一题<small>每题先看题目和例子，想 30 秒</small></div></div>
<div class="g"><span class="hand left"><span>👈</span></span><div><b>向左滑</b> 看解析<small>记忆钩子、自动播放的图解、思路和复杂度</small></div></div>
<div class="g"><span class="hand right"><span>👉</span></span><div><b>向右滑</b> 去默写<small>打字或在纸上写，点核对逐行标对错，也能逐行揭开答案，一键跳到力扣</small></div></div>
<div class="g"><span class="hand"><span>💪</span></span><div><b>右侧按钮</b> 标熟练程度<small>熟练直接下一题，模糊带你去默写，不会带你去看解析。进度和背诵本共用</small></div></div>
<button class="big" id="gok">开始刷题</button></div></div>

<script type="application/json" id="data">{"cats": [{"name": "哈希", "ids": ["1", "128", "49"], "tpl": "用 dict 或 set 把“之前见过什么”存下来，查找从 O(n) 降到 O(1)。"}, {"name": "双指针", "ids": ["15", "42", "11", "283"], "tpl": "两端相向收缩，或快慢同向推进，每一步都排除掉一批不可能的解。"}, {"name": "滑动窗口", "ids": ["3", "438"], "tpl": "右指针扩张，条件被破坏时左指针收缩，窗口内始终保持合法。"}, {"name": "子串", "ids": ["76", "239", "560"], "tpl": "前缀和加哈希求区间和，单调队列维护窗口最值，need/window 计数求覆盖。"}, {"name": "普通数组", "ids": ["41", "53", "56", "238", "189"], "tpl": "前缀与后缀、排序后合并、原地放回下标、三次反转，都是 O(n) 的扫描技巧。"}, {"name": "矩阵", "ids": ["54", "48", "240", "73"], "tpl": "四条边界逐层收缩，或从右上角走楼梯，或借首行首列做标记。"}, {"name": "链表", "ids": ["25", "206", "146", "160", "23", "21", "141", "142", "2", "148", "234", "19", "138", "24"], "tpl": "dummy 头省去边界，快慢指针找中点和环，三指针原地反转。"}, {"name": "二叉树", "ids": ["236", "199", "105", "102", "101", "98", "124", "94", "543", "104", "226", "230", "114", "108", "437"], "tpl": "递归函数先问清楚“返回给父节点什么”，全局答案在递归途中顺手更新。"}, {"name": "图论", "ids": ["200", "208", "994", "207"], "tpl": "网格就是图，BFS 一层就是一步，有向图看入度做拓扑排序。"}, {"name": "回溯", "ids": ["46", "39", "79", "78", "22", "17", "131", "51"], "tpl": "做选择，递归，撤销选择。path 到达终点时复制一份进结果。"}, {"name": "二分查找", "ids": ["33", "4", "153", "74", "34", "35"], "tpl": "先想清楚区间是闭还是半开，每次排除一半，循环条件和更新必须配套。"}, {"name": "栈", "ids": ["155", "20", "394", "739", "84"], "tpl": "括号与嵌套用普通栈，找下一个更大或更小用单调栈。"}, {"name": "堆", "ids": ["215", "347", "295"], "tpl": "Top K 用大小为 k 的小顶堆，中位数用一大一小两个堆。"}, {"name": "贪心算法", "ids": ["121", "763", "45", "55"], "tpl": "一路维护“目前最好”的那个量（最低价、最远可达），不回头。"}, {"name": "动态规划", "ids": ["300", "32", "70", "322", "198", "152", "139", "416", "279", "118"], "tpl": "先写 dp[i] 的含义，再写它从哪几个更小的状态转移来。"}, {"name": "多维动态规划", "ids": ["72", "5", "64", "1143", "62"], "tpl": "dp[i][j] 一般表示两个前缀的答案，看左、上、左上三个格子。"}, {"name": "技巧", "ids": ["31", "287", "169", "136", "75"], "tpl": "异或抵消、投票抵消、数组当链表判环、三步求下一个排列。"}], "extra": ["offer10", "92"], "probs": {"1": {"id": "1", "title": "两数之和", "diff": "简单", "cat": "哈希", "must": false, "desc": "给定一个整数数组 nums 和一个目标值 target，找出数组中和为目标值的两个数的下标。", "idea": "最暴力的方法是两层循环，但太慢。聪明的做法是用一个字典(哈希表)记录\"我之前见过哪些数字\"。遍历数组时，对于当前数字 num，计算 target - num，如果这个差值在字典里，说明之前见过它，直接返回两个下标。如果没见过，就把当前数字和下标存进字典。一次遍历就搞定!", "edge": "", "code": "def twoSum(nums, target):\n    seen = {}\n    for i, num in enumerate(nums):\n        complement = target - num\n        if complement in seen:\n            return [seen[complement], i]\n        seen[num] = i", "url": "https://leetcode.cn/problems/two-sum/", "hook": "边走边查 target−x 在不在 dict 里", "viz": {"ex": "nums = [2,7,11,15]，target = 9", "out": "[0, 1]", "st": [["2 7 11 15", {"0": "i"}, "看 2，需要 9−2=7，字典里没有，存入 {2:0}"], ["2 7 11 15", {"0": "存过", "1": "i"}, "看 7，需要 9−7=2，字典里有，下标是 0"], ["2 7 11 15", [0, 1], "返回 [0, 1]，只扫了一遍"]], "t": "O(n)，只遍历一遍，每次查字典平均 O(1)", "s": "O(n)，字典最多存 n 个数"}}, "128": {"id": "128", "title": "最长连续序列", "diff": "中等", "cat": "哈希", "must": false, "desc": "给定一个未排序的整数数组 nums，找出数字连续的最长序列的长度。要求 O(n) 时间复杂度。", "idea": "先把数组丢进set去重。然后遍历set，只从\"序列的起点\"开始计数(即 num-1 不在set中的数)。从起点开始，不断检查 num+1, num+2... 是否在set中，统计长度。因为每个数字最多被访问两次，总时间是O(n)。", "edge": "", "code": "def longestConsecutive(nums):\n    num_set = set(nums)\n    longest = 0\n    for num in num_set:\n        if num - 1 not in num_set:  # 只从起点开始\n            cur = num\n            length = 1\n            while cur + 1 in num_set:\n                cur += 1\n                length += 1\n            longest = max(longest, length)\n    return longest", "url": "https://leetcode.cn/problems/longest-consecutive-sequence/", "hook": "放进 set，只从 x−1 不在集合里的起点往上数", "viz": {"ex": "nums = [100,4,200,1,3,2]", "out": "4", "st": [["100 4 200 1 3 2", null, "先把所有数放进集合，查“在不在”只要 O(1)"], ["100 4 200 1 3 2", {"1": "跳过"}, "4 的前一个数 3 在集合里，所以 4 不是起点，直接跳过"], ["100 4 200 1 3 2", {"3": "起点"}, "1 的前一个数 0 不在集合里，1 是起点，向后数 2、3、4 都在，长度 4"], ["100 4 200 1 3 2", {"0": "起点", "2": "起点"}, "100 和 200 也是起点，长度都是 1，答案 4"]], "t": "O(n)，只有起点才向后数，每个数最多被数到一次", "s": "O(n)，集合存下全部数"}}, "49": {"id": "49", "title": "字母异位词分组", "diff": "中等", "cat": "哈希", "must": false, "desc": "给你一个字符串数组，将字母异位词组合在一起(如 \"eat\" 和 \"tea\" 是异位词)。", "idea": "异位词的特点是: 字母排序后完全相同! 所以把每个单词排序后的结果作为字典的key，原始单词作为value。比如 \"eat\"、\"tea\"、\"ate\" 排序后都是 \"aet\"，它们就被分到同一组。", "edge": "", "code": "def groupAnagrams(strs):\n    from collections import defaultdict\n    groups = defaultdict(list)\n    for s in strs:\n        key = ''.join(sorted(s))\n        groups[key].append(s)\n    return list(groups.values())", "url": "https://leetcode.cn/problems/group-anagrams/", "hook": "排序后的字符串当 key 分组", "viz": {"ex": "strs = [\"eat\",\"tea\",\"tan\",\"ate\",\"nat\",\"bat\"]", "out": "[['eat', 'tea', 'ate'], ['tan', 'nat'], ['bat']]", "st": [["eat tea tan ate nat bat", {"0": "aet", "1": "aet"}, "把每个词的字母排序当作键，eat 和 tea 排序后都是 aet"], ["eat tea tan ate nat bat", {"2": "ant", "4": "ant"}, "tan 和 nat 的键都是 ant"], ["eat tea tan ate nat bat", {"3": "aet", "5": "abt"}, "ate 进 aet 组，bat 的键 abt 单独一组"], ["", null, "字典的值就是答案 [[eat,tea,ate],[tan,nat],[bat]]"]], "t": "O(n·k log k)，n 个词，每个长 k 的词排序一次", "s": "O(n·k)，字典里存下所有词和它们的键"}}, "15": {"id": "15", "title": "三数之和", "diff": "中等", "cat": "双指针", "must": true, "ali": 1, "desc": "给你一个包含 n 个整数的数组 nums，判断 nums 中是否存在三个元素 a、b、c 使得 a+b+c=0，找出所有满足条件且不重复的三元组。", "idea": "先排序! 然后固定第一个数i，用双指针在i后面的区间找两个数使三数之和为0。左指针从i+1开始，右指针从末尾开始。和太大就右指针左移，和太小就左指针右移。注意跳过重复元素避免重复答案。", "edge": "原文O(1)已排除排序，但面试讨论当前Python实现的总辅助空间时应包含sort临时内存。", "code": "def threeSum(nums):\n    nums.sort()\n    result = []\n    for i in range(len(nums) - 2):\n        if i > 0 and nums[i] == nums[i-1]:\n            continue  # 跳过重复\n        left, right = i + 1, len(nums) - 1\n        while left < right:\n            s = nums[i] + nums[left] + nums[right]\n            if s == 0:\n                result.append([nums[i], nums[left], nums[right]])\n                while left < right and nums[left] == nums[left+1]:\n                    left += 1\n                while left < right and nums[right] == nums[right-1]:\n                    right -= 1\n                left += 1\n                right -= 1\n            elif s < 0:\n                left += 1\n            else:\n                right -= 1\n    return result", "url": "https://leetcode.cn/problems/3sum/", "hook": "排序，固定 i，后面用左右双指针，三处跳重", "viz": {"ex": "nums = [-1,0,1,2,-1,-4]", "out": "[[-1, -1, 2], [-1, 0, 1]]", "st": [["-4 -1 -1 0 1 2", null, "先排序，才能用双指针，也才能跳过重复"], ["-4 -1 -1 0 1 2", {"0": "i", "1": "L", "5": "R"}, "固定 i=−4，−4−1+2=−3 小于 0，L 右移。L 一路右移都小于 0，没有解"], ["-4 -1 -1 0 1 2", {"1": "i", "2": "L", "5": "R"}, "i=−1，−1−1+2=0，记下 [−1,−1,2]，L、R 同时向内"], ["-4 -1 -1 0 1 2", {"1": "i", "3": "L", "4": "R"}, "−1+0+1=0，记下 [−1,0,1]"], ["-4 -1 -1 0 1 2", {"2": "i"}, "第二个 −1 和前一个相同，跳过，避免重复答案"], ["-4 -1 -1 0 1 2", {"3": "i", "4": "L", "5": "R"}, "i=0，0+1+2=3 大于 0，R 左移后相遇，结束"]], "t": "O(n²)，排序 O(n log n)，外层每个 i 配一趟 O(n) 的双指针", "s": "O(n)，Python 排序需要的临时空间，输出另计"}}, "42": {"id": "42", "title": "接雨水", "diff": "困难", "cat": "双指针", "must": true, "desc": "给定 n 个非负整数表示每个宽度为 1 的柱子的高度图，计算按此排列的柱子能接多少雨水。", "idea": "双指针从两端向中间走，同时维护左侧已见最大值 left_max 与右侧已见最大值 right_max。每一步比较两端当前柱子的高度，先处理较矮的一侧：更新该侧已见最大值，再把该最大值减去当前柱高累加进答案，然后该指针内移。这样做成立的理由是，当 height[left] 小于 height[right] 时，左侧的水位只由 left_max 决定，右边一定存在不低于 height[right] 的柱子挡水，不必知道右侧的具体最大值。", "edge": "", "code": "def trap(height):\n    left, right = 0, len(height) - 1\n    left_max = right_max = 0\n    water = 0\n    while left < right:\n        if height[left] < height[right]:\n            left_max = max(left_max, height[left])\n            water += left_max - height[left]\n            left += 1\n        else:\n            right_max = max(right_max, height[right])\n            water += right_max - height[right]\n            right -= 1\n    return water", "url": "https://leetcode.cn/problems/trapping-rain-water/", "hook": "两端双指针，矮的一侧用它的已见最大值算水", "viz": {"ex": "height = [4,2,0,3,2,5]", "out": "9", "st": [["B:4 2 0 3 2 5", {"0": "L", "5": "R"}, "左边 4 比右边 5 矮，左侧的水位只由左边最高值决定，先结算左边。left_max=4，存水 0"], ["B:4 2 0 3 2 5", {"1": "L", "5": "R"}, "水位 4，这一格存 4−2=2，累计 2"], ["B:4 2 0 3 2 5", {"2": "L", "5": "R"}, "存 4−0=4，累计 6"], ["B:4 2 0 3 2 5", {"3": "L", "5": "R"}, "存 4−3=1，累计 7"], ["B:4 2 0 3 2 5", {"4": "L", "5": "R"}, "存 4−2=2，累计 9，L 与 R 相遇，答案 9"]], "t": "O(n)，左右指针一共走 n 步", "s": "O(1)，只用几个变量"}}, "11": {"id": "11", "title": "盛最多水的容器", "diff": "中等", "cat": "双指针", "must": false, "desc": "给定长度为 n 的整数数组 height，第 i 条垂线的两个端点是 (i, 0) 和 (i, height[i])。找出其中两条线，使它们与 x 轴共同构成的容器能容纳最多的水，返回可以储存的最大水量。容器不能倾斜。", "idea": "用左右双指针，从两端向中间收缩。每次计算当前两条线围成的面积(宽度*较短的线)，然后移动较短的那一边。为什么? 因为移动较长的那边只会让宽度变小，高度不可能更高(受限于短板)，面积一定变小。移动短的那边才有可能遇到更高的线。", "edge": "", "code": "def maxArea(height):\n    left, right = 0, len(height) - 1\n    max_water = 0\n    while left < right:\n        w = right - left\n        h = min(height[left], height[right])\n        max_water = max(max_water, w * h)\n        if height[left] < height[right]:\n            left += 1\n        else:\n            right -= 1\n    return max_water", "url": "https://leetcode.cn/problems/container-with-most-water/", "hook": "面积由短板决定，永远移动短的那一边", "viz": {"ex": "height = [1,8,6,2,5,4,8,3,7]", "out": "49", "st": [["B:1 8 6 2 5 4 8 3 7", {"0": "L", "8": "R"}, "宽 8，高 min(1,7)=1，面积 8。左边矮，移动左边"], ["B:1 8 6 2 5 4 8 3 7", {"1": "L", "8": "R"}, "宽 7，高 7，面积 49。右边矮，移动右边"], ["B:1 8 6 2 5 4 8 3 7", {"1": "L", "6": "R"}, "宽变小时只有换掉矮板才可能更大，所以每次丢掉矮的一边。后面的面积都不超过 49"]], "t": "O(n)，每步丢掉一块板，共 n 步", "s": "O(1)"}}, "283": {"id": "283", "title": "移动零", "diff": "简单", "cat": "双指针", "must": false, "desc": "给定一个数组 nums，将所有 0 移动到数组的末尾，同时保持非零元素的相对顺序。要求原地操作。", "idea": "用一个\"慢指针\"pos标记下一个非零元素该放的位置。快指针遍历数组，遇到非零元素就放到pos位置，pos前进一步。遍历完后，pos后面的位置全部填0。就像排队一样，非零元素依次往前站，后面空位填0。", "edge": "", "code": "def moveZeroes(nums):\n    pos = 0\n    for num in nums:\n        if num != 0:\n            nums[pos] = num\n            pos += 1\n    while pos < len(nums):\n        nums[pos] = 0\n        pos += 1", "url": "https://leetcode.cn/problems/move-zeroes/", "hook": "慢指针 pos 收集非零，剩下补 0", "viz": {"ex": "nums = [0,1,0,3,12]", "out": "[1, 3, 12, 0, 0]", "st": [["0 1 0 3 12", {"0": "pos"}, "pos 指向下一个非零数该放的位置"], ["1 1 0 3 12", {"1": "pos"}, "遇到 1，写到下标 0，pos 变成 1"], ["1 3 12 3 12", {"3": "pos"}, "遇到 3 和 12，依次写到下标 1、2，pos 变成 3"], ["1 3 12 0 0", [3, 4], "从 pos 到末尾全部填 0"]], "t": "O(n)，扫一遍再补零", "s": "O(1)，原地修改"}}, "3": {"id": "3", "title": "无重复字符的最长子串", "diff": "中等", "cat": "滑动窗口", "must": true, "ali": 2, "desc": "给定一个字符串 s，找出其中不含有重复字符的最长子串的长度。", "idea": "用滑动窗口(两个指针维护一个区间)。右指针不断扩展窗口，用set记录窗口内的字符。当右指针指向的字符已经在set中(出现重复)，就不断移动左指针缩小窗口，直到没有重复为止。每次更新最大长度。", "edge": "", "code": "def lengthOfLongestSubstring(s):\n    char_set = set()\n    left = 0\n    max_len = 0\n    for right in range(len(s)):\n        while s[right] in char_set:\n            char_set.remove(s[left])\n            left += 1\n        char_set.add(s[right])\n        max_len = max(max_len, right - left + 1)\n    return max_len", "url": "https://leetcode.cn/problems/longest-substring-without-repeating-characters/", "hook": "set 维护窗口，遇重复就挪左指针", "viz": {"ex": "s = \"abcabcbb\"", "out": "3", "st": [["a b c a b c b b", {"0": "L", "2": "R"}, "窗口 abc 没有重复，长度 3"], ["a b c a b c b b", {"1": "L", "3": "R"}, "R 读到 a，a 已在窗口里，从左边弹出 a，窗口变成 bca"], ["a b c a b c b b", {"5": "L", "6": "R"}, "R 读到 b 时窗口是 abc，要连弹 a、b 才能去掉重复，窗口变成 cb"], ["a b c a b c b b", {"7": "R"}, "最后一个 b 又重复，窗口只剩 b。全程最大长度 3"]], "t": "O(n)，L 和 R 都只向右走，每个字符最多进出集合各一次", "s": "O(min(n, 字符集大小))，集合只存窗口里的字符"}}, "438": {"id": "438", "title": "找到字符串中所有字母异位词", "diff": "中等", "cat": "滑动窗口", "must": false, "desc": "给定两个字符串 s 和 p，找到 s 中所有是 p 的异位词的子串，返回这些子串的起始索引。", "idea": "固定大小的滑动窗口! 窗口大小 = len(p)。用两个计数器分别统计 p 和窗口内的字符频率。窗口每次右移一位: 加入右边新字符，去掉左边旧字符。当两个计数器相等时，说明当前窗口是p的异位词。", "edge": "代码未改。原空间标注只考虑计数器，未计Python初始化窗口的字符串切片。", "code": "def findAnagrams(s, p):\n    from collections import Counter\n    if len(s) < len(p):\n        return []\n    p_count = Counter(p)\n    s_count = Counter(s[:len(p)])\n    result = []\n    if s_count == p_count:\n        result.append(0)\n    for i in range(len(p), len(s)):\n        s_count[s[i]] += 1\n        left_char = s[i - len(p)]\n        s_count[left_char] -= 1\n        if s_count[left_char] == 0:\n            del s_count[left_char]\n        if s_count == p_count:\n            result.append(i - len(p) + 1)\n    return result", "url": "https://leetcode.cn/problems/find-all-anagrams-in-a-string/", "hook": "长度固定为 len(p) 的窗口，比较两个计数", "viz": {"ex": "s = \"cbaebabacd\"，p = \"abc\"", "out": "[0, 6]", "st": [["c b a e b a b a c d", [0, 1, 2], "长度 3 的窗口 cba，字母计数和 abc 相同，记下 0"], ["c b a e b a b a c d", [1, 2, 3], "窗口右移一格，进 e、出 c，计数不同"], ["c b a e b a b a c d", [6, 7, 8], "一直滑到 bac，计数相同，记下 6"], ["", null, "答案 [0, 6]。每次只改两个字符的计数，不用重新统计"]], "t": "O(n·Σ)，滑 n 次，每次比较两个最多 Σ 个键的计数字典，小写字母时 Σ=26，就是 O(n)", "s": "O(Σ)，两个计数字典，输出另计"}}, "76": {"id": "76", "title": "最小覆盖子串", "diff": "困难", "cat": "子串", "must": false, "ali": 1, "desc": "给定字符串 s 和 t，返回 s 中涵盖 t 全部字符的最短子串。涵盖按出现次数计算，包括 t 里的重复字符。不存在这样的子串时返回空字符串。测试用例保证答案唯一。", "idea": "need记录每种字符的需求，window记录窗口计数，formed记录已达到需求的字符种类。右边界扩张，满足全部需求后移动左边界缩小窗口。更新最优答案时只保存起点和长度，遍历结束后仅切片一次。", "edge": "原代码反复复制递减长度窗口，最坏时间可为O(m²+n)；现只保存边界并在最后切片一次。；补充了空s或空t返回空串的输入处理。", "code": "def minWindow(s, t):\n    from collections import Counter\n    if not s or not t:\n        return ''\n    need = Counter(t)\n    window = {}\n    required = len(need)\n    formed = left = 0\n    best_start, best_len = 0, len(s) + 1\n    for right, ch in enumerate(s):\n        window[ch] = window.get(ch, 0) + 1\n        if ch in need and window[ch] == need[ch]:\n            formed += 1\n        while formed == required:\n            length = right - left + 1\n            if length < best_len:\n                best_start, best_len = left, length\n            out = s[left]\n            window[out] -= 1\n            if out in need and window[out] < need[out]:\n                formed -= 1\n            left += 1\n    if best_len > len(s):\n        return ''\n    return s[best_start:best_start + best_len]", "url": "https://leetcode.cn/problems/minimum-window-substring/", "hook": "need 计数加 formed 种类数，满足后收缩左边", "viz": {"ex": "s = \"ADOBECODEBANC\"，t = \"ABC\"", "out": "'BANC'", "st": [["A D O B E C O D E B A N C", {"0": "L", "5": "R"}, "R 右扩到 C，窗口 ADOBEC 已包含 A、B、C，记下长度 6"], ["A D O B E C O D E B A N C", {"1": "L", "5": "R"}, "L 右移丢掉 A，窗口缺 A，停止收缩，继续扩 R"], ["A D O B E C O D E B A N C", {"6": "L", "10": "R"}, "R 扩到第二个 A 又满足了，L 收缩到丢掉 C 为止，长度都不比 6 短"], ["A D O B E C O D E B A N C", {"9": "L", "12": "R"}, "R 扩到最后的 C，L 一直收缩到 BANC，长度 4，最短"]], "t": "O(m+n)，L 和 R 各最多走 m 步，统计 t 用 n 步", "s": "O(Σ)，两个计数字典，Σ 为字符种类数"}}, "239": {"id": "239", "title": "滑动窗口最大值", "diff": "困难", "cat": "子串", "must": false, "desc": "给你一个整数数组 nums 和一个大小为 k 的滑动窗口。窗口从左向右移动，返回每个窗口中的最大值。", "idea": "用单调递减双端队列(deque)! 队列存下标，对应的值从大到小。新元素进来前，把队尾所有比它小的元素弹出(它们不可能成为未来窗口的最大值了)。如果队头超出窗口范围就弹出。队头永远是当前窗口的最大值。", "edge": "", "code": "def maxSlidingWindow(nums, k):\n    from collections import deque\n    dq = deque()  # 存下标，对应值递减\n    result = []\n    for i in range(len(nums)):\n        # 弹出队尾比当前值小的\n        while dq and nums[dq[-1]] <= nums[i]:\n            dq.pop()\n        dq.append(i)\n        # 弹出超出窗口的队头\n        if dq[0] <= i - k:\n            dq.popleft()\n        # 窗口形成后开始记录\n        if i >= k - 1:\n            result.append(nums[dq[0]])\n    return result", "url": "https://leetcode.cn/problems/sliding-window-maximum/", "hook": "单调递减 deque 存下标，队头就是窗口最大值", "viz": {"ex": "nums = [1,3,-1,-3,5,3,6,7]，k = 3", "out": "[3, 3, 5, 5, 6, 7]", "st": [["1 3 -1 -3 5 3 6 7", {"1": "i"}, "3 进来，比它小的 1 以后不可能再当最大值，弹掉。队列存 [3]"], ["1 3 -1 -3 5 3 6 7", {"3": "i"}, "队列 [3, −1, −3] 从大到小，队头 3 就是窗口最大值"], ["1 3 -1 -3 5 3 6 7", {"4": "i"}, "5 进来，把 −3、−1、3 都弹掉，队列 [5]，输出 5"], ["1 3 -1 -3 5 3 6 7", {"6": "i"}, "6 进来弹掉 3 和 5，输出 6"], ["1 3 -1 -3 5 3 6 7", {"7": "i"}, "7 进来弹掉 6，输出 7。结果 [3,3,5,5,6,7]"]], "t": "O(n)，每个下标最多进队一次、出队一次", "s": "O(k)，队列里最多存一个窗口的下标"}}, "560": {"id": "560", "title": "和为 K 的子数组", "diff": "中等", "cat": "子串", "must": false, "desc": "给你一个整数数组 nums 和一个整数 k，统计并返回该数组中和为 k 的连续子数组的个数。", "idea": "用前缀和+哈希表。前缀和 prefix_sum[i] 表示 nums[0..i] 的总和。如果 prefix_sum[j] - prefix_sum[i] == k，说明 nums[i+1..j] 的和为k。所以遍历时维护一个字典记录每个前缀和出现的次数，对于当前前缀和cur_sum，查字典里 cur_sum - k 出现了几次，就有几个子数组。", "edge": "", "code": "def subarraySum(nums, k):\n    from collections import defaultdict\n    count = 0\n    cur_sum = 0\n    prefix_counts = defaultdict(int)\n    prefix_counts[0] = 1  # 前缀和为0出现1次\n    for num in nums:\n        cur_sum += num\n        count += prefix_counts[cur_sum - k]\n        prefix_counts[cur_sum] += 1\n    return count", "url": "https://leetcode.cn/problems/subarray-sum-equals-k/", "hook": "前缀和 dict，查 pre−k 出现过几次，初始 {0:1}", "viz": {"ex": "nums = [1,2,3]，k = 3", "out": "2", "st": [["1 2 3", null, "字典记“前缀和出现过几次”，先放 {0:1}，代表空前缀"], ["1 2 3", {"0": "i"}, "前缀和 1，找 1−3=−2，没有。存 {0:1, 1:1}"], ["1 2 3", {"1": "i"}, "前缀和 3，找 3−3=0，有 1 个，对应子数组 [1,2]，count=1"], ["1 2 3", {"2": "i"}, "前缀和 6，找 6−3=3，有 1 个，对应子数组 [3]，count=2"]], "t": "O(n)，扫一遍，每步查一次字典", "s": "O(n)，字典最多存 n+1 个前缀和"}}, "41": {"id": "41", "title": "缺失的第一个正数", "diff": "困难", "cat": "普通数组", "must": true, "desc": "找出数组没有包含的最小正整数，要求线性时间和常数额外空间。", "idea": "答案只可能在1至n+1。把值v放到下标v-1，越界值不处理；目标位置已是v时停止，避免重复值造成死循环。最后扫描第一个值与位置不匹配的位置。", "edge": "原地修改数组；忽略非正数和大于n的值。；重复值必须有停止条件；空数组扩展返回1。", "code": "def firstMissingPositive(nums):\n    n = len(nums)\n    for i in range(n):\n        while 1 <= nums[i] <= n and nums[nums[i] - 1] != nums[i]:\n            j = nums[i] - 1\n            nums[i], nums[j] = nums[j], nums[i]\n    for i in range(n):\n        if nums[i] != i + 1:\n            return i + 1\n    return n + 1", "url": "https://leetcode.cn/problems/first-missing-positive/", "hook": "把 v 换到下标 v−1，再找第一个不在位的", "viz": {"ex": "nums = [3,4,-1,1]", "out": "2", "st": [["3 4 -1 1", {"0": "i"}, "目标是让数 x 待在下标 x−1。3 应在下标 2，和 −1 交换"], ["-1 4 3 1", {"1": "i"}, "换来的 −1 不在 1 到 n 之间，不动。看下标 1 的 4，应在下标 3，和 1 交换"], ["1 -1 3 4", [0, 2, 3], "换来的 1 应在下标 0，再和 −1 交换。现在 1、3、4 都归位了"], ["1 -1 3 4", {"1": "缺"}, "从左扫，下标 1 放的不是 2，答案 2"]], "t": "O(n)，每次交换都让一个数到达最终位置，总交换不超过 n 次", "s": "O(1)，在原数组上交换"}}, "53": {"id": "53", "title": "最大子数组和", "diff": "中等", "cat": "普通数组", "must": false, "desc": "给你一个整数数组 nums，找到一个具有最大和的连续子数组，返回其最大和。", "idea": "Kadane算法。维护当前子数组和cur_sum，如果cur_sum变成负数了，不如重新开始(负数只会拖后腿)。每一步更新最大和。思路: 以每个位置结尾的最大子数组和 = max(自己, 前面的最大和 + 自己)。", "edge": "用索引遍历替代nums[1:]，消除O(n)临时切片；显式拒绝空数组。", "code": "def maxSubArray(nums):\n    if not nums:\n        raise ValueError('nums must be nonempty')\n    cur_sum = max_sum = nums[0]\n    for i in range(1, len(nums)):\n        num = nums[i]\n        cur_sum = max(num, cur_sum + num)\n        max_sum = max(max_sum, cur_sum)\n    return max_sum", "url": "https://leetcode.cn/problems/maximum-subarray/", "hook": "cur = max(x, cur+x)，负数就重开", "viz": {"ex": "nums = [-2,1,-3,4,-1,2,1,-5,4]", "out": "6", "st": [["-2 1 -3 4 -1 2 1 -5 4", {"1": "i"}, "cur = max(1, −2+1) = 1。前面的和是负数，丢掉，从 1 重新开始"], ["-2 1 -3 4 -1 2 1 -5 4", {"3": "i"}, "cur = max(4, −2+4) = 4，又重新开始"], ["-2 1 -3 4 -1 2 1 -5 4", [3, 4, 5, 6], "cur 依次为 3、5、6，best 更新为 6"], ["-2 1 -3 4 -1 2 1 -5 4", {"8": "i"}, "后面 cur 为 1、5，都不超过 6，答案 6"]], "t": "O(n)，扫一遍", "s": "O(1)，只记 cur 和 best"}}, "56": {"id": "56", "title": "合并区间", "diff": "中等", "cat": "普通数组", "must": false, "desc": "给出一个区间的集合，合并所有重叠的区间。", "idea": "先按区间的起点排序。然后遍历，如果当前区间的起点 <= 结果中最后一个区间的终点，说明重叠，合并(更新终点为两者的较大值)。否则不重叠，直接加入结果。", "edge": "会原地排序输入的外层列表；输出区间通过切片独立保存。", "code": "def merge(intervals):\n    intervals.sort(key=lambda x: x[0])\n    merged = []\n    for interval in intervals:\n        if merged and interval[0] <= merged[-1][1]:\n            merged[-1][1] = max(merged[-1][1], interval[1])\n        else:\n            merged.append(interval[:])\n    return merged", "url": "https://leetcode.cn/problems/merge-intervals/", "hook": "按起点排序，重叠就把终点取 max", "viz": {"ex": "intervals = [[1,3],[2,6],[8,10],[15,18]]", "out": "[[1, 6], [8, 10], [15, 18]]", "st": [["[1,3] [2,6] [8,10] [15,18]", null, "先按起点排序"], ["[1,3] [2,6] [8,10] [15,18]", [0, 1], "[2,6] 的起点 2 不超过上一段终点 3，合并成 [1,6]"], ["[1,6] [8,10] [15,18]", [1, 2], "8 大于 6，另起一段。15 大于 10，再另起一段"]], "t": "O(n log n)，排序占主导，合并只扫一遍", "s": "O(n)，排序的临时空间和输出列表"}}, "238": {"id": "238", "title": "除了自身以外数组的乘积", "diff": "中等", "cat": "普通数组", "must": false, "desc": "给你一个整数数组 nums，返回数组 answer，answer[i] 等于 nums 中除 nums[i] 之外其余各元素的乘积。不能使用除法。", "idea": "分两步走。第一步从左到右扫一遍，算出每个位置左边所有元素的乘积。第二步从右到左扫一遍，算出每个位置右边所有元素的乘积。每个位置的答案 = 左边乘积 * 右边乘积。就像站在一个位置，左手握着左边的总乘积，右手握着右边的总乘积，两手一乘就是答案。", "edge": "", "code": "def productExceptSelf(nums):\n    n = len(nums)\n    answer = [1] * n\n    # 从左到右，累积左边的乘积\n    left = 1\n    for i in range(n):\n        answer[i] = left\n        left *= nums[i]\n    # 从右到左，累积右边的乘积\n    right = 1\n    for i in range(n - 1, -1, -1):\n        answer[i] *= right\n        right *= nums[i]\n    return answer", "url": "https://leetcode.cn/problems/product-of-array-except-self/", "hook": "左乘积一遍，右乘积一遍，两者相乘", "viz": {"ex": "nums = [1,2,3,4]", "out": "[24, 12, 8, 6]", "st": [["1 1 2 6", null, "第一遍从左往右，answer[i] = 它左边所有数的乘积"], ["1 1 8 6", {"2": "i"}, "第二遍从右往左，乘上右边所有数的乘积。i=3 乘 1，i=2 乘 4"], ["24 12 8 6", null, "i=1 乘 12，i=0 乘 24，得到答案，全程没用除法"]], "t": "O(n)，左右各扫一遍", "s": "O(1)，不算输出数组"}}, "189": {"id": "189", "title": "轮转数组", "diff": "中等", "cat": "普通数组", "must": false, "desc": "把数组向右循环移动k位，原地修改数组。", "idea": "先将k对长度取余，再依次反转整个数组、前k项和剩余部分。三次反转恢复两段内部顺序，同时交换它们的位置。", "edge": "k为非负整数；k大于长度时取模。；修改输入；空数组扩展处理为不操作，k=0保持原顺序。", "code": "def rotate(nums, k):\n    if not nums:\n        return\n    k %= len(nums)\n    def reverse(left, right):\n        while left < right:\n            nums[left], nums[right] = nums[right], nums[left]\n            left += 1\n            right -= 1\n    reverse(0, len(nums) - 1)\n    reverse(0, k - 1)\n    reverse(k, len(nums) - 1)", "url": "https://leetcode.cn/problems/rotate-array/", "hook": "k %= n，整体反转，再分别反转前 k 和后 n−k", "viz": {"ex": "nums = [1,2,3,4,5,6,7]，k = 3", "out": "[5, 6, 7, 1, 2, 3, 4]", "st": [["1 2 3 4 5 6 7", null, "向右轮转 3 位，等于三次翻转"], ["7 6 5 4 3 2 1", null, "第一次翻转整个数组"], ["5 6 7 4 3 2 1", [0, 1, 2], "第二次翻转前 k=3 个"], ["5 6 7 1 2 3 4", [3, 4, 5, 6], "第三次翻转剩下的，完成"]], "t": "O(n)，每个元素被交换常数次", "s": "O(1)，原地翻转"}}, "54": {"id": "54", "title": "螺旋矩阵", "diff": "中等", "cat": "矩阵", "must": true, "desc": "按顺时针从外圈向内圈读取矩阵，返回读取顺序。", "idea": "维护上、下、左、右四条边界，每次读取上边和右边，再在仍有剩余行列时读取下边和左边。每读取一条边就收缩边界。", "edge": "单行和单列要避免重复读取。；不修改原矩阵；空输入扩展返回空列表。", "code": "def spiralOrder(matrix):\n    if not matrix or not matrix[0]:\n        return []\n    top, bottom = 0, len(matrix) - 1\n    left, right = 0, len(matrix[0]) - 1\n    result = []\n    while top <= bottom and left <= right:\n        for j in range(left, right + 1):\n            result.append(matrix[top][j])\n        top += 1\n        for i in range(top, bottom + 1):\n            result.append(matrix[i][right])\n        right -= 1\n        if top <= bottom:\n            for j in range(right, left - 1, -1):\n                result.append(matrix[bottom][j])\n            bottom -= 1\n        if left <= right:\n            for i in range(bottom, top - 1, -1):\n                result.append(matrix[i][left])\n            left += 1\n    return result", "url": "https://leetcode.cn/problems/spiral-matrix/", "hook": "上右下左四条边界，读一条收一条", "viz": {"ex": "matrix = [[1,2,3],[4,5,6],[7,8,9]]", "out": "[1, 2, 3, 6, 9, 8, 7, 4, 5]", "st": [["G:1 2 3|4 5 6|7 8 9", ["0,0", "0,1", "0,2"], "上边从左到右 1 2 3，然后 top 下移"], ["G:1 2 3|4 5 6|7 8 9", ["1,2", "2,2"], "右边从上到下 6 9，right 左移"], ["G:1 2 3|4 5 6|7 8 9", ["2,1", "2,0"], "下边从右到左 8 7，bottom 上移"], ["G:1 2 3|4 5 6|7 8 9", ["1,0", "1,1"], "左边从下到上 4，left 右移。下一圈只剩 5"]], "t": "O(mn)，每个元素读一次", "s": "O(1)，只用四个边界，输出 O(mn) 另计"}}, "48": {"id": "48", "title": "旋转图像", "diff": "中等", "cat": "矩阵", "must": false, "desc": "给定一个 n x n 的二维矩阵，将图像顺时针旋转 90 度。要求原地旋转。", "idea": "两步走: (1)先上下翻转(第一行和最后一行交换); (2)再沿主对角线转置(行列互换)。这两步的组合效果就是顺时针旋转90度! 记住口诀: \"先翻转，再转置\"。", "edge": "", "code": "def rotate(matrix):\n    n = len(matrix)\n    # 上下翻转\n    for i in range(n // 2):\n        matrix[i], matrix[n-1-i] = matrix[n-1-i], matrix[i]\n    # 主对角线转置\n    for i in range(n):\n        for j in range(i + 1, n):\n            matrix[i][j], matrix[j][i] = matrix[j][i], matrix[i][j]", "url": "https://leetcode.cn/problems/rotate-image/", "hook": "先上下翻转，再沿主对角线转置", "viz": {"ex": "matrix = [[1,2,3],[4,5,6],[7,8,9]]", "out": "[[7, 4, 1], [8, 5, 2], [9, 6, 3]]", "st": [["G:1 2 3|4 5 6|7 8 9", null, "顺时针转 90 度，等于先上下翻转，再沿主对角线转置"], ["G:7 8 9|4 5 6|1 2 3", ["0,0", "2,0"], "上下翻转，第一行和最后一行交换"], ["G:7 4 1|8 5 2|9 6 3", ["0,1", "1,0", "0,2", "2,0", "1,2", "2,1"], "转置，交换 (i,j) 和 (j,i)，完成"]], "t": "O(n²)，每个元素交换常数次", "s": "O(1)，原地交换"}}, "240": {"id": "240", "title": "搜索二维矩阵 II", "diff": "中等", "cat": "矩阵", "must": false, "desc": "在一个每行和每列都按升序排列的 m x n 矩阵中，搜索一个目标值。", "idea": "从右上角开始搜索! 当前值比target大就往左移(排除当前列)，比target小就往下移(排除当前行)。右上角就像一个分叉点，能高效缩小搜索范围。", "edge": "", "code": "def searchMatrix(matrix, target):\n    if not matrix:\n        return False\n    row, col = 0, len(matrix[0]) - 1\n    while row < len(matrix) and col >= 0:\n        if matrix[row][col] == target:\n            return True\n        elif matrix[row][col] > target:\n            col -= 1\n        else:\n            row += 1\n    return False", "url": "https://leetcode.cn/problems/search-a-2d-matrix-ii/", "hook": "从右上角出发，大了左移，小了下移", "viz": {"ex": "matrix = [[1,4,7,11],[2,5,8,12],[3,6,9,16],[10,13,14,17]]，target = 5", "out": "True", "st": [["G:1 4 7 11|2 5 8 12|3 6 9 16|10 13 14 17", {"0,3": "起点"}, "从右上角出发。往左变小，往下变大，像一棵二叉搜索树"], ["G:1 4 7 11|2 5 8 12|3 6 9 16|10 13 14 17", {"0,2": "←"}, "11 大于 5，这一列都比 5 大，左移。7 也大于 5，再左移"], ["G:1 4 7 11|2 5 8 12|3 6 9 16|10 13 14 17", {"0,1": "↓"}, "4 小于 5，这一行左边都更小，下移"], ["G:1 4 7 11|2 5 8 12|3 6 9 16|10 13 14 17", {"1,1": "找到"}, "5 等于目标，返回 True"]], "t": "O(m+n)，每步排除一行或一列", "s": "O(1)"}}, "73": {"id": "73", "title": "矩阵置零", "diff": "中等", "cat": "矩阵", "must": false, "desc": "矩阵中原本含零的任意位置，最终要使其整行和整列归零，原地完成。", "idea": "单独记录首行和首列原本是否有零。用首行、首列标记内部零对应的列与行，再清理内部区域，最后依据最初记录处理首行和首列。", "edge": "先保留首行首列的原始状态，不能把后来写入的零当原始零。；支持单行、单列和空矩阵扩展；非空输入应为矩形。", "code": "def setZeroes(matrix):\n    if not matrix or not matrix[0]:\n        return\n    rows, cols = len(matrix), len(matrix[0])\n    first_row = any(matrix[0][j] == 0 for j in range(cols))\n    first_col = any(matrix[i][0] == 0 for i in range(rows))\n    for i in range(1, rows):\n        for j in range(1, cols):\n            if matrix[i][j] == 0:\n                matrix[i][0] = matrix[0][j] = 0\n    for i in range(1, rows):\n        for j in range(1, cols):\n            if matrix[i][0] == 0 or matrix[0][j] == 0:\n                matrix[i][j] = 0\n    if first_row:\n        for j in range(cols):\n            matrix[0][j] = 0\n    if first_col:\n        for i in range(rows):\n            matrix[i][0] = 0", "url": "https://leetcode.cn/problems/set-matrix-zeroes/", "hook": "先记首行首列有没有 0，再用它们当标记", "viz": {"ex": "matrix = [[1,1,1],[1,0,1],[1,1,1]]", "out": "[[1, 0, 1], [0, 0, 0], [1, 0, 1]]", "st": [["G:1 1 1|1 0 1|1 1 1", {"1,1": "0"}, "先记下第一行、第一列本身有没有 0，这里都没有"], ["G:1 0 1|0 0 1|1 1 1", {"0,1": "标", "1,0": "标"}, "(1,1) 是 0，把标记写在第一行和第一列的对应位置"], ["G:1 0 1|0 0 0|1 0 1", ["1,2", "2,1"], "按标记把内部格子置零。第一行第一列最后按开头记的结果处理"]], "t": "O(mn)，扫两遍矩阵", "s": "O(1)，借用第一行第一列当标记"}}, "31": {"id": "31", "title": "下一个排列", "diff": "中等", "cat": "技巧", "must": true, "desc": "找到给定数组的下一个字典序更大的排列。如果已是最大排列，则重排为最小排列。", "idea": "三步算法: (1)从后往前找第一个升序对(nums[i] < nums[i+1])的i; (2)从后往前找第一个大于nums[i]的nums[j]，交换; (3)将i后面的部分反转(变成最小)。如果步骤1没找到升序对，说明已是最大排列，直接反转整个数组。", "edge": "", "code": "def nextPermutation(nums):\n    n = len(nums)\n    i = n - 2\n    while i >= 0 and nums[i] >= nums[i + 1]:\n        i -= 1\n    if i >= 0:\n        j = n - 1\n        while nums[j] <= nums[i]:\n            j -= 1\n        nums[i], nums[j] = nums[j], nums[i]\n    # 反转i+1之后\n    left, right = i + 1, n - 1\n    while left < right:\n        nums[left], nums[right] = nums[right], nums[left]\n        left += 1\n        right -= 1", "url": "https://leetcode.cn/problems/next-permutation/", "hook": "从后找第一个下降点 i，再找比它大的 j 交换，反转 i 之后", "viz": {"ex": "nums = [1,2,7,4,3,1]", "out": "[1, 3, 1, 2, 4, 7]", "st": [["1 2 7 4 3 1", {"1": "i"}, "从右往左找第一个比右邻居小的数，是 2。它右边 7 4 3 1 是降序"], ["1 2 7 4 3 1", {"1": "i", "4": "j"}, "再从右往左找第一个比 2 大的数，是 3"], ["1 3 7 4 2 1", [1, 4], "交换 2 和 3"], ["1 3 1 2 4 7", [2, 3, 4, 5], "把 i 右边翻转成升序，得到下一个排列"]], "t": "O(n)，最多扫两遍再翻转一次", "s": "O(1)"}}, "287": {"id": "287", "title": "寻找重复数", "diff": "中等", "cat": "技巧", "must": false, "desc": "给定一个包含 n+1 个整数的数组(值在 [1, n] 范围内)，只有一个重复的整数，找出这个重复数。不能修改数组，O(1)额外空间。", "idea": "把数组看成链表! nums[i] 表示节点i的next指向nums[i]。因为有重复数，所以一定有环。用Floyd判圈法(和环形链表II一样): 快慢指针找到环，再找环入口，入口就是重复的数!", "edge": "", "code": "def findDuplicate(nums):\n    slow = fast = nums[0]\n    while True:\n        slow = nums[slow]\n        fast = nums[nums[fast]]\n        if slow == fast:\n            break\n    slow = nums[0]\n    while slow != fast:\n        slow = nums[slow]\n        fast = nums[fast]\n    return slow", "url": "https://leetcode.cn/problems/find-the-duplicate-number/", "hook": "把值当 next 指针，用找环入口的方法", "viz": {"ex": "nums = [1,3,4,2,2]", "out": "2", "st": [["1 3 4 2 2", null, "把下标 i 指向 nums[i] 看成链表，有两个下标指向 2，所以重复数 2 就是环的入口"], ["L:0 1 3 2 4", {"0": "起点"}, "链表是 0→1→3→2→4，节点 4 又指回 2"], ["L:0 1 3 2 4", {"2": "slow", "3": "fast"}, "和 142 题一样，slow 每次走一步，fast 每次走两步。第一轮后 slow 在 3，fast 在 2"], ["L:0 1 3 2 4", {"3": "相遇"}, "第二轮两者都到 2，相遇"], ["L:0 1 3 2 4", {"3": "入口"}, "slow 回到起点，两者每次走一步，再次相遇在入口 2，答案 2"]], "t": "O(n)", "s": "O(1)，不修改数组"}}, "169": {"id": "169", "title": "多数元素", "diff": "简单", "cat": "技巧", "must": false, "desc": "给定一个大小为 n 的数组 nums，返回其中的多数元素(出现次数大于 n/2 的元素)。", "idea": "用Boyer-Moore投票算法。想象一个擂台赛: 维护一个候选人和票数。遍历数组，如果票数为0，换新候选人; 遇到相同的数就+1票，不同的就-1票。因为多数元素超过一半，它\"打架\"永远打不完，最后留在擂台上的就是答案。", "edge": "", "code": "def majorityElement(nums):\n    candidate = 0\n    count = 0\n    for num in nums:\n        if count == 0:\n            candidate = num\n        count += 1 if num == candidate else -1\n    return candidate", "url": "https://leetcode.cn/problems/majority-element/", "hook": "投票：票数为 0 换候选人，相同 +1 不同 −1", "viz": {"ex": "nums = [2,2,1,1,1,2,2]", "out": "2", "st": [["2 2 1 1 1 2 2", {"0": "候选2"}, "候选 2，计数 1。相同加 1，不同减 1"], ["2 2 1 1 1 2 2", {"3": "计数0"}, "读完两个 1 后计数减到 0，两个 2 和两个 1 互相抵消"], ["2 2 1 1 1 2 2", {"4": "候选1"}, "计数为 0 时换候选为 1"], ["2 2 1 1 1 2 2", {"6": "候选2"}, "后面两个 2 先抵消掉 1，再成为候选。多数元素超过一半，最后剩下的一定是它"]], "t": "O(n)", "s": "O(1)"}}, "136": {"id": "136", "title": "只出现一次的数字", "diff": "简单", "cat": "技巧", "must": false, "desc": "给定一个非空整数数组，除了某个元素只出现一次以外，其余每个元素均出现两次。找出那个只出现了一次的元素。", "idea": "这题用异或运算(XOR)最巧妙。异或有个性质: a^a=0, a^0=a。也就是说，两个相同的数异或后变成0，任何数和0异或还是它自己。把数组所有元素异或一遍，成对的数字互相抵消变成0，最后剩下的就是那个只出现一次的数字!", "edge": "", "code": "def singleNumber(nums):\n    result = 0\n    for num in nums:\n        result ^= num\n    return result", "url": "https://leetcode.cn/problems/single-number/", "hook": "全部异或，成对的抵消为 0", "viz": {"ex": "nums = [4,1,2,1,2]", "out": "4", "st": [["4 1 2 1 2", null, "异或满足 a^a=0、a^0=a，并且可以交换顺序"], ["4 1 2 1 2", [1, 3], "1^1=0"], ["4 1 2 1 2", [2, 4], "2^2=0，最后只剩 4"]], "t": "O(n)", "s": "O(1)"}}, "75": {"id": "75", "title": "颜色分类", "diff": "中等", "cat": "技巧", "must": false, "desc": "给定一个包含红色、白色和蓝色(用0, 1, 2表示)的数组，原地排序使相同颜色相邻，按红白蓝顺序排列。", "idea": "经典的荷兰国旗问题! 用三个指针: p0指向下一个0应该放的位置(左边)，p2指向下一个2应该放的位置(右边)，cur是当前扫描位置。cur遇到0就和p0交换，遇到2就和p2交换，遇到1就跳过。注意和p2交换后cur不动(换过来的数还没检查)。", "edge": "", "code": "def sortColors(nums):\n    p0, cur, p2 = 0, 0, len(nums) - 1\n    while cur <= p2:\n        if nums[cur] == 0:\n            nums[cur], nums[p0] = nums[p0], nums[cur]\n            p0 += 1\n            cur += 1\n        elif nums[cur] == 2:\n            nums[cur], nums[p2] = nums[p2], nums[cur]\n            p2 -= 1\n            # cur不动! 换过来的数还没看\n        else:\n            cur += 1", "url": "https://leetcode.cn/problems/sort-colors/", "hook": "三指针 p0、cur、p2，和 p2 交换后 cur 不动", "viz": {"ex": "nums = [2,0,2,1,1,0]", "out": "[0, 0, 1, 1, 2, 2]", "st": [["2 0 2 1 1 0", {"0": "p0 cur", "5": "p2"}, "p0 左边全是 0，p2 右边全是 2，cur 扫描"], ["0 0 2 1 1 2", {"0": "p0 cur", "4": "p2"}, "cur 是 2，和 p2 交换，p2 左移。换来的数还没检查，cur 不动"], ["0 0 2 1 1 2", {"2": "p0 cur", "4": "p2"}, "cur 是 0，和 p0 交换，两者都右移。连续两次"], ["0 0 1 1 2 2", {"2": "p0", "3": "p2", "4": "cur"}, "cur 是 2，和 p2 交换。之后的 1 跳过，cur 越过 p2，结束"]], "t": "O(n)，一趟扫描", "s": "O(1)"}}, "25": {"id": "25", "title": "K 个一组翻转链表", "diff": "困难", "cat": "链表", "must": true, "ali": 1, "desc": "每k个节点翻转一次链表；末尾不足k个的部分保持原样。", "idea": "先检查当前组是否有k个节点，记下组后节点。以组后节点为初始前驱翻转这一组，再将组前节点接到新组头。旧组头成为下组的前驱。", "edge": "k为正整数；k=1保持原样。；不足一组时必须不改该组；只改节点指针。", "code": "def reverseKGroup(head, k):\n    if k <= 0:\n        raise ValueError('k must be positive')\n    dummy = ListNode(0, head)\n    before = dummy\n    while True:\n        kth = before\n        for _ in range(k):\n            kth = kth.next\n            if kth is None:\n                return dummy.next\n        after = kth.next\n        prev, cur = after, before.next\n        while cur is not after:\n            nxt = cur.next\n            cur.next = prev\n            prev, cur = cur, nxt\n        old_first = before.next\n        before.next = kth\n        before = old_first", "url": "https://leetcode.cn/problems/reverse-nodes-in-k-group/", "hook": "先数够 k 个，翻转这一组，再接回前后", "viz": {"ex": "head = [1,2,3,4,5]，k = 2", "out": "[2, 1, 4, 3, 5]", "st": [["L:1 2 3 4 5", {"0": "before.next", "1": "kth"}, "先从 before 往后数 k 个，数够了才翻"], ["L:2 1 3 4 5", [0, 1], "把这一组翻成 2→1，接回原链表，before 移到 1"], ["L:2 1 4 3 5", [2, 3], "下一组 3、4 翻成 4→3"], ["L:2 1 4 3 5", {"4": "不足 k"}, "剩下 5 不足 k 个，保持原样"]], "t": "O(n)，每个节点被数一次、翻一次", "s": "O(1)，只改指针"}}, "146": {"id": "146", "title": "LRU 缓存", "diff": "中等", "cat": "链表", "must": true, "desc": "设计一个满足 LRU(最近最少使用)缓存约束的数据结构，支持 get 和 put 操作，均为 O(1) 时间。", "idea": "使用OrderedDict同时维护键值索引和访问顺序。get命中及put更新后，把该键移动到末端，末端代表最近使用。超出容量时popitem(last=False)删除最前端的最久未使用项。若面试要求手写底层结构，应另写哈希表加双向链表，不能把标准库调用说成自建节点实现。", "edge": "代码未改，说明已与实际实现统一。最近使用项位于OrderedDict末端。", "code": "class LRUCache:\n    def __init__(self, capacity):\n        from collections import OrderedDict\n        self.cache = OrderedDict()\n        self.cap = capacity\n\n    def get(self, key):\n        if key not in self.cache:\n            return -1\n        self.cache.move_to_end(key)\n        return self.cache[key]\n\n    def put(self, key, value):\n        if key in self.cache:\n            self.cache.move_to_end(key)\n        self.cache[key] = value\n        if len(self.cache) > self.cap:\n            self.cache.popitem(last=False)", "url": "https://leetcode.cn/problems/lru-cache/", "hook": "OrderedDict，访问就 move_to_end，满了弹最旧", "viz": {"ex": "capacity = 2，依次 put(1,1) put(2,2) get(1) put(3,3) get(2) put(4,4)", "out": "[1, -1, -1, 3, 4]", "st": [["1 2", null, "put(1,1)、put(2,2)。从左到右按“最久没用到最近用过”排"], ["2 1", {"1": "刚用"}, "get(1) 返回 1，把 1 移到最右边"], ["1 3", {"1": "新"}, "put(3,3) 超出容量，删掉最左边最久没用的 2"], ["3 4", {"1": "新"}, "get(2) 返回 −1。put(4,4) 删掉 1。之后 get(1)=−1，get(3)=3，get(4)=4"]], "t": "O(1)，get 和 put 都是哈希查找加链表移动", "s": "O(capacity)"}}, "206": {"id": "206", "title": "反转链表", "diff": "简单", "cat": "链表", "must": true, "ali": 1, "desc": "给你单链表的头节点，反转链表并返回。", "idea": "三个指针: prev(前一个节点，初始null)、cur(当前节点)、next(下一个节点)。每次先保存cur.next，然后把cur.next指向prev(反转指针方向)，再把prev和cur都前进一步。就像一排人，依次转身面向后方。", "edge": "", "code": "def reverseList(head):\n    prev = None\n    cur = head\n    while cur:\n        nxt = cur.next\n        cur.next = prev\n        prev = cur\n        cur = nxt\n    return prev", "url": "https://leetcode.cn/problems/reverse-linked-list/", "hook": "prev、cur、nxt 三指针，逐个掉头", "viz": {"ex": "head = [1,2,3]", "out": "[3, 2, 1]", "st": [["L:1 2 3", {"0": "cur"}, "prev = None，cur 指向 1"], ["L:1", {"0": "prev"}, "先存 nxt=2，再让 1 指向 prev，prev 前进到 1，cur 前进到 2"], ["L:2 1", {"0": "prev"}, "2 指向 1，已反转部分 2→1，cur 前进到 3"], ["L:3 2 1", {"0": "prev"}, "3 指向 2，cur 为空，返回 prev"]], "t": "O(n)，每个节点改一次指针", "s": "O(1)"}}, "160": {"id": "160", "title": "相交链表", "diff": "简单", "cat": "链表", "must": false, "desc": "找到两个单链表相交的起始节点。如果不相交返回 null。", "idea": "让两个指针分别从两个链表头出发。走到末尾后，跳到另一个链表的头继续走。如果有交点，两个指针一定会在交点相遇(因为走过的总路程相同)。如果没有交点，两个指针最终都会到null。浪漫的算法: 走过你走过的路，我们终将相遇!", "edge": "", "code": "def getIntersectionNode(headA, headB):\n    a, b = headA, headB\n    while a != b:\n        a = a.next if a else headB\n        b = b.next if b else headA\n    return a", "url": "https://leetcode.cn/problems/intersection-of-two-linked-lists/", "hook": "走完自己的再走对方的，相遇处就是交点", "viz": {"ex": "A = [4,1,8,4,5]，B = [5,6,1,8,4,5]，从 8 开始相交", "out": "8", "st": [["L:4 1 8 4 5", {"2": "交点"}, "链表 A，独有部分 4→1 长 2，公共部分 8→4→5 长 3"], ["L:5 6 1 8 4 5", {"3": "交点"}, "链表 B，独有部分 5→6→1 长 3"], ["", null, "a 走完 A 换到 B 的头，b 走完 B 换到 A 的头。两人走的总路程都是 2+3+3，所以同时到达交点 8"]], "t": "O(m+n)，每个指针最多走两条链表", "s": "O(1)"}}, "23": {"id": "23", "title": "合并 K 个升序链表", "diff": "困难", "cat": "链表", "must": false, "desc": "给你一个链表数组，每个链表都已经按升序排列，将所有链表合并到一个升序链表中。", "idea": "用最小堆(优先队列)! 把每个链表的头节点放入堆中。每次取出堆中最小的节点接到结果链表后面，然后把该节点的下一个节点(如果有)放入堆中。堆始终维护k个候选节点，每次高效取最小值。", "edge": "", "code": "def mergeKLists(lists):\n    import heapq\n    dummy = ListNode(0)\n    cur = dummy\n    heap = []\n    for i, node in enumerate(lists):\n        if node:\n            heapq.heappush(heap, (node.val, i, node))\n    while heap:\n        val, i, node = heapq.heappop(heap)\n        cur.next = node\n        cur = cur.next\n        if node.next:\n            heapq.heappush(heap, (node.next.val, i, node.next))\n    return dummy.next", "url": "https://leetcode.cn/problems/merge-k-sorted-lists/", "hook": "所有链表头进小顶堆，弹最小，补它的 next", "viz": {"ex": "lists = [[1,4,5],[1,3,4],[2,6]]", "out": "[1, 1, 2, 3, 4, 4, 5, 6]", "st": [["1 1 2", null, "每条链表的头放进小顶堆，堆里是 1、1、2"], ["1", {"0": "取出"}, "弹出最小的 1（第 1 条），接到结果后面，把它的下一个 4 放进堆"], ["1 1", {"1": "取出"}, "弹出 1（第 2 条），放进 3。堆里是 2、3、4"], ["1 1 2 3 4 4 5 6", null, "一直弹最小值，直到堆空"]], "t": "O(N log k)，N 个节点各进出堆一次，堆大小不超过 k", "s": "O(k)，堆里每条链表最多一个节点"}}, "21": {"id": "21", "title": "合并两个有序链表", "diff": "简单", "cat": "链表", "must": false, "desc": "将两个升序链表合并为一个新的升序链表。", "idea": "用一个虚拟头节点(dummy)简化操作。两个指针分别指向两个链表，每次比较两个指针的值，把较小的接到结果链表后面，指针前进。当一个链表走完了，把另一个链表剩余部分直接接上。", "edge": "", "code": "def mergeTwoLists(list1, list2):\n    dummy = ListNode(0)\n    cur = dummy\n    while list1 and list2:\n        if list1.val <= list2.val:\n            cur.next = list1\n            list1 = list1.next\n        else:\n            cur.next = list2\n            list2 = list2.next\n        cur = cur.next\n    cur.next = list1 if list1 else list2\n    return dummy.next", "url": "https://leetcode.cn/problems/merge-two-sorted-lists/", "hook": "dummy 头，谁小接谁，剩下的直接挂上", "viz": {"ex": "list1 = [1,2,4]，list2 = [1,3,4]", "out": "[1, 1, 2, 3, 4, 4]", "st": [["L:1 2 4", {"0": "l1"}, "用 dummy 头，cur 指向结果末尾"], ["L:1 1 2 3", null, "每次比较两个头，小的接到 cur 后面"], ["L:1 1 2 3 4 4", null, "一条走完后，另一条剩下的整段直接接上"]], "t": "O(m+n)，每个节点接一次", "s": "O(1)，只改指针"}}, "141": {"id": "141", "title": "环形链表", "diff": "简单", "cat": "链表", "must": false, "desc": "给你一个链表的头节点，判断链表中是否有环。", "idea": "快慢指针(龟兔赛跑)! 慢指针每次走一步，快指针每次走两步。如果有环，快指针一定会在环内追上慢指针(就像操场跑步，跑得快的会套圈)。如果快指针走到了null，说明没有环。", "edge": "", "code": "def hasCycle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n        if slow == fast:\n            return True\n    return False", "url": "https://leetcode.cn/problems/linked-list-cycle/", "hook": "快走两步慢走一步，相遇就有环", "viz": {"ex": "head = [3,2,0,-4]，尾部指回 2", "out": "True", "st": [["L:3 2 0 -4", {"0": "slow fast"}, "慢指针一次走 1 步，快指针一次走 2 步，尾部 −4 指回 2"], ["L:3 2 0 -4", {"1": "slow", "2": "fast"}, "第 1 步后 slow 在 2，fast 在 0"], ["L:3 2 0 -4", {"2": "slow", "1": "fast"}, "第 2 步后 slow 在 0，fast 绕回 2"], ["L:3 2 0 -4", {"3": "slow fast"}, "第 3 步两者都在 −4，相遇说明有环"]], "t": "O(n)，进环后快指针每步追近 1，不超过环长就追上", "s": "O(1)"}}, "142": {"id": "142", "title": "环形链表 II", "diff": "中等", "cat": "链表", "must": true, "desc": "给定一个链表，返回链表开始入环的第一个节点。如果无环返回 null。", "idea": "先用快慢指针判断有环(相遇)。相遇后，把一个指针放回头节点，两个指针都每次走一步，再次相遇的位置就是环的入口! 这是数学推导的结论: 头到入口的距离 = 相遇点到入口的距离。", "edge": "", "code": "def detectCycle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n        if slow == fast:\n            # 找入口\n            slow = head\n            while slow != fast:\n                slow = slow.next\n                fast = fast.next\n            return slow\n    return None", "url": "https://leetcode.cn/problems/linked-list-cycle-ii/", "hook": "相遇后一个回头，两个都走一步，再相遇即入口", "viz": {"ex": "head = [3,2,0,-4]，尾部指回 2", "out": "2", "st": [["L:3 2 0 -4", {"3": "相遇"}, "和 141 一样，快慢指针在 −4 相遇"], ["L:3 2 0 -4", {"0": "slow", "3": "fast"}, "设头到入口 a 步，入口到相遇点 b 步，环长 c。快指针路程是慢指针两倍，推出 a 等于 c−b 加整数圈"], ["L:3 2 0 -4", {"1": "入口"}, "slow 回到头，两者每次都走 1 步，再次相遇的位置就是入口 2"]], "t": "O(n)", "s": "O(1)"}}, "2": {"id": "2", "title": "两数相加", "diff": "中等", "cat": "链表", "must": true, "desc": "两个非空链表表示两个非负整数(逆序存储)，将两数相加返回一个新链表。", "idea": "模拟竖式加法! 同时遍历两个链表，逐位相加，记录进位carry。每一位的结果 = (l1.val + l2.val + carry) % 10，进位 = (l1.val + l2.val + carry) // 10。用dummy头节点简化操作。遍历完后如果还有进位，再加一个节点。", "edge": "", "code": "def addTwoNumbers(l1, l2):\n    dummy = ListNode(0)\n    cur = dummy\n    carry = 0\n    while l1 or l2 or carry:\n        val = carry\n        if l1:\n            val += l1.val\n            l1 = l1.next\n        if l2:\n            val += l2.val\n            l2 = l2.next\n        carry = val // 10\n        cur.next = ListNode(val % 10)\n        cur = cur.next\n    return dummy.next", "url": "https://leetcode.cn/problems/add-two-numbers/", "hook": "逐位相加带 carry，最后别忘了进位", "viz": {"ex": "l1 = [2,4,3]，l2 = [5,6,4]，即 342 + 465", "out": "[7, 0, 8]", "st": [["L:7", null, "个位 2+5=7，进位 0"], ["L:7 0", null, "十位 4+6=10，写 0，进位 1"], ["L:7 0 8", null, "百位 3+4+1=8，结果 807 倒序存成 7→0→8"]], "t": "O(max(m,n))，每一位算一次", "s": "O(1) 额外空间，输出链表 O(max(m,n)) 另计"}}, "148": {"id": "148", "title": "排序链表", "diff": "中等", "cat": "链表", "must": true, "desc": "给你链表的头结点 head，将其按升序排列后返回排序后的链表。官方在进阶部分提问能否做到 O(n log n) 时间与常数级空间，正文本身不强制。", "idea": "对链表用归并排序。快慢指针找中点并断成两段，递归排序两段，再合并两个有序链表。本实现是递归写法，额外空间来自 O(log n) 深的递归栈；若要做到常数级空间，需要改写成自底向上的迭代归并。", "edge": "", "code": "def sortList(head):\n    if not head or not head.next:\n        return head\n    # 找中点并断开\n    slow, fast = head, head.next\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n    mid = slow.next\n    slow.next = None\n    # 递归排序\n    left = sortList(head)\n    right = sortList(mid)\n    # 合并\n    dummy = ListNode(0)\n    cur = dummy\n    while left and right:\n        if left.val <= right.val:\n            cur.next = left\n            left = left.next\n        else:\n            cur.next = right\n            right = right.next\n        cur = cur.next\n    cur.next = left if left else right\n    return dummy.next", "url": "https://leetcode.cn/problems/sort-list/", "hook": "快慢指针找中点断开，递归排两半，再合并", "viz": {"ex": "head = [4,2,1,3]", "out": "[1, 2, 3, 4]", "st": [["L:4 2 1 3", {"1": "slow"}, "快慢指针找中点，从 slow 后面断开"], ["4 2 | 1 3", null, "左右两半分别递归排序"], ["2 4 | 1 3", null, "每半再拆到单个节点后合并，得到 2→4 和 1→3"], ["L:1 2 3 4", null, "按 21 题的方法合并两条有序链表"]], "t": "O(n log n)，共 log n 层，每层拆分和合并共 O(n)", "s": "O(log n)，递归栈深度"}}, "234": {"id": "234", "title": "回文链表", "diff": "简单", "cat": "链表", "must": false, "desc": "判断一个链表是否为回文链表(正着读反着读一样)。", "idea": "三步走: (1)快慢指针找到链表中点; (2)反转后半部分链表; (3)从两端同时遍历比较。用O(1)额外空间实现。前半部分和反转后的后半部分逐个比较，全部相等就是回文。", "edge": "原代码反转后半链表且不恢复，可能改变调用方持有的链表；需要保留输入结构时应再反转恢复。", "code": "def isPalindrome(head):\n    # 找中点\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n    # 反转后半部分\n    prev = None\n    while slow:\n        nxt = slow.next\n        slow.next = prev\n        prev = slow\n        slow = nxt\n    # 比较两半\n    left, right = head, prev\n    while right:\n        if left.val != right.val:\n            return False\n        left = left.next\n        right = right.next\n    return True", "url": "https://leetcode.cn/problems/palindrome-linked-list/", "hook": "找中点，反转后半段，两头逐个比较", "viz": {"ex": "head = [1,2,2,1]", "out": "True", "st": [["L:1 2 2 1", {"2": "slow"}, "快慢指针，fast 走到头时 slow 停在后半段开头"], ["1 2 | 1 2", null, "把后半段反转成 1→2"], ["1 2 | 1 2", [0, 2], "前后两段逐个比较，1=1，2=2，是回文"]], "t": "O(n)，找中点、反转、比较各一遍", "s": "O(1)，只改指针"}}, "19": {"id": "19", "title": "删除链表的倒数第 N 个结点", "diff": "中等", "cat": "链表", "must": false, "desc": "给你一个链表，删除链表的倒数第 n 个结点，返回链表的头结点。", "idea": "快慢指针! 让快指针先走n步，然后快慢指针同时走，当快指针到达末尾时，慢指针正好在倒数第n+1个节点(要删除节点的前一个)。用dummy头节点处理删除头节点的边界情况。", "edge": "", "code": "def removeNthFromEnd(head, n):\n    dummy = ListNode(0, head)\n    fast = slow = dummy\n    for _ in range(n + 1):\n        fast = fast.next\n    while fast:\n        fast = fast.next\n        slow = slow.next\n    slow.next = slow.next.next\n    return dummy.next", "url": "https://leetcode.cn/problems/remove-nth-node-from-end-of-list/", "hook": "快指针先走 n 步，再一起走，慢指针停在待删前一个", "viz": {"ex": "head = [1,2,3,4,5]，n = 2", "out": "[1, 2, 3, 5]", "st": [["L:0 1 2 3 4 5", {"0": "slow", "3": "fast"}, "加 dummy 头（这里显示为 0）。fast 先走 n+1=3 步"], ["L:0 1 2 3 4 5", {"3": "slow"}, "两者一起走到 fast 为空，slow 停在要删节点 4 的前一个"], ["L:1 2 3 5", null, "slow.next = slow.next.next，删掉 4"]], "t": "O(L)，L 为链表长度，只走一遍", "s": "O(1)"}}, "138": {"id": "138", "title": "随机链表的复制", "diff": "中等", "cat": "链表", "must": false, "desc": "复制带next和random指针的链表，副本的所有指针只能指向副本节点或空。", "idea": "第一遍为每个旧节点建立一个新节点并记录映射。第二遍通过映射连接新节点的next和random。这避免random指向尚未复制节点的问题。", "edge": "按节点身份映射，不按值映射；节点值可能重复。；random可为空、指向自身或任意原链表节点；原链表不变。", "code": "def copyRandomList(head):\n    copies = {None: None}\n    cur = head\n    while cur:\n        copies[cur] = Node(cur.val)\n        cur = cur.next\n    cur = head\n    while cur:\n        copies[cur].next = copies[cur.next]\n        copies[cur].random = copies[cur.random]\n        cur = cur.next\n    return copies[head]", "url": "https://leetcode.cn/problems/copy-list-with-random-pointer/", "hook": "第一遍建映射 old→new，第二遍连 next 和 random", "viz": {"ex": "head = [[7,null],[13,0],[11,4],[10,2],[1,0]]", "out": "[[7, None], [13, 0], [11, 4], [10, 2], [1, 0]]", "st": [["L:7 13 11 10 1", null, "每个节点除了 next 还有一个随便指的 random"], ["L:7 13 11 10 1", null, "第一遍为每个旧节点建新节点，存进字典 {旧: 新}"], ["L:7 13 11 10 1", null, "第二遍按字典连线，新.next = 字典[旧.next]，新.random = 字典[旧.random]"]], "t": "O(n)，两遍扫描，字典查找平均 O(1)", "s": "O(n)，字典存 n 对映射"}}, "24": {"id": "24", "title": "两两交换链表中的节点", "diff": "中等", "cat": "链表", "must": false, "desc": "交换链表中每一对相邻节点的位置，节点值保持不变。", "idea": "用哑节点统一头部情况。每轮记录一对节点，先把第一个节点接到后继，再让第二个节点指向第一个，最后把前驱接到第二个节点。", "edge": "实际修改next指针，不能只交换值。；奇数长度末节点不动，空链表直接返回空。", "code": "def swapPairs(head):\n    dummy = ListNode(0, head)\n    before = dummy\n    while before.next and before.next.next:\n        first = before.next\n        second = first.next\n        first.next = second.next\n        second.next = first\n        before.next = second\n        before = first\n    return dummy.next", "url": "https://leetcode.cn/problems/swap-nodes-in-pairs/", "hook": "dummy 头，每次处理一对，三根指针重新接", "viz": {"ex": "head = [1,2,3,4]", "out": "[2, 1, 4, 3]", "st": [["L:1 2 3 4", {"0": "first", "1": "second"}, "before 指 dummy，first=1，second=2"], ["L:2 1 3 4", {"1": "before"}, "1 指向 3，2 指向 1，before 接 2。before 移到 1"], ["L:2 1 4 3", [2, 3], "对 3、4 重复同样三步"]], "t": "O(n)", "s": "O(1)"}}, "236": {"id": "236", "title": "二叉树的最近公共祖先", "diff": "中等", "cat": "二叉树", "must": true, "desc": "给定一个二叉树，找到两个指定节点的最近公共祖先(LCA)。", "idea": "递归: 如果当前节点是p或q，返回当前节点。递归查找左右子树。如果左右子树各找到一个(一个返回了p，一个返回了q)，说明当前节点就是LCA。如果只在一边找到，返回那一边的结果。", "edge": "按节点对象身份判断，且p、q均在树中；若允许节点缺失，需额外验证而不能直接套用返回值。", "code": "def lowestCommonAncestor(root, p, q):\n    if not root or root == p or root == q:\n        return root\n    left = lowestCommonAncestor(root.left, p, q)\n    right = lowestCommonAncestor(root.right, p, q)\n    if left and right:\n        return root  # p和q分别在左右子树\n    return left if left else right", "url": "https://leetcode.cn/problems/lowest-common-ancestor-of-a-binary-tree/", "hook": "当前是 p 或 q 就返回，左右都找到则当前就是答案", "viz": {"ex": "root = [3,5,1,6,2,0,8,null,null,7,4]，p = 6，q = 4", "out": "5", "st": [["T:3 5 1 6 2 0 8 # # 7 4", {"6": "p", "4": "q"}, "后序遍历，从下往上汇报。遇到 p 或 q 就把自己交上去"], ["T:3 5 1 6 2 0 8 # # 7 4", {"6": "返回6", "2": "返回4"}, "节点 6 返回自己，节点 2 的右孩子是 q，2 返回 4"], ["T:3 5 1 6 2 0 8 # # 7 4", {"5": "LCA"}, "节点 5 左边收到 6，右边收到 4，两边都不空，5 就是最近公共祖先"], ["T:3 5 1 6 2 0 8 # # 7 4", {"3": "传5"}, "节点 1 那一侧什么都没找到，返回空。根 3 只收到 5，原样返回，答案 5"]], "t": "O(n)，每个节点访问一次", "s": "O(h)，递归栈深度等于树高 h，最坏 O(n)"}}, "199": {"id": "199", "title": "二叉树的右视图", "diff": "中等", "cat": "二叉树", "must": true, "desc": "按从上到下的层次返回每层最靠右的可见节点值。", "idea": "从左到右做层序遍历，每层固定处理开始时的队列长度。该层最后弹出的节点就是右视图中的节点。", "edge": "空树返回空列表。；不是只沿right指针走，右子树缺失时左子树深层仍可能可见。", "code": "def rightSideView(root):\n    from collections import deque\n    if root is None:\n        return []\n    queue = deque([root])\n    result = []\n    while queue:\n        size = len(queue)\n        for i in range(size):\n            node = queue.popleft()\n            if node.left:\n                queue.append(node.left)\n            if node.right:\n                queue.append(node.right)\n            if i == size - 1:\n                result.append(node.val)\n    return result", "url": "https://leetcode.cn/problems/binary-tree-right-side-view/", "hook": "层序遍历，每层最后一个节点", "viz": {"ex": "root = [1,2,3,null,5,null,4]", "out": "[1, 3, 4]", "st": [["T:1 2 3 # 5 # 4", {"1": "看到"}, "按层 BFS，每层最后一个节点就是从右边看到的"], ["T:1 2 3 # 5 # 4", {"3": "看到"}, "第二层 2、3，最后一个是 3"], ["T:1 2 3 # 5 # 4", {"4": "看到"}, "第三层 5、4，最后一个是 4，答案 [1,3,4]"]], "t": "O(n)，每个节点进出队列一次", "s": "O(w)，队列最多存一层，w 为最大层宽，输出另计"}}, "105": {"id": "105", "title": "从前序与中序遍历序列构造二叉树", "diff": "中等", "cat": "二叉树", "must": true, "desc": "给定两个整数数组 preorder 和 inorder，其中 preorder 是前序遍历，inorder 是中序遍历，构造并返回二叉树。", "idea": "前序区间的首项为根。先用哈希表记录每个值在中序中的位置，递归传递前序起点及中序半开区间。根的中序位置决定左子树大小，据此计算右子树的前序起点。传下标而不复制列表，每个节点构建一次。", "edge": "原切片实现最坏时间和额外空间均可为O(n²)，现已同时去除index线性查找与切片。；约定节点值互异、两遍历合法且对应同一棵树；长度检查不构成完整输入合法性验证。；TreeNode由题目平台或练习脚本提供；很深的树仍需考虑Python递归深度。", "code": "def buildTree(preorder, inorder):\n    if len(preorder) != len(inorder):\n        raise ValueError('traversal lengths differ')\n    index = {value: i for i, value in enumerate(inorder)}\n\n    def build(pre_left, in_left, in_right):\n        if in_left >= in_right:\n            return None\n        value = preorder[pre_left]\n        mid = index[value]\n        root = TreeNode(value)\n        left_size = mid - in_left\n        root.left = build(pre_left + 1, in_left, mid)\n        root.right = build(pre_left + 1 + left_size, mid + 1, in_right)\n        return root\n\n    return build(0, 0, len(inorder))", "url": "https://leetcode.cn/problems/construct-binary-tree-from-preorder-and-inorder-traversal/", "hook": "前序第一个是根，用中序下标切出左子树大小", "viz": {"ex": "preorder = [3,9,20,15,7]，inorder = [9,3,15,20,7]", "out": "[3, 9, 20, None, None, 15, 7]", "st": [["9 3 15 20 7", {"1": "根"}, "前序第一个 3 是根，在中序里找到它，左边 [9] 是左子树，右边 [15,20,7] 是右子树"], ["9 3 15 20 7", {"0": "左"}, "左子树只有 9，前序里紧跟在根后面"], ["9 3 15 20 7", {"3": "根"}, "右子树的前序是 [20,15,7]，根 20，中序里 15 在左、7 在右"], ["T:3 9 20 # # 15 7", null, "用字典存中序下标，每次 O(1) 定位根，建好整棵树"]], "t": "O(n)，每个节点建一次，字典定位 O(1)", "s": "O(n)，下标字典，递归栈 O(h)"}}, "102": {"id": "102", "title": "二叉树的层序遍历", "diff": "中等", "cat": "二叉树", "must": false, "desc": "给你二叉树的根节点 root，返回其节点值的层序遍历(逐层从左到右)。", "idea": "用BFS(广度优先搜索)! 用队列(queue)辅助。每次处理一层: 记录当前队列长度(这一层有几个节点)，依次弹出这些节点，将它们的子节点加入队列。每一层的值收集到一个列表中。", "edge": "", "code": "def levelOrder(root):\n    if not root:\n        return []\n    from collections import deque\n    queue = deque([root])\n    result = []\n    while queue:\n        level = []\n        for _ in range(len(queue)):\n            node = queue.popleft()\n            level.append(node.val)\n            if node.left:\n                queue.append(node.left)\n            if node.right:\n                queue.append(node.right)\n        result.append(level)\n    return result", "url": "https://leetcode.cn/problems/binary-tree-level-order-traversal/", "hook": "队列 BFS，每层先记下 len(queue)", "viz": {"ex": "root = [3,9,20,null,null,15,7]", "out": "[[3], [9, 20], [15, 7]]", "st": [["T:3 9 20 # # 15 7", {"3": "第1层"}, "队列里先放根。每轮先记下队列长度，正好是这一层的节点数"], ["T:3 9 20 # # 15 7", {"9": "第2层", "20": "第2层"}, "弹出 3，放入 9、20。下一轮弹 2 个，得到 [9,20]"], ["T:3 9 20 # # 15 7", {"15": "第3层", "7": "第3层"}, "弹 20 时放入 15、7，得到 [15,7]"]], "t": "O(n)，每个节点进出队列一次", "s": "O(n)，队列和输出"}}, "101": {"id": "101", "title": "对称二叉树", "diff": "简单", "cat": "二叉树", "must": false, "desc": "给你一个二叉树的根节点 root，检查它是否轴对称。", "idea": "对称 = 左子树和右子树是镜像关系。写一个辅助函数check(left, right): 两个都空->对称; 一个空一个不空->不对称; 值不等->不对称; 然后递归检查 left.left和right.right 是否镜像，left.right和right.left 是否镜像。", "edge": "", "code": "def isSymmetric(root):\n    def check(left, right):\n        if not left and not right:\n            return True\n        if not left or not right:\n            return False\n        return (left.val == right.val and\n                check(left.left, right.right) and\n                check(left.right, right.left))\n    return check(root.left, root.right) if root else True", "url": "https://leetcode.cn/problems/symmetric-tree/", "hook": "check(左, 右)：外侧配外侧，内侧配内侧", "viz": {"ex": "root = [1,2,2,3,4,4,3]", "out": "True", "st": [["T:1 2 2 3 4 4 3", {"2": "比较"}, "比较根的左右两个 2，值相等"], ["T:1 2 2 3 4 4 3", {"3": "外侧"}, "外侧配对，左的左 3 对右的右 3"], ["T:1 2 2 3 4 4 3", {"4": "内侧"}, "内侧配对，左的右 4 对右的左 4，全部相等，对称"]], "t": "O(n)，每对节点比较一次", "s": "O(h)，递归栈深度等于树高 h，最坏 O(n)"}}, "98": {"id": "98", "title": "验证二叉搜索树", "diff": "中等", "cat": "二叉树", "must": false, "desc": "给你二叉树的根节点 root，判断它是否是一个有效的二叉搜索树。有效的定义是节点的左子树只包含严格小于当前节点的数，右子树只包含严格大于当前节点的数，并且左右子树自身也都是二叉搜索树。出现相等的值即判定为不合法。", "idea": "BST的性质: 每个节点的值必须在一个范围内。根节点范围是(-inf, +inf)，左孩子的上界变成父节点值，右孩子的下界变成父节点值。递归时传递上下界，检查每个节点是否在合法范围内。", "edge": "", "code": "def isValidBST(root):\n    def validate(node, low, high):\n        if not node:\n            return True\n        if node.val <= low or node.val >= high:\n            return False\n        return (validate(node.left, low, node.val) and\n                validate(node.right, node.val, high))\n    return validate(root, float('-inf'), float('inf'))", "url": "https://leetcode.cn/problems/validate-binary-search-tree/", "hook": "递归带上下界 (low, high)，左收上界右收下界", "viz": {"ex": "root = [5,1,4,null,null,3,6]", "out": "False", "st": [["T:5 1 4 # # 3 6", {"5": "(−∞,∞)"}, "每个节点带一个合法区间往下传，根的区间是 (−∞, ∞)"], ["T:5 1 4 # # 3 6", {"1": "(−∞,5)"}, "左孩子 1 必须在 (−∞, 5) 内，满足"], ["T:5 1 4 # # 3 6", {"4": "(5,∞)"}, "右孩子 4 必须在 (5, ∞) 内，不满足，返回 False"]], "t": "O(n)", "s": "O(h)，递归栈深度等于树高 h，最坏 O(n)"}}, "124": {"id": "124", "title": "二叉树中的最大路径和", "diff": "困难", "cat": "二叉树", "must": false, "desc": "给你一个二叉树的根节点 root，返回其最大路径和。路径可以从任意节点出发到任意节点(不一定经过根节点)。", "idea": "和二叉树直径思路类似! 对每个节点，经过它的最大路径和 = 节点值 + 左子树贡献(如果>0) + 右子树贡献(如果>0)。递归函数返回该节点能向上提供的最大贡献(只能选左/右之一，因为路径不能分叉)。遍历时更新全局最大值。", "edge": "", "code": "def maxPathSum(root):\n    max_sum = float('-inf')\n    def dfs(node):\n        nonlocal max_sum\n        if not node:\n            return 0\n        left = max(0, dfs(node.left))   # 负贡献不要\n        right = max(0, dfs(node.right))\n        # 经过当前节点的最大路径和\n        max_sum = max(max_sum, node.val + left + right)\n        # 向上只能选一边\n        return node.val + max(left, right)\n    dfs(root)\n    return max_sum", "url": "https://leetcode.cn/problems/binary-tree-maximum-path-sum/", "hook": "返回单边最大贡献（负的取 0），全局记左+右+根", "viz": {"ex": "root = [-10,9,20,null,null,15,7]", "out": "42", "st": [["T:-10 9 20 # # 15 7", {"15": "15", "7": "7", "9": "9"}, "dfs 返回“从这个节点往下走一条腿的最大和”，叶子返回自己"], ["T:-10 9 20 # # 15 7", {"20": "拐点"}, "在 20 处拐弯，20+15+7=42，更新答案。向上只能带一条腿，返回 20+15=35"], ["T:-10 9 20 # # 15 7", {"-10": "拐点"}, "在 −10 处拐弯，−10+9+35=34，小于 42。负的腿用 max(0, ·) 砍掉，答案 42"]], "t": "O(n)", "s": "O(h)，递归栈深度等于树高 h，最坏 O(n)"}}, "94": {"id": "94", "title": "二叉树的中序遍历", "diff": "简单", "cat": "二叉树", "must": false, "desc": "给定一个二叉树的根节点 root，返回它的中序遍历(左-根-右)。", "idea": "中序遍历的顺序是: 先遍历左子树，再访问根节点，最后遍历右子树。递归写法最简单: 对左子树递归调用，加入当前节点值，对右子树递归调用。也可以用栈实现迭代版本。", "edge": "", "code": "def inorderTraversal(root):\n    result = []\n    def dfs(node):\n        if not node:\n            return\n        dfs(node.left)\n        result.append(node.val)\n        dfs(node.right)\n    dfs(root)\n    return result", "url": "https://leetcode.cn/problems/binary-tree-inorder-traversal/", "hook": "左、根、右，迭代就一路压左再弹出", "viz": {"ex": "root = [1,null,2,3]", "out": "[1, 3, 2]", "st": [["T:1 # 2 3", {"1": "1"}, "中序是 左、根、右。1 没有左孩子，先输出 1"], ["T:1 # 2 3", {"3": "2"}, "去右子树 2，先走它的左孩子 3，输出 3"], ["T:1 # 2 3", {"2": "3"}, "再输出 2，结果 [1,3,2]"]], "t": "O(n)", "s": "O(h)，递归栈深度等于树高 h，最坏 O(n)"}}, "543": {"id": "543", "title": "二叉树的直径", "diff": "简单", "cat": "二叉树", "must": true, "desc": "给定一棵二叉树，计算它的直径(任意两个节点之间的最长路径的边数)。", "idea": "直径不一定经过根节点! 对于每个节点，经过它的最长路径 = 左子树深度 + 右子树深度。所以在求深度的过程中，顺便更新全局最大直径。深度用递归求，每个节点的深度 = max(左深度, 右深度) + 1。", "edge": "", "code": "def diameterOfBinaryTree(root):\n    diameter = 0\n    def depth(node):\n        nonlocal diameter\n        if not node:\n            return 0\n        left = depth(node.left)\n        right = depth(node.right)\n        diameter = max(diameter, left + right)\n        return max(left, right) + 1\n    depth(root)\n    return diameter", "url": "https://leetcode.cn/problems/diameter-of-binary-tree/", "hook": "求深度时顺手记 左深度+右深度 的最大值", "viz": {"ex": "root = [1,2,3,4,5]", "out": "3", "st": [["T:1 2 3 4 5", {"4": "深1", "5": "深1"}, "depth 返回子树深度，叶子是 1"], ["T:1 2 3 4 5", {"2": "深2"}, "节点 2 处，经过它的路径长 1+1=2，返回深度 2"], ["T:1 2 3 4 5", {"1": "直径3"}, "节点 1 处，左深 2、右深 1，路径长 3，答案 3"]], "t": "O(n)", "s": "O(h)，递归栈深度等于树高 h，最坏 O(n)"}}, "104": {"id": "104", "title": "二叉树的最大深度", "diff": "简单", "cat": "二叉树", "must": true, "desc": "给定一个二叉树，找出其最大深度(根节点到最远叶子节点的最长路径上的节点数)。", "idea": "经典递归: 一棵树的最大深度 = max(左子树深度, 右子树深度) + 1。空节点深度为0。就这么简单! 递归会帮你层层计算每个子树的深度。", "edge": "", "code": "def maxDepth(root):\n    if not root:\n        return 0\n    return max(maxDepth(root.left), maxDepth(root.right)) + 1", "url": "https://leetcode.cn/problems/maximum-depth-of-binary-tree/", "hook": "max(左深度, 右深度) + 1", "viz": {"ex": "root = [3,9,20,null,null,15,7]", "out": "3", "st": [["T:3 9 20 # # 15 7", {"15": "1", "7": "1", "9": "1"}, "叶子深度 1"], ["T:3 9 20 # # 15 7", {"20": "2"}, "20 的深度是 max(1,1)+1=2"], ["T:3 9 20 # # 15 7", {"3": "3"}, "根的深度是 max(1,2)+1=3"]], "t": "O(n)", "s": "O(h)，递归栈深度等于树高 h，最坏 O(n)"}}, "114": {"id": "114", "title": "二叉树展开为链表", "diff": "中等", "cat": "二叉树", "must": false, "desc": "给你二叉树的根节点 root，将它展开为一个单链表(按前序遍历顺序，所有节点的右子节点连接，左子节点为空)。", "idea": "巧妙的原地操作: 对于当前节点，如果有左子树，找到左子树的最右节点(前驱节点)，把当前节点的右子树接到这个最右节点的右边，然后把左子树移到右边，左边置空。处理下一个节点。", "edge": "", "code": "def flatten(root):\n    cur = root\n    while cur:\n        if cur.left:\n            # 找左子树最右节点\n            rightmost = cur.left\n            while rightmost.right:\n                rightmost = rightmost.right\n            # 把右子树接到左子树最右节点后面\n            rightmost.right = cur.right\n            cur.right = cur.left\n            cur.left = None\n        cur = cur.right", "url": "https://leetcode.cn/problems/flatten-binary-tree-to-linked-list/", "hook": "左子树的最右节点接上原右子树，再把左子树挪到右边", "viz": {"ex": "root = [1,2,5,3,4,null,6]", "out": "[1, None, 2, None, 3, None, 4, None, 5, None, 6]", "st": [["T:1 2 5 3 4 # 6", {"1": "cur", "4": "最右"}, "cur=1 有左子树，找到左子树最右的节点 4"], ["T:1 # 2 3 4 # # # 5 # 6", {"2": "cur"}, "把 1 的右子树 5 接到 4 后面，再把左子树搬到右边，左边置空"], ["T:1 # 2 # 3 # 4 # 5 # 6", null, "cur=2 时同样处理 3。之后一路向右，全部展开"]], "t": "O(n)，每个节点当一次 cur，找最右节点的路径加起来也不超过 n", "s": "O(1)，不用栈和递归"}}, "226": {"id": "226", "title": "翻转二叉树", "diff": "简单", "cat": "二叉树", "must": false, "desc": "给你一棵二叉树的根节点 root，翻转这棵二叉树(左右子树互换)，返回根节点。", "idea": "递归: 先翻转左子树，再翻转右子树，然后交换左右子树。就像照镜子一样，每个节点的左右孩子都要互换。三行代码搞定!", "edge": "", "code": "def invertTree(root):\n    if not root:\n        return None\n    root.left, root.right = invertTree(root.right), invertTree(root.left)\n    return root", "url": "https://leetcode.cn/problems/invert-binary-tree/", "hook": "交换左右孩子，再递归翻转", "viz": {"ex": "root = [4,2,7,1,3,6,9]", "out": "[4, 7, 2, 9, 6, 3, 1]", "st": [["T:4 2 7 1 3 6 9", {"4": "交换"}, "对每个节点交换左右孩子"], ["T:4 7 2 6 9 1 3", {"7": "交换", "2": "交换"}, "根交换后，再递归处理两个孩子"], ["T:4 7 2 9 6 3 1", null, "全部交换完，得到镜像树"]], "t": "O(n
