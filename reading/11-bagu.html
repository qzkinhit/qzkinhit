t", "src": "CLIP", "id": "g5-1"}, {"topic": "多模态与 RAG", "q": "CLIP 怎样对齐图像和文本，错误配对和多个正例怎么办？", "tag": "必背", "key": "这类方法用不同编码器处理两种模态，再投影到共同的表示空间，通常归一化后计算相似度，通过配对监督拉高正确组合相对其他组合的分数", "a": ["应先明确匹配语义，再考虑去重、关系掩码或多正例目标。", "共享空间不意味着两种模态完全等价，也不保证所有细粒度时间信息都保留下来，仍需具体任务验证。"], "f": ["s_ij=normalize(f_audio(a_i))ᵀnormalize(f_text(t_j))", "匹配标签由数据关系定义。"], "fa": "不必。 可以定义多个正例，用相应多正例损失或采样规则训练。 关键是让目标函数承认这些关系，避免把其他正确描述作为负例。 还要控制重复对训练权重的影响。", "viz": "contrast", "src": "CLIP；Section0.1 多模态大模型综述", "id": "g5-2"}, {"topic": "多模态与 RAG", "q": "掩码建模、因果建模与对比预训练的目标有何区别？", "tag": "必背", "key": "掩码建模隐藏部分输入，让模型利用可见上下文恢复缺失内容，BERT 预测被选 token，MAE 重建图像被掩码部分", "a": ["因果建模按照序列顺序，只用历史预测下一项，因此适合自回归采样。", "对比学习则区分匹配与不匹配的表示，重点塑造相似关系，不必直接重建原始内容。", "三者可以结合，但输出对象、可见信息和损失不同。", "选择取决于下游需要生成能力、重建细节还是检索表示，不能仅凭预训练损失低就断言迁移任务最好。"], "f": ["因果目标 L=-Σ_t log p(x_t|x_<t)", "掩码目标只在指定隐藏位置或内容上计算重建损失。"], "fq": "双向编码器是不是不能用于生成任务？", "fa": "它可以作为生成系统的编码器，也可以参与迭代式生成设计。 这里只是说其原始掩码目标与从左到右下一 token 目标不同，不能把架构用途说成绝对限制。", "src": "4.1 BERT及变体；4.3 GPT系列", "id": "g5-3"}, {"topic": "多模态与 RAG", "q": "为什么不能只按一个相似度分数清洗多模态预训练数据？", "tag": "必背", "key": "相似度主要反映某个编码器认可的语义关系，并不完整代表事实正确性、声音质量、时间对齐和覆盖度", "a": ["低分样本可能是错配，也可能是模型不熟悉的稀有风格。", "只保留高分容易扩大原有偏差。", "合理流程是先明确下游任务，分别检查配对、重复、长度与长尾，再用可信验证集比较保留、降权或删除策略。", "比较时还应固定训练时长与总计算预算，计入筛选开销。"], "fq": "如何区分困难但有价值的样本和错误样本？", "fa": "结合标注证据、近邻或多模型分歧、人工抽检和下游干预实验。 高损失或低相似度只能提出候选，不能单独证明样本错误。 最好分类型查看实际例子。", "src": "2.2 预训练数据；10.4 八股面经（含答案）", "id": "g5-4"}, {"topic": "多模态与 RAG", "q": "多模态编码器怎样接入 LLM，投影层与 Q-Former 有何区别？", "tag": "必背", "key": "常见结构先用模态编码器得到特征，再通过连接器映射到语言模型能处理的表示", "a": ["投影层逐 token 变换维度，结构简单，但保留的模态 token 可能较多。", "Q-Former 使用可学习查询通过交叉注意力提取和压缩相关信息，再适配到语言模型。", "训练可先冻结已有编码器和 LLM，只训练连接器建立对齐，再按任务放开部分参数做指令微调，但并非所有模型都采用同一阶段。"], "fq": "为什么对齐维度相同不代表语义已经对齐？", "fa": "同维度只是矩阵运算可连接，表示分布和信息含义仍可能不同。 需要配对训练目标与下游任务验证，检查模型是否真的使用模态信息，而不是依赖文本偏置。", "src": "Section0.1 多模态大模型综述；BLIP-2", "id": "g5-5"}, {"topic": "多模态与 RAG", "q": "一个 RAG 系统从文档到答案包含哪些关键步骤？", "tag": "必背", "key": "离线先解析文档、清理结构、切分片段并保存来源和权限元数据，再建立稀疏或向量索引", "a": ["在线先理解查询，按需要改写或分解，用关键词与语义召回找到候选，再重排、去重和裁剪上下文，最后基于证据生成答案并保留引用。", "切块太小可能丢上下文，太大则混入噪声并增加成本。", "索引与文档要有更新和版本机制，权限过滤应在检索和结果返回时生效。", "RAG 不是把向量库接上模型就完成，必须能定位每一阶段的失效。"], "fq": "BM25 与向量召回为什么经常组合？", "fa": "关键词召回对专名、编号等精确词匹配有效，向量召回能处理部分语义改写。 组合可补充覆盖，但要统一候选、去重和重排，并验证额外成本是否换来收益。", "viz": "rag", "src": "6.3 RAG 检索增强生成", "id": "g5-6"}, {"topic": "多模态与 RAG", "q": "怎样分别评价 RAG 的检索和生成，失败时怎样定位？", "tag": "必背", "key": "检索侧检查相关文档是否召回以及排名，可用召回、MRR 或 NDCG", "a": ["生成侧检查答案正确性、对证据的忠实性、完整性和引用是否支持主张。", "可以把正确证据直接给生成器，判断问题是否仍存在，再固定候选测试重排，逐层定位。", "MRR 只取每个查询首个相关项的倒数排名，命中率也不同于前 K 项的精确率。", "模型评审可扩展规模，但要用人工样本校准，并记录检索、上下文和答案，不能只看一个端到端分数。"], "f": ["MRR=(1/N)Σ_q (1)/(rank_first(q))，无命中记0", "Hit@K 对每个查询只记是否命中。"], "fq": "答案和参考答案词面不同，BLEU 或 ROUGE 很低，一定错了吗？", "fa": "不一定。 开放问答可能有多种正确表达，应检查事实、证据和任务约束。 词面指标只是补充，不能代替语义正确性与引用支持度评价。", "viz": "rag", "src": "6.3 RAG 检索增强生成", "id": "g5-7"}, {"topic": "多模态与 RAG", "q": "类别不平衡怎样处理，为什么高准确率不代表模型有效？", "tag": "必背", "key": "先看业务中的正负定义、错误代价与真实类比例", "a": ["极少正例时，永远预测负类也可能有很高准确率，应检查逐类召回、精确率、宏平均和合适的 PR 指标。", "训练上可以比较类别权重、过采样、欠采样或更好的特征，推理上可根据验证集调整阈值。", "采样只作用于训练折，不能在划分前对全数据复制或合成样本，否则可能泄漏。", "改变训练类比例还会影响概率校准，应在接近真实分布的独立数据上检查。"], "fq": "把正负样本采成一比一后，测试集也要改成一比一吗？", "fa": "一般应保留目标部署分布来评估，除非评测协议明确规定。 人为平衡测试集会改变精确率等与类比例相关的量，可能让业务效果判断失真。", "viz": "roc", "src": "0.10 ML 评估指标与模型选择；10.6 机器学习深度学习八股（初稿）", "id": "g5-8"}, {"topic": "多模态与 RAG", "q": "SigLIP 相比 CLIP 改了什么？为什么小批量下更有优势？", "tag": "理解", "key": "CLIP 用 softmax 形式的对比损失，归一化项要在整个批次上计算，因此需要极大批量才能提供足够的负样本，且分布式训练需要跨卡收集全部特征", "a": ["SigLIP 把损失换成逐对的 sigmoid 二分类，每个图文对独立判断是否匹配，不依赖批内归一化。", "这样批大小不再直接决定负样本质量，小批量下性能下降小得多，分布式实现也只需分块计算而无需全局收集。", "另外 softmax 形式隐含批内只有一个正例的假设，现实数据中同批出现语义重复样本时会产生错误的负梯度，sigmoid 形式没有这个问题。"], "f": ["SigLIP 损失对每一对计算带标签的 logistic 损失，标签在对角线为正、其余为负，并引入可学习的偏置补偿正负不平衡。"], "id": "g5-10"}, {"topic": "微调与压缩", "q": "ICL、SFT 与预训练有什么区别，示范数据如何形成训练目标？", "tag": "必背", "key": "预训练通常用较大范围的数据学习通用能力，SFT 用带示范输出的数据继续更新参数，让行为适配任务或指令", "a": ["二者的区别更多在数据、目标和训练阶段，不是两种必然不同的网络。", "ICL 则把示例放进当前上下文，在通常推理设置下不更新参数。", "语言 SFT 可用 teacher forcing，对目标回答的 token 计算交叉熵。", "是否监督提示部分要由训练设计确定。", "不能因为模型在上下文里模仿了示例，就说已经完成微调，也不能用训练损失替代独立任务评价。"], "f": ["L_SFT=-(Σ_t m_t log pθ(y_t|x,y_<t))/(Σ_t m_t)，m_t 指定受监督位置。"], "fq": "为什么 SFT 常把 prompt 或 padding 位置的标签设为忽略？", "fa": "若目标是学习回答，就只在需要预测的回答位置计算损失，排除无效 padding。 prompt 是否监督不是普遍定律，要看数据与目标。 实现还应正确对齐输入和下一 token 标签。", "viz": "learnmodes", "src": "3.1 SFT 监督微调；10.4 八股面经（含答案）", "id": "g6-1"}, {"topic": "微调与压缩", "q": "LoRA 的数学形式、参数量和局限是什么？", "tag": "必背", "key": "LoRA 冻结预训练权重，用两个低秩矩阵的乘积表示更新，再把这个更新加到原线性映射上", "a": ["若输入维度和输出维度都很大，而秩较小，可训练参数明显少于完整矩阵，从而减少梯度和优化器状态。", "它假设任务适配所需的更新可以低秩近似，并不是说原权重本身低秩。", "基座权重和训练激活仍占显存，梯度也需要沿冻结层传播到可训练模块。", "秩、插入位置和数据决定适配能力，不能保证所有任务都与全参数微调等效。"], "f": ["W′=W+(α/r)BA", "A∈R^(r×d_in)，B∈R^(d_out×r)", "新增参数 r(d_in+d_out)。"], "fq": "LoRA 中 A 随机、B=0 时，哪个矩阵先有任务损失梯度？", "fa": "按 ΔW=sBA，令 G 为更新矩阵的梯度，则 ∇B=sGAᵀ，∇A=sBᵀG。 B=0、A 随机时，B 可以先得到非零任务梯度，A 的任务梯度为零。 两者同时为零会使两侧任务梯度都为零。", "viz": "lora", "src": "3.5 PEFT 参数高效微调；10.4 八股面经（含答案）", "id": "g6-2"}, {"topic": "微调与压缩", "q": "训练和推理显存由什么构成，各种节省方法影响哪部分？", "tag": "必背", "key": "训练显存至少包括模型权重、前向保留的激活、梯度和优化器状态，还可能有高精度副本、临时工作区与通信缓冲", "a": ["推理通常不需要梯度和优化器状态，但自回归服务会增加 KV 缓存。", "减小 batch 或序列长度主要降低激活及缓存。", "LoRA 主要减少可训练参数的梯度和优化器状态。", "激活重计算用额外计算换存储。", "FlashAttention 减少注意力中间量。", "估算要声明精度、参数是否可训练和框架设置，不能只拿参数量乘一个固定倍数。"], "f": ["总显存≈权重+激活+梯度+优化器状态+缓存/工作区", "各项随训练或推理设置变化。"], "fq": "一个七十亿参数模型，用两字节存权重，大约需要多少空间？", "fa": "仅权重约十四 GB，按十进制计算。 换成 GiB 数值不同。 完整训练或推理还需额外内存，尤其长上下文缓存和训练激活，因此这不是显卡容量的完整要求。", "viz": "parallel", "src": "10.3 Transformer量化分析计算；3.1 SFT 监督微调", "id": "g6-3"}, {"topic": "微调与压缩", "q": "加权交叉熵如何定义，删除与降权有什么关系？", "tag": "必背", "key": "样本加权交叉熵先计算每条记录的损失，再乘非负权重，最后按权重和归一化", "a": ["权重为零意味着该样本不直接贡献这项损失，介于零和一则降低相对贡献。", "修复还会改变样本内容，和单纯降权不同。", "把所有权重乘同一正数，归一化后的损失不变。", "权重和为零时应跳过或明确拒绝，不能除零。", "样本级权重也不同于接口中的类别权重。", "存在 BatchNorm、对比负例或其他批内耦合时，零权重样本仍可能间接影响训练。"], "f": ["L=(Σ_i w_i CE_i)/(Σ_i w_i)，w_i≥0，Σ_i w_i>0。"], "fq": "为什么 w=0 有时并不等同于物理删除该样本？", "fa": "如果它仍参与批统计、对比学习的分母或随机采样过程，即使直接损失为零，也会影响其他样本。 完全等同需要逐样本损失可分且不存在这些耦合，并控制批量及训练步数。", "src": "10.4 八股面经（含答案）", "id": "g6-4"}, {"topic": "微调与压缩", "q": "PPL 怎样计算，为什么 SFT loss 不能用固定阈值判断好坏？", "tag": "必背", "key": "困惑度是有效预测 token 的平均负对数似然取指数，计算时要固定 tokenizer、文本、上下文窗口和哪些位置计入损失", "a": ["SFT 常只监督回答位置，因此与全序列预训练损失不能直接比。", "更低的训练 loss 可能表示拟合更好，也可能来自更容易的数据、重复、掩码口径或过拟合，没有低于零点五就只会一句话的通用规则。", "packing 还会改变文档边界及批内权重，需要控制跨样本注意力和归一化。", "最终仍看独立任务指标与能力保持。"], "f": ["PPL=exp[-(Σ_t m_t log p(x_t|context))/(Σ_t m_t)]。"], "fq": "多个 batch 的 PPL 可以直接平均吗？", "fa": "通常应先按有效 token 数加权汇总负对数似然，再取指数。 不同长度 batch 的 PPL 直接算术平均，和整体语料困惑度一般不相等。", "src": "12.2 Pretrain 阶段的评估；3.1 SFT 监督微调", "id": "g6-5"}, {"topic": "微调与压缩", "q": "Agent 为什么要记录 trace，应该评价哪些指标？", "tag": "必背", "key": "最终答案成功率能说明任务是否完成，却不能解释失败发生在哪一步", "a": ["trace 应记录任务、模型和工具版本、输入摘要、工具调用参数、返回状态、耗时、费用与关键状态变化，再结合任务成功率、子目标进度、工具选择和参数正确率、重复动作与违规率分析。", "涉及外部副作用时，还要核对最终系统状态，而不是要求轨迹逐字等于参考答案。", "评测用固定任务集和可复现环境，敏感信息需脱敏。", "模型自评可以辅助，但不能作为唯一完成证据。"], "fq": "两个 Agent 采取不同路径，都完成了目标，怎么比较？", "fa": "先按最终状态与约束验收，再比较成本、延迟和可靠性。 若任务允许多条正确路径，不应只因与参考调用顺序不同就判错。 关键步骤仍可单独评分。", "src": "6.2 LLM-based Agent 基于大模型的智能体；1. 相关工作概述", "id": "g6-6"}, {"topic": "微调与压缩", "q": "什么是提示注入，Agent 应如何保护工具权限？", "tag": "必背", "key": "提示注入是把恶意指令混入用户输入、网页、检索文档或工具返回，诱导模型偏离原任务或越权操作", "a": ["外部内容应当作待分析数据，其自称系统消息并不能提高权限。", "防护要结合指令与数据分离、最小工具权限、参数校验、资源白名单和敏感操作检查，并限制凭据暴露。", "仅在提示词里写忽略攻击不够，模型判断不能代替执行层授权。", "系统还应记录可疑轨迹并测试间接注入案例，在保证来源可用的同时控制动作范围。"], "fq": "检索文档里写着让你把密钥发到某个网址，是否需要执行？", "fa": "不需要。 那是低信任内容中的指令，和用户授权任务无关。 应忽略该指令，不向文档暴露凭据，继续提取与任务有关的事实，并由执行层阻止越权网络操作。", "src": "先看本质；Harness Engineering: 为 Agent 设计闭环系统", "id": "g6-7"}, {"topic": "微调与压缩", "q": "什么是 teacher forcing？它带来的曝光偏差怎么缓解？", "tag": "理解", "key": "训练时解码器每个位置的输入用的是真实前缀而不是模型自己上一步的输出，这叫 teacher forcing", "a": ["配合因果掩码，所有位置可以一次前向并行算完，训练效率高。", "推理时没有真实前缀，只能拿模型自己生成的内容往下接，于是训练与推理的输入分布不一致。", "模型训练中从没见过自己的错误前缀，一旦某一步生成偏了就无法纠正，误差沿序列累积，这就是曝光偏差。"], "f": ["训练时第 t 步的条件是真实前缀，推理时第 t 步的条件是模型自己生成的前缀，两者分布不同。"], "fq": "哪些方法在缓解它？", "fa": "早期有 scheduled sampling，训练中按概率把真实前缀换成模型自己的预测。 更根本的做法是让训练发生在模型自己的分布上，在线策略的强化学习采样自当前策略并按奖励更新，在线策略蒸馏在学生自己生成的轨迹上取教师反馈。 DPO 是离线的，只在给定的偏好对上优化，无法覆盖策略跑偏后的状态，这也是它与在线 RL 的主要差别之一。", "id": "g6-8"}, {"topic": "微调与压缩", "q": "SFT 数据的质量和数量哪个更重要？怎样做数据筛选？", "tag": "理解", "key": "在指令微调阶段质量明显更重要", "a": ["少量高质量、多样化的样本即可激活预训练中已有的能力，而大量低质量数据会引入风格噪声与事实错误。", "筛选维度包括指令的复杂度与多样性、回答的正确性与完整性、指令与回答的相关性、以及样本之间的去重。", "可用方法有大模型打分、基于梯度或影响函数估计单样本对验证损失的贡献、用嵌入聚类保证覆盖度。", "需要注意打分模型自身的偏好会引入选择偏置，例如偏好长回答。"], "f": ["影响函数近似认为某样本的贡献正比于其梯度与验证集梯度的内积。"], "id": "g6-9"}, {"topic": "微调与压缩", "q": "训练后量化和量化感知训练有什么区别？GPTQ 与 AWQ 的思路是什么？", "tag": "必背", "key": "训练后量化直接在已训练模型上确定量化参数，只需少量校准数据，成本低但低比特下精度损失明显", "a": ["量化感知训练在训练中插入伪量化算子，用直通估计回传梯度，让模型适应量化误差，精度更高但需要完整训练流程。", "GPTQ 做逐层重建误差最小化，沿用 OBQ 的二阶误差补偿，但放弃了 OBQ 按海森信息贪心挑选下一个权重的顺序策略，改成所有行按同一个固定顺序逐列量化，论文称之为任意顺序洞察。", "固定顺序让未量化集合与海森逆对所有行共用，复杂度大幅下降。", "每量化完一列，再用海森逆把该列的量化误差补偿到尚未量化的列上。", "AWQ 观察到少数激活幅值大的通道对精度影响远超其余，通过按通道缩放把这些重要通道的权重放大再量化，等价于保护显著权重，无需反向传播即可在四比特下保持精度。"], "f": ["对称均匀量化的缩放因子等于张量绝对值最大值除以量化上限所得的商，反量化等于整数值乘以缩放因子。"], "fq": "KV 缓存量化有什么特殊之处？", "fa": "KV 缓存是逐 token 动态生成的激活，分布随内容变化，不能像权重那样离线标定。 通常按通道或按 token 分组做动态量化，键对量化误差比值更敏感，常给键更高比特。 异常值通道需要单独保留高精度，否则长上下文下误差累积明显。", "viz": "quant", "id": "g6-10"}, {"topic": "微调与压缩", "q": "知识蒸馏有哪几种形式？温度起什么作用？", "tag": "理解", "key": "响应蒸馏让学生拟合教师的软标签概率分布，软标签包含类间相似结构，信息量大于硬标签", "a": ["特征蒸馏对齐中间层表示，需要维度映射。", "关系蒸馏对齐样本之间的相似度结构而非单点输出。", "在大模型上还有序列级蒸馏，直接用教师生成的文本做学生的监督数据，以及在线策略蒸馏，让学生自己生成、教师逐 token 打分反馈，避免学生只在教师分布上训练而在自己分布上失准的偏移问题。", "温度用于软化概率分布，温度越高分布越平滑，类间相对关系越突出，梯度需要乘以温度平方来补偿尺度。"], "f": ["蒸馏损失等于温度平方乘以学生与教师软分布的 KL 散度，通常再与真实标签的交叉熵加权求和。"], "fq": "为什么在线策略蒸馏比离线序列蒸馏更有效？", "fa": "离线蒸馏的训练数据来自教师分布，学生在推理时走的是自己的分布，一旦偏离就没有监督信号，误差累积。 在线策略蒸馏在学生自己生成的轨迹上取教师反馈，监督信号覆盖学生实际会遇到的状态，缓解了这种分布不匹配。", "id": "g6-11"}, {"topic": "微调与压缩", "q": "结构化剪枝和非结构化剪枝的取舍是什么？", "tag": "理解", "key": "非结构化剪枝按权重重要性逐元素置零，理论压缩率高，但产生不规则稀疏，通用硬件无法直接加速，需要专门的稀疏算子或特定稀疏模式支持", "a": ["结构化剪枝整体删除注意力头、前馈通道、甚至整层，得到的仍是稠密小模型，可以直接获得实际加速，但同样稀疏率下精度损失更大。", "半结构化的 N 比 M 稀疏是折中，在每 M 个连续权重中保留 N 个非零，能被特定硬件加速。", "剪枝后通常需要少量微调恢复精度。"], "f": ["重要性常用权重绝对值与对应激活范数的乘积估计，也可用损失对该权重的二阶敏感度近似。"], "fq": "大模型时代剪枝为什么不如量化流行？", "fa": "大模型的瓶颈主要在显存带宽与容量，量化对这两者都直接见效且几乎不损精度。 剪枝要达到可观压缩率往往需要恢复训练，成本高，且结构化剪枝在大模型上精度损失明显。 实践中量化是首选，剪枝多用于特定部署约束。", "id": "g6-12"}, {"topic": "微调与压缩", "q": "大模型作为评判者有哪些系统性偏置？", "tag": "理解", "key": "位置偏置指对先出现的候选打分偏高，缓解办法是交换顺序各评一次取平均", "a": ["长度偏置指偏好更长的回答，缓解办法是控制长度或在提示中明确要求不以长度判断。", "自我偏好指模型偏好自己或同族模型生成的文本。", "格式偏置指偏好带列表与标题的结构化输出。", "还有分数分布集中，多数样本被打成中间值，区分度低，改用成对比较可以缓解。", "使用前应在有人工标注的子集上校准，报告评判者与人类的一致率。"], "f": ["一致率可用 Cohen kappa 衡量，扣除随机一致后的净一致程度。"], "id": "g6-13"}, {"topic": "对齐与分布式推理", "q": "有 SFT 为什么还做偏好优化，怎样选择 SFT、DPO 或在线 RL？", "tag": "必背", "key": "SFT 学习示范输出，适合把明确的任务格式和正确行为教给模型，但单个示范未必表达多个可接受答案之间的偏好", "a": ["标准离线 DPO 使用同一提示下的优劣回答对，适合已有可靠比较数据的情形。", "在线 RL 通过当前策略采样，结合环境或奖励反馈探索新输出，但成本通常更高。", "选择应从反馈来源、覆盖范围、可验证性和计算预算出发。", "偏好噪声、基础能力不足和奖励错位都可能限制效果，所以不能把后训练理解成按固定顺序叠加越多越好。"], "fq": "某个错误 SFT 没改好，DPO 就一定能改好吗？", "fa": "不一定。 先判断是能力、知识、数据覆盖还是偏好排序问题。 若没有正确候选或可靠偏好，DPO 也可能没有足够监督。 应对具体 bad case 做同预算对照。", "src": "10.4 八股面经（含答案）", "id": "g7-1"}, {"topic": "对齐与分布式推理", "q": "PPO 的概率比率、优势与 clip 目标分别起什么作用？", "tag": "必背", "key": "PPO 用当前策略相对于收集样本的旧策略的概率比率，对优势进行加权更新", "a": ["优势为正的动作应更可能出现，优势为负的动作应被抑制。", "裁剪目标取未裁剪与裁剪项的较小值，在更新过度沿有利方向推进时停止增加该项收益，从而降低一次更新过大的风险。", "它允许一批采样做多轮小批量优化，但样本过旧仍有问题。", "clip 不是把全部概率变化硬截断，也不保证真实 KL 永远低于某个阈值，实际仍要监控分布偏移。"], "f": ["r_t(θ)=πθ(a_t|s_t)/πold(a_t|s_t)", "Lclip=E[min(r_t A_t,clip(r_t,1-ε,1+ε)A_t)]。"], "fq": "为什么一定是取 min，而不是总把比率截断以后乘优势？", "fa": "min 对正负优势都构造较保守的目标。 只对比率做无条件替换会改变某些方向的梯度，和原 PPO 裁剪目标不等价。 应分别检查 A 为正与为负时的分段情况。", "viz": "ppo", "src": "3.2 RL 强化学习基础；3.3 RLHF 基于人类反馈的强化学习", "id": "g7-2"}, {"topic": "对齐与分布式推理", "q": "DPO 的参考策略、偏好对与损失怎样解释？", "tag": "必背", "key": "DPO 对同一提示下的优选和劣选回答，比较它们相对于参考策略的序列对数概率提升，再用逻辑损失推动优选回答占优", "a": ["参考策略提供相对变化的基准，避免只比较当前模型的绝对概率。", "标准形式无需在训练时单独拟合奖励模型，也不需要像 PPO 那样每步在线采样，但仍依赖偏好对质量与覆盖。", "序列概率应按有效回答 token 求和，提示与 padding 的口径要统一。", "随意改成长度平均会改变目标，不能当作原始公式的无影响实现细节。"], "f": ["Δ=log[πθ(y+|x)/πref(y+|x)]-log[πθ(y-|x)/πref(y-|x)]", "L=-log σ(βΔ)。"], "fq": "DPO 可以只不断降低劣选回答的概率吗？", "fa": "损失主要约束相对差值，并不单独保证优选回答的绝对概率必然上升。 因此要检查实际生成行为、优选概率和能力保持，不能只看训练偏好准确率。", "viz": "dpo", "src": "3.4 DPO 直接偏好优化；10.4 八股面经（含答案）", "id": "g7-3"}, {"topic": "对齐与分布式推理", "q": "GRPO 怎样构造组内优势，奖励怎样避免被投机利用？", "tag": "必背", "key": "GRPO 对同一提示采样多条输出，利用组内奖励的相对位置构造优势，减少对独立价值模型的依赖", "a": ["常见做法是奖励减组均值，再按组标准差归一化。", "若同组奖励完全相同，奖励部分没有区分信号。", "增加一个小常数只能避免除零，不能创造有效反馈。", "需要独立评测、失败样本和盲听检查，因为策略可能提高奖励分数却降低实际质量。"], "f": ["A_i=(R_i-mean(R))/(std(R)+ε)", "同组 R_i 相等时 A_i=0。"], "fq": "组内优势全为零，是否表示任何参数更新都必然为零？", "fa": "不一定。 奖励加权的策略梯度没有区分信号，但实现中若还有 KL 正则、辅助损失或其他非零项，仍可能更新。 应分别检查各损失项，而不是只看总 loss。", "viz": "grpo", "src": "3.3 RLHF 基于人类反馈的强化学习；10.4 八股面经（含答案）", "id": "g7-4"}, {"topic": "对齐与分布式推理", "q": "old policy、reference、reward model 与 critic 的角色分别是什么？", "tag": "必背", "key": "old policy 是生成本批训练样本的策略，用于计算新旧动作概率比", "a": ["reference 是参考策略，用于限制偏离。", "reward model 为结果或过程评分。", "critic 估计状态价值，辅助计算优势和长期收益。", "四者功能不同，不能因为初始权重相同就混称。", "PPO 常用 critic，GRPO 利用组内相对奖励减少独立价值模型需求。", "旧策略会随采样批次更新，参考策略可长期固定。", "删除参考 KL 项也不会自动产生最大熵目标。"], "fq": "old policy 与 reference 都不更新，为什么还要区分？", "fa": "old policy 通常随采样批次更新，是本批 rollout 的行为策略。 reference 可以长期固定。 前者处理采样分布校正，后者定义参考约束，生命周期和数学作用不同。", "viz": "rlhf", "src": "3.3 RLHF 基于人类反馈的强化学习；10.4 八股面经（含答案）", "id": "g7-5"}, {"topic": "对齐与分布式推理", "q": "Agent 链路很慢，如何判断该并行、缓存还是减少调用？", "tag": "必背", "key": "先按 trace 拆分模型推理、工具执行、网络和等待时间，再画出真实依赖", "a": ["相互独立的只读查询可以并行，有前置状态依赖的操作不能硬并行。", "固定重复子流程可下沉成确定性服务，减少模型决策轮数。", "稳定查询结果可以带版本和有效期缓存。", "长工具输出则保留摘要与引用，控制上下文。", "优化需要比较端到端成功率与尾延迟，不能为速度跳过验证。", "也不能把旧缓存用于已经变化的业务状态，或重复执行有副作用的操作。"], "fq": "有四个工具，是不是每轮同时调用四个最省时间？", "fa": "不是。 先确认是否都需要、是否相互独立及是否有共享写状态。 并行可以缩短独立任务的关键路径，但无用调用会增加成本，依赖错误还会降低正确性。", "src": "10.4 八股面经（含答案）", "id": "g7-6"}, {"topic": "对齐与分布式推理", "q": "XGBoost 如何利用一阶和二阶信息，怎样处理复杂度和缺失值？", "tag": "必背", "key": "XGBoost 在当前模型附近对损失做二阶展开，用样本的一阶梯度和 Hessian 汇总计算叶子权重及分裂收益，并加入树复杂度和叶权重正则", "a": ["它还利用分桶、稀疏感知等工程设计提高效率。", "训练时可为缺失值学习分裂的默认方向，不等于恢复该字段的真实值。", "Boosting 轮次仍需顺序推进，并行主要发生在统计或分裂搜索等环节。", "二阶信息和正则也不保证任何数据上都优于其他方法，仍要调参并控制相同评测条件。"], "f": ["固定叶结构、仅L2时：w_j*=-G_j/(H_j+λ)", "G_j=Σ_i g_i，H_j=Σ_i h_i。"], "fq": "缺失值学到默认方向，能否声称完成了数据修复？", "fa": "不能。 它是预测模型内部的路由策略，不输出或证明缺失字段的真实内容。 讨论数据质量与修复正确率时，应把这种模型容错和显式修复区分。", "viz": "gbdt", "src": "10.6 机器学习深度学习八股（初稿）", "id": "g7-7"}, {"topic": "对齐与分布式推理", "q": "KV 缓存占多少显存？给个算例。", "tag": "必背", "key": "每个 token 在每一层要存键和值两份，每份是键值头数乘以头维", "a": ["乘上层数、序列长度、批大小与每个数的字节数，就是总占用。", "用 MHA 的 7B 模型举例，层数 32、键值头数 32、头维 128、半精度每个数 2 字节，每 token 每层是 2 乘 32 乘 128 乘 2，等于 16 KB，乘 32 层得每 token 512 KB。", "4096 长度的一条序列就要 2 GiB，批大小 8 是 16 GiB，而这个模型的半精度权重约 13 GiB，缓存已经比权重还大。", "换成键值头数为 8 的 GQA，这个数直接降到四分之一。"], "f": ["缓存字节数等于 2 乘层数乘键值头数乘头维乘批大小乘序列长度乘每数字节数。"], "fq": "除了换 GQA 还有什么办法降？", "fa": "缓存量化到 8 比特或 4 比特，键对误差更敏感通常给更高比特。 用 MLA 把键值压到低维隐空间只存隐向量。 滑动窗口只保留最近若干 token 加上开头几个作为注意力汇聚点。 用 PagedAttention 消除预留浪费并让相同前缀共享块。", "viz": "heads", "id": "g7-8"}, {"topic": "对齐与分布式推理", "q": "MoE 的路由怎样工作？负载不均衡会造成什么后果，怎样缓解？", "tag": "必背", "key": "MoE 把前馈层替换成多个专家，路由网络对每个 token 计算各专家的打分，取 top-k 个激活并按归一化权重加权求和", "a": ["参数总量随专家数增长，但每个 token 的计算量只和 k 有关，因此实现参数扩展与计算解耦。", "负载不均衡指少数专家被大量 token 选中而其余闲置，后果是这些专家所在设备成为瓶颈，超出容量的 token 被丢弃或走残差直连，训练信号损失且质量下降。", "缓解手段包括辅助负载均衡损失、专家容量因子加溢出处理、路由加噪增加探索，以及 DeepSeek-V3 的无辅助损失方案。", "该方案给每个专家配一个偏置加到亲和度打分上，偏置只影响 top-k 选择，不进入最终的加权系数。", "每个训练步结束后，过载专家的偏置减去固定步长，欠载专家的偏置加上固定步长，按规则更新而不靠梯度。", "共享专家始终激活，负责通用能力，其余路由专家负责专精，减少知识冗余。"], "f": ["负载均衡损失等于专家数乘以各专家实际分配比例与路由概率均值的内积。理想均衡时该值等于一。"], "fq": "MoE 推理的瓶颈和稠密模型有什么不同？", "fa": "稠密模型解码阶段受显存带宽限制。 MoE 参数量大但激活稀疏，显存占用按总参数计而带宽按激活参数计，因此显存容量压力大而算力利用率低。 分布式部署时专家并行引入全对全通信，批内 token 路由分散会放大通信开销，需要做专家放置优化与批内路由聚合。", "viz": "moe", "id": "g7-9"}, {"topic": "对齐与分布式推理", "q": "数据并行、张量并行、流水线并行、专家并行各切分什么？怎样组合？", "tag": "必背", "key": "数据并行切分样本，每张卡持有完整模型副本，反向后对梯度做全归约，通信量与参数量成正比", "a": ["张量并行切分单层内的权重矩阵，前向与反向在层内做全归约，通信频繁且对带宽敏感，通常限制在单机内的高速互联域。", "流水线并行按层切分模型，不同卡负责不同阶段，通过微批次流水填充减少空泡，通信量小但存在气泡损失且显存在各阶段不均。", "专家并行把 MoE 的专家分散到不同卡，引入全对全通信。", "实际训练采用三维或四维组合，机内用张量并行与专家并行，机间用流水线并行与数据并行，按互联带宽从高到低分配通信最密集的维度。"], "f": ["流水线气泡比例约等于阶段数减一，除以微批次数加阶段数减一所得的商。增大微批次数可压低气泡。"], "fq": "ZeRO 的三个阶段分别切什么？", "fa": "阶段一切优化器状态，阶段二再切梯度，阶段三再切参数。 显存随并行度线性下降，代价是阶段三在前向反向时需要按需收集参数，通信量增加。 ZeRO 属于数据并行的显存优化，不改变计算切分方式。", "viz": "parallel", "id": "g7-10"}, {"topic": "对齐与分布式推理", "q": "prefill 和 decode 阶段的瓶颈分别是什么？连续批处理为什么有效？", "tag": "必背", "key": "prefill 一次处理整个提示，矩阵乘法规模大，算力利用率高，受算力限制", "a": ["decode 每步只产生一个 token，权重读取量与计算量之比极高，受显存带宽限制，批大小小时 GPU 大量空闲。", "连续批处理不等整批请求都结束才换批，而是在每个解码步动态加入新到达的请求、移出已完成的请求，使批内始终保持较高的有效并发。", "这把带宽受限阶段的权重读取分摊到更多请求上，吞吐显著提升，同时因为新请求不必排队等待整批结束，首 token 延迟也下降。"], "f": ["算术强度等于浮点运算次数与访存字节数之比。decode 阶段该比值接近批大小，因此提高批大小直接提高利用率。"], "fq": "PagedAttention 解决什么问题？", "fa": "解决 KV 缓存的显存碎片与预留浪费。 传统实现按最大长度为每个请求预留连续显存，实际长度远小于上限时浪费严重。 PagedAttention 借鉴虚拟内存分页，把缓存切成固定大小的块，按需分配并用页表索引，显存利用率大幅提高，还使多个请求共享相同前缀的块成为可能。", "viz": "heads", "id": "g7-11"}, {"topic": "对齐与分布式推理", "q": "投机解码为什么能加速？它会改变输出分布吗？", "tag": "必背", "key": "草稿模型快速生成若干候选 token，目标模型对这几个位置做一次并行前向即可拿到全部位置的概率，再逐位置做接受或拒绝判定", "a": ["加速来源于把多个串行的带宽受限步骤合并成一次并行前向，而一次前向处理多个位置几乎不增加时间。", "接受采样的设计保证最终输出分布与直接用目标模型采样完全一致，因此不损失质量。", "加速比取决于接受率，接受率由草稿与目标模型的分布接近程度决定，草稿模型太弱则频繁拒绝，收益消失。"], "f": ["接受概率取目标概率与草稿概率之比与一的较小者。拒绝时从两者之差的正部归一化后重采样，保证边缘分布不变。"], "fq": "除了小模型做草稿还有什么变体？", "fa": "自投机用同一模型跳层或早退出产生草稿。 Medusa 在模型上加多个预测头一次预测多个未来位置。 前瞻解码用雅可比迭代并行求解多个位置。 还可以用 n-gram 缓存直接从历史文本中检索候选，对重复性强的场景特别有效。", "viz": "specdec", "id": "g7-12"}, {"topic": "其他", "q": "什么时候用多 Agent，为什么多个角色不一定更好？", "tag": "必背", "key": "它能隔离上下文并利用不同工具，但增加通信、重复工作和状态一致性成本", "a": ["若任务很短或步骤固定，单 Agent 加工作流可能更简单。", "任务分配应明确输入输出、责任、共享状态和验收标准，避免多个 Agent 同时修改同一对象。", "多角色互相赞同也不代表独立证据，最终仍要依据真实数据和执行结果。"], "fq": "如何避免两个 Agent 重复调用同一个昂贵工具？", "fa": "共享任务状态、去重键和结果缓存，明确子任务边界。 需要写状态的步骤通过单一协调者或明确的并发控制执行。 先看依赖与资源，不只给角色起不同名字。", "src": "6.2 LLM-based Agent 基于大模型的智能体；先看本质", "id": "g8-1"}, {"topic": "生成模型", "q": "残差向量量化（RVQ）怎样工作？相比单码本有什么优势？", "tag": "必背", "key": "单码本要达到 N 比特精度需要 2 的 N 次方个条目，参数量与查找开销随比特数指数增长", "a": ["RVQ 把量化拆成多级，第一级量化原向量并输出索引，随后计算残差，第二级量化该残差，依此类推，最终重建是各级码字之和。", "K 个码本各含 M 条目，等效容量为 M 的 K 次方，但存储只有 K 乘以 M。", "另一个好处是天然支持可变码率，推理时只用前若干级即可得到粗糙但可用的重建，这被称为量化器丢弃训练，使同一模型覆盖多个码率点。"], "f": ["重建向量等于各级码字之和。第 k 级的输入是原向量减去前 k 减 1 级码字之和得到的残差。"], "fq": "码本坍缩指什么，怎样缓解？", "fa": "坍缩指大部分码字从不被选中，有效码本远小于名义大小，量化误差居高不下。 缓解手段包括码字的指数滑动平均更新、对长期未使用的码字做随机重启、码本与输入都做 L2 归一化后按余弦距离查找、加入多样性或熵正则鼓励均匀使用。 DAC 采用因子分解降维查找并配合归一化，显著提升利用率。", "id": "g9-2"}, {"topic": "生成模型", "q": "向量量化不可导，训练时梯度怎样回传？", "tag": "必背", "key": "用直通估计", "a": ["前向传播输出量化后的码字，反向传播时把量化算子当作恒等映射，直接把解码器传来的梯度复制给编码器输出。", "为了让码本靠近编码器输出、编码器输出也不要漂离码本，额外加两项损失，一项更新码本使其逼近编码器输出，另一项是承诺损失约束编码器输出靠近所选码字，后者带系数。", "工程实现常用指数滑动平均更新码本替代梯度更新，更稳定。"], "f": ["量化输出写作编码器输出加上码字减去编码器输出后再取停止梯度的差。承诺损失等于系数乘以编码器输出与停止梯度后码字之差的平方范数。"], "fq": "承诺损失系数取太大或太小会怎样？", "fa": "太小则编码器输出自由漂移，码本追不上，量化误差增大且训练不稳。 太大则编码器被过度约束，表达能力受限，重建质量下降。 常用取值在 0.25 附近。", "id": "g9-3"}, {"topic": "生成模型", "q": "FSQ 相比 RVQ 有什么不同？为什么有人用它替代 VQ？", "tag": "理解", "key": "有限标量量化不维护显式码本，而是把隐向量投影到很低的维度，对每个维度做固定网格的标量四舍五入，隐式码本大小等于各维度取值数的连乘", "a": ["它没有码本更新过程，因此不存在坍缩问题，也不需要承诺损失，实现简单且利用率接近满。", "代价是码字分布受限于规则网格，在同等容量下重建质量通常略逊于精心训练的 RVQ，并且维度必须压得很低。"], "f": ["隐式码本大小等于各维度量化级数的连乘。例如 6 维每维 8 级得到 8 的 6 次方，即 262144。"], "fq": "什么场景下优先考虑 FSQ？", "fa": "训练不稳定、码本利用率长期偏低，或者希望简化工程链路时。 生成式建模里若下游只需要离散序列而不追求极限保真，FSQ 的稳定性收益往往超过质量损失。", "id": "g9-5"}, {"topic": "生成模型", "q": "无分类器引导（CFG）怎样工作？引导强度越大越好吗？", "tag": "必背", "key": "训练时以一定概率丢弃条件，使同一模型同时学会条件生成和无条件生成", "a": ["采样时把两路预测做外推，得到强化条件方向的预测。", "引导强度控制外推幅度。", "强度过小则条件相关性弱，文本描述得不到体现。"], "f": ["引导后的预测等于无条件预测，加上引导系数乘以条件预测与无条件预测之差。"], "fq": "除了调强度还有什么办法改善条件遵循？", "fa": "用动态引导，在采样早期用大强度确定整体结构，后期减小以保留细节。 或者引入负向提示，把不想要的属性作为额外的无条件分支。 也可以在数据侧提高描述质量与覆盖度，从根本上减少对强引导的依赖。", "id": "g9-9"}, {"topic": "生成模型", "q": "DDPM 的前向与反向过程是什么？预测噪声、预测原图、预测速度三种参数化有什么区别？", "tag": "必背", "key": "前向过程按预定方差表逐步加高斯噪声，任意步的边缘分布可以闭式写出，训练时可直接采样任意时刻而不必迭代", "a": ["反向过程学习逐步去噪，训练目标简化为预测所加噪声的均方误差。", "三种参数化的差别体现在高低噪声两端。", "预测噪声在低噪声区表现好。", "到了高噪声区，输入几乎全是噪声，预测噪声近乎平凡，而由预测的噪声反推原图要除以累积保留系数的平方根，该系数趋近零，预测误差被成倍放大。", "预测原图正好相反，在高噪声区数值稳定，在低噪声区输入几乎就是原图，目标近乎平凡，反推噪声要除以一减该系数后的平方根，误差同样被放大。", "预测速度是两者的线性组合，在高低噪声两端都不会退化成平凡目标，训练更稳定，也便于少步采样与蒸馏，Progressive Distillation 正是为此改用速度参数化。", "流匹配回归的目标同样是速度场，只是概率路径的定义不同。"], "f": ["任意步的样本等于累积保留系数的平方根乘以原样本，加上一减该系数后的平方根乘以标准高斯噪声。速度参数化的目标等于该系数平方根乘以噪声，减去一减该系数的平方根乘以原样本。"], "fq": "DDIM 相比 DDPM 快在哪？", "fa": "DDIM 把采样改成确定性的非马尔可夫过程，允许跳步，用远少于训练步数的步数完成采样，且同一初始噪声对应确定输出，便于做插值与可控编辑。 代价是多样性略低于随机采样。", "viz": "diffusion", "id": "g9-14"}, {"topic": "生成模型", "q": "DiT 相比 UNet 有什么优势？条件怎样注入？", "tag": "理解", "key": "DiT 把隐空间切成 patch 序列用 Transformer 处理，去掉了 UNet 的卷积归纳偏置", "a": ["优势是扩展性好，模型规模与计算量增加时质量持续提升且规律可预测，便于套用语言模型成熟的并行训练与优化经验。", "条件注入主流做法是自适应层归一化，把时间步与类别或文本嵌入映射成归一化层的缩放和平移参数，再加上一个门控系数控制残差分支强度，这种方式比直接拼接 token 或交叉注意力更参数高效。", "对长文本条件仍会保留交叉注意力。"], "f": ["自适应归一化写作，输出等于归一化后的特征乘以由条件预测的缩放，加上由条件预测的平移，残差分支再乘以由条件预测的门控。"], "fa": "Seed-Music 与 Stable Audio 一类系统都采用扩散 Transformer 生成连续隐变量。", "id": "g9-15"}, {"topic": "生成模型", "q": "VAE、VQ-VAE、VQGAN 的关系是什么？", "tag": "理解", "key": "VAE 学习连续隐变量的后验分布，用重参数化技巧采样，损失为重建误差加隐分布与先验的 KL 散度", "a": ["问题是重建偏模糊，KL 项过强时还会出现后验坍缩。", "VQ-VAE 把隐空间换成离散码本，用最近邻查找替代采样，避免了 KL 项与后验坍缩，且离散序列可以交给自回归先验建模，但仅用重建损失时细节仍然不足。", "VQGAN 在 VQ-VAE 上加入对抗损失与感知损失，让解码器生成锐利纹理，使离散隐空间在高分辨率上可用，成为后续离散生成模型的标准组件。"], "f": ["VAE 损失等于重建负对数似然，加上后验与先验的 KL 散度。VQ-VAE 把 KL 项换成码本损失与承诺损失。"], "fq": "为什么生成模型普遍要先压到隐空间再建模？", "fa": "原始信号维度高且大量容量被感知无关的细节占据。 先用自编码器压缩掉这些细节，让生成模型专注于语义与结构层面的分布，显著降低计算量并提升生成质量。", "id": "g9-16"}, {"topic": "分词", "q": "什么是 BPE？", "tag": "定义", "key": "从字符或字节出发，反复统计相邻符号对的频次，把最高频的一对合并成新符号，直到词表达到目标大小", "a": ["从字符或字节出发，反复统计相邻符号对的频次，把最高频的一对合并成新符号，直到词表达到目标大小。", "字节级 BPE 以字节为初始单元，不会出现未登录词。", "分词粒度决定序列长度，直接影响训练与推理成本。"], "terms": ["BPE"], "id": "d1"}, {"topic": "评估", "q": "什么是 困惑度 PPL？", "tag": "定义", "key": "对数似然取负后按 token 平均再取指数，衡量模型对文本的预测不确定性", "a": ["对数似然取负后按 token 平均再取指数，衡量模型对文本的预测不确定性。", "只能在同一 tokenizer 与同分布语料上横比，不能跨模型直接比较，也不反映指令遵循质量。"], "terms": ["困惑度 PPL"], "id": "d2"}, {"topic": "评估", "q": "什么是 BLEU 与 ROUGE？", "tag": "定义", "key": "BLEU 看生成里有多少 n-gram 出现在参考里（偏准确率），ROUGE 看参考里有多少被生成覆盖（偏召回）", "a": ["BLEU 看生成里有多少 n-gram 出现在参考里（偏准确率），ROUGE 看参考里有多少被生成覆盖（偏召回）。", "都依赖字面重叠，对同义改写不敏感，开放生成任务上与人评相关性弱。"], "terms": ["BLEU 与 ROUGE"], "id": "d3"}, {"topic": "评估", "q": "什么是 检索指标 mAP、Recall@K、MRR？", "tag": "定义", "key": "mAP 衡量整体排序质量，Recall@K 看前 K 个里召回了多少相关项，MRR 是第一个正确结果排名倒数的平均", "a": ["mAP 衡量整体排序质量，Recall@K 看前 K 个里召回了多少相关项，MRR 是第一个正确结果排名倒数的平均。"], "terms": ["检索指标 mAP、Recall@K、MRR"], "id": "d4"}, {"topic": "评估", "q": "什么是 LLM-as-judge？", "tag": "定义", "key": "用大模型给生成结果打分或做成对比较", "a": ["用大模型给生成结果打分或做成对比较。", "存在位置偏置、长度偏置、自我偏好与格式偏置。", "用前需在人工标注子集上校准并报告一致率。"], "terms": ["LLM-as-judge"], "id": "d5"}, {"topic": "数据", "q": "什么是 去重？", "tag": "定义", "key": "精确去重用哈希或指纹，近重复用嵌入近邻或 MinHash", "a": ["精确去重用哈希或指纹，近重复用嵌入近邻或 MinHash。", "重复数据让模型反复看到同一内容，表现为生成趋同与评测虚高。"], "terms": ["去重"], "id": "d6"}, {"topic": "数据", "q": "什么是 配比 Data Mixture？", "tag": "定义", "key": "不同来源、领域、质量档在训练集里的混合比例", "a": ["不同来源、领域、质量档在训练集里的混合比例。", "常用小规模代理实验扫描后外推，或按各组损失下降速度在线调权。", "评测集必须覆盖所有分组，否则配比会被优化到只利于头部。"], "terms": ["配比 Data Mixture"], "id": "d7"}, {"topic": "数据", "q": "什么是 课程学习？", "tag": "定义", "key": "按难度或质量排序，先易后难或先高质量后全量", "a": ["按难度或质量排序，先易后难或先高质量后全量。", "在数据质量参差时收益明显。", "风险是排序信号本身有偏，把某类数据系统性推后。"], "terms": ["课程学习"], "id": "d8"}, {"topic": "数据", "q": "什么是 数据选择？", "tag": "定义", "key": "在预算约束下挑选对下游任务收益最大的子集", "a": ["在预算约束下挑选对下游任务收益最大的子集。", "单一质量分数容易与任务目标错配，实践中用互补的多路信号。", "验证收益必须用等预算对照实验，固定样本量与训练步数。"], "terms": ["数据选择"], "id": "d9"}, {"topic": "数据", "q": "什么是 长尾分布？", "tag": "定义", "key": "少数类别占据大部分样本，多数类别样本极少", "a": ["少数类别占据大部分样本，多数类别样本极少。", "直接按自然分布训练会让头部主导，尾部条件遵循弱。", "可用温度采样把类别概率取幂压平，评价时必须分组报告。"], "terms": ["长尾分布"], "id": "d10"}, {"topic": "归一化", "q": "什么是 LayerNorm 与 BatchNorm？", "tag": "定义", "key": "LayerNorm 在单个样本的特征维上算均值方差，BatchNorm 在批次维上算并维护滑动统计", "a": ["LayerNorm 在单个样本的特征维上算均值方差，BatchNorm 在批次维上算并维护滑动统计。", "LayerNorm 与批大小无关且训练推理行为一致，适合变长序列。", "BatchNorm 在小批量和序列任务上不稳。"], "terms": ["LayerNorm 与 BatchNorm"], "id": "d11"}, {"topic": "归一化", "q": "什么是 RMSNorm？", "tag": "定义", "key": "只用均方根缩放，去掉减均值与平移", "a": ["只用均方根缩放，去掉减均值与平移。", "比 LayerNorm 少一次归约与一组参数，质量相当，是当前大模型默认。"], "terms": ["RMSNorm"], "id": "d12"}, {"topic": "归一化", "q": "什么是 Pre-Norm 与 Post-Norm？", "tag": "定义", "key": "Pre-Norm 把归一化放在子层输入侧，Post-Norm 放在残差相加之后", "a": ["Pre-Norm 把归一化放在子层输入侧，Post-Norm 放在残差相加之后。", "Pre-Norm 的残差路径是恒等通路，深层训练稳定，不必复杂预热。", "Post-Norm 表达力略强但深层易梯度消失。"], "terms": ["Pre-Norm 与 Post-Norm"], "id": "d13"}, {"topic": "激活", "q": "什么是 GELU、Swish、SwiGLU？", "tag": "定义", "key": "GELU 用高斯累积分布做平滑门控，Swish 是输入乘自身 sigmoid，SwiGLU 是用 Swish 做门的门控线性单元", "a": ["GELU 用高斯累积分布做平滑门控，Swish 是输入乘自身 sigmoid，SwiGLU 是用 Swish 做门的门控线性单元。", "SwiGLU 需要三个权重矩阵，为保持参数量一致把中间维从四倍隐维改成三分之八倍隐维。"], "terms": ["GELU、Swish、SwiGLU"], "id": "d14"}, {"topic": "架构", "q": "什么是 残差连接？", "tag": "定义", "key": "把子层输出与输入相加再传给下一层", "a": ["把子层输出与输入相加再传给下一层。", "提供梯度直达浅层的通路，使深层网络可训练。", "没有残差，几十层的 Transformer 无法收敛。"], "terms": ["残差连接"], "id": "d15"}, {"topic": "架构", "q": "什么是 三种 Transformer 形态？", "tag": "定义", "key": "Encoder-only 双向编码适合理解，代表 BERT，Decoder-only 因果解码适合生成，代表 GPT，Encoder-Decoder 先编码输入再用交叉注意力解码，代表 T5", "a": ["Encoder-only 双向编码适合理解，代表 BERT，Decoder-only 因果解码适合生成，代表 GPT，Encoder-Decoder 先编码输入再用交叉注意力解码，代表 T5。", "当前大模型几乎都是 Decoder-only，原因是训练目标统一、零样本泛化好、KV 缓存推理简单。"], "terms": ["三种 Transformer 形态"], "id": "d16"}, {"topic": "架构", "q": "什么是 MoE 混合专家？", "tag": "定义", "key": "把前馈层换成多个专家，路由网络为每个 token 选 top-k 个专家激活并加权求和", "a": ["把前馈层换成多个专家，路由网络为每个 token 选 top-k 个专家激活并加权求和。", "总参数随专家数增长而每 token 计算量只和 k 有关。", "它和混合注意力不是一回事，MoE 混的是前馈层专家，混合注意力混的是注意力层的类型。", "核心难点是负载均衡。"], "terms": ["MoE 混合专家"], "id": "d17"}, {"topic": "正则", "q": "什么是 Dropout 与权重衰减？", "tag": "定义", "key": "Dropout 训练时随机置零一部分激活，权重衰减在损失里加参数范数惩罚", "a": ["Dropout 训练时随机置零一部分激活，权重衰减在损失里加参数范数惩罚。", "大模型预训练阶段通常不用 Dropout，因为数据量足够且单个样本只见一次。", "权重衰减仍然保留。"], "terms": ["Dropout 与权重衰减"], "id": "d18"}, {"topic": "优化", "q": "什么是 Adam 与 AdamW？", "tag": "定义", "key": "Adam 用梯度的一阶矩与二阶矩做逐参数自适应步长，AdamW 把权重衰减从梯度里分离，直接作用在参数上", "a": ["Adam 用梯度的一阶矩与二阶矩做逐参数自适应步长，AdamW 把权重衰减从梯度里分离，直接作用在参数上。", "Adam 里把 L2 正则加进梯度后会被二阶矩缩放，衰减强度因参数而异。", "AdamW 解耦后衰减可控，是大模型默认。"], "terms": ["Adam 与 AdamW"], "id": "d19"}, {"topic": "训练", "q": "什么是 混合精度 fp16 与 bf16？", "tag": "定义", "key": "前向与反向用 16 位浮点计算，主权重与优化器状态保留 32 位副本", "a": ["前向与反向用 16 位浮点计算，主权重与优化器状态保留 32 位副本。", "fp16 指数位只有 5 位，小梯度会下溢，需要损失缩放。", "bf16 指数位与 fp32 相同，动态范围一致，不需要损失缩放。"], "terms": ["混合精度 fp16 与 bf16"], "id": "d20"}, {"topic": "训练", "q": "什么是 预训练 Pre-training？", "tag": "定义", "key": "在大规模无标注语料上做自监督学习，目标通常是预测下一个 token", "a": ["在大规模无标注语料上做自监督学习，目标通常是预测下一个 token。", "决定模型的知识与能力上限，后训练只是把已有能力对齐到指令形式。"], "terms": ["预训练 Pre-training"], "id": "d21"}, {"topic": "训练", "q": "什么是 SFT 监督微调？", "tag": "定义", "key": "在指令与回答配对数据上做有监督的下一 token 预测，通常只在回答部分计算损失", "a": ["在指令与回答配对数据上做有监督的下一 token 预测，通常只在回答部分计算损失。", "质量比数量重要，少量高质量多样样本即可激活能力，低质量数据会引入风格噪声与事实错误。"], "terms": ["SFT 监督微调"], "id": "d22"}, {"topic": "训练", "q": "什么是 ICL 上下文学习？", "tag": "定义", "key": "在提示里给几个示例，模型不更新参数就能完成新任务", "a": ["在提示里给几个示例，模型不更新参数就能完成新任务。", "与 SFT 的区别是不改参数，成本低但受上下文长度限制，且效果对示例顺序敏感。"], "terms": ["ICL 上下文学习"], "id": "d23"}, {"topic": "训练", "q": "什么是 CoT 思维链？", "tag": "定义", "key": "让模型先写推理步骤再给答案", "a": ["让模型先写推理步骤再给答案。", "把一步映射变成多步计算，等价于给模型更多的计算预算。", "对需要多步推理的任务提升明显，对检索型任务几乎无用。"], "terms": ["CoT 思维链"], "id": "d24"}, {"topic": "训练", "q": "什么是 RLHF？", "tag": "定义", "key": "用人类偏好数据训奖励模型，再用 PPO 优化策略，同时用 KL 惩罚约束不偏离参考策略", "a": ["用人类偏好数据训奖励模型，再用 PPO 优化策略，同时用 KL 惩罚约束不偏离参考策略。", "需要策略、参考、奖励、价值四个模型同驻，工程复杂度高。"], "terms": ["RLHF"], "id": "d25"}, {"topic": "训练", "q": "什么是 DPO 直接偏好优化？", "tag": "定义", "key": "跳过奖励模型，直接在偏好对上优化一个由策略与参考策略对数比构成的损失", "a": ["跳过奖励模型，直接在偏好对上优化一个由策略与参考策略对数比构成的损失。", "只需策略与参考两个模型，稳定且实现简单。", "代价是离线训练，无法在策略自己的分布上纠偏。"], "terms": ["DPO 直接偏好优化"], "id": "d26"}, {"topic": "训练", "q": "什么是 GRPO 组相对策略优化？", "tag": "定义", "key": "对同一提示采样一组回复，用组内奖励的标准化值当优势，去掉价值模型", "a": ["对同一提示采样一组回复，用组内奖励的标准化值当优势，去掉价值模型。", "相比 PPO 少一个需要训练的模型，显存与工程复杂度明显下降。", "组内奖励全相同时优势退化为零，该提示对梯度无贡献。"], "terms": ["GRPO 组相对策略优化"], "id": "d27"}, {"topic": "训练", "q": "什么是 RLVR 可验证奖励强化学习？", "tag": "定义", "key": "奖励由规则或程序直接判定，例如答案比对、单元测试、格式校验", "a": ["奖励由规则或程序直接判定，例如答案比对、单元测试、格式校验。", "奖励无噪声且难被语言层面的讨好行为欺骗，可长时间大幅优化。", "限制是任务必须能自动验证。"], "terms": ["RLVR 可验证奖励强化学习"], "id": "d28"}, {"topic": "训练", "q": "什么是 奖励投机 Reward Hacking？", "tag": "定义", "key": "策略找到提高奖励模型分数但实际质量下降的捷径", "a": ["策略找到提高奖励模型分数但实际质量下降的捷径。", "典型表现是回答越写越长或刻意迎合评分偏好。", "缓解靠 KL 约束、多个异构奖励模型、定期用人评校准。"], "terms": ["奖励投机 Reward Hacking"], "id": "d29"}, {"topic": "训练", "q": "什么是 Scaling Law？", "tag": "定义", "key": "模型损失随参数量、数据量与计算量按幂律下降", "a": ["模型损失随参数量、数据量与计算量按幂律下降。", "Chinchilla 的结论是给定算力下参数量与训练 token 数应同比例增长，经验上约每个参数配 20 个 token。"], "terms": ["Scaling Law"], "id": "d30"}, {"topic": "训练", "q": "什么是 灾难性遗忘？", "tag": "定义", "key": "在新任务上微调后，模型在旧任务上的能力明显下降", "a": ["在新任务上微调后，模型在旧任务上的能力明显下降。", "缓解手段有混入少量通用数据做回放、降低学习率、只训练 LoRA 这类少量参数。"], "terms": ["灾难性遗忘"], "id": "d31"}, {"topic": "训练", "q": "什么是 数据、张量、流水线并行与 ZeRO？", "tag": "定义", "key": "数据并行切样本，张量并行切层内矩阵，流水线并行按层切模型，ZeRO 在数据并行内依次切优化器状态、梯度与参数", "a": ["数据并行切样本，张量并行切层内矩阵，流水线并行按层切模型，ZeRO 在数据并行内依次切优化器状态、梯度与参数。", "张量并行通信最密集，一般放在单机高速互联内。", "流水线并行有气泡，靠增加微批次压低。"], "terms": ["数据、张量、流水线并行与 ZeRO"], "id": "d32"}, {"topic": "注意力", "q": "什么是 全注意力 Full Attention？", "tag": "定义", "key": "每个位置的查询与序列里所有位置的键做点积，softmax 归一化后对值加权求和", "a": ["每个位置的查询与序列里所有位置的键做点积，softmax 归一化后对值加权求和。", "计算量与 KV 缓存都随序列长度平方增长，长上下文的主要瓶颈就在这里。"], "terms": ["全注意力 Full Attention"], "id": "d33"}, {"topic": "注意力", "q": "什么是 自注意力与交叉注意力？", "tag": "定义", "key": "自注意力的查询、键、值来自同一序列，交叉注意力的查询来自一个序列，键和值来自另一个序列", "a": ["自注意力的查询、键、值来自同一序列，交叉注意力的查询来自一个序列，键和值来自另一个序列。", "键值序列长度可以与查询不同。"], "terms": ["自注意力与交叉注意力"], "id": "d34"}, {"topic": "注意力", "q": "什么是 因果与双向？", "tag": "定义", "key": "因果注意力用上三角掩码禁止看未来位置，双向注意力不加掩码", "a": ["因果注意力用上三角掩码禁止看未来位置，双向注意力不加掩码。", "解码器用因果，编码器用双向。", "BERT 是双向，GPT 是因果。", "生成任务必须因果，否则训练与推理不一致。"], "terms": ["因果与双向"], "id": "d35"}, {"topic": "注意力", "q": "什么是 MHA 多头？", "tag": "定义", "key": "把隐维切成 h 份，每份独立做注意力，再拼接后线性投影", "a": ["把隐维切成 h 份，每份独立做注意力，再拼接后线性投影。", "多头让模型在不同子空间关注不同关系。", "头数乘头维等于隐维，参数量与单头一致。"], "terms": ["MHA 多头"], "id": "d36"}, {"topic": "注意力", "q": "什么是 MQA 与 GQA？", "tag": "定义", "key": "MQA 让所有查询头共享一组键值头，GQA 折中，每组查询头共享一组键值头", "a": ["MQA 让所有查询头共享一组键值头，GQA 折中，每组查询头共享一组键值头。", "目的都是压缩 KV 缓存。", "缓存量按分组数缩减，代价是表达多样性下降。", "Llama 2 起普遍用 GQA。"], "terms": ["MQA 与 GQA"], "id": "d37"}, {"topic": "注意力", "q": "什么是 MLA 多头隐注意力？", "tag": "定义", "key": "把键值先投影到低维隐空间，缓存只存隐向量，用时再上投影还原各头键值", "a": ["把键值先投影到低维隐空间，缓存只存隐向量，用时再上投影还原各头键值。", "与 GQA 削减头数不同，MLA 压的是维度，各头仍有独立参数。", "与 RoPE 结合要另加一段各头共享的位置键，这段不参与压缩。", "DeepSeek-V2 每层每 token 只缓存 576 维。"], "terms": ["MLA 多头隐注意力"], "id": "d38"}, {"topic": "注意力", "q": "什么是 滑动窗口 Sliding Window？", "tag": "定义", "key": "每个位置只看固定长度窗口内的历史，复杂度与序列长度成线性", "a": ["每个位置只看固定长度窗口内的历史，复杂度与序列长度成线性。", "堆叠多层后感受野随层数线性扩展。", "Mistral 用它配合滚动缓存控制显存。"], "terms": ["滑动窗口 Sliding Window"], "id": "d39"}, {"topic": "注意力", "q": "什么是 稀疏注意力 Sparse Attention？", "tag": "定义", "key": "只计算注意力矩阵里的一部分位置，其余视为零", "a": ["只计算注意力矩阵里的一部分位置，其余视为零。", "分固定模式（条带、块、全局 token）与内容相关的动态选择两类。", "动态选择精度高但引入不可导的 top-k，难高效实现。"], "terms": ["稀疏注意力 Sparse Attention"], "id": "d40"}, {"topic": "注意力", "q": "什么是 线性注意力 Linear Attention？", "tag": "定义", "key": "用核函数替换 softmax，利用矩阵乘法结合律先算键值外积再与查询相乘，复杂度降为线性", "a": ["用核函数替换 softmax，利用矩阵乘法结合律先算键值外积再与查询相乘，复杂度降为线性。", "本质是把注意力写成可递推的状态更新，因此可以像 RNN 那样常数显存流式推理。", "代价是精确检索能力弱于 softmax 注意力。"], "terms": ["线性注意力 Linear Attention"], "id": "d41"}, {"topic": "注意力", "q": "什么是 混合注意力 Hybrid Attention？", "tag": "定义", "key": "在同一模型里按层交替使用线性注意力与全注意力，多数层走线性，少数层走全注意力", "a": ["在同一模型里按层交替使用线性注意力与全注意力，多数层走线性，少数层走全注意力。", "线性层负责长程压缩与吞吐，全注意力层负责精确回忆。", "Qwen3-Next 与 Qwen3.5 采用约 75% 线性配 25% 全注意力的交替。", "MiniMax-01、Jamba 属同一思路。", "这是当前长上下文架构的主流答案。"], "terms": ["混合注意力 Hybrid Attention"], "id": "d42"}, {"topic": "注意力", "q": "什么是 Gated Attention 门控注意力？", "tag": "定义", "key": "在注意力输出上乘一个由输入算出的 sigmoid 门，控制该路信息通过多少", "a": ["在注意力输出上乘一个由输入算出的 sigmoid 门，控制该路信息通过多少。", "Qwen3-Next 的做法是把查询投影输出翻倍，一半做查询一半做门控。", "作用是抑制注意力汇聚到无信息 token。"], "terms": ["Gated Attention 门控注意力"], "id": "d43"}, {"topic": "注意力", "q": "什么是 FlashAttention？", "tag": "定义", "key": "分块计算注意力并在片上累加，不把完整的注意力矩阵写回显存", "a": ["分块计算注意力并在片上累加，不把完整的注意力矩阵写回显存。", "它是精确算法不是近似，省的是访存不是计算量。", "复杂度仍是平方，但常数大幅下降且显存从平方降到线性。"], "terms": ["FlashAttention"], "id": "d44"}, {"topic": "注意力", "q": "什么是 PagedAttention？", "tag": "定义", "key": "把 KV 缓存切成固定大小的块，用页表索引，按需分配", "a": ["把 KV 缓存切成固定大小的块，用页表索引，按需分配。", "借鉴操作系统分页，解决按最大长度预留造成的显存碎片与浪费，并让相同前缀的块可以共享。", "vLLM 的核心。"], "terms": ["PagedAttention"], "id": "d45"}, {"topic": "位置", "q": "什么是 绝对与可学习位置编码？", "tag": "定义", "key": "给每个位置一个固定或可学习的向量，加到词嵌入上", "a": ["给每个位置一个固定或可学习的向量，加到词嵌入上。", "可学习的无法外推到训练时没见过的长度，因为超出部分没有对应参数。"], "terms": ["绝对与可学习位置编码"], "id": "d46"}, {"topic": "位置", "q": "什么是 正弦位置编码？", "tag": "定义", "key": "用不同频率的正余弦函数生成位置向量", "a": ["用不同频率的正余弦函数生成位置向量。", "理论上可外推，实际外推效果有限。", "相对位置关系隐含在三角恒等式里，但模型不一定学得到。"], "terms": ["正弦位置编码"], "id": "d47"}, {"topic": "位置", "q": "什么是 RoPE 旋转位置编码？", "tag": "定义", "key": "把查询和键按位置做二维平面旋转，使点积只依赖相对位置差", "a": ["把查询和键按位置做二维平面旋转，使点积只依赖相对位置差。", "当前主流。", "外推受限于训练时见过的相位范围，超出后注意力分布崩坏，需要插值或 NTK 缩放。"], "terms": ["RoPE 旋转位置编码"], "id": "d48"}, {"topic": "位置", "q": "什么是 ALiBi？", "tag": "定义", "key": "不加位置向量，直接在注意力分数上按查询键距离减去一个线性偏置", "a": ["不加位置向量，直接在注意力分数上按查询键距离减去一个线性偏置。", "天然支持外推，实现极简，但精确位置分辨能力弱于 RoPE。"], "terms": ["ALiBi"], "id": "d49"}, {"topic": "位置", "q": "什么是 MRoPE 多模态旋转位置编码？", "tag": "定义", "key": "把位置拆成时间、高度、宽度三个维度分别做旋转", "a": ["把位置拆成时间、高度、宽度三个维度分别做旋转。", "为图像和视频提供二维与三维位置信息。", "Qwen2-VL 起使用。"], "terms": ["MRoPE 多模态旋转位置编码"], "id": "d50"}, {"topic": "现象", "q": "什么是 注意力汇聚 Attention Sink？", "tag": "定义", "key": "大量注意力权重集中到序列开头少数 token 上，即使它们没有语义信息", "a": ["大量注意力权重集中到序列开头少数 token 上，即使它们没有语义信息。", "原因是 softmax 权重必须和为一，模型需要一个放置多余注意力的位置。", "StreamingLLM 保留开头几个 token 的缓存就利用了这一点，门控注意力也能缓解它。"], "terms": ["注意力汇聚 Attention Sink"], "id": "d51"}, {"topic": "现象", "q": "什么是 幻觉？", "tag": "定义", "key": "模型生成流畅但与事实或输入不符的内容", "a": ["模型生成流畅但与事实或输入不符的内容。", "来源包括训练数据错误、知识缺失时仍被迫作答、采样随机性。", "缓解靠 RAG、拒答训练与事实校验。"], "terms": ["幻觉"], "id": "d52"}, {"topic": "多模态", "q": "什么是 CLIP？", "tag": "定义", "key": "图文双塔用对比损失对齐到同一嵌入空间，支持零样本分类与检索", "a": ["图文双塔用对比损失对齐到同一嵌入空间，支持零样本分类与检索。", "softmax 形式的对比损失依赖大批量提供负样本，且隐含批内只有一个正例的假设。"], "terms": ["CLIP"], "id": "d53"}, {"topic": "多模态", "q": "什么是 SigLIP？", "tag": "定义", "key": "把对比损失换成逐对的 sigmoid 二分类，不做批内归一化", "a": ["把对比损失换成逐对的 sigmoid 二分类，不做批内归一化。", "小批量下性能下降远小于 CLIP，也允许一个样本对多条描述同时为正。"], "terms": ["SigLIP"], "id": "d54"}, {"topic": "多模态", "q": "什么是 BLIP-2 与 Q-Former？", "tag": "定义", "key": "用一组固定数量的可学习查询，通过交叉注意力从视觉编码器抽取信息，输出定长 token 送进语言模型", "a": ["用一组固定数量的可学习查询，通过交叉注意力从视觉编码器抽取信息，输出定长 token 送进语言模型。", "输出长度与输入分辨率无关，开销可控，代价是存在信息瓶颈且需额外预训练。"], "terms": ["BLIP-2 与 Q-Former"], "id": "d55"}, {"topic": "多模态", "q": "什么是 LLaVA 式投影？", "tag": "定义", "key": "用线性层或多层感知机把视觉编码器输出直接映射成语言模型的软 token 前缀", "a": ["用线性层或多层感知机把视觉编码器输出直接映射成语言模型的软 token 前缀。"], "terms": ["LLaVA 式投影"], "id": "d56"}, {"topic": "多模态", "q": "什么是 Flamingo 式交叉注意力？", "tag": "定义", "key": "在语言模型内部插入门控交叉注意力层直接读取视觉特征，主干冻结", "a": ["在语言模型内部插入门控交叉注意力层直接读取视觉特征，主干冻结。", "保留完整视觉信息且不占用上下文长度，代价是改动模型结构。"], "terms": ["Flamingo 式交叉注意力"], "id": "d57"}, {"topic": "多模态", "q": "什么是 ImageBind？", "tag": "定义", "key": "只用各模态与图像的配对数据分别对比学习，把所有模态绑定到图像空间", "a": ["只用各模态与图像的配对数据分别对比学习，把所有模态绑定到图像空间。", "未直接配对过的模态之间也涌现出对齐能力。", "上限受限于枢纽模态能承载的信息。"], "terms": ["ImageBind"], "id": "d58"}, {"topic": "应用", "q": "什么是 RAG 检索增强生成？", "tag": "定义", "key": "先从外部知识库检索相关片段，拼进提示再让模型生成", "a": ["先从外部知识库检索相关片段，拼进提示再让模型生成。", "解决知识时效与私有知识问题，也降低幻觉。", "答错时要区分是检索没召回，还是召回了但生成没用上。"], "terms": ["RAG 检索增强生成"], "id": "d59"}, {"topic": "应用", "q": "什么是 Agent 与 ReAct？", "tag": "定义", "key": "Agent 让模型在循环里交替思考、调用工具、观察结果，直到完成任务，ReAct 是把推理步骤与动作交织写出的范式", "a": ["Agent 让模型在循环里交替思考、调用工具、观察结果，直到完成任务，ReAct 是把推理步骤与动作交织写出的范式。", "与单次调用的区别是有状态、多轮、能作用于外部环境。", "工程难点在终止条件、错误恢复与权限控制。"], "terms": ["Agent 与 ReAct"], "id": "d60"}, {"topic": "应用", "q": "什么是 工具调用 Function Calling？", "tag": "定义", "key": "模型按给定的函数签名输出结构化参数，由执行器真正调用并把结果返回模型", "a": ["模型按给定的函数签名输出结构化参数，由执行器真正调用并把结果返回模型。", "模型只产生调用意图与参数，执行、鉴权、超时与幂等都由执行器负责，JSON 合法不等于可以执行。"], "terms": ["工具调用 Function Calling"], "id": "d61"}, {"topic": "PEFT", "q": "什么是 LoRA？", "tag": "定义", "key": "冻结原权重，在旁路加一个低秩矩阵乘积作为增量，只训练这两个小矩阵", "a": ["冻结原权重，在旁路加一个低秩矩阵乘积作为增量，只训练这两个小矩阵。", "训练参数量降到千分之一量级，推理时可合并回原权重不增延迟。", "秩太小会限制表达，通常对注意力投影层加。"], "terms": ["LoRA"], "id": "d62"}, {"topic": "PEFT", "q": "什么是 QLoRA？", "tag": "定义", "key": "把基座量化到 4 比特并冻结，在其上做 LoRA 训练", "a": ["把基座量化到 4 比特并冻结，在其上做 LoRA 训练。", "让单卡微调大模型成为可能。", "关键技术包括 NF4 量化、双重量化与分页优化器。"], "terms": ["QLoRA"], "id": "d63"}, {"topic": "PEFT", "q": "什么是 Adapter 与 Prefix-tuning？", "tag": "定义", "key": "Adapter 在层间插入小瓶颈模块，Prefix-tuning 在每层注意力前拼接可学习的前缀键值", "a": ["Adapter 在层间插入小瓶颈模块，Prefix-tuning 在每层注意力前拼接可学习的前缀键值。", "Adapter 会增加推理延迟，LoRA 不会，这是 LoRA 更流行的主要原因。"], "terms": ["Adapter 与 Prefix-tuning"], "id": "d64"}, {"topic": "推理", "q": "什么是 量化 PTQ 与 QAT？", "tag": "定义", "key": "PTQ 在训练好的模型上直接定量化参数，QAT 在训练中插入伪量化让模型适应误差", "a": ["PTQ 在训练好的模型上直接定量化参数，QAT 在训练中插入伪量化让模型适应误差。", "PTQ 成本低但低比特掉点，QAT 精度高但要完整训练。", "大模型以 PTQ 为主，代表方法是 GPTQ 与 AWQ。"], "terms": ["量化 PTQ 与 QAT"], "id": "d65"}, {"topic": "推理", "q": "什么是 知识蒸馏？", "tag": "定义", "key": "让学生拟合教师的软分布或教师生成的数据", "a": ["让学生拟合教师的软分布或教师生成的数据。", "软标签含类间相似结构，信息量大于硬标签。", "在线策略蒸馏在学生自己的分布上取教师反馈，缓解分布不匹配。"], "terms": ["知识蒸馏"], "id": "d66"}, {"topic": "推理", "q": "什么是 KV 缓存？", "tag": "定义", "key": "把已生成位置的键和值缓存下来，解码新 token 时只算当前位置", "a": ["把已生成位置的键和值缓存下来，解码新 token 时只算当前位置。", "把每步的平方级重算降为线性，代价是显存随上下文长度线性增长，长上下文下缓存往往比权重还大。"], "terms": ["KV 缓存"], "id": "d67"}, {"topic": "推理", "q": "什么是 prefill 与 decode？", "tag": "定义", "key": "prefill 一次并行处理整个提示，decode 逐个生成 token", "a": ["prefill 一次并行处理整个提示，decode 逐个生成 token。", "prefill 受算力限制，decode 受显存带宽限制。", "两阶段的优化手段完全不同，分离部署是常见做法。"], "terms": ["prefill 与 decode"], "id": "d68"}, {"topic": "推理", "q": "什么是 投机解码 Speculative Decoding？", "tag": "定义", "key": "小模型或额外预测头先起草若干 token，大模型一次并行校验，按接受采样决定保留多少", "a": ["小模型或额外预测头先起草若干 token，大模型一次并行校验，按接受采样决定保留多少。", "输出分布与直接用大模型采样完全一致，不损质量。", "加速比取决于草稿与目标分布的接近程度。"], "terms": ["投机解码 Speculative Decoding"], "id": "d69"}, {"topic": "推理", "q": "什么是 连续批处理 Continuous Batching？", "tag": "定义", "key": "在每个解码步动态加入新请求、移出已完成请求，而不是等整批结束", "a": ["在每个解码步动态加入新请求、移出已完成请求，而不是等整批结束。", "把带宽受限阶段的权重读取分摊到更多请求上，吞吐与首 token 延迟同时改善。"], "terms": ["连续批处理 Continuous Batching"], "id": "d70"}, {"topic": "序列", "q": "什么是 状态空间模型 SSM？", "tag": "定义", "key": "用一个线性递推的隐状态压缩历史，输出由隐状态线性读出", "a": ["用一个线性递推的隐状态压缩历史，输出由隐状态线性读出。", "训练时可以写成卷积并行，推理时按递推进行，显存与序列长度无关。"], "terms": ["状态空间模型 SSM"], "id": "d71"}, {"topic": "序列", "q": "什么是 Mamba 与选择性 SSM？", "tag": "定义", "key": "让 SSM 的状态转移参数依赖当前输入，从而能按内容决定记住还是遗忘", "a": ["让 SSM 的状态转移参数依赖当前输入，从而能按内容决定记住还是遗忘。", "参数变成输入相关后不能再用卷积并行，靠硬件感知的并行扫描实现。", "解决了原始 SSM 无法做内容选择的问题。"], "terms": ["Mamba 与选择性 SSM"], "id": "d72"}, {"topic": "序列", "q": "什么是 GatedDeltaNet？", "tag": "定义", "key": "带门控的 delta 规则线性注意力，状态更新时既做衰减也做定向写入", "a": ["带门控的 delta 规则线性注意力，状态更新时既做衰减也做定向写入。", "相比纯线性衰减能更精确地覆盖旧记忆。", "Qwen3-Next 的线性层用的就是它。"], "terms": ["GatedDeltaNet"], "id": "d73"}, {"topic": "序列", "q": "什么是 RNN、LSTM、GRU？", "tag": "定义", "key": "按时间步递推隐状态。LSTM 用输入门、遗忘门、输出门加细胞状态缓解梯度消失，GRU 合并为更新门与重置门", "a": ["按时间步递推隐状态。LSTM 用输入门、遗忘门、输出门加细胞状态缓解梯度消失，GRU 合并为更新门与重置门。", "共同缺点是训练无法沿时间并行。", "Transformer 取代它们的主因是并行度而非表达力。"], "terms": ["RNN、LSTM、GRU"], "id": "d74"}, {"topic": "序列", "q": "什么是 多 token 预测 MTP？", "tag": "定义", "key": "训练时一次预测未来多个位置而不是只预测下一个", "a": ["训练时一次预测未来多个位置而不是只预测下一个。", "既是训练信号增强，也为推理期自投机解码提供现成的草稿头。", "DeepSeek V3 与 Qwen3.5 都用。"], "terms": ["多 token 预测 MTP"], "id": "d75"}, {"topic": "解码", "q": "什么是 贪心、束搜索与采样？", "tag": "定义", "key": "贪心每步取概率最大的 token，束搜索保留得分最高的若干条候选序列，采样按概率随机抽，温度调节分布尖锐程度，top-k 只在前 k 个里抽，top-p 只在累计概率达到 p 的最小集合里抽", "a": ["贪心每步取概率最大的 token，束搜索保留得分最高的若干条候选序列，采样按概率随机抽，温度调节分布尖锐程度，top-k 只在前 k 个里抽，top-p 只在累计概率达到 p 的最小集合里抽。", "束搜索适合翻译这类有标准答案的任务。", "开放生成用采样，否则容易重复与平淡。"], "terms": ["贪心、束搜索与采样"], "id": "d76"}, {"topic": "生成", "q": "什么是 VAE？", "tag": "定义", "key": "编码器输出隐分布参数，重参数化采样后解码，损失是重建误差加隐分布与先验的 KL", "a": ["编码器输出隐分布参数，重参数化采样后解码，损失是重建误差加隐分布与先验的 KL。", "重建偏模糊，KL 项过强时出现后验坍缩。"], "terms": ["VAE"], "id": "d77"}, {"topic": "生成", "q": "什么是 VQ-VAE 与 VQGAN？", "tag": "定义", "key": "把连续隐向量替换成码本里最近的码字，得到离散隐表示。VQGAN 在此基础上加对抗与感知损失", "a": ["把连续隐向量替换成码本里最近的码字，得到离散隐表示。VQGAN 在此基础上加对抗与感知损失。", "离散化后可以用自回归模型建模隐序列。", "量化不可导，靠直通估计回传梯度。"], "terms": ["VQ-VAE 与 VQGAN"], "id": "d78"}, {"topic": "生成", "q": "什么是 GAN？", "tag": "定义", "key": "生成器与判别器对抗训练，生成器骗过判别器，判别器区分真假", "a": ["生成器与判别器对抗训练，生成器骗过判别器，判别器区分真假。", "单步生成速度快，但训练不稳定且容易模式坍缩。"], "terms": ["GAN"], "id": "d79"}, {"topic": "生成", "q": "什么是 扩散模型 DDPM？", "tag": "定义", "key": "前向按方差表逐步加高斯噪声，反向学习逐步去噪", "a": ["前向按方差表逐步加高斯噪声，反向学习逐步去噪。", "任意时刻的加噪结果有闭式解，所以训练可直接采样任意步。", "采样需要多步迭代，是主要开销。"], "terms": ["扩散模型 DDPM"], "id": "d80"}, {"topic": "生成", "q": "什么是 DDIM？", "tag": "定义", "key": "把采样改成确定性的非马尔可夫过程，允许跳步", "a": ["把采样改成确定性的非马尔可夫过程，允许跳步。", "用远少于训练步数的步数完成采样，同一初始噪声对应确定输出，便于插值与可控编辑。"], "terms": ["DDIM"], "id": "d81"}, {"topic": "生成", "q": "什么是 流匹配 Flow Matching？", "tag": "定义", "key": "直接回归连接噪声分布与数据分布的概率路径速度场", "a": ["直接回归连接噪声分布与数据分布的概率路径速度场。", "最优传输路径近似直线，少量步数即可采样，训练目标是简单回归，比扩散更稳。"], "terms": ["流匹配 Flow Matching"], "id": "d82"}, {"topic": "生成", "q": "什么是 DiT 扩散 Transformer？", "tag": "定义", "key": "把隐空间切成 patch 序列，用 Transformer 替代 UNet 做去噪主干", "a": ["把隐空间切成 patch 序列，用 Transformer 替代 UNet 做去噪主干。", "扩展性好，规模与质量的关系可预测。", "条件通过自适应层归一化注入，把时间步与条件映射成缩放、平移与门控。"], "terms": ["DiT 扩散 Transformer"], "id": "d83"}, {"topic": "生成", "q": "什么是 CFG 无分类器引导？", "tag": "定义", "key": "训练时随机丢弃条件，采样时把条件预测与无条件预测做外推", "a": ["训练时随机丢弃条件，采样时把条件预测与无条件预测做外推。", "强度越大条件遵循越好，但样本被推离数据流形，出现过饱和与多样性塌缩。", "需要扫描取折中点。"], "terms": ["CFG 无分类器引导"], "id": "d84"}], "pre": {"表格基础模型": ["i16", "i15", "i14"], "树模型与 AutoML": ["i5", "i6"], "缺失值与数据合成": ["i18", "i15"], "评测": ["i9", "i17"], "风控与业务": ["i17", "i4"], "训练推理与 Scaling": ["i2", "i12"], "ICL 与统计": ["i14", "i9"], "论文与岗位": ["i16"], "机器学习与评估": ["i1", "i3", "i17"], "优化与训练": ["i2", "i8"], "强化学习与 Agent": ["i14"], "Transformer 与注意力": ["i11", "i12", "i10"], "多模态与 RAG": ["i10", "i11"], "微调与压缩": ["i14", "i7"], "对齐与分布式推理": ["i14", "i13"], "生成模型": ["i7", "i2"]}}</script>
<script>// 八股图解组件：每个组件 W[name](el) 在容器里画出可交互的图
const W = {};
const BV = (() => {
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const ACC = 'hsl(var(--h) 58% 42%)', ACC2 = 'hsl(var(--h) 70% 88%)', RED = '#c2453a', BLUE = '#2f6fb3', GRAY = '#9aa69f', INK = '#20332f';
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const reseed = s => { seed = s; };
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const f = (x, d = 3) => (Math.round(x * 10 ** d) / 10 ** d).toString();
  function frame(el, title, body) {
    el.innerHTML = `<div class="bv"><div class="bvt">${title}</div><div class="bvb">${body}</div></div>`;
    return el.querySelector('.bvb');
  }
  function slider(label, min, max, step, val, fmt = v => v) {
    return `<label class="bvs"><span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${val}"><b>${fmt(val)}</b></label>`;
  }
  function bindSliders(root, fmts, cb) {
    const ins = [...root.querySelectorAll('.bvs input')];
    const read = () => ins.map(i => +i.value);
    ins.forEach((i, k) => i.addEventListener('input', () => { i.nextElementSibling.textContent = (fmts[k] || (v => v))(+i.value); cb(read()); }));
    cb(read());
  }
  function seg(opts, on = 0) { return `<div class="bvseg">${opts.map((o, i) => `<button data-i="${i}" class="${i === on ? 'on' : ''}">${o}</button>`).join('')}</div>`; }
  function bindSeg(root, cb, sel = '.bvseg') {
    const g = root.querySelector(sel);
    g.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; e.stopPropagation(); g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); cb(+b.dataset.i); });
  }
  // 简单坐标轴绘图
  function plot(w, h, xr, yr, pad = [28, 8, 8, 22]) {
    const [L, R, T, B] = pad;
    const X = x => L + (x - xr[0]) / (xr[1] - xr[0]) * (w - L - R);
    const Y = y => h - B - (y - yr[0]) / (yr[1] - yr[0]) * (h - T - B);
    const axes = `<line x1="${L}" y1="${h - B}" x2="${w - R}" y2="${h - B}" stroke="${GRAY}"/><line x1="${L}" y1="${T}" x2="${L}" y2="${h - B}" stroke="${GRAY}"/>`;
    const path = (pts, color = ACC, width = 2, dash = '') => `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('')}" fill="none" stroke="${color}" stroke-width="${width}" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
    const text = (x, y, t, o = {}) => `<text x="${X(x)}" y="${Y(y)}" font-size="${o.size || 10}" fill="${o.color || INK}" text-anchor="${o.anchor || 'middle'}" ${o.dy ? `dy="${o.dy}"` : ''}>${esc(t)}</text>`;
    return { X, Y, axes, path, text, w, h, L, R, T, B };
  }
  const svg = (w, h, inner) => `<svg viewBox="0 0 ${w} ${h}" class="bvsvg">${inner}</svg>`;
  return { esc, ACC, ACC2, RED, BLUE, GRAY, INK, rnd, reseed, gauss, f, frame, slider, bindSliders, seg, bindSeg, plot, svg };
})();

// TabPFN 注意力：v1 每行一个 token，测试行只看训练行；v2 每个单元格一个表示，行内跨特征、列内跨样本
W.pfn = el => {
  const b = BV.frame(el, 'TabPFN 的注意力模式（点一个格子看它能注意到谁）', BV.seg(['v1 样本注意力', 'v2 双向注意力']) + '<div class="bvc"></div><div class="bvn"></div>');
  const nTr = 4, nTe = 2, nF = 3;
  let mode = 0, sel = [nTr, 1];
  const draw = () => {
    const cw = 46, ch = 26, ox = 60, oy = 22, W0 = ox + (nF + 1) * cw + 10, H0 = oy + (nTr + nTe) * ch + 10;
    let s = '';
    for (let j = 0; j <= nF; j++) s += `<text x="${ox + j * cw + cw / 2}" y="14" font-size="10" text-anchor="middle" fill="${BV.INK}">${j < nF ? 'x' + (j + 1) : 'y'}</text>`;
    for (let i = 0; i < nTr + nTe; i++) {
      const test = i >= nTr;
      s += `<text x="${ox - 6}" y="${oy + i * ch + ch / 2 + 4}" font-size="10" text-anchor="end" fill="${test ? BV.RED : BV.INK}">${test ? '测试 ' + (i - nTr + 1) : '训练 ' + (i + 1)}</text>`;
      for (let j = 0; j <= nF; j++) {
        const label = j === nF;
        let on = false;
        if (mode === 0) { const qi = sel[0]; on = qi >= nTr ? i < nTr : i < nTr; if (i === qi) on = 'self'; }
        else { const [qi, qj] = sel; if (i === qi && j === qj) on = 'self'; else if (i === qi) on = true; else if (j === qj && i < nTr) on = true; }
        const fill = on === 'self' ? '#ffd76a' : on ? BV.ACC2 : '#fff';
        const txt = label ? (test ? '?' : ['0', '1', '1', '0'][i]) : BV.f(Math.sin(i * 3 + j * 1.7) * 2, 1);
        s += `<rect x="${ox + j * cw}" y="${oy + i * ch}" width="${cw - 3}" height="${ch - 3}" rx="4" fill="${fill}" stroke="${on ? BV.ACC : '#c9d2cb'}" data-c="${i},${j}" style="cursor:pointer"/><text x="${ox + j * cw + cw / 2 - 1}" y="${oy + i * ch + ch / 2 + 3}" font-size="10" text-anchor="middle" pointer-events="none" fill="${label && test ? BV.RED : BV.INK}">${txt}</text>`;
      }
      if (mode === 0) s += `<rect x="${ox - 2}" y="${oy + i * ch - 1}" width="${(nF + 1) * cw}" height="${ch - 1}" rx="5" fill="none" stroke="${i === sel[0] ? '#d1a52a' : 'none'}" stroke-width="2"/>`;
    }
    b.querySelector('.bvc').innerHTML = BV.svg(W0, H0, s);
    const qi = sel[0];
    b.querySelector('.bvn').innerHTML = mode === 0
      ? `v1 里整行是一个 token。${qi >= nTr ? '测试样本只注意全部训练样本，测试样本之间互不可见。' : '训练样本之间互相注意，训练样本不看测试样本。'}高亮的行就是它能注意到的行。`
      : `v2 里每个单元格一个表示。高亮的是它这一层能注意到的格子，同一行跨特征注意，同一列只跨训练样本注意。${qi >= nTr ? '测试行的格子在列方向上只看训练行。' : ''}`;
    b.querySelectorAll('rect[data-c]').forEach(r => r.addEventListener('click', e => { e.stopPropagation(); sel = r.dataset.c.split(',').map(Number); draw(); }));
  };
  BV.bindSeg(b, i => { mode = i; draw(); });
  draw();
};

// 结构因果模型合成数据：随机 DAG，从根节点传播，挑节点当特征和标签
W.scm = el => {
  const b = BV.frame(el, '用随机因果图合成一个表格任务', '<button class="bvbtn">再生成一个数据集</button><div class="bvc"></div><div class="bvn"></div>');
  let s0 = 11;
  const gen = () => {
    BV.reseed(s0 += 17);
    const n = 6, pos = [[40, 30], [140, 30], [240, 30], [70, 100], [190, 100], [130, 165]];
    const edges = [];
    for (let j = 3; j < n; j++) for (let i = 0; i < j; i++) if (BV.rnd() < 0.45 || (j >= 3 && !edges.some(e => e[1] === j) && i === j - 1)) edges.push([i, j, BV.rnd() * 2 - 1]);
    const order = [...Array(n).keys()];
    const target = 5, feats = [0, 3, 4].concat(BV.rnd() < 0.5 ? [1] : []);
    const rows = [];
    for (let r = 0; r < 5; r++) {
      const v = [];
      for (const j of order) {
        const par = edges.filter(e => e[1] === j);
        const z = par.length ? Math.tanh(par.reduce((a, e) => a + e[2] * v[e[0]] * 1.6, 0)) : BV.gauss();
        v[j] = z + 0.2 * BV.gauss();
      }
      rows.push(v);
    }
    const med = rows.map(r => r[target]).sort((a, c) => a - c)[2];
    let s = edges.map(([i, j]) => `<line x1="${pos[i][0]}" y1="${pos[i][1]}" x2="${pos[j][0]}" y2="${pos[j][1]}" stroke="${BV.GRAY}" stroke-width="1.5" marker-end="url(#ar)"/>`).join('');
    s = `<defs><marker id="ar" viewBox="0 0 10 10" refX="16" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="${BV.GRAY}"/></marker></defs>` + s;
    s += pos.map((p, i) => { const role = i === target ? 'y' : feats.includes(i) ? 'x' : 'h'; const col = role === 'y' ? BV.RED : role === 'x' ? BV.BLUE : BV.GRAY; return `<circle cx="${p[0]}" cy="${p[1]}" r="14" fill="#fff" stroke="${col}" stroke-width="2"/><text x="${p[0]}" y="${p[1] + 4}" font-size="10" text-anchor="middle" fill="${col}">${role === 'y' ? 'y' : role === 'x' ? 'x' + (feats.indexOf(i) + 1) : 'z' + i}</text>`; }).join('');
    const tbl = `<table class="bvtab"><tr>${feats.map((_, k) => `<th>x${k + 1}</th>`).join('')}<th>y</th></tr>${rows.map(r => `<tr>${feats.map(j => `<td>${BV.f(r[j], 2)}</td>`).join('')}<td><b>${r[target] > med ? 1 : 0}</b></td></tr>`).join('')}</table>`;
    b.querySelector('.bvc').innerHTML = `<div class="bvrow">${BV.svg(280, 190, s)}${tbl}</div>`;
    b.querySelector('.bvn').innerHTML = '蓝色节点当特征，红色节点当标签，灰色是看不到的隐变量。根节点采噪声，沿边经过随机函数向下传播，标签按中位数离散化成分类任务。每点一次就是一个新的预训练任务。';
  };
  b.querySelector('.bvbtn').addEventListener('click', e => { e.stopPropagation(); gen(); });
  gen();
};

// 回归的分桶分布
W.bins = el => {
  const b = BV.frame(el, '回归输出的分桶分布（拖动看分位数）', BV.slider('分位数', 0.05, 0.95, 0.05, 0.5, v => v.toFixed(2)) + '<div class="bvc"></div><div class="bvn"></div>');
  const nb = 24, xs = [...Array(nb).keys()].map(i => i / (nb - 1) * 10);
  const dens = xs.map(x => 0.6 * Math.exp(-((x - 3.2) ** 2) / 1.2) + 0.4 * Math.exp(-((x - 7) ** 2) / 0.8));
  const Z = dens.reduce((a, c) => a + c, 0), p = dens.map(d => d / Z);
  const mean = xs.reduce((a, x, i) => a + x * p[i], 0);
  BV.bindSliders(b, [v => v.toFixed(2)], ([q]) => {
    let cum = 0, qi = 0; for (let i = 0; i < nb; i++) { cum += p[i]; if (cum >= q) { qi = i; break; } }
    const P = BV.plot(300, 150, [-0.3, 10.3], [0, Math.max(...p) * 1.15]);
    let s = P.axes + p.map((v, i) => `<rect x="${P.X(xs[i] - 0.2)}" y="${P.Y(v)}" width="${P.X(0.4) - P.X(0)}" height="${P.Y(0) - P.Y(v)}" fill="${i <= qi ? BV.ACC : BV.ACC2}"/>`).join('');
    s += `<line x1="${P.X(mean)}" y1="${P.Y(0)}" x2="${P.X(mean)}" y2="${P.T}" stroke="${BV.RED}" stroke-dasharray="3 3"/>` + P.text(mean, Math.max(...p) * 1.1, '均值 ' + BV.f(mean, 2), { color: BV.RED });
    b.querySelector('.bvc').innerHTML = BV.svg(300, 150, s);
    b.querySelector('.bvn').innerHTML = `每根柱子是一个区间的概率，合起来是整条预测分布。当前 ${q.toFixed(2)} 分位数约为 ${BV.f(xs[qi], 2)}。这条分布是双峰的，只报均值会落在两个峰之间，分位数和区间更有信息量。`;
  });
};

// GBDT：每一步拟合残差
W.gbdt = el => {
  const b = BV.frame(el, 'GBDT 一棵一棵拟合残差', BV.slider('学习率 η', 0.1, 1, 0.1, 0.5, v => v.toFixed(1)) + '<div class="bvbtns"><button class="bvbtn" data-a="add">加一棵树</button><button class="bvbtn ghost" data-a="reset">重来</button></div><div class="bvc"></div><div class="bvn"></div>');
  BV.reseed(5);
  const xs = [...Array(30).keys()].map(i => i / 29 * 10), ys = xs.map(x => Math.sin(x * 0.8) * 2 + 0.3 * x + 0.35 * BV.gauss());
  let F = xs.map(() => ys.reduce((a, c) => a + c, 0) / ys.length), m = 0, eta = 0.5, last = null;
  const stump = r => {
    let best = null;
    for (let k = 1; k < xs.length; k++) {
      const L = r.slice(0, k), R = r.slice(k), mL = L.reduce((a, c) => a + c, 0) / L.length, mR = R.reduce((a, c) => a + c, 0) / R.length;
      const sse = L.reduce((a, c) => a + (c - mL) ** 2, 0) + R.reduce((a, c) => a + (c - mR) ** 2, 0);
      if (!best || sse < best.sse) best = { sse, t: (xs[k - 1] + xs[k]) / 2, mL, mR };
    }
    return best;
  };
  const draw = () => {
    const P = BV.plot(300, 170, [-0.3, 10.3], [-3, 6]);
    const res = ys.map((y, i) => y - F[i]);
    let s = P.axes + xs.map((x, i) => `<line x1="${P.X(x)}" y1="${P.Y(ys[i])}" x2="${P.X(x)}" y2="${P.Y(F[i])}" stroke="${BV.RED}" stroke-width="1" opacity=".6"/><circle cx="${P.X(x)}" cy="${P.Y(ys[i])}" r="2.6" fill="${BV.INK}"/>`).join('');
    s += P.path(xs.map((x, i) => [x, F[i]]), BV.ACC, 2.2);
    if (last) s += `<line x1="${P.X(last.t)}" y1="${P.T}" x2="${P.X(last.t)}" y2="${P.Y(-3)}" stroke="${BV.BLUE}" stroke-dasharray="3 3"/>`;
    const mse = res.reduce((a, c) => a + c * c, 0) / res.length;
    b.querySelector('.bvc').innerHTML = BV.svg(300, 170, s);
    b.querySelector('.bvn').innerHTML = `已加 ${m} 棵树，均方误差 ${BV.f(mse, 3)}。红线是当前残差，下一棵树就拟合它们。${last ? `刚加的树在 x=${BV.f(last.t, 2)} 处切一刀（蓝虚线），左右各输出残差均值乘 η。` : '起点是全部标签的均值。'}`;
  };
  b.querySelector('.bvbtns').addEventListener('click', e => {
    const a = e.target.dataset.a; if (!a) return; e.stopPropagation();
    if (a === 'add') { const r = ys.map((y, i) => y - F[i]); last = stump(r); F = F.map((v, i) => v + eta * (xs[i] < last.t ? last.mL : last.mR)); m++; }
    else { F = xs.map(() => ys.reduce((a, c) => a + c, 0) / ys.length); m = 0; last = null; }
    draw();
  });
  BV.bindSliders(b, [v => v.toFixed(1)], ([v]) => { eta = v; draw(); });
};

// LightGBM GOSS
W.goss = el => {
  const b = BV.frame(el, 'GOSS：保留大梯度，小梯度抽样后放大权重', BV.slider('大梯度保留比例 a', 0.1, 0.5, 0.05, 0.2, v => v.toFixed(2)) + BV.slider('小梯度抽样比例 b', 0.05, 0.5, 0.05, 0.1, v => v.toFixed(2)) + '<div class="bvc"></div><div class="bvn"></div>');
  BV.reseed(9);
  const g = [...Array(40).keys()].map(() => Math.abs(BV.gauss())).sort((x, y) => y - x);
  const order = [...Array(40).keys()].map(() => BV.rnd());
  BV.bindSliders(b, [v => v.toFixed(2), v => v.toFixed(2)], ([a, bb]) => {
    const top = Math.round(a * g.length), rest = g.length - top, take = Math.round(bb * g.length);
    const restIdx = [...Array(rest).keys()].map(i => i + top).sort((x, y) => order[x] - order[y]).slice(0, take);
    const P = BV.plot(300, 130, [0, g.length], [0, Math.max(...g) * 1.05], [10, 4, 6, 14]);
    let s = g.map((v, i) => { const kept = i < top ? 1 : restIdx.includes(i) ? 2 : 0; return `<rect x="${P.X(i) + 1}" y="${P.Y(v)}" width="${P.X(1) - P.X(0) - 2}" height="${P.Y(0) - P.Y(v)}" fill="${kept === 1 ? BV.ACC : kept === 2 ? '#e7a93b' : '#dfe5e1'}"/>`; }).join('');
    b.querySelector('.bvc').innerHTML = BV.svg(300, 130, s);
    b.querySelector('.bvn').innerHTML = `按梯度绝对值从大到小排。绿色是全部保留的前 ${top} 个大梯度样本，橙色是从其余 ${rest} 个里随机抽的 ${take} 个，它们的权重放大为 (1−a) 除以 b = ${BV.f((1 - a) / bb, 2)}，保证梯度和的估计近似无偏。灰色样本这一轮不参与。`;
  });
};

// 三种缺失机制
W.missing = el => {
  const b = BV.frame(el, '缺失机制会不会让观测到的均值有偏', BV.seg(['MCAR 完全随机', 'MAR 依赖年龄', 'MNAR 依赖收入本身']) + '<div class="bvc"></div><div class="bvn"></div>');
  BV.reseed(21);
  const rows = [...Array(12).keys()].map(() => { const age = Math.round(22 + BV.rnd() * 35); const inc = Math.round(6 + (age - 22) * 0.35 + BV.gauss() * 3); return [age, Math.max(2, inc)]; });
  const rr = rows.map(() => BV.rnd());
  const trueMean = rows.reduce((a, r) => a + r[1], 0) / rows.length;
  const draw = mode => {
    const miss = rows.map((r, i) => mode === 0 ? rr[i] < 0.35 : mode === 1 ? r[0] < 33 : r[1] > 14);
    const obs = rows.filter((_, i) => !miss[i]).map(r => r[1]);
    const om = obs.reduce((a, c) => a + c, 0) / Math.max(1, obs.length);
    b.querySelector('.bvc').innerHTML = `<table class="bvtab"><tr><th>年龄</th><th>月收入（千）</th></tr>${rows.map((r, i) => `<tr><td>${r[0]}</td><td class="${miss[i] ? 'miss' : ''}">${miss[i] ? '缺失' : r[1]}</td></tr>`).join('')}</table>`;
    const why = ['是否缺失和任何变量无关', '年龄小于 33 岁的人不填收入，年轻人收入偏低', '收入高于 14 的人不填收入'][mode];
    b.querySelector('.bvn').innerHTML = `${why}。真实均值 ${BV.f(trueMean, 1)}，只用观测值算的均值 ${BV.f(om, 1)}${Math.abs(om - trueMean) > 1 ? '，明显有偏' : '，偏差不大'}。${mode === 1 ? '年龄是观测到的，用年龄建模填补可以纠正。' : mode === 2 ? '缺失取决于收入本身，只靠观测数据纠正不了。' : '直接删除只损失样本量。'}`;
  };
  BV.bindSeg(b, draw); draw(0);
};

// 扩散前向加噪
W.diffusion = el => {
  const b = BV.frame(el, '扩散前向过程：数据逐步变成噪声', BV.slider('时间步 t', 0, 1000, 10, 0) + '<div class="bvc"></div><div class="bvn"></div>');
  BV.reseed(3);
  const pts = [...Array(160).keys()].map(i => { const k = i % 2; const a = BV.rnd() * Math.PI * 2, r = 0.25 + 0.08 * BV.gauss(); return [(k ? 0.9 : -0.9) + r * Math.cos(a), r * Math.sin(a) + (k ? 0.4 : -0.4)]; });
  const eps = pts.map(() => [BV.gauss(), BV.gauss()]);
  const abar = t => { let p = 1; for (let s = 1; s <= t; s++) p *= 1 - (1e-4 + (0.02 - 1e-4) * s / 1000); return p; };
  BV.bindSliders(b, [v => v], ([t]) => {
    const ab = abar(t), sa = Math.sqrt(ab), sn = Math.sqrt(1 - ab);
    const P = BV.plot(260, 200, [-2.8, 2.8], [-2.8, 2.8], [6, 6, 6, 6]);
    const s = pts.map((p, i) => `<circle cx="${P.X(sa * p[0] + sn * eps[i][0])}" cy="${P.Y(sa * p[1] + sn * eps[i][1])}" r="2.3" fill="${i % 2 ? BV.ACC : BV.RED}" opacity=".75"/>`).join('');
    b.querySelector('.bvc').innerHTML = BV.svg(260, 200, `<rect x="0" y="0" width="260" height="200" fill="#fbfcfa"/>` + s);
    b.querySelector('.bvn').innerHTML = `ᾱ_t = ${BV.f(ab, 4)}，信号系数 √ᾱ = ${BV.f(sa, 3)}，噪声系数 √(1−ᾱ) = ${BV.f(sn, 3)}。t 越大原始的两团结构越模糊，到最后接近标准高斯。网络要学的是反过来，从噪声一步步去噪回到数据。`;
  });
};

// ROC、KS、混淆矩阵
W.roc = el => {
  const b = BV.frame(el, '拖动阈值，看混淆矩阵、ROC 和 KS 怎么变', BV.slider('阈值', 0, 1, 0.01, 0.5, v => v.toFixed(2)) + BV.slider('好坏样本区分度', 0.5, 3, 0.1, 1.6, v => v.toFixed(1)) + '<div class="bvc"></div><div class="bvn"></div>');
  BV.reseed(13);
  const zb = [...Array(60).keys()].map(() => BV.gauss()), zg = [...Array(240).keys()].map(() => BV.gauss());
  const sig = x => 1 / (1 + Math.exp(-x));
  BV.bindSliders(b, [v => v.toFixed(2), v => v.toFixed(1)], ([th, sep]) => {
    const bad = zb.map(z => sig(z + sep / 2)), good = zg.map(z => sig(z - sep / 2));
    const TP = bad.filter(s => s >= th).length, FN = bad.length - TP, FP = good.filter(s => s >= th).length, TN = good.length - FP;
    const ths = [...Array(101).keys()].map(i => i / 100);
    const curve = ths.map(t => [good.filter(s => s >= t).length / good.length, bad.filter(s => s >= t).length / bad.length]);
    let auc = 0; for (let i = 1; i < curve.length; i++) auc += (curve[i - 1][0] - curve[i][0]) * (curve[i - 1][1] + curve[i][1]) / 2;
    let ks = 0, ksT = 0; ths.forEach((t, i) => { const d = curve[i][1] - curve[i][0]; if (d > ks) { ks = d; ksT = t; } });
    const tpr = TP / bad.length, fpr = FP / good.length, prec = TP / Math.max(1, TP + FP), f1 = 2 * TP / Math.max(1, 2 * TP + FP + FN);
    const P = BV.plot(170, 160, [0, 1], [0, 1], [24, 6, 6, 20]);
    let s = P.axes + P.path([[0, 0], [1, 1]], BV.GRAY, 1, '3 3') + P.path(curve.slice().reverse(), BV.ACC, 2.2) + `<circle cx="${P.X(fpr)}" cy="${P.Y(tpr)}" r="4.5" fill="${BV.RED}"/>`;
    const ki = Math.round(ksT * 100); s += `<line x1="${P.X(curve[ki][0])}" y1="${P.Y(curve[ki][0])}" x2="${P.X(curve[ki][0])}" y2="${P.Y(curve[ki][1])}" stroke="#e7a93b" stroke-width="2"/>`;
    s += P.text(0.5, -0.12, 'FPR', { size: 9 }) + `<text x="8" y="${P.Y(0.5)}" font-size="9" transform="rotate(-90 8 ${P.Y(0.5)})" text-anchor="middle">TPR</text>`;
    const cm = `<table class="bvtab cm"><tr><th></th><th>预测坏</th><th>预测好</th></tr><tr><th>真实坏</th><td class="tp">TP ${TP}</td><td>FN ${FN}</td></tr><tr><th>真实好</th><td>FP ${FP}</td><td class="tn">TN ${TN}</td></tr></table>`;
    b.querySelector('.bvc').innerHTML = `<div class="bvrow">${BV.svg(170, 160, s)}${cm}</div>`;
    b.querySelector('.bvn').innerHTML = `精确率 ${BV.f(prec, 3)}，召回率（TPR）${BV.f(tpr, 3)}，FPR ${BV.f(fpr, 3)}，F1 ${BV.f(f1, 3)}。AUC ${BV.f(auc, 3)}，KS ${BV.f(ks, 3)}（橙线，出现在阈值 ${ksT.toFixed(2)}）。坏样本只占 20%，准确率 ${BV.f((TP + TN) / 300, 3)} 不能说明区分能力。`;

};

W.attn = el => {
  const b = BV.frame(el, '注意力权重：QKᵀ 缩放、掩码、softmax', BV.seg(['双向', '因果掩码']) + BV.slider('是否除以 √d（0 否 1 是）', 0, 1, 1, 1) + '<div class="bvc"></div><div class="bvn"></div>');
  const toks = ['我', '爱', '机器', '学习', '。'], d = 16;
  BV.reseed(4);
  const Q = toks.map(() => [...Array(d)].map(() => BV.gauss())), K = toks.map(() => [...Array(d)].map(() => BV.gauss()));
  let causal = 0, scale = 1;
  const draw = () => {

      <div class="decks">${DECKS.map((d, i) => `<button data-deck="${d.id}" class="${tmp.deck === d.id ? 'on' : ''}"><span class="dn">${i + 1}</span><b>${d.emo} ${esc(d.name)}</b><small>${d.ids.length} 题 · ${esc(d.desc)}</small></button>`).join('')}</div>
      <div class="srow"><b>主题</b><div class="opts" id="topicopts">${topics.map(t => `<button data-topic="${esc(t)}" class="${tmp.topics.includes(t) ? 'on' : ''}">${esc(t)}</button>`).join('')}<span style="font-size:12px;color:var(--muted);align-self:center">不选就是全部</span></div></div>
      <div class="srow"><b>顺序</b><div class="opts">${opt('order', 'seq', '推荐顺序')}${opt('order', 'rand', '随机打乱')}</div></div>
      <div class="srow"><b>范围</b><div class="opts">${opt('filter', 'all', '全部')}${opt('filter', 'must', '只看必背和高频')}${opt('filter', 'due', '⏰ 今日复习')}${opt('filter', 'weak', '还没熟练')}${opt('filter', 'wrong', '不会和模糊')}</div></div>
      <div class="srow"><b>每日目标</b><div class="opts">${[10, 20, 30, 50].map(g => opt('goal', g, g + ' 题')).join('')}</div></div>
      <button class="big" id="apply" style="width:100%;background:#176c63;margin-top:6px">按这个设置开刷</button>
      <h3>本轮题目（点一下跳过去）</h3><div class="map">${order.map((id, k) => { const s = ST.get(id); return `<button data-j="${k}" class="${s !== undefined ? 's' + s : ''}${k === cur ? ' cur' : ''}" title="${esc(BY[id].q)}">${k + 1}</button>`; }).join('')}</div>
      <p style="font-size:12px;color:var(--muted);margin:12px 0 0">专属卡组按岗位描述的五个方向整理，并收录了通用八股里和岗位相关的题。复习按间隔重复安排，进度保存在这个浏览器里。</p>`;
    sh.classList.add('on');
  }
  $('#sheet').addEventListener('click', e => {
    if (e.target.id === 'sheet') return $('#sheet').classList.remove('on');
    const dk = e.target.closest('[data-deck]'); if (dk) { tmp.deck = dk.dataset.deck; tmp.topics = []; $('#sheet').querySelectorAll('[data-deck]').forEach(b => b.classList.toggle('on', b === dk)); const topics = [...new Set(deckCards(tmp).map(c => c.topic))]; $('#topicopts').innerHTML = topics.map(t => `<button data-topic="${esc(t)}">${esc(t)}</button>`).join(''); return; }
    const o = e.target.closest('[data-k]'); if (o) { const k = o.dataset.k; tmp[k] = k === 'goal' ? +o.dataset.v : o.dataset.v; o.parentNode.querySelectorAll(`[data-k="${k}"]`).forEach(b => b.classList.toggle('on', b === o)); return; }
    const tp = e.target.closest('[data-topic]'); if (tp) { const v = tp.dataset.topic; tmp.topics = tmp.topics.includes(v) ? tmp.topics.filter(x => x !== v) : tmp.topics.concat(v); tp.classList.toggle('on'); return; }
    const j = e.target.closest('[data-j]'); if (j) { $('#sheet').classList.remove('on'); return jump(+j.dataset.j); }
    if (e.target.id === 'apply') { const ch = cfgKey(tmp) !== cfgKey(cfg) || tmp.order === 'rand'; cfg = tmp; LS.set('bagu-cfg-v1', cfg); $('#sheet').classList.remove('on'); paintDeckChip(); if (ch) { start(false); toast(order.length ? `本轮 ${order.length} 题，开刷` : '没有符合条件的题'); } else paintStats(); }
  });
  $('#gear').addEventListener('click', openSheet);
  function paintDeckChip() { const d = deckOf(cfg.deck); $('#deckbtn').textContent = d.emo; $('#deckbtn').title = d.name; }
  $('#deckbtn').addEventListener('click', openSheet);
  const guide = $('#guide');
  $('#gok').addEventListener('click', () => { guide.classList.remove('on'); LS.set('bagu-guide-v1', 1); });
  $('#help').addEventListener('click', () => guide.classList.add('on'));
  if (!LS.get('bagu-guide-v1', 0)) guide.classList.add('on');

  // ---------- 听题 ----------
  const audio = new Audio(); audio.preload = 'auto';
  let listening = false, playIdx = -1, sleepT = null, sleepEnd = 0, rate = LS.get('bagu-rate-v1', 1);
  const RATES = [1, 1.25, 1.5, 2, 0.8], pl = $('#player');
  const fmt = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00';
  function playAt(k, scroll) {
    if (k >= order.length) { stopListen(); toast('本轮都听完了'); return; }
    playIdx = k; const c = BY[order[k]];
    audio.src = 'audio/bagu-natural/' + c.id + '.mp3'; audio.playbackRate = rate; audio.play().catch(() => {});
    pl.querySelector('.ptitle').textContent = c.q;
    if ('mediaSession' in navigator) { try { navigator.mediaSession.metadata = new MediaMetadata({ title: c.q, artist: '八股速记', album: `${deckOf(cfg.deck).name} · 第 ${k + 1} / ${order.length} 题` }); } catch (e) {} }
    if (scroll && k !== cur) { if (document.visibilityState === 'visible') feed.scrollTo({ top: k * feed.clientHeight, behavior: 'smooth' }); else jump(k); }
    document.querySelectorAll('.rb.lis').forEach(b => b.classList.toggle('on', +b.closest('.slide').dataset.k === k));
  }
  function startListen(k) { listening = true; document.body.classList.add('listening'); pl.classList.add('on'); $('#listen').classList.add('on'); playAt(k === undefined ? Math.min(cur, order.length - 1) : k, false); }
  function stopListen() { listening = false; audio.pause(); document.body.classList.remove('listening'); pl.classList.remove('on'); $('#listen').classList.remove('on'); clearTimeout(sleepT); sleepT = null; paintSleep(); document.querySelectorAll('.rb.lis').forEach(b => b.classList.remove('on')); }
  function paintSleep() { const b = pl.querySelector('[data-p=sleep]'); b.textContent = sleepT ? Math.max(1, Math.round((sleepEnd - Date.now()) / 60000)) + '′' : '⏲'; }
  audio.addEventListener('ended', () => { if (listening) playAt(playIdx + 1, true); });
  audio.addEventListener('play', () => { pl.querySelector('[data-p=toggle]').textContent = '⏸'; });
  audio.addEventListener('pause', () => { pl.querySelector('[data-p=toggle]').textContent = '▶'; });
  audio.addEventListener('timeupdate', () => { const d = audio.duration || 0; pl.querySelector('.pbar i').style.width = d ? (100 * audio.currentTime / d) + '%' : '0'; pl.querySelector('.ptime').textContent = `${fmt(audio.currentTime)} / ${fmt(d)}`; if (sleepT) paintSleep(); });
  audio.addEventListener('error', () => { if (listening) { toast('这题的音频还在制作中，跳到下一题'); setTimeout(() => playAt(playIdx + 1, true), 800); } });
  pl.addEventListener('click', e => {
    const b = e.target.closest('[data-p]');
    if (!b) { const bar = e.target.closest('.pbar'); if (bar && audio.duration) { const r = bar.getBoundingClientRect(); audio.currentTime = audio.duration * (e.clientX - r.left) / r.width; } return; }
    const a = b.dataset.p;
    if (a === 'toggle') audio.paused ? audio.play() : audio.pause();
    else if (a === 'next') playAt(playIdx + 1, true);
    else if (a === 'prev') { if (audio.currentTime > 5) audio.currentTime = 0; else playAt(Math.max(0, playIdx - 1), true); }
    else if (a === 'back') audio.currentTime = Math.max(0, audio.currentTime - 10);
    else if (a === 'rate') { rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length]; audio.playbackRate = rate; b.textContent = rate + '×'; LS.set('bagu-rate-v1', rate); }
    else if (a === 'sleep') {
      const opts = [0, 15, 30, 60], curM = sleepT ? Math.round((sleepEnd - Date.now()) / 60000) : 0, nx = opts[(opts.findIndex(o => o >= curM) + 1) % opts.length] || 0;
      clearTimeout(sleepT); sleepT = null;
      if (nx) { sleepEnd = Date.now() + nx * 60000; sleepT = setTimeout(() => { audio.pause(); sleepT = null; paintSleep(); toast('睡眠定时到了，已暂停'); }, nx * 60000); toast(`${nx} 分钟后自动暂停`); } else toast('已关闭睡眠定时');
      paintSleep();
    } else if (a === 'close') stopListen();
  });
  pl.querySelector('[data-p=rate]').textContent = rate + '×';
  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession, set = (k, f) => { try { ms.setActionHandler(k, f); } catch (e) {} };
    set('play', () => audio.play()); set('pause', () => audio.pause());
    set('nexttrack', () => playAt(playIdx + 1, true)); set('previoustrack', () => playAt(Math.max(0, playIdx - 1), true));
    set('seekbackward', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
    set('seekforward', () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); });
  }
  $('#listen').addEventListener('click', () => { listening ? stopListen() : (startListen(), toast('🎧 连播开始，播完自动下一题，锁屏也能听')); });
  const _setCur = setCur;
  setCur = function (k, force) { _setCur(k, force); if (listening && k !== playIdx && k < order.length) playAt(k, false); };

  document.addEventListener('keydown', e => {
    if (/input|textarea|select/i.test(e.target.tagName)) return;
    if ($('#sheet').classList.contains('on')) { if (e.key === 'Escape') $('#sheet').classList.remove('on'); return; }
    const sl = slideAt(cur), pane = sl && sl.dataset.pane !== undefined ? +sl.dataset.pane : 1;
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowLeft' && sl && sl.querySelector('.hx')) { e.preventDefault(); goPane(sl, Math.max(0, pane - 1)); }
    else if (e.key === 'ArrowRight' && sl && sl.querySelector('.hx')) { e.preventDefault(); goPane(sl, Math.min(2, pane + 1)); }
    else if (e.key === ' ' && sl && sl._next && pane === 0) { e.preventDefault(); sl._next(); }
    else if (/^[123]$/.test(e.key) && sl && sl.querySelector('.hx')) { const s = +e.key - 1; mark(order[cur], s, sl, pane === 0 ? 'rec' : 'main', sl.querySelector(`.rb[data-s="${s}"]`)); }
  });
  let rt = null;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { ready = false; feed.querySelectorAll('.slide[data-f]').forEach(sl => { const hx = sl.querySelector('.hx'); hx.scrollLeft = (+sl.dataset.pane || 0) * hx.clientWidth; }); feed.scrollTop = cur * feed.clientHeight; requestAnimationFrame(() => { ready = true; }); }, 120); });
  paintDeckChip();
  start(true);
})();
</script>
</body></html>
