<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f13"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow,noarchive"><title>八股速记</title><style>:root{--bg:#f7f8f5;--paper:#fff;--ink:#20332f;--muted:#5a6a65;--line:#d9dfd7;--acc:#176c63;--acc2:#e3f0ec;--easy:#2f8a5b;--mid:#b07a14;--hard:#b4443c;--code:#f3f5f1;--warn:#fbf1e2;--warnink:#8a5413;--blue:#2c5d8f;--blue2:#e6eef7;--red2:#f8e3e1}
.hidden{display:none!important}
html,body{height:100%;margin:0;background:#0d0f13;overscroll-behavior:none}
body{font:15px/1.65 system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#111}
#feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar,.hx::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;
  background:radial-gradient(120% 70% at 15% 0%,hsl(var(--h) 80% 64% / .95),transparent 62%),linear-gradient(165deg,hsl(var(--h) 62% 44%),hsl(calc(var(--h) + 45) 58% 20%))}
.hx{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.pane{flex:0 0 100%;height:100%;box-sizing:border-box;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) 12px 70px;-webkit-overflow-scrolling:touch}
.prec,.pexp{overscroll-behavior-y:contain;padding-bottom:28px}
.card{background:rgba(255,255,255,.97);border-radius:22px;padding:16px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.slide.in .pmain .card{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
/* top bar */
#top{position:absolute;left:0;right:0;top:0;z-index:20;padding:calc(6px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));color:#fff;pointer-events:none}
#top>*{pointer-events:auto}
#top .r1{display:flex;align-items:center;gap:6px}
#top a.back,#top .ib{color:#fff;text-decoration:none;font-size:15px;background:rgba(255,255,255,.16);border:0;border-radius:999px;height:32px;min-width:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
#tabs{flex:1;display:flex;justify-content:center;gap:18px}
#tabs button{background:none;border:0;color:rgba(255,255,255,.62);font:600 16px/1 inherit;padding:6px 0 7px;position:relative;cursor:pointer;transition:color .2s}
#tabs button.on{color:#fff}
#tabs button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:3px;border-radius:2px;background:#fff}
#top .bar{height:3px;background:rgba(255,255,255,.22);border-radius:2px;margin:8px 2px 4px;overflow:hidden}
#top .bar i{display:block;height:100%;width:0;background:#fff;transition:width .3s}
#top .r2{display:flex;justify-content:space-between;font-size:12px;opacity:.92;padding:0 2px}
#top .fire{display:inline-block}
#top .fire.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.6)}}
/* main pane */
.pmain{position:relative;overflow:hidden;padding:0}
.mscroll{position:relative;z-index:2;height:100%;box-sizing:border-box;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) 12px 70px}
.pmain .card{margin-right:62px}
.bigemo{position:absolute;left:-18px;bottom:60px;font-size:150px;line-height:1;opacity:.22;transform:rotate(-14deg);pointer-events:none;z-index:1;filter:saturate(.6)}
.slide.in .bigemo{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:rotate(-8deg) translateY(-10px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{font-size:12px;border-radius:999px;padding:1px 9px;background:#eef2ee;color:#3b4b46;white-space:nowrap}
.chip.d-简单{background:#e1f2e8;color:var(--easy)}
.chip.d-中等{background:#f8eedb;color:var(--mid)}
.chip.d-困难{background:#f8e3e1;color:var(--hard)}
.chip.must{background:var(--hard);color:#fff}
.chip.ali{background:#fde9dc;color:#c2521b}
.pmain h2{font-size:22px;line-height:1.35;margin:4px 0 8px}
.pmain h2 .no{display:inline-block;font-size:13px;color:#fff;background:hsl(var(--h) 55% 42%);border-radius:7px;padding:1px 7px;margin-right:8px;vertical-align:3px}
.desc{margin:0 0 10px;font-size:15.5px}
.ex{background:#f3f5f1;border-radius:12px;padding:8px 11px;font-size:13.5px}
.ex div{display:flex;gap:8px;align-items:baseline}
.ex b{flex:0 0 auto;font-size:12.5px;color:var(--muted)}
.ex code{font:13px/1.55 ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.think{margin-top:12px;font-size:13.5px;color:var(--muted);border-left:3px solid hsl(var(--h) 60% 50%);padding-left:9px}
.rail{position:absolute;right:8px;bottom:84px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:5}
.rb{display:flex;flex-direction:column;align-items:center;background:none;border:0;color:#fff;text-decoration:none;cursor:pointer;padding:0}
.rb span{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;font-size:25px;transition:transform .15s,background .2s,box-shadow .2s}
.rb i{font-style:normal;font-size:11.5px;margin-top:3px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.rb:active span{transform:scale(.88)}
.rb.on span{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.edge{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;z-index:4}
.edge button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:999px;padding:7px 14px;font:600 14px/1 inherit;cursor:pointer;backdrop-filter:blur(4px)}
.edge .up{color:#fff;font-size:12.5px;opacity:.85;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
/* explain / recall */
.phd{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 10px}
.phd b{font-size:16px}
.phd button,.phd span{min-width:64px}
.phd button{background:#eef2ee;border:0;border-radius:999px;padding:4px 10px;font:13px inherit;color:var(--ink);cursor:pointer}
.phd span{display:inline-block}
.hookbig{background:linear-gradient(135deg,#fff3c4,#ffe28a);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:600;line-height:1.55;margin-bottom:10px}
.tpl{font-size:13.5px;background:#eef4f1;border-radius:10px;padding:8px 10px;margin-bottom:10px}
.sec{margin:10px 0}
.sec>b{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.sec p{margin:0}
.cx{display:grid;gap:6px;margin:10px 0}
.cx div{background:#f3f5f1;border-radius:10px;padding:7px 10px;font-size:13.5px}
.cx b{color:hsl(var(--h) 55% 38%);margin-right:6px}
.foot{display:flex;gap:8px;margin-top:14px}
.big{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;background:hsl(var(--h) 58% 40%);color:#fff;border:0;border-radius:14px;padding:11px 12px;font:600 15px/1.2 inherit;text-decoration:none;cursor:pointer}
.big.ghost{background:#eef2ee;color:var(--ink)}
.big.lc{background:#1f2328}
.big:active{transform:scale(.97)}
.hint{background:#fff8e1;border-radius:10px;padding:7px 10px;font-size:13.5px;margin-bottom:10px}
.hint summary{cursor:pointer;color:#8a5413}
.hint p{margin:6px 0 0;font-weight:600}
.draft{display:block;width:100%;box-sizing:border-box;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:10px;font:16px/1.5 ui-monospace,Menlo,monospace;background:#fbfcfa;resize:vertical;tab-size:4}
.draft:focus{outline:2px solid hsl(var(--h) 60% 50%);border-color:transparent}
.btns{display:flex;gap:8px;margin:10px 0}
.ansbar{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.ansbar b{font-size:14px;margin-right:auto}
.ansbar .cnt{font-size:12px;color:var(--muted)}
.ansbar button{background:#eef2ee;border:0;border-radius:999px;padding:4px 11px;font:13px inherit;color:var(--ink);cursor:pointer}
.ansbar button[data-rv=next]{background:hsl(var(--h) 58% 40%);color:#fff}
.pane pre.code{font-size:12.2px;margin:8px 0;cursor:pointer}
.pane pre.code .ln{white-space:pre-wrap;overflow-wrap:anywhere;padding:0 10px 0 32px}
.pane pre.code .ln::before{width:24px}
.pane pre.code .ln.hide::after{left:32px}
.pane pre.code .ln.hit{background:#dff3e6}
.pane pre.code .ln.miss{background:#fbe1de}
.pane pre.code .ln.near{background:#fdf1cc}
.score{font-size:14px;margin:4px 0 0;min-height:4px}
.score .pct{font-size:22px;font-weight:700;color:hsl(var(--h) 55% 38%);margin-right:6px}
.grade{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.grade span{width:100%;font-size:13px;color:var(--muted)}
.grade button{flex:1;background:#f3f5f1;border:0;border-radius:12px;padding:10px 4px;font:600 14px inherit;cursor:pointer}
.grade button:active{transform:scale(.95)}
.grade button.on{background:hsl(var(--h) 58% 40%);color:#fff}
.nextbtn{margin-top:10px}
/* demo inside panes */
.pane .anim{padding:10px;margin:6px 0;border-radius:12px}
.pane .stage{overflow:hidden;min-height:0}
.pane .stage svg{height:auto}
.pane .arr{gap:3px;padding:22px 0 18px}
.pane .arr .cell{flex:1 1 0;min-width:15px;max-width:44px;padding:0 1px;font-size:12px;overflow:visible}
.pane .grid .cell{min-width:26px;height:28px;font-size:12px}
.pane .ll .node{min-width:30px;height:30px;font-size:13px}
.pane .ll .arrow{width:16px;font-size:14px}
.pane .anim .ah{gap:6px}
.pane .anim .ah code{font-size:12.5px;overflow-wrap:anywhere}
.pane .anim .ah b{font-size:13px}
.pane .anim .ah .btn{padding:4px 10px;font-size:13px}
.pane .note{font-size:13.5px}
.pane .vizbox .grid{row-gap:16px;padding-top:16px}
/* end slide */
.endslide .pane{display:flex;align-items:center}
.endslide .card{width:100%;text-align:center}
.endslide h2{font-size:24px;margin:6px 0}
.endstats{display:flex;justify-content:center;gap:16px;margin:14px 0;font-size:14px}
.endstats div{display:flex;flex-direction:column;align-items:center}
.endstats b{font-size:26px}
.endslide .big{width:100%;margin-top:8px}
/* sheet */
#sheet{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none}
#sheet.on{display:block}
#sheet .body{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:#d4dad5;margin:4px auto 8px}
#sheet h3{font-size:16px;margin:10px 0 8px}
.srow{display:flex;align-items:flex-start;gap:10px;margin:10px 0}
.srow>b{flex:0 0 58px;font-size:14px;padding-top:5px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{background:#f1f4f1;border:1px solid transparent;border-radius:999px;padding:5px 11px;font:13.5px inherit;cursor:pointer;color:var(--ink)}
.opts button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.map button{height:34px;border:0;border-radius:8px;font:12px ui-monospace,Menlo,monospace;background:#eceff0;color:#4b5853;cursor:pointer}
.map button.s2{background:#cfeedd;color:#1f6b45}
.map button.s1{background:#fbeccb;color:#8a5f0a}
.map button.s0{background:#f8d9d5;color:#9b3129}
.map button.cur{outline:2px solid var(--ink)}
.legend{display:flex;gap:10px;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* guide */
#guide{position:absolute;inset:0;z-index:50;background:rgba(10,12,16,.78);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
#guide.on{display:flex}
#guide .gbox{background:#fff;border-radius:22px;padding:18px 18px 16px;width:100%;max-width:380px}
#guide h3{margin:0 0 10px;font-size:19px;text-align:center}
.g{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #eef1ee;font-size:14.5px}
.g:last-of-type{border-bottom:0}
.g .hand{flex:0 0 44px;height:44px;border-radius:12px;background:#f2f5f2;display:flex;align-items:center;justify-content:center;font-size:24px}
.g .hand span{display:inline-block}
.g .hand.up span{animation:gu 1.4s ease-in-out infinite}
.g .hand.left span{animation:gl 1.4s ease-in-out infinite}
.g .hand.right span{animation:gr 1.4s ease-in-out infinite}
@keyframes gu{0%,100%{transform:translateY(7px)}50%{transform:translateY(-7px)}}
@keyframes gl{0%,100%{transform:translateX(7px)}50%{transform:translateX(-7px)}}
@keyframes gr{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
.g small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
#guide .big{width:100%;margin-top:12px;background:#176c63}
/* toast and burst */
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);z-index:60;background:rgba(20,22,26,.86);color:#fff;border-radius:16px;padding:10px 18px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.fly{position:fixed;z-index:70;font-size:24px;pointer-events:none;animation:fly .95s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--rot))}}
/* desktop side hints */
#side{display:none}
@media (min-width:900px){
  #side{display:block;position:fixed;left:calc(50% + 260px);top:50%;transform:translateY(-50%);color:#cfd6d2;font-size:13.5px;line-height:2}
  #side .kbd{background:#2a2f36;border:1px solid #3a4048;border-radius:5px;padding:0 6px;color:#fff;font:12px ui-monospace,Menlo,monospace}
  #app{border-left:1px solid #222;border-right:1px solid #222}
}
@media (prefers-reduced-motion:reduce){.slide.in .pmain .card,.edge .up,.g .hand span{animation:none}}
/* v2 learning features */
.hidden{display:none!important}
.chip.again{background:#2b2f36;color:#fff}
.quiz{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.qh{font-size:13.5px;color:var(--muted);margin-bottom:4px}
.qq{font-weight:600;font-size:14.5px;margin:6px 0}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qlist{display:flex;flex-direction:column;gap:6px}
.qopts button,.qlist button{background:#f2f5f2;border:1.5px solid transparent;border-radius:12px;padding:9px 8px;font:14px/1.35 inherit;color:var(--ink);cursor:pointer}
.qlist button{text-align:left;padding:9px 11px;font-size:13.5px}
.qopts button:active,.qlist button:active{transform:scale(.97)}
.qopts button.right,.qlist button.right{background:#dff3e6;border-color:var(--easy)}
.qopts button.wrong,.qlist button.wrong{background:#fbe1de;border-color:var(--hard)}
.qopts button:disabled,.qlist button:disabled{color:var(--ink);cursor:default}
.qr{font-size:13.5px;margin-top:6px}
.qdone p{margin:10px 0 4px;font-size:14px}
.qdone .foot{margin-top:8px}
.seg2{display:flex;background:#eef2ee;border-radius:12px;padding:3px;margin-bottom:10px}
.seg2 button{flex:1;border:0;background:none;border-radius:9px;padding:7px;font:600 14px inherit;color:var(--muted);cursor:pointer}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.ctl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ctl button{background:#eef2ee;border:0;border-radius:999px;padding:3px 10px;font:13px inherit;color:var(--ink);cursor:pointer}
.ctl button.on{background:hsl(var(--h) 58% 40%);color:#fff}
.ctl .ccnt{margin-left:auto}
.pane pre.code.cz{cursor:default;line-height:1.9}
.bk{display:inline-block;height:1.3em;vertical-align:-4px;max-width:100%;border:0;border-radius:5px;background:repeating-linear-gradient(90deg,hsl(var(--h) 60% 87%) 0 7px,hsl(var(--h) 55% 79%) 7px 14px);cursor:pointer;padding:0;margin:0 1px}
.bk:active{transform:scale(.94)}
.bk-on{background:#fff1bd;border-radius:4px;animation:flash .6s}
@keyframes flash{from{background:#ffcf4a}}
.tip{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.sib{display:flex;flex-direction:column;gap:6px}
.sib button{display:flex;gap:8px;align-items:flex-start;text-align:left;background:#f6f8f5;border:0;border-radius:12px;padding:8px 10px;font:13px/1.45 inherit;color:var(--ink);cursor:pointer}
.sib .sno{flex:0 0 auto;font:600 12px ui-monospace,Menlo,monospace;background:hsl(var(--h) 55% 42%);color:#fff;border-radius:6px;padding:1px 6px;margin-top:1px}
.sib .stx{flex:1}
.sib .stx b{display:block;font-size:13.5px}
.sib .sst{flex:0 0 auto}
#due{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:999px;padding:1px 9px;font:12px inherit;cursor:pointer;margin-right:4px}
.quiz>div{scroll-margin-top:96px;scroll-margin-bottom:84px}
.prec,.pexp,.mscroll{-webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent calc(env(safe-area-inset-top) + 66px),#000 calc(env(safe-area-inset-top) + 84px));mask-image:linear-gradient(to bottom,transparent 0,transparent calc(env(safe-area-inset-top) + 66px),#000 calc(env(safe-area-inset-top) + 84px))}
/* v3 explain pane */
.toc{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}
.toc button{background:#eef2ee;border:0;border-radius:999px;padding:3px 10px;font:12.5px inherit;color:var(--ink);cursor:pointer}
.xq{background:#f4f7f3;border-radius:12px;padding:8px 11px;margin:8px 0}
.xq b{display:block;font-size:13px;color:hsl(var(--h) 50% 34%);margin-bottom:2px}
.xq p{margin:0;font-size:14.5px}
.xq.ob{background:#eef4fb}
.xq.vs{background:#f6f0fb}
.steps{margin:4px 0 0;padding-left:22px}
.steps li{margin:3px 0;font-size:14.5px}
.steps li::marker{color:hsl(var(--h) 55% 40%);font-weight:700}
.pit{margin:4px 0 0;padding-left:20px}
.pit li{margin:3px 0;font-size:14px;color:#7a2f28}
.run{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fbfcfa}
.rctl{display:flex;gap:4px;flex-wrap:wrap}
.rctl button{flex:1;min-width:36px;background:#eef2ee;border:0;border-radius:9px;padding:6px 4px;font:600 13px inherit;color:var(--ink);cursor:pointer}
.rctl button.pri{flex:2;background:hsl(var(--h) 58% 40%);color:#fff}
.rctl .spd{flex:0 0 42px}
.rsl{width:100%;margin:8px 0 4px;touch-action:none;accent-color:hsl(var(--h) 58% 40%)}
.rhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px;font-size:12px;color:var(--muted);margin-bottom:4px}
.rstack span{background:#eceff0;border-radius:6px;padding:0 6px;font-family:ui-monospace,Menlo,monospace}
.rstack span.on{background:hsl(var(--h) 58% 40%);color:#fff}
.rstack b{margin:0 2px;font-weight:400}
.rcode{position:relative;max-height:236px;overflow-y:auto;overscroll-behavior:contain;border-radius:8px}
.rcode pre.code{margin:0;font-size:11.8px}
.pane .rcode pre.code .ln.cur{background:#ffe9a0}
.pane .rcode pre.code .ln.done{background:#e0f2e6}
.rret{font-size:13px;color:#7a4d00;margin:4px 0}
.rret:empty{display:none}
.rvis{margin:6px 0}
.rvis:empty{display:none}
.rll{display:flex;flex-wrap:wrap;align-items:center;row-gap:20px;padding:18px 0 4px}

d15", "d16", "d17", "d18", "d19", "d20", "d21", "d22", "d23", "d24", "d25", "d26", "d27", "d28", "d29", "d30", "d31", "d32", "d33", "d34", "d35", "d36", "d37", "d38", "d39", "d40", "d41", "d42", "d43", "d44", "d45", "d46", "d47", "d48", "d49", "d50", "d51", "d52", "d53", "d54", "d55", "d56", "d57", "d58", "d59", "d60", "d61", "d62", "d63", "d64", "d65", "d66", "d67", "d68", "d69", "d70", "d71", "d72", "d73", "d74", "d75", "d76", "d77", "d78", "d79", "d80", "d81", "d82", "d83", "d84"]}], "cards": [{"topic": "机器学习基础", "q": "机器学习到底在做什么？", "key": "用数据自动调参数，让一个函数的输出贴近真实答案", "plain": "你做数据清洗时，常写规则把脏值改对。机器学习不手写规则，而是给一个带参数的函数和一堆有答案的样本，让程序自动调参数，使函数的输出尽量接近答案。调好之后，函数就能给新样本输出预测。", "a": ["模型是一个带参数的函数，例如直线 ŷ = w·x + b，w 和 b 是参数。", "损失函数衡量预测和真实答案差多少，例如误差平方的平均。", "训练就是找让损失最小的参数，最常用的方法是梯度下降。", "预测时把新样本的特征代入训练好的函数，得到输出。"], "terms": ["参数", "损失函数", "训练", "梯度下降", "预测"], "viz": "linreg", "tag": "入门", "id": "i1"}, {"topic": "机器学习基础", "q": "损失函数和梯度下降是什么？学习率起什么作用？", "key": "梯度指向损失上升最快的方向，沿反方向走一小步", "plain": "损失是参数的函数。梯度是这个函数在当前参数处的斜率，沿梯度的反方向移动参数，损失就下降。每一步移动多少由学习率决定，太小收敛慢，太大会越过最低点，甚至越走越高。", "a": ["梯度是损失对每个参数的偏导数组成的向量，指向损失增加最快的方向。", "梯度下降每一步把参数减去学习率乘梯度。", "学习率太小收敛慢，太大会在谷底两侧振荡甚至发散。", "实际训练每步只用一小批样本估计梯度，叫随机梯度下降，Adam 等优化器在此基础上自适应地调整步长。"], "terms": ["梯度", "偏导数", "学习率", "发散", "随机梯度下降", "Adam"], "viz": "gd", "f": ["θ ← θ − η · ∇L(θ)"], "tag": "入门", "id": "i2"}, {"topic": "机器学习基础", "q": "什么是过拟合和欠拟合？怎么判断和缓解？", "key": "训练误差小测试误差大是过拟合，两个都大是欠拟合", "plain": "过拟合是模型把训练数据里的随机噪声也拟合进去了，在训练数据上误差很小，换一批新数据误差就变大。欠拟合是模型太简单，连训练数据里的主要规律都没有拟合好。判断的关键是看模型在没见过的数据上的表现。", "a": ["欠拟合是模型太简单，训练误差和测试误差都大。", "过拟合是模型太复杂，把训练数据里的噪声也拟合了，训练误差很小、测试误差大。", "缓解过拟合可以增加数据、降低模型复杂度、加正则化（L1、L2、Dropout）、早停。", "要用模型没见过的验证集来判断，不能只看训练误差。"], "terms": ["欠拟合", "过拟合", "噪声", "正则化", "Dropout", "早停", "验证集"], "viz": "poly", "tag": "入门", "id": "i3"}, {"topic": "机器学习基础", "q": "分类模型怎样输出概率？逻辑回归是什么？", "key": "先算线性分数，再用 sigmoid 压到 0 到 1 之间", "plain": "要判断一个客户会不会违约，可以先给他算一个分数，分数越高越危险。sigmoid 函数把任意分数变成 0 到 1 之间的数，当作违约概率。", "a": ["逻辑回归先计算 z = w·x + b，再输出 p = σ(z)，σ 是 sigmoid 函数。", "训练用交叉熵损失，也就是让真实标签的预测概率尽量大。", "多分类时用 softmax 把多个分数变成和为 1 的概率。", "虽然叫回归，逻辑回归是分类模型，在风控评分卡里非常常用。"], "terms": ["sigmoid", "交叉熵", "softmax", "评分卡"], "viz": "sigmoid", "f": ["p = σ(w·x + b) = 1 / (1 + e^{−(w·x+b)})"], "tag": "入门", "id": "i4"}, {"topic": "机器学习基础", "q": "决策树怎么做预测？怎么选择切分？", "key": "一连串的是非问题，每次选让两边最“纯”的切分", "plain": "决策树是一串是非判断，先判断“收入是否大于一万”，再根据结果判断下一个条件，最后落到一个叶子上给出预测。每次选的判断条件，是能把好坏样本分得最干净的那个。", "a": ["决策树从根节点开始，每个内部节点按一个特征和阈值把样本分成两部分。", "选择切分的标准是让子节点尽量纯，分类常用 Gini 系数或信息增益，回归用平方误差。", "树太深会过拟合，要限制深度、叶子样本数，或做剪枝。", "单棵树不稳定，实际常用多棵树组成随机森林或梯度提升树。"], "terms": ["特征", "阈值", "Gini", "信息增益", "剪枝", "随机森林"], "viz": "tree", "tag": "入门", "id": "i5"}, {"topic": "机器学习基础", "q": "Bagging 和 Boosting 有什么区别？", "key": "Bagging 并行投票降方差，Boosting 串行纠错降偏差", "plain": "多个模型组合有两种方式。一种是在不同的抽样数据上各自独立训练很多个模型，预测时投票或平均，这是 Bagging，代表是随机森林。另一种是一个接一个地训练，后面的模型专门拟合前面模型的残差，这是 Boosting，代表是 GBDT、XGBoost。", "a": ["Bagging 对训练集有放回抽样得到多份数据，各训练一个模型，预测时平均或投票，主要降低方差。", "随机森林在 Bagging 基础上，每次分裂还随机挑一部分特征。", "Boosting 串行训练，每个新模型重点拟合前面模型的残差或错误，主要降低偏差。", "表格任务上梯度提升树通常是最强的传统方法。"], "terms": ["有放回抽样", "方差", "随机森林", "残差", "偏差", "梯度提升树"], "viz": "gbdt", "tag": "入门", "id": "i6"}, {"topic": "神经网络", "q": "神经网络是什么？激活函数有什么用？", "key": "一层层的加权求和加非线性，叠起来能拟合复杂函数", "plain": "一个神经元就是把输入乘上权重加起来，再过一个非线性函数。很多神经元组成一层，很多层叠起来就是神经网络。逻辑回归可以看作只有一个神经元的网络。", "a": ["每个神经元计算 z = Σ w_i·x_i + b，再输出 h = f(z)，f 是激活函数。", "常用激活函数有 ReLU、Sigmoid、GELU。", "没有激活函数，多层线性变换叠起来仍然等价于一层线性变换，表达能力不会增加。", "训练就是用梯度下降调整所有层的权重。"], "terms": ["神经元", "权重", "激活函数", "ReLU", "GELU", "线性变换"], "viz": "mlp", "tag": "入门", "id": "i7"}, {"topic": "神经网络", "q": "反向传播是怎么计算梯度的？", "key": "正向算损失，反向用链式法则把梯度一层层传回去", "plain": "网络有成百上千万个参数，要知道每个参数该往哪边调。反向传播先正常算一遍得到损失，然后从损失开始往回推，每经过一个计算步骤就乘上这一步的导数，很快就能得到每个参数的梯度。", "a": ["正向传播按顺序计算每层输出，最后得到损失。", "反向传播从损失开始，按链式法则逐层计算损失对中间结果和参数的偏导数。", "每个参数的梯度算出后，用优化器统一更新。", "PyTorch 记录计算图后，调用 loss.backward() 会自动完成反向传播。"], "terms": ["正向传播", "链式法则", "偏导数", "计算图", "backward"], "viz": "backprop", "f": ["∂L/∂w = ∂L/∂z · ∂z/∂w"], "tag": "入门", "id": "i8"}, {"topic": "神经网络", "q": "训练集、验证集、测试集和交叉验证分别做什么？", "key": "训练集调参数，验证集挑模型，测试集最后打分", "plain": "训练集用来调参数。验证集用来比较不同模型和超参数，挑出最好的那个。测试集在一切确定之后只用一次，给出最终分数。如果反复看测试集来调整，测试分数就会偏乐观，不再可信。", "a": ["训练集用来拟合模型参数。", "验证集用来选超参数、比较模型、决定何时早停。", "测试集只在流程全部确定后评估一次。", "K 折交叉验证把数据分成 K 份轮流当验证集，结果更稳，适合数据少的情况。"], "terms": ["训练集", "验证集", "测试集", "超参数", "K 折交叉验证"], "viz": "kfold", "tag": "入门", "id": "i9"}, {"topic": "大模型基础", "q": "嵌入（Embedding）是什么？", "key": "把词或类别映射成一个可训练的向量", "plain": "模型只能处理数字。“猫”这个词怎么变成数字？嵌入给每个词分配一个向量，比如 768 个数。训练之后，意思相近的词向量也相近，计算机就能比较词之间的关系。", "a": ["嵌入是一个查找表，词表里每个 token 对应一行向量。", "嵌入向量是模型参数，随训练一起更新。", "向量之间用点积或余弦相似度衡量相似程度，这也是向量检索的基础。", "表格模型里的类别特征也常用嵌入表示，比 one-hot 更紧凑。"], "terms": ["查找表", "token", "余弦相似度", "向量检索", "one-hot"], "viz": "embed", "tag": "入门", "id": "i10"}, {"topic": "大模型基础", "q": "注意力机制在做什么？", "key": "每个位置按相关程度加权汇总其他位置的信息", "plain": "在句子“小明把苹果给了她，因为她饿了”里，“她”的含义取决于前面的词。注意力让每个词计算它和其他每个词的相关程度，再按这个程度把其他词的信息加权合并到自己的表示里。", "a": ["每个 token 生成查询 Q、键 K、值 V 三个向量。", "查询和所有键做点积得到相关分数，除以 √d 后做 softmax 得到权重。", "用这些权重对值向量加权求和，得到这个 token 的新表示。", "多头注意力并行做多组，每组关注不同的关系。语言模型生成时加因果掩码，只能看前面的词。"], "terms": ["查询", "键", "值", "softmax", "多头注意力", "因果掩码"], "viz": "attn", "f": ["Attention(Q, K, V) = softmax(QKᵀ / √d) · V"], "tag": "入门", "id": "i11"}, {"topic": "大模型基础", "q": "Transformer 的一层里有哪些部分？", "key": "注意力加前馈网络，每个子层都有残差和归一化", "plain": "Transformer 是现在大模型的基本结构，由很多相同的层堆起来。每一层先让各个位置互相交流信息（注意力），再让每个位置各自加工一下（前馈网络）。", "a": ["每层包含多头自注意力和前馈网络两个子层。", "每个子层外面有残差连接，输出等于输入加上子层的变化，让很深的网络也能训练。", "每个子层配一个归一化，现代大模型常用放在子层前面的 RMSNorm。", "堆叠几十层后接输出层，语言模型输出下一个词的概率。"], "terms": ["自注意力", "前馈网络", "残差连接", "RMSNorm", "堆叠"], "viz": "tflayer", "tag": "入门", "id": "i12"}, {"topic": "大模型基础", "q": "语言模型是怎样一个词一个词生成文本的？", "key": "每步输出下一个词的概率分布，按某种策略选一个，接到后面再继续", "plain": "语言模型就是不断回答“下一个词是什么”。它给词表里每个词一个概率，挑一个接到句子后面，再把新句子输进去预测下一个词，直到生成结束符。", "a": ["模型输出每个词的 logits，经过 softmax 变成概率分布。", "贪心解码每步选概率最大的词，采样则按概率随机选。", "温度、top-k、top-p 控制采样的随机程度。", "生成时会缓存前面词的键和值（KV 缓存），避免重复计算。"], "terms": ["logits", "softmax", "贪心", "温度", "top-p", "KV 缓存"], "viz": "sampling", "tag": "入门", "id": "i13"}, {"topic": "大模型基础", "q": "预训练、微调和上下文学习有什么区别？", "key": "预训练打基础，微调改参数适配任务，上下文学习不改参数只给例子", "plain": "预训练在海量文本上训练，得到通用的语言能力。微调用少量带标注的数据继续训练，会改变模型参数，让它适配具体任务。上下文学习不改参数，只在输入里放几个例子，模型按例子的格式对新输入给出结果。", "a": ["预训练在海量数据上用自监督目标训练，消耗算力最多。", "监督微调用带标注的示范数据继续训练，参数会更新。", "偏好对齐用 RLHF 或 DPO 让输出更符合人的偏好。", "上下文学习不更新参数，把示例放进输入，模型在一次前向中完成新任务。TabPFN 对表格就是这种方式。"], "terms": ["预训练", "自监督", "监督微调", "RLHF", "DPO", "上下文学习"], "viz": "learnmodes", "tag": "入门", "id": "i14"}, {"topic": "表格模型入门", "q": "表格数据和图像、文本有什么不同？", "key": "列各有含义、类型混合、行列顺序无意义、样本量常常不大", "plain": "你天天处理的表格，和图像、文本差别很大。图像的相邻像素有关系，文本的词序有意义，而表格的列可以随便换顺序，每列单位和含义都不一样，还混着数值、类别和缺失。", "a": ["表格每列是不同的特征，有不同的单位、分布和含义，不能像像素那样一视同仁。", "数值、类别、时间、缺失混在一起，需要专门的编码。", "行和列的顺序没有意义，模型应该对它们不敏感。", "很多业务表只有几千到几十万行，深度模型容易过拟合，所以树模型长期占优，表格基础模型借助预训练弥补这一点。"], "terms": ["特征", "类别", "缺失", "顺序", "树模型", "表格基础模型"], "cmp": {"head": ["", "图像", "文本", "表格"], "rows": [["基本单位", "像素", "token", "单元格"], ["顺序是否有意义", "空间位置有意义", "词序有意义", "行列顺序都无意义"], ["数据类型", "统一的数值", "统一的离散符号", "数值、类别、缺失混合"], ["传统强方法", "卷积网络、ViT", "Transformer", "梯度提升树"]]}, "tag": "入门", "id": "i15"}, {"topic": "表格模型入门", "q": "用一句话说清什么是表格基础模型？", "key": "在海量合成或真实表格上预训练，新表不用训练，放进上下文就能预测", "plain": "传统做法是每张新表都训练一个 XGBoost 并调参。表格基础模型先在几亿张表上预训练好，遇到新表时，把有标签的行整个放进输入，模型直接给出没标签行的预测，和大语言模型根据示例完成任务的方式相同。", "a": ["代表模型有 TabPFN 系列、TabICL、TabDPT、LimiX 等。", "它们大多用 Transformer，在行和列上做注意力。", "预训练数据可以是按因果图生成的合成表格，也可以是真实表格。", "优势是小数据上准、不需要调参、速度快，挑战是扩展到大表和线上部署。"], "terms": ["TabPFN", "TabICL", "Transformer", "合成表格", "不需要调参"], "viz": "pfn", "tag": "入门", "id": "i16"}, {"topic": "表格模型入门", "q": "精确率、召回率、AUC 应该怎么理解？", "key": "精确率是抓得准不准，召回率是抓得全不全，AUC 看整体排序", "plain": "风控里要找出坏人。精确率回答“被模型标成坏人的里面，有多少真是坏人”，召回率回答“所有坏人里，被找出来了多少”。两者常常此消彼长，阈值定严了精确率高、召回率低。", "a": ["精确率等于 TP 除以 (TP + FP)，召回率等于 TP 除以 (TP + FN)。", "F1 是两者的调和平均。", "AUC 是随机抽一个正样本和一个负样本，正样本得分更高的概率，和阈值无关。", "样本不平衡时准确率会误导，要看精确率、召回率、AUC 和 KS。"], "terms": ["精确率", "召回率", "F1", "AUC", "不平衡"], "viz": "roc", "f": ["P = TP / (TP + FP)", "R = TP / (TP + FN)"], "tag": "入门", "id": "i17"}, {"topic": "表格模型入门", "q": "缺失值为什么麻烦？有哪几类？", "key": "缺失的原因决定处理方法，完全随机、依赖其他列、依赖自身", "plain": "你做数据清洗时一定遇到过大量空值。处理之前要先想清楚它为什么空。如果空值是随机出现的，删掉或填均值问题不大。如果是收入高的人故意不填，填均值就会把整体收入估低。", "a": ["MCAR 完全随机缺失，删除不会引入偏差。", "MAR 缺失只依赖其他已观测的列，可以用其他列建模填补。", "MNAR 缺失依赖缺失值本身，需要对缺失机制建模或补充信息。", "“是否缺失”本身常常有预测价值，可以加缺失指示列，树模型和 TabPFN v2 都能直接处理缺失。"], "terms": ["MCAR", "MAR", "MNAR", "缺失指示列"], "viz": "missing", "tag": "入门", "id": "i18"}, {"topic": "表格基础模型", "q": "什么是 PFN（Prior-data Fitted Network）？为什么说它在做近似贝叶斯推断？", "key": "在先验采样的海量合成数据集上训练，一次前向就输出后验预测分布", "a": ["PFN 先定义一个生成数据集的先验，从中采样大量合成数据集，每个数据集切成训练部分和测试部分。", "Transformer 把训练部分整个当作上下文输入，学习预测测试样本的标签，损失是测试标签的负对数似然在先验上的期望。", "最小化这个期望损失的最优解，正是该先验下的后验预测分布 p(y | x, D)，所以训练好的网络一次前向就近似完成了贝叶斯推断。", "推理时不更新参数，把新任务的训练集放进上下文即可预测，这就是表格上的 In-Context Learning。"], "terms": ["后验预测分布", "负对数似然", "先验", "In-Context Learning", "一次前向"], "f": ["L(θ) = E_{D∼p(D)} [ −log q_θ(y_test | x_test, D_train) ]", "q_θ*(y | x, D) ≈ p(y | x, D) = ∫ p(y | x, φ) p(φ | D) dφ"], "viz": "pfn", "fq": "PFN 的效果上限由什么决定？", "fa": "由先验决定。先验覆盖的数据生成机制越接近真实任务，近似的后验越有用。所以表格基础模型的核心工作之一是设计先验，也就是合成数据体系。", "tag": "高频", "id": "j1", "plain": "普通做法是每来一张新表就训练一个新模型。PFN 反过来，先用电脑造出几亿张带答案的假表，训练一个 Transformer 专门做“看一张表的已知行，猜未知行的标签”。训练完以后，遇到真实的新表，不用再训练，把已知行整个喂进去，一次前向就给出预测。它猜的方式在数学上等价于贝叶斯推断里的“后验预测”。"}, {"topic": "表格基础模型", "q": "TabPFN v1 的输入、结构、限制和推理方式是什么？", "key": "每行一个 token，测试行只看训练行，小数据一秒出结果", "a": ["TabPFN v1 发表于 ICLR 2023，面向小规模表格分类。", "每个样本整行线性嵌入成一个 token，训练样本带上标签嵌入。训练样本之间互相注意，测试样本只注意训练样本，测试样本之间不互相看。", "限制是训练样本不超过 1000 条、特征不超过 100 个、类别不超过 10 个，只做分类。", "先验由结构因果模型和贝叶斯神经网络组成，并偏好简单的数据生成机制。", "推理不调参，靠对特征顺序、类别顺序和预处理做多次变换后集成来降低偏差，小数据集上达到调参一小时的 AutoML 水平。"], "terms": ["1000", "100", "10", "结构因果模型", "贝叶斯神经网络", "集成"], "viz": "pfn", "tag": "必背", "id": "j2", "plain": "TabPFN v1 是第一代。一行数据被当成一个词，已知标签的训练行之间互相参考，要预测的测试行只参考训练行。它只能处理小表，最多 1000 行、100 列、10 个类别，但在这种小表上一秒钟就能达到调参一小时的效果。"}, {"topic": "表格基础模型", "q": "TabPFN v2 相比 v1 做了哪些关键改进？", "key": "每个单元格一个表示，行内看特征、列内看样本的双向注意力，规模扩到一万行五百列", "a": ["TabPFN v2 于 2025 年 1 月发表在 Nature。", "结构上每个单元格有自己的表示，每层交替做两种一维注意力，一种在同一行内跨特征，一种在同一列内跨样本，测试样本同样只看训练样本。", "规模扩到 10,000 个训练样本和 500 个特征，并支持回归。", "先验改为基于随机计算图的结构因果模型，生成了约 1.3 亿个合成数据集，覆盖缺失值、类别特征、异常值和无信息特征，所以原生支持这些情况。", "论文报告在分类任务上用 2.8 秒超过调参 4 小时的最强基线集成，还能做微调、生成数据、密度估计和提取嵌入。"], "terms": ["Nature", "双向注意力", "10,000", "500", "回归", "1.3 亿", "2.8 秒", "4 小时"], "cmp": {"head": ["", "TabPFN v1", "TabPFN v2"], "rows": [["token 单位", "一行一个", "一个单元格一个"], ["注意力", "样本之间", "行内跨特征加列内跨样本"], ["规模上限", "1000 行、100 列", "10,000 行、500 列"], ["任务", "分类", "分类和回归"], ["缺失值和类别", "不擅长", "先验中覆盖，原生支持"]]}, "viz": "pfn", "tag": "必背", "id": "j3", "plain": "v2 把粒度从“一行”细化到“一个格子”。每个格子既看同一行的其他列，也看同一列的其他训练行，这叫双向注意力。表的规模放大到一万行、五百列，还能做回归，并且造假表时就加入了缺失值、类别列、异常值，所以真实表里这些脏情况它都能直接处理。"}, {"topic": "表格基础模型", "q": "TabPFN-2.5 又往哪个方向推进？", "key": "规模再扩约二十倍单元格，并能蒸馏成小模型部署", "a": ["Prior Labs 在 2025 年底发布 TabPFN-2.5，把支持规模扩到约 50,000 个样本、2,000 个特征，可处理的单元格数约为 v2 的 20 倍。", "技术报告在 TabArena 上评测，显示它在中小规模数据上和调参加集成后的强基线竞争。", "它提供蒸馏能力，把 TabPFN 的预测能力迁移到 MLP 或树集成上，解决在线推理延迟的问题。", "面试时把版本演进讲成一条线，v1 证明可行，v2 换结构和先验扩到中等规模，2.5 继续扩规模并解决部署。"], "terms": ["50,000", "2,000", "20 倍", "蒸馏", "TabArena"], "fq": "为什么部署时需要蒸馏？", "fa": "TabPFN 预测时要把整个训练集放进上下文，计算量随训练样本数增长，在线逐条打分的延迟和成本高。蒸馏成树或 MLP 后，推理只依赖小模型。", "tag": "高频", "id": "j4", "plain": "2.5 是 v2 的放大版，能吃下大约五万行、两千列的表。另一个重点是部署，它可以把自己的能力“压缩”给一个小的树模型或 MLP，线上打分时只跑小模型，速度快。"}, {"topic": "表格基础模型", "q": "TabPFN 的合成先验数据是怎样生成的？", "key": "随机建因果图，从根节点噪声出发逐层传播，挑节点当特征和标签，再加缺失和离散化", "a": ["先随机生成一张有向无环图，图的节点是变量。", "根节点采样噪声，沿着边用随机函数向下传播，函数可以是小神经网络、决策树或离散化等操作，并加入噪声。", "从图里随机选一部分节点当特征、一个节点当标签，标签离散化后得到分类任务。", "再做后处理，例如随机置缺失、把部分特征变成类别、加入异常值和无信息特征、随机扭曲数值分布。", "因为变量之间是因果关系生成的，模型在预训练里见到的就是“特征和标签之间存在机制”的数据，这比完全随机的函数更接近真实表格。"], "terms": ["有向无环图", "根节点", "随机函数", "特征", "标签", "缺失"], "viz": "scm", "tag": "必背", "id": "j5", "plain": "造假表的过程像一个随机的因果故事。先随机画一张“谁影响谁”的箭头图，比如年龄影响收入、收入影响是否违约。从源头随机取值，沿着箭头用随机函数算出下游的值，再挑几个节点当表的列、挑一个当标签。最后像真实数据一样故意弄脏，随机挖掉一些格子、把一些数变成类别。"}, {"topic": "表格基础模型", "q": "TabPFN 怎样做回归？为什么能输出整个预测分布？", "key": "把连续目标切成很多桶，输出每个桶的概率，相当于一条分段常数密度", "a": ["TabPFN 把目标值的范围切分成许多区间，输出层对每个区间给出概率，组合成分段常数的密度，论文称为条形分布。", "训练仍然用负对数似然，所以回归和分类共享同一套交叉熵式的训练方式。", "有了整条分布，可以取均值、中位数或分位数，也能给出预测区间，适合需要不确定性的风控和医疗场景。"], "terms": ["区间", "分段常数", "负对数似然", "分位数", "不确定性"], "viz": "bins", "tag": "高频", "id": "j6", "plain": "分类时模型输出“属于每个类别的概率”。回归的目标是连续的数，TabPFN 把数值范围切成很多小段，比如 0 到 1、1 到 2，输出“落在每一段的概率”。这样得到的是一整条概率分布，不只是一个数，所以能直接说“有 90% 的把握在某个区间内”。"}, {"topic": "表格基础模型", "q": "TabPFN 为什么不需要调参？推理时的集成怎么做？", "key": "超参数被先验和预训练吸收了，推理时对预处理和特征顺序做多份变换再平均", "a": ["传统模型要针对每个数据集调超参数，TabPFN 的“调参”在预训练阶段已经通过先验完成，推理时只需一次前向。", "为了减少对输入表示的敏感，推理时会生成多份变换后的数据，例如打乱特征顺序和类别编号、换不同的数值预处理，分别预测后取平均。", "训练集只需编码一次，可以缓存下来，预测新样本时复用，类似语言模型的 KV 缓存。"], "terms": ["先验", "一次前向", "打乱特征顺序", "取平均", "缓存"], "tag": "高频", "id": "j7", "plain": "调参的意义是让模型适应这个数据集。TabPFN 在造假表训练时已经见过各种各样的数据集，相当于提前把这件事做了，所以拿来就用。为了更稳，它会把同一张表换几种写法，比如打乱列顺序、换个数值变换，各预测一次再取平均。"}, {"topic": "表格基础模型", "q": "表格基础模型为什么要处理好行和列的置换？", "key": "样本顺序和列顺序都不该影响预测，所以样本维不加位置编码、列维靠结构或集成处理", "a": ["一张表的行交换顺序含义不变，所以样本之间的注意力不加位置编码，模型对训练样本的顺序是置换不变的。", "列的顺序同样没有含义，但不同列又必须被区分开。v1 用多次打乱特征顺序再集成来缓解，v2 每个单元格单独表示并在行内做跨特征注意力。", "这也是表格和文本最大的区别，文本的位置信息有意义，表格的位置信息是噪声。"], "terms": ["置换不变", "位置编码", "跨特征注意力", "集成"], "tag": "高频", "id": "j8", "plain": "一张表把第 3 行和第 5 行换个位置，内容完全没变，预测也不该变。列的顺序同样没有意义。文本不一样，“我爱你”和“你爱我”意思不同。所以表格模型不能像语言模型那样给每个位置编号，要专门设计成对行和列的顺序不敏感。"}, {"topic": "表格基础模型", "q": "TabPFN 的规模瓶颈在哪里？大数据上有哪些扩展思路？", "key": "样本之间的注意力随样本数平方增长，靠子采样、检索局部上下文、换结构和蒸馏来扩展", "a": ["所有训练样本都在上下文里，样本维注意力的计算和显存随样本数平方增长，这是主要瓶颈。", "第一种思路是子采样或分块，每次只用一部分训练集做上下文，再集成。", "第二种是检索，对每个测试样本取它的近邻训练样本做局部上下文。", "第三种是换结构，例如 TabICL 先把每行压成一个向量，再在行向量上做上下文学习。", "第四种是部署时蒸馏成树或 MLP。"], "terms": ["平方", "子采样", "近邻", "TabICL", "蒸馏"], "tag": "高频", "id": "j9", "plain": "TabPFN 预测时要让每个测试行和所有训练行逐一比较，训练行翻一倍，比较量翻四倍。表太大就算不动。办法有几种，只拿一部分训练行、只拿和测试行最像的那些行、先把每行压成一个向量再比较，或者部署时换成小模型。"}, {"topic": "表格基础模型", "q": "TabICL 的结构有什么特点？", "key": "先按列嵌入、再按行交互压成行向量、最后在行向量上做上下文学习", "a": ["TabICL 发表于 ICML 2025，目标是把表格上下文学习扩展到大数据。", "第一步对每一列用集合 Transformer 做分布感知的嵌入，第二步在每一行内让特征交互，把整行压缩成固定维度的行向量。", "第三步只在行向量上做样本之间的上下文学习，注意力的单位从单元格变成行，所以能处理到约 50 万样本。", "它同样只用合成数据预训练。"], "terms": ["集合 Transformer", "行向量", "50 万", "合成数据"], "tag": "高频", "id": "j10", "plain": "TabICL 为了处理大表，先把每一行压缩成一个固定长度的向量，再让测试行和训练行的向量比较。比较的单位从“格子”变成“行”，计算量小得多，能处理几十万行。"}, {"topic": "表格基础模型", "q": "TabDPT 和 TabPFN 在训练数据上有什么不同？", "key": "TabPFN 只用合成数据，TabDPT 用真实表格加自监督和检索", "a": ["TabPFN 系列在合成先验上预训练。TabDPT 在大量真实表格上预训练，用随机选一列当目标的自监督任务构造训练样本。", "它在训练和推理时都用检索，为每个查询取近邻样本作为上下文。", "论文展示了随着真实数据量和模型规模增加，效果按规律提升，说明真实数据也能支持表格模型的 Scaling。"], "terms": ["真实表格", "自监督", "检索", "Scaling"], "tag": "高频", "id": "j11", "plain": "TabPFN 只用电脑造的假表训练，TabDPT 用网上收集的真实表格训练。真实表没有现成的“标签列”，它就随机挑一列当成要预测的目标，自己给自己出题。"}, {"topic": "表格基础模型", "q": "怎样用一个模型同时做分类、回归、缺失值填补和生成？", "key": "把整张表看成变量的联合分布，随机遮住一部分单元格让模型补全", "a": ["分类、回归、填补本质都是在已知部分单元格的条件下预测其他单元格。", "如果预训练目标是随机遮住表里的一部分单元格，让模型根据上下文预测被遮住的值，模型拟合的就是变量之间的联合分布。", "推理时遮住标签列就是分类或回归，遮住缺失位置就是填补，逐步采样被遮住的值就是生成。", "2025 年的 LimiX 就采用了这种掩码联合分布建模的思路，岗位描述里分类、回归、缺失值填补和生成并列，指向的正是这种统一建模。"], "terms": ["联合分布", "遮住", "填补", "生成", "LimiX"], "tag": "高频", "id": "j12", "plain": "分类、回归、填缺失、造数据，其实都是“已知一部分格子，猜另一部分格子”。如果训练时就随机遮住表里的一些格子让模型补全，那么遮住标签列就是预测，遮住缺失位置就是填补，一格一格补出整行就是生成。一个模型就能做四件事。"}, {"topic": "表格基础模型", "q": "表格基础模型和直接用大语言模型处理表格有什么区别？", "key": "LLM 要把表格序列化成文本，数值和长表都吃亏，表格基础模型直接在数值单元格上建模", "a": ["大语言模型处理表格要先把每行序列化成文本，数值被切成多个 token，模型对大小关系和精度不敏感。", "上下文长度限制了能放进去的样本数，几百行就很长。", "它的优势是能利用列名和类别值的语义，以及跨任务的世界知识，例如 TabuLa-8B 在大量表格序列化文本上微调 Llama 3 8B。", "表格基础模型直接把单元格数值作为输入，样本规模和数值建模更强，但通常不理解列名语义。两者结合是一个研究方向。"], "terms": ["序列化", "数值", "上下文长度", "列名", "TabuLa-8B"], "tag": "高频", "id": "j13", "plain": "让大语言模型读表，要先把每行写成一句话，比如“年龄是 35，收入是 1.2 万”。数字被拆成好几个字符，模型对大小不敏感，几百行就把上下文塞满了。好处是它看得懂列名的意思。表格基础模型直接读数字，规模和精度强，但不理解列名。"}, {"topic": "表格基础模型", "q": "表格模型上的检索增强怎么做？", "key": "为每个查询检索相似样本当上下文，相当于局部的贝叶斯推断", "a": ["对每个测试样本，在训练集中按距离取 k 个近邻，只把这些近邻放进上下文预测。", "这样做把全局的上下文换成局部上下文，既解决样本太多放不下的问题，也让模型更关注和查询相关的区域。", "可以在检索得到的局部上下文上再微调模型，进一步提升大数据上的效果。", "深度表格模型 TabR 也是检索思路，把近邻的标签和表示融合进预测。"], "terms": ["近邻", "局部上下文", "微调", "TabR"], "tag": "高频", "id": "j14", "plain": "预测一个新客户时，先在历史客户里找出最像他的 50 个，只把这 50 个当参考。这就是检索增强。参考的样本更相关，表再大也放得下。"}, {"topic": "表格基础模型", "q": "结构化数据模型的推理时计算扩展有哪些做法？", "key": "多份预处理集成、更多上下文、检索、测试时微调，都是用推理算力换效果", "a": ["集成，对同一个任务生成多份不同预处理或特征顺序的输入，预测后平均，份数越多越稳。", "上下文扩展，放进更多训练样本，或用检索挑更相关的样本。", "测试时训练，在当前任务的训练集上做少量步数的微调。", "这些方法和 LLM 的推理时扩展类似，代价是推理延迟和算力，部署时要和蒸馏结合。"], "terms": ["集成", "上下文", "检索", "测试时训练", "延迟"], "tag": "高频", "id": "j15", "plain": "训练完的模型参数不变，但预测时多花一点算力也能更准。比如同一张表换几种写法多预测几次再平均，或者多放一些参考样本，或者在当前这张表上再微调几步。代价是预测变慢。"}, {"topic": "树模型与 AutoML", "q": "GBDT 的核心思想是什么？", "key": "每棵新树拟合当前模型的负梯度，平方损失下就是残差", "a": ["GBDT 把多棵回归树加起来，第 m 步在已有模型 F_{m−1} 的基础上加一棵新树。", "新树拟合损失函数对当前预测的负梯度，平方损失时负梯度就是残差 y − F(x)。", "每棵树的输出乘上学习率再累加，学习率小、树多通常泛化更好。", "Boosting 主要降低偏差，Bagging 主要降低方差。"], "terms": ["负梯度", "残差", "学习率", "偏差", "方差"], "f": ["F_m(x) = F_{m−1}(x) + η · h_m(x)", "h_m 拟合 r_i = −∂L(y_i, F(x_i)) / ∂F(x_i)"], "viz": "gbdt", "tag": "必背", "id": "j16", "plain": "GBDT 是一棵一棵地种树。第一棵树先粗略预测，算出每个样本还差多少，也就是残差。第二棵树专门去预测这些残差，加上去以后误差变小。如此反复，每棵新树都在修补前面的错误。"}, {"topic": "树模型与 AutoML", "q": "XGBoost 的目标函数、叶子权重和分裂增益怎么推？", "key": "二阶泰勒展开加正则，叶子权重是负的 G 除以 H 加 λ", "a": ["XGBoost 对损失做二阶泰勒展开，每个样本有一阶梯度 g 和二阶导 h。", "正则项惩罚叶子数 T 和叶子权重的平方，系数分别是 γ 和 λ。", "把同一叶子里样本的 g 和 h 求和得到 G、H，最优叶子权重是 −G 除以 (H+λ)。", "分裂增益比较分裂前后的结构分数，增益小于 γ 就不分裂，相当于自带剪枝。"], "terms": ["二阶泰勒展开", "γ", "λ", "G", "H", "剪枝"], "f": ["Obj ≈ Σ_j [ G_j w_j + ½ (H_j + λ) w_j² ] + γT", "w_j* = −G_j / (H_j + λ)", "Gain = ½ [ G_L²/(H_L+λ) + G_R²/(H_R+λ) − (G_L+G_R)²/(H_L+H_R+λ) ] − γ"], "viz": "gbdt", "tag": "必背", "id": "j17", "plain": "XGBoost 在 GBDT 的基础上做得更精细。它不只看“往哪个方向改”（一阶导），还看“改多少合适”（二阶导），并且对树的叶子数和叶子值加了惩罚，防止树长得太复杂。由此可以直接推出每个叶子该输出多少，以及一次切分值不值得做。"}, {"topic": "树模型与 AutoML", "q": "XGBoost 怎样处理缺失值和稀疏特征？", "key": "分裂时为缺失值学一个默认方向，左右都试一次选增益大的", "a": ["寻找分裂点时只遍历非缺失的样本。", "缺失样本分别放到左边和右边各算一次增益，取增益大的方向作为这个节点的默认方向。", "预测时遇到缺失值就走默认方向，稀疏的 one-hot 特征也用同样的方式加速。"], "terms": ["默认方向", "增益", "稀疏"], "tag": "高频", "id": "j18", "plain": "数据里经常有缺失。XGBoost 在每个切分点上试两次，把缺失的样本全放左边算一次、全放右边算一次，哪边效果好就记住这个方向。以后遇到缺失值，直接走这个方向。"}, {"topic": "树模型与 AutoML", "q": "LightGBM 为什么比 XGBoost 快？", "key": "直方图、按叶子生长、GOSS 采样、EFB 捆绑特征", "a": ["直方图算法，把连续特征分成若干个桶，只在桶边界上找分裂点，父节点直方图减去兄弟节点得到另一个子节点。", "按叶子生长，每次选增益最大的叶子分裂，比按层生长损失下降更快，但要限制最大深度防止过拟合。", "GOSS，保留梯度最大的 a 比例样本，在其余样本里随机采 b 比例，并把采到的小梯度样本权重放大为 (1−a) 除以 b。", "EFB，把很少同时非零的互斥特征捆成一个特征，减少特征数。"], "terms": ["直方图", "按叶子生长", "GOSS", "EFB", "最大深度"], "f": ["小梯度样本权重 = (1 − a) / b"], "viz": "goss", "tag": "必背", "id": "j19", "plain": "LightGBM 快在四个地方。把连续值分成几十个桶，只在桶之间找切分点。每次挑最值得分的那个叶子去分。梯度小的样本已经预测得不错，只抽一部分来算。很少同时有值的列合并成一列。"}, {"topic": "树模型与 AutoML", "q": "CatBoost 的有序提升和有序目标统计解决什么问题？", "key": "用排列只拿“之前的样本”算统计量和梯度，避免目标泄漏造成的预测偏移", "a": ["类别特征常用目标统计编码，即用同类别样本的标签均值代替类别值。如果用包含当前样本的全部样本计算，就把当前样本的标签泄漏进了特征。", "CatBoost 随机排列样本，每个样本只用排在它前面的样本计算目标统计，并加先验平滑。", "梯度估计也有同样的偏移问题，有序提升让每个样本的残差由没见过它的模型计算。", "CatBoost 还用对称树，同一层所有节点用同一个分裂条件，预测快、不易过拟合。"], "terms": ["目标统计", "泄漏", "排列", "先验", "对称树"], "f": ["TS(x_i) = ( Σ_{j<i, x_j=x_i} y_j + a·p ) / ( Σ_{j<i, x_j=x_i} 1 + a )"], "tag": "高频", "id": "j20", "plain": "类别特征常用“同类别的平均标签”来编码，比如“城市 A 的平均违约率”。但如果算这个平均时把当前样本自己的标签也算进去，就等于把答案泄漏进了特征。CatBoost 把样本排个顺序，每个样本只用排在它前面的样本算平均，避免泄漏。"}, {"topic": "树模型与 AutoML", "q": "XGBoost、LightGBM、CatBoost 怎么对比？", "key": "XGB 稳，LGB 快，Cat 擅长类别特征", "a": ["三者都是梯度提升树，区别在于树的生长方式、对类别特征和缺失值的处理以及速度。", "默认参数下 CatBoost 往往更省心，大数据追求速度用 LightGBM，XGBoost 生态最成熟。", "实际比赛和业务里常把三者都训练后集成。"], "terms": ["生长方式", "类别特征", "集成"], "cmp": {"head": ["", "XGBoost", "LightGBM", "CatBoost"], "rows": [["生长方式", "按层（默认）", "按叶子", "对称树"], ["分裂查找", "预排序或直方图", "直方图", "直方图"], ["类别特征", "需编码，新版支持", "原生分组分裂", "有序目标统计"], ["缺失值", "学默认方向", "学默认方向", "视作特殊值"], ["加速手段", "二阶信息、列块", "GOSS、EFB", "对称树、有序提升"]]}, "tag": "高频", "id": "j21", "plain": "三个都是梯度提升树，可以理解成同一种方法的三种实现。XGBoost 最老牌稳定，LightGBM 最快适合大数据，CatBoost 处理类别特征最省心。"}, {"topic": "树模型与 AutoML", "q": "AutoGluon-Tabular 为什么效果强？", "key": "多层堆叠集成加重复 K 折装袋，把功夫花在集成而不是调参上", "a": ["AutoGluon 同时训练多种模型族，包括梯度提升树、随机森林、神经网络等。", "对每个模型做 K 折装袋，得到每个样本的折外预测。", "把折外预测和原始特征拼起来作为下一层的输入，训练多层堆叠，最后用加权集成合并。", "它的设计观点是在固定时间预算内，集成多样的模型比给单个模型做超参数搜索更有效。新版本也接入了 TabPFN 这类表格基础模型作为成员。"], "terms": ["堆叠", "K 折", "折外预测", "集成", "超参数搜索"], "tag": "高频", "id": "j22", "plain": "AutoGluon 的思路是不纠结调参，而是把很多不同的模型都训练一遍，再训练一个模型来综合它们的意见，还可以一层套一层地综合。在表格比赛里这种“集体投票”往往比精调单个模型更稳。"}, {"topic": "树模型与 AutoML", "q": "为什么树模型长期在表格数据上强于深度学习？", "key": "表格目标函数不平滑、无用特征多、列没有旋转不变性", "a": ["NeurIPS 2022 的一篇基准研究总结了三个原因。", "第一，表格的目标函数常常不平滑、有突变，神经网络偏好平滑解，树按阈值切分更合适。", "第二，表格里无信息特征多，MLP 容易被它们干扰，树会自然忽略。", "第三，表格的列各有含义，数据不具备旋转不变性，而 MLP 的学习过程对旋转不变，丢掉了列的个体性。", "表格基础模型用大量合成任务的先验弥补了这些劣势，在中小数据上开始超过调参的树模型。"], "terms": ["不平滑", "无信息特征", "旋转不变性", "先验"], "tag": "高频", "id": "j23", "plain": "表格数据有三个特点让神经网络吃亏。规律常常是突变的，比如收入超过某个值风险骤降，树按阈值切分正好合适。表里常有很多没用的列，树会自动忽略。每一列含义不同，不能像图片那样随便旋转混合。"}, {"topic": "树模型与 AutoML", "q": "表格深度学习有哪些代表模型？", "key": "MLP 加数值嵌入、FT-Transformer、TabNet、SAINT、TabR、TabM", "a": ["MLP 和 ResNet 是强基线，给数值特征加周期或分段线性嵌入后提升明显。", "FT-Transformer 把每个特征变成一个 token，在特征之间做注意力。", "TabNet 用逐步的注意力做特征选择，可解释性较好。", "SAINT 同时做特征之间和样本之间的注意力。TabR 是检索增强的模型，TabM 用参数高效的方式在一个 MLP 里实现多个成员的集成。"], "terms": ["FT-Transformer", "TabNet", "SAINT", "TabR", "TabM"], "tag": "高频", "id": "j24", "plain": "这些是专门为表格设计的神经网络。有的给每列一个向量再做注意力，有的在行和列两个方向都做注意力，有的预测时参考相似样本，有的在一个网络里装多个子模型做集成。"}, {"topic": "树模型与 AutoML", "q": "类别特征有哪些编码方式？目标编码怎样避免泄漏？", "key": "one-hot、序号、哈希、嵌入、目标编码，目标编码必须用折外或有序方式算", "a": ["低基数用 one-hot，高基数 one-hot 维度爆炸，可以用哈希或嵌入。", "目标编码用同类别样本的标签均值代替类别，信息量大但容易泄漏。", "避免泄漏的做法是 K 折折外计算，每折的编码只用其他折的标签，或者像 CatBoost 一样用有序目标统计，并加先验平滑处理样本少的类别。", "风控里常用的 WOE 编码也属于用标签信息编码，同样要在训练折内计算。"], "terms": ["one-hot", "哈希", "目标编码", "折外", "先验平滑", "WOE"], "tag": "高频", "id": "j25", "plain": "模型只认数字，类别要转成数。one-hot 是每个类别一列 0 或 1，类别太多时列数爆炸。目标编码用这个类别的平均标签代替，信息多但容易泄漏标签，所以要分折计算，每折只用别的折的标签。"}, {"topic": "缺失值与数据合成", "q": "MCAR、MAR、MNAR 有什么区别？对建模有什么影响？", "key": "完全随机、依赖已观测变量、依赖缺失值本身", "a": ["MCAR 是完全随机缺失，是否缺失和任何变量都无关，直接删掉缺失样本也不会带来偏差，只损失样本量。", "MAR 是随机缺失，是否缺失只依赖已观测的其他变量，例如年轻人更常不填收入。用已观测变量建模做填补可以消除偏差。", "MNAR 是非随机缺失，是否缺失依赖缺失值本身，例如收入越高越不愿意填。只靠观测数据无法完全纠正，需要对缺失机制建模或引入额外信息。", "风控里“是否缺失”本身常常是强特征，可以加缺失指示变量。"], "terms": ["MCAR", "MAR", "MNAR", "缺失指示变量"], "viz": "missing", "tag": "必背", "id": "j26", "plain": "数据为什么缺，决定了能不能放心处理。MCAR 是随机丢的，比如录入员偶尔漏填。MAR 是缺失和别的已知列有关，比如年轻人更常不填收入。MNAR 是缺失和它自己的值有关，比如收入很高的人故意不填，这种最难处理。"}, {"topic": "缺失值与数据合成", "q": "常见的缺失值填补方法有哪些？各自适用什么情况？", "key": "统计量、KNN、MICE、MissForest、GAIN、扩散模型，越往后越能建模复杂依赖", "a": ["均值、中位数、众数填补简单快速，但会压缩方差、破坏变量之间的关系。", "KNN 填补用相似样本的值，依赖距离定义。", "MICE 对每个有缺失的变量轮流建回归模型，用其他变量预测它，迭代多轮，并可多次填补估计不确定性。MissForest 是用随机森林做同样的迭代。", "GAIN 用生成对抗网络，生成器填补、判别器判断哪些位置是填补的。扩散模型把缺失位置当作要生成的部分，以观测部分为条件去噪。", "树模型和 TabPFN v2 可以原生处理缺失，不一定要先填补。"], "terms": ["均值", "KNN", "MICE", "MissForest", "GAIN", "扩散模型"], "tag": "高频", "id": "j27", "plain": "填缺失从简单到复杂。最简单是填平均值，但会让数据变得过于集中。可以找相似样本的值来填，也可以用其他列建模来预测缺的那列，反复迭代。更复杂的用生成模型，根据已知的格子生成缺失的格子。"}, {"topic": "缺失值与数据合成", "q": "填补效果怎么评估？", "key": "把已知值人为遮住再填回来比误差，同时看下游任务", "a": ["在完整数据上按指定机制人为遮住一部分值，填补后和真值比较，数值列看 RMSE，类别列看准确率。", "还要看下游任务的效果，填补误差小不一定让预测更好。", "要分别报告 MCAR、MAR、MNAR 三种遮挡机制下的结果，因为 MNAR 下很多方法会失效。", "多重填补还可以评估区间是否覆盖真值。"], "terms": ["遮住", "RMSE", "下游任务", "MNAR"], "tag": "高频", "id": "j28", "plain": "把一些已知的格子故意遮住，用方法填回去，和真值比差多少。同时要看填补后训练出的模型效果如何，因为填得准不一定预测得好。"}, {"topic": "缺失值与数据合成", "q": "CTGAN、TVAE、TabDDPM、TabSyn 这些表格生成方法有什么区别？", "key": "GAN、VAE、直接扩散、潜空间扩散", "a": ["CTGAN 用条件生成对抗网络，对数值列做按模式的归一化来处理多峰分布，并按类别条件采样训练来照顾稀有类别。TVAE 是同样预处理下的变分自编码器。", "TabDDPM 直接在数据空间做扩散，数值列用高斯扩散，类别列用多项分布扩散。", "TabSyn 先用 VAE 把混合类型的行编码到连续潜空间，再在潜空间里训练扩散模型，采样后解码。", "扩散类方法在保真度上通常优于 GAN 和 VAE，代价是采样步数多、速度慢。"], "terms": ["CTGAN", "TVAE", "TabDDPM", "TabSyn", "多项分布扩散", "潜空间"], "viz": "diffusion", "tag": "高频", "id": "j29", "plain": "这些都是“造假数据”的方法，目标是生成和真实表格分布一样的新数据。CTGAN 用生成器和判别器互相对抗，TVAE 用编码再解码，TabDDPM 和 TabSyn 用扩散模型，先把数据加噪成随机数，再训练网络一步步去噪还原。"}, {"topic": "缺失值与数据合成", "q": "扩散模型怎样用于表格生成和填补？", "key": "前向逐步加噪，网络学去噪，填补时把观测值作为条件", "a": ["前向过程按噪声调度逐步给数据加高斯噪声，第 t 步的样本可以由原始数据一步得到。", "网络学习预测加入的噪声，训练目标是预测噪声和真实噪声的均方误差。", "生成时从纯噪声出发逐步去噪。填补时把观测到的单元格作为条件，只对缺失位置去噪。", "类别列可以用多项分布扩散，或先嵌入到连续空间。"], "terms": ["加噪", "预测噪声", "去噪", "条件"], "f": ["x_t = √(ᾱ_t) · x_0 + √(1 − ᾱ_t) · ε", "L = ‖ ε − ε_θ(x_t, t) ‖²"], "viz": "diffusion", "tag": "必背", "id": "j30", "plain": "扩散模型训练时，把真实数据一点点加噪声，直到变成纯随机数，然后训练网络预测加了什么噪声。生成时反过来，从随机数开始一步步去噪。填缺失时，已知的格子保持不变，只对缺失的格子去噪。"}, {"topic": "缺失值与数据合成", "q": "合成数据怎么评价？", "key": "保真度、可用性、隐私三方面", "a": ["保真度看单列分布和列之间的相关性是否和真实数据一致。", "可用性常用“合成训练、真实测试”，用合成数据训练模型，在真实测试集上看效果。", "隐私看合成样本离最近真实样本的距离，距离过近说明可能复制了真实记录。", "对表格基础模型的预训练来说，合成先验的价值最终看它在真实基准上带来的下游效果。"], "terms": ["保真度", "合成训练、真实测试", "隐私", "最近真实样本"], "tag": "高频", "id": "j31", "plain": "评价假数据看三点。像不像，各列分布和列之间的关系是否和真数据一致。好不好用，用假数据训练模型，在真数据上测效果。安不安全，假数据有没有直接复制某条真实记录。"}, {"topic": "缺失值与数据合成", "q": "预训练数据配比怎样确定？", "key": "小模型代理实验扫配比，或按各域损失动态调权，评测要覆盖所有分组", "a": ["配比是不同来源、领域、质量档在训练数据中的比例。", "DoReMi 先训练一个小的代理模型，用分组鲁棒优化找出各领域的权重，再用这组权重训练大模型。", "也可以用多个小规模实验拟合“配比到损失”的规律后外推，或者在训练中按各组损失下降速度动态调权。", "对结构化数据模型，配比的对象可以是不同先验的合成数据、不同领域的真实表格、不同规模和特征类型的任务。"], "terms": ["代理模型", "DoReMi", "分组鲁棒优化", "动态调权"], "tag": "高频", "id": "j32", "plain": "训练数据来自多个来源，每个来源放多少的比例叫配比。一般先用小模型试几种比例，看哪种效果好，再用这个比例训练大模型。"}, {"topic": "缺失值与数据合成", "q": "表格基础模型预训练怎样结合合成数据和真实数据？", "key": "合成先验打底，真实数据继续预训练补机制，同时防止和评测集重叠", "a": ["合成数据规模无限、机制可控，适合打底，让模型具备通用的推断能力。", "真实数据包含合成先验没覆盖的机制，例如特定的分布形状和变量关系。在合成预训练之后用真实表格继续预训练，可以进一步提升真实基准上的效果。", "真实数据有和评测基准重叠的风险，需要按数据集去重，并把评测集排除在训练之外。", "还可以把多种先验混合，例如结构因果模型加基于树的先验，提升覆盖面。"], "terms": ["合成先验", "继续预训练", "去重", "混合先验"], "tag": "高频", "id": "j33", "plain": "假数据可以无限造、规律可控，适合先打基础。真实数据里有假数据没覆盖到的规律，后面再用真实表格接着训练。要特别注意，真实训练数据里不能混进评测要用的数据集，否则分数是虚高的。"}, {"topic": "评测", "q": "TabArena 是什么？有哪些主要发现？", "key": "持续更新的表格基准，精选数据集、充分调参和集成、用 Elo 排名", "a": ["TabArena 是 2025 年推出的持续更新表格基准，从大量候选数据集中人工筛选出一批高质量的真实数据集。", "它对每个模型做充分的超参数调优和集成，并多次重复交叉验证，用 Elo 等方式排名，减少评测协议不同带来的偏差。", "主要发现包括调参加集成后的梯度提升树仍然很强，深度模型通过集成能追上来，TabPFN v2 和 TabICL 这类基础模型在中小数据上表现突出。", "岗位描述把它列为主要的公开基准之一。"], "terms": ["持续更新", "超参数调优", "集成", "Elo", "TabPFN v2"], "tag": "高频", "id": "j34", "plain": "TabArena 是一个持续更新的表格模型排行榜。它挑选了一批高质量真实数据集，给每个模型都认真调参，用类似下棋的积分排名，比较方式更公平。"}, {"topic": "评测", "q": "TALENT 是什么？", "key": "南京大学团队的表格学习基准和工具箱，覆盖几百个数据集和几十种方法", "a": ["TALENT 是南京大学团队发布的表格学习基准与工具箱，包含数百个分类和回归数据集，以及树模型、深度表格模型等数十种方法的统一实现。", "它的配套研究分析了不同方法在什么样的数据集上更好，例如按样本量、特征数、特征类型划分。", "用它可以在统一协议下快速比较新方法。"], "terms": ["南京大学", "数百个", "统一实现", "统一协议"], "tag": "高频", "id": "j35", "plain": "TALENT 是南京大学团队做的一套表格模型评测工具，收集了几百个数据集和几十种方法，统一接口，方便公平比较。"}, {"topic": "评测", "q": "表格模型评测要注意哪些问题？", "key": "固定划分和重复、等调参预算、归一化汇总、防止预训练泄漏、做显著性检验", "a": ["划分要固定并重复多次，报告均值和波动，小数据集上单次划分方差很大。", "比较要给各方法相同的调参预算和时间，否则是在比较调参投入。", "跨数据集汇总要用平均排名、归一化分数或 Elo，不能直接平均原始指标。", "表格基础模型可能在预训练时见过评测集，要检查数据集重叠。", "多方法比较用 Friedman 检验和临界差图判断差异是否显著。"], "terms": ["重复", "调参预算", "平均排名", "Elo", "重叠", "临界差图"], "tag": "高频", "id": "j36", "plain": "比较表格模型容易出现不公平。划分只做一次的话运气成分大，要重复多次。有的方法调参一天、有的不调，不能直接比。多个数据集的分数量纲不同，不能直接平均。表格基础模型可能训练时就见过评测集。"}, {"topic": "评测", "q": "怎样分析一个表格模型的能力边界？", "key": "按数据集元特征分组看表现，找它在哪类数据上输", "a": ["把评测数据集按元特征分组，例如样本量、特征数、类别特征比例、缺失率、类别数、不平衡程度。", "在每组里比较模型和强基线的差距，找出它明显变差的区域。", "再用合成数据控制单一因素，例如只改变无信息特征的比例，验证是不是这个因素导致变差。", "分析结论反过来指导数据、架构和训练策略，例如补充对应机制的合成先验。"], "terms": ["元特征", "分组", "控制单一因素", "合成先验"], "tag": "高频", "id": "j37", "plain": "看一个模型擅长什么、不擅长什么，就把数据集按特点分组，比如行数多少、有没有类别列、缺失多不多，看它在哪一组输得最多，再针对性地改进。"}, {"topic": "风控与业务", "q": "KS 值怎么计算？和 AUC 是什么关系？", "key": "好坏样本累计分布之差的最大值，即 TPR 减 FPR 的最大值", "a": ["把样本按模型分数排序，分别计算坏样本和好样本在各分数阈值下的累计占比。", "KS 等于两条累计分布曲线之间的最大差距，也等于所有阈值上真正率减假正率的最大值。", "KS 只看最佳阈值这一点的区分度，AUC 看所有阈值的整体排序能力。", "风控里 KS 常用来选切分点，经验上 0.3 以上有区分度，过高要怀疑泄漏。"], "terms": ["累计分布", "最大差距", "真正率", "假正率", "0.3", "泄漏"], "f": ["KS = max_t | F_bad(t) − F_good(t) | = max_t ( TPR(t) − FPR(t) )"], "viz": "roc", "tag": "必背", "id": "j38", "plain": "风控模型给每个人打一个风险分。KS 衡量的是，在某个分数线上，坏人被识别出来的比例和好人被误判的比例最多能拉开多大差距。差距越大说明模型越能区分好坏人。"}, {"topic": "风控与业务", "q": "PSI 怎么计算？阈值代表什么？", "key": "按分箱比较期望和实际占比，0.1 以下稳定、0.25 以上明显漂移", "a": ["PSI 衡量特征或模型分数的分布在两个时期之间的变化。", "先按建模期的分布分箱，计算每箱在建模期的占比 E 和当前时期的占比 A。", "PSI 对各箱的 (A − E) 乘 ln(A 除以 E) 求和。", "经验上小于 0.1 视为稳定，0.1 到 0.25 需要关注，大于 0.25 说明分布明显漂移，要考虑重新建模。"], "terms": ["分箱", "占比", "0.1", "0.25", "漂移"], "f": ["PSI = Σ_i (A_i − E_i) · ln(A_i / E_i)"], "viz": "psi", "tag": "必背", "id": "j39", "plain": "PSI 用来检查数据有没有变。比如上线半年后，客户的分数分布和建模时还一样吗？把分数分成几段，比较两个时期每段的人数占比，差得越多 PSI 越大。"}, {"topic": "风控与业务", "q": "WOE 和 IV 是什么？", "key": "WOE 是每箱坏好比的对数，IV 汇总整个特征的区分能力", "a": ["把特征分箱，每箱的 WOE 等于这一箱坏样本占全部坏样本的比例，除以好样本占全部好样本的比例，再取对数。", "IV 对各箱的 (坏占比 − 好占比) 乘 WOE 求和，衡量这个特征整体的区分能力。", "经验上 IV 小于 0.02 几乎没用，0.1 到 0.3 中等，大于 0.5 要怀疑泄漏。", "WOE 编码后特征和对数几率近似线性，适合逻辑回归评分卡。"], "terms": ["WOE", "IV", "0.02", "评分卡", "对数几率"], "f": ["WOE_i = ln( (B_i / B) / (G_i / G) )", "IV = Σ_i ( B_i/B − G_i/G ) · WOE_i"], "viz": "woe", "tag": "必背", "id": "j40", "plain": "把一个特征分成几段，比如年龄分成五段。WOE 看每一段里坏人是不是特别集中，IV 把各段汇总，衡量这个特征整体对区分好坏人有多大用处。"}, {"topic": "风控与业务", "q": "什么是时间外验证 OOT？什么是样本穿越？", "key": "用时间上更晚的数据验证，特征只能用观察点之前的信息", "a": ["风控数据有时间顺序，随机划分会让模型见到未来的模式，验证结果虚高。", "OOT 是用时间上晚于训练期的样本做验证，更接近上线后的真实表现。", "样本穿越是特征里混进了观察点之后才能获得的信息，例如用到了表现期内的还款记录，上线后这些信息拿不到。", "防止穿越要为每个样本定义观察点，所有特征只用观察点之前的数据计算。"], "terms": ["OOT", "观察点", "穿越", "表现期"], "viz": "split", "tag": "必背", "id": "j41", "plain": "风控数据是按时间来的。如果随机划分，模型在训练时就见过“未来”的数据，验证分数会偏高。OOT 是用更晚的一段时间做验证。样本穿越是特征里用到了预测时刻之后才能拿到的信息，上线后这个信息不存在，模型就失效了。"}, {"topic": "风控与业务", "q": "风控样本极度不平衡怎么处理？", "key": "先换指标，再考虑重采样、加权和阈值调整", "a": ["坏样本可能只占百分之一，准确率没有意义，要看 AUC、KS、PR 曲线和召回。", "可以对坏样本过采样或对好样本欠采样，也可以在损失里给坏样本更大权重。", "重采样或加权会改变预测概率的绝对值，需要校准后才能当概率用。", "最终按业务成本选择阈值，例如误拒好客户和放过坏客户的损失不同。"], "terms": ["AUC", "KS", "过采样", "加权", "校准", "阈值"], "tag": "高频", "id": "j42", "plain": "一万个客户里可能只有一百个坏人。模型全猜“好人”就有 99% 的准确率，但毫无用处。所以要看能不能把坏人找出来，可以多复制坏人样本，或者在训练时给坏人更大的权重。"}, {"topic": "风控与业务", "q": "什么是拒绝推断？", "key": "被拒绝的申请没有表现标签，只用通过的样本建模会有偏", "a": ["信贷模型只能观察到被批准客户的还款表现，被拒绝的客户没有标签。", "只用通过的样本训练，样本分布和全部申请人不一致，模型在低分人群上有偏。", "拒绝推断用各种方法给被拒样本推断标签，例如用已有模型打分后按分数赋予伪标签，或分组加权，再一起训练。", "这本质上是一个非随机缺失标签的问题。"], "terms": ["被拒绝", "没有标签", "伪标签", "非随机缺失"], "tag": "高频", "id": "j43", "plain": "银行只知道被批准贷款的人后来有没有还钱，被拒绝的人没有结果。只用被批准的人训练，模型就没见过被拒的那类人。拒绝推断就是想办法给被拒的人估一个结果，一起训练。"}, {"topic": "风控与业务", "q": "风控模型为什么强调可解释性和稳定性？", "key": "监管要求解释拒绝原因，业务要求分数长期稳定", "a": ["金融监管要求能向客户和审计说明决策原因，所以评分卡和单调约束的树模型很常见。", "复杂模型可以用 SHAP 值解释单个预测的特征贡献。", "模型上线后要监控分数和特征的 PSI，以及按月的 KS，发现漂移及时迭代。", "对抗环境下欺诈模式会变化，需要快速更新特征和模型。"], "terms": ["监管", "单调约束", "SHAP", "PSI", "漂移"], "tag": "高频", "id": "j44", "plain": "贷款被拒，客户和监管都会问原因，模型必须讲得清楚。上线后数据会慢慢变化，模型效果会下降，所以要持续监控分数分布，变化大了就重新训练。"}, {"topic": "训练推理与 Scaling", "q": "Scaling Law 的主要结论是什么？Chinchilla 改变了什么？", "key": "损失随参数、数据、算力按幂律下降，算力最优时数据量约是参数量的二十倍", "a": ["Kaplan 等人发现语言模型的损失随参数量、数据量和算力都按幂律下降。", "训练算力可以估为 C ≈ 6ND，N 是参数量，D 是训练 token 数。", "Chinchilla 重新做实验后发现，给定算力时参数和数据应该同比例增长，最优的训练 token 数约为参数量的 20 倍，此前的大模型普遍训练数据不足。", "表格模型也开始研究 Scaling，例如 TabDPT 展示了真实数据量和模型规模的规律，TabPFN 的演进本身就是数据规模和模型能力一起扩展。"], "terms": ["幂律", "6ND", "20 倍", "Chinchilla", "TabDPT"], "f": ["C ≈ 6 · N · D", "L(N, D) ≈ E + A / N^α + B / D^β"], "viz": "scaling", "tag": "必背", "id": "j45", "plain": "模型越大、数据越多、算力越多，效果越好，而且提升有稳定的规律，可以提前预测。Chinchilla 的结论是，模型变大的同时数据也要同比例变多，大约每个参数配 20 个训练词最划算。"}, {"topic": "训练推理与 Scaling", "q": "ZeRO 的三个阶段分别切分什么？FSDP 是什么？", "key": "ZeRO-1 切优化器状态，ZeRO-2 再切梯度，ZeRO-3 连参数一起切", "a": ["数据并行时每张卡都保存完整的参数、梯度和优化器状态，Adam 的优化器状态通常是参数的好几倍。", "ZeRO-1 把优化器状态切分到各卡，ZeRO-2 再切分梯度，ZeRO-3 把参数也切分，用到时再临时收集。", "切得越多显存越省，但通信越多。", "PyTorch 的 FSDP 是类似 ZeRO-3 的实现，按模块包装，前向和反向时收集参数，算完释放。"], "terms": ["优化器状态", "梯度", "参数", "通信", "FSDP"], "viz": "parallel", "tag": "必背", "id": "j46", "plain": "训练大模型时显存不够用。每张卡除了存模型参数，还要存梯度和优化器的状态，后者占得最多。ZeRO 的办法是让多张卡分摊这些东西，每张卡只存一部分，用到时再互相传。"}, {"topic": "训练推理与 Scaling", "q": "表格基础模型的推理怎样加速？", "key": "训练集只编码一次并缓存，分批预测，必要时蒸馏", "a": ["TabPFN 类模型的预测分成两步，先把训练集编码成上下文，再让测试样本注意上下文。训练集的表示可以缓存，多批测试样本复用。", "大训练集可以子采样或检索局部上下文，减少注意力的计算量。", "数值精度上可以用 bf16 推理，配合 FlashAttention 一类的高效注意力实现。", "在线低延迟场景把它蒸馏成树或 MLP。"], "terms": ["缓存", "子采样", "bf16", "FlashAttention", "蒸馏"], "tag": "高频", "id": "j47", "plain": "TabPFN 预测一批新样本，都要参考同一份训练集。训练集只需处理一次存起来，后面每批新样本直接复用。表太大可以只用一部分行，线上要求快的场景就换成蒸馏出的小模型。"}, {"topic": "ICL 与统计", "q": "In-Context Learning 为什么能工作？有哪些解释？", "key": "隐式贝叶斯推断、在前向里模拟梯度下降、归纳头复制模式", "a": ["贝叶斯视角的解释是，预训练后的模型在前向中从上下文推断潜在的任务，再按这个任务预测，TabPFN 的训练目标把这一点做得很明确。", "另一种解释证明 Transformer 的注意力可以在前向中实现类似梯度下降的更新，上下文样本相当于训练数据。", "机制可解释性研究发现了归纳头，它能找到上下文中出现过的模式并复制后续内容。", "ICL 的效果对示例的选择、顺序和格式敏感，这也是表格模型要做集成和检索的原因之一。"], "terms": ["隐式贝叶斯推断", "梯度下降", "归纳头", "示例的选择"], "tag": "必背", "id": "j48", "plain": "在输入里放几个例子，大模型就能对新输入给出同样格式的结果，这叫上下文学习。一种解释是模型在前向计算中从例子里推断出了“这是什么任务”。TabPFN 把这件事做得很直接，训练目标本身就是“看例子做预测”。"}, {"topic": "ICL 与统计", "q": "模型校准是什么？怎么衡量和修正？", "key": "预测概率等于真实频率，用 ECE 衡量，用温度缩放或保序回归修正", "a": ["校准好的模型，所有预测为 0.8 的样本里，真实正例比例应该接近 0.8。", "ECE 把预测概率分箱，按样本数加权平均每箱的平均预测和实际正例率之差。", "修正方法有 Platt 缩放、温度缩放和保序回归，都在验证集上拟合。", "风控里分数要当概率用于定价和额度时，校准尤其重要，重采样后的模型必须重新校准。"], "terms": ["ECE", "温度缩放", "保序回归", "Platt"], "f": ["ECE = Σ_b (n_b / n) · | acc_b − conf_b |"], "tag": "高频", "id": "j49", "plain": "模型说“80% 是坏人”，那么在所有被它这样说的人里，实际上应该真有 80% 左右是坏人，这叫校准好。风控里分数要直接用于定价和额度，所以概率必须准，不准就要修正。"}, {"topic": "ICL 与统计", "q": "因果推断的基本概念有哪些？和预测建模有什么区别？", "key": "预测看相关，因果看干预效果，要处理混杂", "a": ["预测建模学习 p(y | x)，只要相关就有用。因果推断关心干预 x 之后 y 会怎样变化。", "平均处理效应 ATE 是处理组和对照组潜在结果的期望之差，观测数据里两组往往不可比。", "混杂变量同时影响处理和结果，会造成虚假关联。常用倾向分匹配或加权、双重稳健估计来调整。", "营销和风控里的“发券是否提升转化”“提额是否增加坏账”都是因果问题，不能直接用预测模型的特征重要性回答。"], "terms": ["干预", "ATE", "混杂", "倾向分", "双重稳健"], "tag": "高频", "id": "j50", "plain": "预测模型回答“这个人违约的可能性多大”。因果推断回答“如果给他提额度，违约率会变多少”。后者要排除其他因素的干扰，比如收入既影响提额又影响违约，不处理就会得出错误结论。"}, {"topic": "ICL 与统计", "q": "Bootstrap 和置信区间在实验比较里怎么用？", "key": "有放回重采样估计统计量的分布，配对比较两个模型", "a": ["Bootstrap 从样本中有放回地重采样很多次，每次算一遍统计量，得到它的经验分布，进而给出置信区间。", "比较两个模型时用配对 bootstrap，在同一组重采样上比较两者的差值，比分别算区间更灵敏。", "如果差值的置信区间不包含 0，说明差异较可靠。", "小数据集上单次评测波动大，这一步能避免把噪声当成提升。"], "terms": ["有放回", "经验分布", "配对", "置信区间"], "viz": "bootstrap", "tag": "高频", "id": "j51", "plain": "只有一次评测结果时，不知道它是真的好还是运气好。Bootstrap 从测试样本里有放回地重新抽很多次，每次算一遍分数，看分数波动多大，进而判断两个模型的差距是否可靠。"}, {"topic": "机器学习与评估", "q": "交叉熵、负对数似然与 KL 散度有什么关系？", "tag": "必背", "key": "交叉熵是在目标分布下，对预测概率取负对数后的平均", "a": ["分类标签可看成经验目标分布，因此最小化交叉熵就是最大化观测标签的似然。", "目标分布固定时，交叉熵等于目标熵加上目标到预测的 KL 散度，所以两者有相同的最优解。", "比如真实类别的预测概率从零点二升到零点八，该样本损失会下降。", "KL 一般不对称。", "若目标概率为正而预测为零，损失可趋于无穷。", "这里的等价关系也不意味着深层网络对参数是凸优化。"], "f": ["H(P,Q)=-Σ p_i log q_i", "KL(P∥Q)=Σ p_i log(p_i/q_i)=H(P,Q)-H(P)。"], "fq": "为什么分类实现通常直接接收 logits，而不是先做 softmax？", "fa": "把 log-softmax 与负对数似然合并，可以用 logsumexp 稳定计算，减少先指数化再取对数造成的上溢或下溢。 交叉熵函数的输入约定要看接口，不能重复 softmax。", "viz": "ce", "src": "0.16 DL Softmax回归与多分类；0.5 ML 逻辑回归 (Logistic Regression)", "id": "g1-1"}, {"topic": "机器学习与评估", "q": "Precision、Recall、F1、macro-F1 与 AUC 分别衡量什么？", "tag": "必背", "key": "精确率回答预测为正的样本有多少是真的，召回率回答真实正例找回了多少，F1 是两者的调和平均", "a": ["假设真阳性八个、假阳性两个、假阴性四个，精确率是零点八，召回率约零点六七，F1 约零点七三。", "macro-F1 先分别算每类 F1，再等权平均，更容易暴露少数类问题。", "AUC 衡量随机正例得分高于随机负例的排序能力，平分按一半计。", "F1 依赖分类阈值，AUC 不对应某一个固定阈值，二者不能替代。"], "f": ["P=TP/(TP+FP)", "R=TP/(TP+FN)", "F1=2TP/(2TP+FP+FN)。"], "fq": "AUC 很高是否意味着上线使用的阈值效果一定好？", "fa": "不能。 AUC 是跨阈值的排序摘要，业务还受类比例、阈值、误报与漏报成本影响。 需要在验证集上按目标选择阈值，并在独立测试集检查该工作点的指标。", "viz": "roc", "src": "0.10 ML 评估指标与模型选择；10.6 机器学习深度学习八股（初稿）", "id": "g1-2"}, {"topic": "机器学习与评估", "q": "训练、验证、测试集各做什么，反复用验证集会有什么问题？", "tag": "必背", "key": "训练集用于拟合参数，验证集用于选择超参数、数据策略和早停位置，测试集用于流程确定后的最终评价", "a": ["虽然验证集没有直接反向传播，但反复比较大量方案，会把验证集的随机波动也选进结果，造成选择偏差。", "预处理中的均值、特征选择和清洗规则也应只用允许的训练信息拟合。", "更严格的做法是预先固定划分，在独立数据上确认最终方案，并保留重复实验的不确定性。"], "fq": "随机划分一次以后，为什么仍可能有数据泄漏？", "fa": "划分只是第一步，还要检查每个处理步骤和样本之间的关联。", "viz": "split", "src": "0.10 ML 评估指标与模型选择；12.2 Pretrain 阶段的评估", "id": "g1-3"}, {"topic": "机器学习与评估", "q": "怎样求伯努利参数的极大似然估计，MLE 与 MAP 有何区别？", "tag": "必背", "key": "先假设各次观测独立、成功概率都为 p", "a": ["十次里成功四次，对这条观测序列的似然与 p 的四次方乘一减 p 的六次方成正比。", "取对数、对 p 求导并令其为零，可得到最大似然估计零点四。", "MLE 只利用当前观测的似然，MAP 还把先验加入目标，选择后验密度最大的参数。", "比如认为概率不应太接近边界，可以使用合适的 Beta 先验。", "先验强度必须明确，MAP 也不等于后验均值，不能把几种估计混称。"], "f": ["ℓ(p)=k log p+(n-k)log(1-p)", "p_MLE=k/n", "p_MAP=argmax_p[ℓ(p)+log prior(p)]。"], "fq": "如果一次成功都没有，MLE 会是多少？", "fa": "在允许 p 取零的伯努利模型里，MLE 位于边界 p=0。 它不证明真实成功概率就是零，有限样本仍有不确定性。 可以报告区间，或声明先验后使用贝叶斯估计。", "viz": "mle", "src": "0.5 ML 逻辑回归 (Logistic Regression)；10.6 机器学习深度学习八股（初稿）", "id": "g1-4"}, {"topic": "机器学习与评估", "q": "Tokenization 为什么影响成本，BPE 怎样构造子词？", "tag": "必背", "key": "分词把文本映射成离散 token 序列，再供模型查表得到嵌入", "a": ["词级词表大且有稀有词问题，字符或字节级词表小但序列更长，子词在两者之间折中。", "BPE 从基础符号开始，反复合并频繁相邻片段并保存合并规则。", "标准实现会保留基础符号及已学 token，不会因为旧符号在当前语料计数为零就随意删除。", "词表与预处理影响中文、数字和代码的长度，也影响训练与推理成本，但模型算术差不能全部归因于分词。"], "fq": "为什么不同 tokenizer 的 token 级困惑度不能直接比较？", "fa": "同一文本会被分成不同数量和粒度的 token，平均损失的单位不同。 应固定 tokenizer 和文本协议，或使用清楚定义的字节归一化指标，同时保留任务评测。", "viz": "bpe", "src": "1.1 Tokenization 分词", "id": "g1-5"}, {"topic": "机器学习与评估", "q": "Agent、Workflow 和普通 LLM 调用有什么区别？", "tag": "必背", "key": "普通 LLM 调用主要根据输入生成输出，Workflow 用预定义的代码路径组织模型和工具，Agent 则让模型结合环境反馈动态选择下一步动作", "a": ["是否用了框架或多个模型，并不能决定它属于哪一种。", "步骤明确、风险和延迟约束强时，固定工作流通常更容易验证。", "步骤难以预知时，可以把局部决策交给 Agent。", "Agent 不必在运行时更新权重，也不必具有长期记忆。", "选择重点是任务是否需要动态行动，以及多步执行的额外成本是否值得。"], "fq": "用一个例子说明怎样组合 Workflow 与 Agent。", "fa": "描述含糊时，由 Agent 决定补查哪些元数据。 确定性校验和写入权限仍由程序控制。", "viz": "agent", "src": "6.2 LLM-based Agent 基于大模型的智能体", "id": "g1-6"}, {"topic": "机器学习与评估", "q": "RAG、微调和工具调用怎样选择？", "tag": "必背", "key": "RAG 在回答时检索外部资料，适合知识更新快、需要来源或访问私有文档的任务", "a": ["微调更新模型参数，更适合改善格式、任务行为和特定能力。", "工具调用让系统查询实时状态、计算或执行动作，不只是提供文字知识。", "三者可以组合，但不能把向量库当实时业务状态，也不能依靠微调记住不断变化的事实。", "先建立可测基线，再决定增加哪一层。"], "fq": "有 RAG 就不会产生幻觉了吗？", "fa": "不会。 检索可能漏掉证据或返回错误资料，生成也可能曲解证据。 需要检索与生成分开评测，支持引用核对，并在证据不足时说明不确定性。", "viz": "rag", "src": "6.3 RAG 检索增强生成；3.1 SFT 监督微调", "id": "g1-7"}, {"topic": "机器学习与评估", "q": "线性回归与逻辑回归的输出、损失和假设有什么区别？", "tag": "必背", "key": "线性回归用特征的线性组合预测连续值，常通过最小化平方误差拟合", "a": ["若误差是同方差独立高斯噪声，最小二乘与最大似然估计相联系。", "逻辑回归先计算线性分数，再用 sigmoid 得到二分类概率，通常最小化伯努利负对数似然，也就是交叉熵。", "两者对参数都是线性的打分结构，但输出空间和训练目标不同。", "线性模型可以加入非线性特征，却不自动学出任意复杂边界。", "处理共线性、异常值和类别不平衡时，还需要检查假设与评测。"], "f": ["线性回归：ŷ=wᵀx+b", "logistic：p(y=1|x)=σ(wᵀx+b)。"], "fq": "线性回归为什么不建议总用显式矩阵求逆求解？", "fa": "设计矩阵可能奇异或病态，显式逆还会放大数值误差。 可用 QR、SVD、正则化或合适的优化方法。 数据规模和稀疏性也影响选择。", "viz": "sigmoid", "src": "10.6 机器学习深度学习八股（初稿）；0.15 DL 线性回归", "id": "g1-8"}, {"topic": "机器学习与评估", "q": "基准污染指什么？怎样检测和缓解？", "tag": "理解", "key": "污染指测试集内容以某种形式出现在训练数据中，导致评测分数虚高", "a": ["形式包括原文泄漏、改写泄漏、以及题目来源网站被整体抓取。", "检测方法有 n-gram 重叠扫描，检查测试样本与训练语料的最长公共子串。", "有基于困惑度的检测，模型对见过的样本困惑度异常低。", "还有顺序敏感检测，把选项顺序打乱后若分数大幅下降说明记忆而非理解。", "缓解手段包括使用训练截止日期之后发布的新基准、用私有held-out集合、以及报告时同时给出去污染后的结果。"], "f": ["重叠率可定义为测试样本中被训练语料覆盖的 n-gram 数量与总 n-gram 数量之比。"], "fq": "如果面试官质疑你论文的实验存在数据泄漏，怎样回答？", "fa": "先说明划分方式与去重手段，例如按数据集或按实体分组划分、跨集合做近重复检测。 再说明做了哪些对照实验验证，例如把疑似泄漏部分剔除后重跑，指标变化在误差范围内。 承认无法穷尽证明，但给出已经排查的范围，这比断言完全没有泄漏更可信。", "id": "g1-9"}, {"topic": "优化与训练", "q": "logistic 交叉熵对参数与输入的梯度分别是什么？", "tag": "必背", "key": "设线性输出为权重与输入的内积加偏置，经过 sigmoid 得到正类概率 p", "a": ["二分类交叉熵对线性输出的导数是 p 减标签 y。", "继续用链式法则，对权重的梯度是残差乘输入，对偏置是残差，对输入则是残差乘权重。", "两种梯度形状和含义不同，前者描述怎样更新模型，后者描述输入扰动怎样影响损失。", "比如预测很错时残差可能较大，但梯度还取决于输入或权重尺度，所以高梯度不能直接等同于错误样本或高价值样本。"], "f": ["z=wᵀx+b，p=σ(z)", "∂L/∂z=p-y", "∇wL=(p-y)x", "∇xL=(p-y)w。"], "fq": "如果加入 L2 正则，参数梯度怎样变化？", "fa": "若目标额外加 λ∥w∥²/2，权重梯度增加 λw，偏置是否正则要另行定义。 输入梯度一般没有这项，因为正则项不依赖输入。 也不要把这种耦合正则直接称为 AdamW。", "viz": "ce", "src": "0.5 ML 逻辑回归 (Logistic Regression)", "id": "g2-1"}, {"topic": "优化与训练", "q": "非均匀采样为什么需要重要性权重，梯度范数采样在什么条件下有效？", "tag": "必背", "key": "假设目标是全部样本梯度的平均，而每次按非均匀概率抽一个样本", "a": ["直接使用被抽样本的梯度，会更偏向高概率样本，改变原目标。", "将它除以样本数和抽样概率的乘积，期望才能回到原平均。", "在梯度固定、抽样概率有效且估计无偏的条件下，最小化估计的二阶矩会得到概率与梯度范数成正比。", "它解释的是随机梯度估计的方差，不证明确定性删数据或清洗排序全局最优。", "概率太小还会放大权重，实际需关注数值与方差。"], "f": ["ḡ=(1/n)Σg_i", "I∼p，ĝ=g_I/(n p_I)，E[ĝ]=ḡ", "最优 p_i∝∥g_i∥。"], "fq": "可以把这个公式直接用于任意无放回采样吗？", "fa": "不可以。 无放回方案的样本包含概率和联合分布不同，需要对应的无偏估计，例如按包含概率构造权重。 面试推导应先说明这里讨论的是单次有放回抽样。", "src": "10.4 八股面经（含答案）", "id": "g2-2"}, {"topic": "优化与训练", "q": "SGD、Adam 与 AdamW 的主要区别是什么？", "tag": "必背", "key": "SGD 沿当前小批量梯度更新，动量版本会累积方向", "a": ["Adam 维护梯度的一阶矩和平方梯度的二阶矩，并做偏差修正，让各参数使用不同的有效步长。", "AdamW 保留这一自适应更新，同时把权重衰减作为单独的参数收缩步骤。", "对普通 SGD，适当缩放后的 L2 正则与权重衰减可等价，但在 Adam 中正则梯度会进入矩估计，通常不再等价。", "优化器不存在对所有任务都最好的选择，还要比较学习率、调度、正则和同等训练预算。"], "f": ["m_t=β₁m_(t-1)+(1-β₁)g_t", "v_t=β₂v_(t-1)+(1-β₂)g_t²", "AdamW 独立执行 θ←(1-ηλ)θ。"], "fq": "为什么 Adam 要做偏差修正？", "fa": "矩估计常从零初始化，早期会偏向零。 分别除以 1-β₁ᵗ 和 1-β₂ᵗ，可以修正这种初始化偏差。 它不代表消除了小批量噪声或保证达到全局最优。", "viz": "gd", "src": "0.14 DL 优化与训练基础；10.6 机器学习深度学习八股（初稿）", "id": "g2-3"}, {"topic": "优化与训练", "q": "过拟合与 loss NaN 应怎样分别排查？", "tag": "必背", "key": "训练损失下降而验证变差时，先确认划分、评价流程和训练验证模式，再看样本量、标签噪声与分布差异，之后尝试早停、正则或数据改进", "a": ["NaN 是另一类问题，应定位第一个非有限张量，检查输入异常、标签越界、除零、对数定义域、全 mask 行和混合精度溢出。", "用固定小批量与较高精度复现，可以缩小范围，再检查学习率和梯度范数。", "梯度裁剪只控制有限梯度大小，不能修复非法标签、已经溢出的数值或错误的数学操作。"], "fq": "softmax 减去最大值后为什么仍可能出现 NaN？", "fa": "输入 logits 可能此前已经含有 inf，做 inf 减 inf 会成为 NaN。 全 mask 行也可能全为负无穷。 需要处理异常来源与无有效键的情况，不能只在 softmax 后替换结果。", "src": "3.1 SFT 监督微调；10.4 八股面经（含答案）", "id": "g2-4"}, {"topic": "优化与训练", "q": "ReAct 的循环是什么，和单纯写思维链有什么区别？", "tag": "必背", "key": "ReAct 把任务推理与行动交替组织", "a": ["系统根据当前问题和已有观察选择动作，外部工具实际执行后返回新观察，再据此决定继续、改变计划或结束。", "关键是行动后取得真实环境反馈，不能把模型自行写出的工具结果当作事实。", "单纯思维链主要在模型内部展开推理，不一定改变或查询环境。", "部署时只需保留必要的决策摘要、动作与结果，重点验证每步是否有效。", "ReAct 是组织方式，不保证计划正确，也不能取代工具校验和停止规则。"], "f": ["任务状态→决策→工具执行→观察→更新状态→继续或结束。"], "fq": "工具返回与原先推理冲突时怎么办？", "fa": "先核对调用参数、返回状态与数据来源，再更新结论或补充验证。 不能为了维持原答案忽略真实反馈，也不能把单次工具异常直接当成最终事实。", "viz": "agent", "src": "6.2 LLM-based Agent 基于大模型的智能体", "id": "g2-5"}, {"topic": "优化与训练", "q": "一个可靠的工具 schema 应包含什么，JSON 合法就能执行吗？", "tag": "必背", "key": "工具定义要写清名称、用途、适用边界、参数类型、必填项、单位、枚举和返回值", "a": ["模型生成调用请求后，程序先解析和校验 schema，再检查参数语义及权限，最后才执行。", "例如开始时间和结束时间即使都是合法数字，也可能前后颠倒。", "约束解码能提高结构正确率，却不能保证选对工具或数据真实。", "错误返回应结构化说明问题，允许有限次数修正，不能靠无限重试。", "工具输出还应区分成功、业务失败和系统异常，便于下一步决策。"], "fq": "所有字段都设成可选会不会更灵活？", "fa": "可能减少表面校验失败，却把缺省语义和不确定性转移到执行层。 核心参数应明确必填，缺省值必须有业务含义。 缺少必要信息时应补查或澄清。", "src": "10.4 八股面经（含答案）", "id": "g2-6"}, {"topic": "优化与训练", "q": "模型发起工具调用后，执行器需要负责哪些事情？", "tag": "必背", "key": "模型负责提出动作，执行器负责把动作变成受控的真实操作", "a": ["执行前核对工具是否允许、参数是否符合业务约束，以及当前任务是否具备权限。", "执行时设置超时和资源限制。", "执行后记录返回状态并检查目标是否实现。", "凭据应保留在受控服务端，不能把任意模型文本直接当 shell 或数据库语句执行。", "即使工具调用格式完全正确，也可能访问错误对象或超出任务范围。", "模型声称执行成功不是验收证据，必须依赖工具结果或目标系统状态。"], "fa": "不意味着。 权限应按操作、资源和任务范围区分。 读取、修改和对外发布具有不同后果，执行器必须分别检查，不根据模型的自然语言理由自动扩大权限。", "src": "10.4 八股面经（含答案）；Harness Engineering: 为 Agent 设计闭环系统", "id": "g2-7"}, {"topic": "优化与训练", "q": "偏差方差与正则化如何解释，L1、L2 和 Dropout 有何不同？", "tag": "必背", "key": "偏差描述学习方法平均预测与真实规律的差距，方差描述它对训练样本变化的敏感性", "a": ["经典平方误差可分为偏差平方、方差和不可约噪声。", "正则化限制模型选择，可能以增加一些偏差换取较低方差。", "L1 惩罚倾向产生稀疏解，L2 使权重整体收缩，但不能断言所有权重永远非零。", "Dropout 训练时随机屏蔽激活，常见实现同时按保留率缩放，普通推理关闭。", "正则强度应通过验证选择，过强也会欠拟合。"], "f": ["E[(y-f̂(x))²]=Bias²+Variance+Noise", "L1=λ∥w∥₁，L2=λ∥w∥²₂。"], "fq": "训练和验证损失都高，就一定该增大模型吗？", "fa": "不一定。 还应检查特征、目标、优化是否收敛和数据质量。 欠拟合可能来自模型限制，也可能是训练流程、学习率或标签问题，先定位再增加复杂度。", "viz": "biasvar", "src": "10.6 机器学习深度学习八股（初稿）；0.9 ML 偏差-方差权衡 (Bias-Variance Tradeoff)", "id": "g2-8"}, {"topic": "优化与训练", "q": "训练和推理的计算量怎么估？6N 是怎么来的？", "tag": "必背", "key": "把参数量记作 N", "a": ["前向时每个参数对每个 token 参与一次乘法和一次加法，约 2N 次浮点运算。", "反向要算输入梯度与参数梯度两部分，约为前向的两倍，即 4N。", "训练一个 token 合计约 6N，训练总量约等于 6 乘 N 乘训练 token 数。", "推理只有前向，每个 token 约 2N。", "这个估算没算注意力矩阵本身，注意力还有与序列长度平方相关的项，短序列可忽略，长上下文下不能忽略。"], "f": ["训练总计算量约等于 6 乘 N 乘 D。取 N 为 70 亿、D 为 1 万亿 token，约为 4.2 乘 10 的 22 次方次浮点运算。"], "fq": "知道这个估算有什么用？", "fa": "一是排算力预算与训练时长，用总计算量除以卡数与单卡有效算力就得到大致天数。 二是理解 Chinchilla 的结论，给定计算量下参数量与 token 数应同比例增长，经验上每个参数配约 20 个 token。 三是判断瓶颈，若实测吞吐远低于这个估算给出的理论值，问题通常在数据管线或通信而不是算力。", "viz": "scaling", "id": "g2-9"}, {"topic": "优化与训练", "q": "混合精度训练为什么需要损失缩放？bf16 和 fp16 怎样选？", "tag": "必背", "key": "fp16 的指数位只有 5 位，可表示的最小正规数约为十的负五次方量级，反向传播中小梯度容易下溢为零，训练停滞", "a": ["损失缩放把损失乘以一个较大系数，使梯度整体放大到可表示范围，更新前再除回去，并对出现溢出的步做跳过与动态调整系数。", "bf16 指数位与 fp32 相同，动态范围一致，只是尾数精度低，因此不需要损失缩放，训练稳定性明显更好，代价是数值精度略低。", "在支持 bf16 的硬件上优先选 bf16。", "无论哪种，主权重与优化器状态通常仍保留 fp32 副本以保证更新精度。"], "f": ["有效更新量级与参数量级之比若小于精度分辨率，更新会被舍入丢失，这是保留 fp32 主权重的原因。"], "fq": "梯度检查点省了什么，代价是什么？", "fa": "省激活显存。 前向只保存分段边界处的激活，反向时重新计算段内激活。 显存从与层数成正比降到与层数平方根成正比的量级，代价是多一次前向计算，训练时间增加约三成。", "viz": "mixed", "id": "g2-10"}, {"topic": "优化与训练", "q": "学习率预热和余弦衰减各起什么作用？批大小变化时学习率怎样调？", "tag": "理解", "key": "预热在训练初期用较小学习率线性升到峰值，此时参数随机、梯度方向噪声大，直接用大学习率容易让自适应优化器的二阶矩估计失真并发散", "a": ["余弦衰减在后期平滑降低学习率，使参数在损失盆地中收敛而非持续震荡，末端通常保留一个很小的常数学习率。", "批大小增大时梯度噪声降低，可以用更大学习率，经验规则是线性缩放或平方根缩放，线性缩放适用于中等批量，超大批量下平方根缩放更稳，并需要同步延长预热步数。"], "f": ["线性缩放规则写作，新学习率等于基准学习率乘以新批大小与基准批大小之比。"], "fq": "为什么大批量训练常常泛化更差？", "fa": "梯度噪声本身有正则作用，帮助逃离尖锐极小点。 批量增大后噪声减小，容易收敛到尖锐极小点，测试集上表现下降。 缓解手段包括延长预热、配合更强的数据增广或权重衰减、使用逐层自适应的优化器。", "viz": "lrsched", "id": "g2-11"}, {"topic": "优化与训练", "q": "梯度裁剪解决什么问题？按范数裁剪和按值裁剪有什么区别？", "tag": "理解", "key": "解决梯度爆炸", "a": ["深层网络或长序列上偶发的极大梯度会让一步更新把参数推离合理区域，损失出现尖峰甚至变成非数。", "按范数裁剪计算全部梯度的全局范数，若超过阈值则整体等比缩放，保持梯度方向不变，只压缩幅度，是标准做法。", "按值裁剪逐元素截断到区间内，会改变梯度方向，破坏不同参数间的相对比例，一般不用于大模型。", "实践中还会监控梯度范数曲线，突然的尖峰往往提示数据中存在异常样本。"], "f": ["按范数裁剪的缩放因子等于阈值与全局范数之比，取该比值与一的较小者。"], "fq": "训练中途 loss 变成 NaN，排查顺序是什么？", "fa": "先看是否某个批次触发，定位到具体样本检查是否有异常输入。 再看是否学习率过大或预热不足。 然后检查混合精度是否溢出，softmax 或 log 是否出现零输入，归一化层分母是否加了 epsilon。 最后检查是否有除以零的自定义算子。 定位方法是回滚到最近检查点并开启异常检测逐算子定位。", "id": "g2-12"}, {"topic": "强化学习与 Agent", "q": "如何把一个数据准备任务写成 MDP？", "tag": "必背", "key": "MDP 用状态、动作、转移和奖励描述序列决策，再通过折扣或有限时域定义累计收益", "a": ["以数据准备为例，状态可以包含当前错误证据、模型反馈、保留率和剩余预算，动作可以是保留、删除、估计修复或付费查询真值，转移则由动作执行后数据和预算的变化决定。", "奖励可结合下游收益与成本。", "关键是当前状态是否足以描述未来所需信息。", "只堆几个统计量不自动满足 Markov 性。", "若遗漏重要历史，应扩充状态或承认部分可观测近似。"], "f": ["MDP=(S,A,P,r,γ)", "J(π)=E_π[Σ_t γᵗ r_t]。"], "fq": "为什么剩余预算和剩余步数可能需要进入状态？", "fa": "相同数据在不同剩余资源下，最优动作和可行动作可能不同。 若把这两种情形映成同一状态，策略就缺少决策信息。 有限时域中时间也可能是状态的一部分。", "src": "3.2 RL 强化学习基础", "id": "g3-1"}, {"topic": "强化学习与 Agent", "q": "经验回放、目标网络与 Double DQN 分别解决什么问题？", "tag": "必背", "key": "经验回放把历史转移存起来随机抽取，降低相邻样本相关性并提高利用率", "a": ["目标网络让回归目标在一段时间内较稳定，减轻一边预测一边快速改变目标的问题。", "普通 DQN 在目标中取最大动作价值，同一估计既选动作又评分，噪声可能造成高估。", "Double DQN 用在线网络选下一动作，再由目标网络评价它。", "它缓解这种选择偏差，但不保证估值完全无偏或训练必然稳定，还依赖探索、数据覆盖和目标更新设置。"], "f": ["a*=argmax_a Q_online(s′,a)", "y=r+γ(1-terminated)Q_target(s′,a*)。"], "fq": "online=[10,1]、target=[2,20]、r=1、γ=0.5，未终止目标是多少？", "fa": "在线网络选择第一个动作，目标网络对它的估值是 2，所以目标是 1+0.5×2=2。 若自然终止则为 1。 若算成 11，就是错误地取了目标网络的最大值。", "src": "3.2 RL 强化学习基础", "id": "g3-2"}, {"topic": "强化学习与 Agent", "q": "Dueling、Double 与两阶段动作结构有什么区别？", "tag": "必背", "key": "Dueling 是价值网络的参数化方式，把状态整体好坏与各动作相对优势分开建模，再组合成 Q 值", "a": ["因为给价值加常数、同时给优势减常数不会改变 Q，常用减去优势均值来固定这种自由度。", "Double 改的是 TD 目标，用不同估计完成动作选择与评价。", "两阶段则是任务动作的分解，例如先判断是否干预，再决定采用估计值还是真值。", "三者处于不同层面，可以组合，但组合有效仍需对照实验，不能凭名称就认定消除了所有价值偏差。"], "f": ["Q(s,a)=V(s)+A(s,a)-(1/|A|)Σ_b A(s,b)。"], "fq": "减去优势均值之后，A 就必然是真实优势函数吗？", "fa": "不是。 它主要约束网络分解并便于学习。 网络估计仍可能有误差，V 分支也不能自动解释成任意指定策略的精确状态价值。", "id": "g3-3"}, {"topic": "强化学习与 Agent", "q": "如何处理稀疏奖励，为什么预算约束不能只靠惩罚？", "tag": "必背", "key": "稀疏反馈可以用较低成本的中间评价或奖励塑形补充，例如用局部证据引导，再周期性测代理模型，最终用真实任务收益验收", "a": ["这样提高反馈密度，却可能让策略学会追求代理分数，因此要检查动作分布和最终目标的一致性。", "一般经验塑形会改变优化目标，不能随意宣称保持原最优策略。", "硬预算更应由环境检查可行动作，阻止无法支付的修复。", "只设大额惩罚仍允许探索时违规，也可能因奖励尺度失衡产生错误偏好。"], "f": ["势函数塑形的常见形式 F(s,a,s′)=γΦ(s′)-Φ(s)", "保持策略的结论依赖对应假设。"], "fq": "自然终止与达到外部时间限制都应该把 bootstrap 置零吗？", "fa": "自然终止通常不再 bootstrap。 仅因外部时间限制截断、而任务本身仍可继续时通常应保留 bootstrap。 若有限时域就是任务定义的一部分，应把时间纳入状态并按终止定义处理。", "src": "3.2 RL 强化学习基础；6.2 LLM-based Agent 基于大模型的智能体", "id": "g3-4"}, {"topic": "强化学习与 Agent", "q": "Agent 怎样判断结束，如何控制死循环和预算？", "tag": "必背", "key": "结束条件应在任务开始时定义，包括目标完成、不可恢复失败、需要补充信息和预算耗尽", "a": ["除了最大步数，还要限制总时间、token、调用次数与费用，并检查重复动作和重复观察是否带来进展。", "完成判断最好由可验证结果支持，例如文件已生成且通过检查。", "检测到循环后，可以缩小任务、换工具或返回当前证据和未完成项。", "单靠模型说已经足够并不可靠，预算也应在执行层扣减，避免模型估计错误或一次昂贵调用超出上限。"], "fq": "达到步数上限能否直接返回成功？", "fa": "不能。 应区分正常完成与预算中止，保留已有结果、失败原因和可恢复状态。 若部分目标未验证，最终结果必须明确表达未完成部分。", "src": "6.2 LLM-based Agent 基于大模型的智能体", "id": "g3-5"}, {"topic": "强化学习与 Agent", "q": "工具调用超时后为什么不能直接重试，幂等如何设计？", "tag": "必背", "key": "超时只表示没有及时收到结果，不代表服务端没有执行", "a": ["只读查询通常容易重试，但写入、扣费或发布可能已成功，再执行会产生重复副作用。", "可为一次逻辑操作生成稳定的幂等键，服务端记录处理状态与结果，相同键重试返回同一结果。", "重试前也可以查询状态。", "瞬时网络错误适合有限重试和退避，参数错误、权限拒绝或确定的业务失败应先处理原因。", "任务状态要持久化，恢复时识别已完成步骤，不能把整个流程无条件再跑一次。"], "fq": "同一个幂等键重试时，可以换一套参数吗？", "fa": "通常不应允许。 服务端应把幂等键与请求语义或参数摘要绑定，参数不同返回冲突。 否则同一个键可能意外复用旧结果，掩盖真正的新操作。", "src": "10.4 八股面经（含答案）；1. 相关工作概述", "id": "g3-6"}, {"topic": "强化学习与 Agent", "q": "Agent 的短期记忆、长期记忆与上下文压缩如何区分？", "tag": "必背", "key": "短期记忆保存当前任务的消息、计划和工具状态，通常进入上下文或任务状态", "a": ["长期记忆跨任务保留事实、偏好和经验，可以放在数据库、文件或检索系统中。", "长期记忆不等于向量库，更不等于模型权重。", "上下文压缩应保留目标、约束、已验证事实、待办和失败原因，把可恢复的长日志移到外部并保存引用。", "写入长期记忆前要检查来源和有效期，避免把幻觉反复回灌。", "读取还要遵守用户与资源隔离，不能把不同用户的信息混用。"], "fq": "为什么不是把全部历史放进更长的窗口就行？", "fa": "长上下文仍有成本和噪声，旧信息也可能过时或冲突。 应按当前决策需要检索，并保留来源、时间和状态，使压缩后的事实能被核查。", "src": "6.2 LLM-based Agent 基于大模型的智能体；先看本质", "id": "g3-7"}, {"topic": "强化学习与 Agent", "q": "决策树怎样选分裂，信息增益、Gini 与剪枝是什么？", "tag": "必背", "key": "决策树在每个节点比较候选特征和阈值，选择能降低目标不纯度或回归误差的划分，再递归处理子节点", "a": ["分类常用熵或 Gini，不纯度下降要按子节点样本比例加权。", "信息增益容易偏向取值很多的特征，信息增益率用分裂信息归一化来缓解。", "树长得很深时可能记住噪声，可限制深度、叶子最小样本量或使用剪枝。", "贪心地选每一步最好划分并不保证整棵树全局最优，最终仍要看独立验证表现。"], "f": ["H=-Σ_k p_k log p_k", "Gini=1-Σ_k p_k²", "Gain=I(parent)-Σ_c(n_c/n)I(child_c)。"], "fq": "为什么树通常不需要像线性模型那样先做标准化？", "fa": "普通轴对齐树主要利用单个特征的排序和阈值，严格单调变换通常保持可选划分。 仍要处理数据类型、缺失值和编码。 涉及近似分桶时还要看实现。", "viz": "tree", "src": "10.6 机器学习深度学习八股（初稿）；0.8 ML 决策树与集成学习 (Decision Trees and Ensembles)", "id": "g3-8"}, {"topic": "强化学习与 Agent", "q": "RLHF 的完整流程包含哪几个模型？各自的作用和显存开销是什么？", "tag": "必背", "key": "标准 PPO 流程涉及四个模型", "a": ["策略模型是被优化的对象。", "参考模型是 SFT 后的冻结副本，用于计算 KL 惩罚防止策略偏离过远。", "奖励模型给完整回复打分。", "价值模型估计状态价值以计算优势，通常从奖励模型初始化。", "显存上策略需要参数、梯度与优化器状态，价值模型同样需要训练，参考与奖励模型只需前向。", "四模型同驻是 PPO 工程复杂度高的主因。", "DPO 去掉奖励模型与价值模型，只需策略与参考两个模型。", "GRPO 去掉价值模型，用同一提示下多条采样的组内奖励标准化替代优势估计，显著降低显存。"], "f": ["PPO 的优势用广义优势估计计算，目标为概率比率乘以优势与其裁剪版本的较小者，再减去 KL 惩罚项。"], "fq": "GRPO 的组内标准化有什么隐患？", "fa": "当组内所有样本奖励相同时标准差为零，优势退化为零或数值不稳，该提示对梯度无贡献。 需要做过滤或加小常数。 另外组内标准化会抹掉提示之间的难度差异，简单提示上的微小差异被放大，可能导致训练偏向易题。", "viz": "rlhf", "id": "g3-9"}, {"topic": "强化学习与 Agent", "q": "可验证奖励的强化学习（RLVR）适用于什么场景？", "tag": "必背", "key": "RLVR 用规则或程序直接判定正确性作为奖励，例如数学答案比对、代码单元测试、格式校验", "a": ["优势是奖励无噪声且无法被语言层面的讨好行为欺骗，因此可以长时间大幅度优化而不出现奖励投机。", "局限是需要任务本身可自动验证。", "可行做法是把这些可验证约束作为规则奖励，与基于人类偏好的奖励模型组合，规则部分提供硬约束，偏好部分提供审美信号。"], "f": ["组合奖励等于规则奖励与偏好奖励的加权和，规则不满足时可直接置为下界以形成硬约束。"], "fa": "对规则奖励设上限，满足即给满分不再加分，避免过度优化。 同时保留 KL 约束并定期用人评抽检，监控偏好奖励是否在规则奖励上升时下降，出现该现象即为投机信号。", "id": "g3-10"}, {"topic": "强化学习与 Agent", "q": "过程奖励模型和结果奖励模型有什么区别？各自怎样标注？", "tag": "理解", "key": "结果奖励只对最终输出打分，标注成本低，但对长推理链只能提供稀疏信号，无法指出错在哪一步", "a": ["过程奖励对中间每一步打分，信号密集，能定位错误步骤，训练出的模型在搜索时可用于剪枝。", "过程标注成本高，人工逐步标注不现实，常用自动方法，从某个中间步骤出发多次采样到终点，用能否到达正确答案的比例作为该步骤的价值估计。", "这类估计存在偏差，正确步骤也可能因后续采样失败而被低估。"], "f": ["某步骤的过程分可估计为从该步续采样若干条轨迹中最终正确的比例。"], "fa": "有。 分段打分就是过程奖励的形式，对生成的每个小节或每个段落分别评估调性一致性、节奏稳定性与过渡自然度，而不是只对整首打一个分。 这能定位到具体是哪一段崩坏，训练信号也更密集。", "id": "g3-11"}, {"topic": "Transformer 与注意力", "q": "Self-attention、cross-attention 和多头注意力怎样区分？", "tag": "必背", "key": "注意力用 Q 与 K 的相似度生成权重，再对 V 加权", "a": ["自注意力中三者来自同一序列，交叉注意力中 Q 来自当前序列，K 和 V 可来自另一序列或模态，所以查询长度与键长度可以不同。", "多头将表示映射到多个子空间，分别计算后拼接并投影。", "输入形状为批量、长度、总维度时，每头通常是批量、头数、长度、头维。"], "f": ["Attention(Q,K,V)=softmax(QKᵀ/√d_k+M)V", "head 形状 [B,H,T,d_k]。"], "fq": "交叉注意力的注意力矩阵形状是什么？", "fa": "若查询长度为 Tq、键长度为 Tk，则每头分数形状为 [B,H,Tq,Tk]，输出长度跟随查询，值维跟随 V。 Tq 与 Tk 不必相等，但 K/V 的键位置必须对应。", "viz": "attn", "src": "1.3 Attention 注意力", "id": "g4-1"}, {"topic": "Transformer 与注意力", "q": "为何除以根号 d，mask 与稳定 softmax 怎样处理？", "tag": "必背", "key": "在分量近似独立、均值为零且方差相近的简化条件下，点积方差会随维度增加", "a": ["除以根号维度可控制分数尺度，减少 softmax 过度饱和。", "causal mask 阻止读取未来位置，padding mask 排除无效键。", "计算 softmax 时减去行最大值，不改变概率，却能减小指数上溢风险。", "若一整行没有合法键，直接对全负无穷取 softmax 会出问题，需要显式定义空行输出。", "不同接口对布尔 mask 的真值含义可能相反，必须检查约定。"], "f": ["softmax(z)_i=(exp(z_i-m))/(Σ_j exp(z_j-m))，m=max_j z_j。"], "fq": "softmax 能直接换成 sigmoid 吗？", "fa": "可以设计使用 sigmoid 的注意力变体，但它不是标准 softmax 注意力的等价替换。 各权重不再共同归一到一，输出尺度和位置间竞争都会变化，需要相应的结构设计与验证。", "viz": "attn", "src": "0.16 DL Softmax回归与多分类；0.19 DL 注意力与 Transformer", "id": "g4-2"}, {"topic": "Transformer 与注意力", "q": "LayerNorm 与 BatchNorm 的统计维度和训练推理行为有何区别？", "tag": "必背", "key": "BatchNorm 通常对每个通道沿批量及相应空间维统计，训练时用当前批统计并维护运行统计，常规推理使用运行均值与方差", "a": ["LayerNorm 对单个样本指定的特征维归一化，例如对每个 token 的隐藏维计算均值方差，训练和推理使用同一类当前输入统计。", "它较少依赖批大小，因此适合长度变化的序列场景。", "两者都可包含可学习的缩放和偏置。", "应按具体张量与 normalized_shape 说明归一化轴，不能笼统说沿所有维度归一化。"], "f": ["LN(x)=γ⊙(x-μ)/√(σ²+ε)+β，μ、σ² 沿指定特征维计算。"], "fq": "RMSNorm 与 LayerNorm、Pre-Norm 与 Post-Norm 各有什么区别？", "fa": "RMSNorm 按均方根缩放而不减均值。 它不是假设实际均值为零。 Pre-Norm 在子层前归一化，保留更直接的残差路径。 Post-Norm 在残差相加后归一化。 训练稳定性依具体设计而定，Pre-Norm 不意味着永远不需要 warmup。", "viz": "norm", "src": "1.4 FFN & Add & LN 前馈层、残差、层归一化；10.6 机器学习深度学习八股（初稿）", "id": "g4-3"}, {"topic": "Transformer 与注意力", "q": "Attention 的开销是什么，FlashAttention 和 KV cache 优化哪里？", "tag": "必背", "key": "对长度为 T、隐藏维为 D 的标准全注意力，两个主要矩阵乘法有二次序列长度项，直接保存注意力矩阵也需要二次空间", "a": ["FlashAttention 利用分块与在线 softmax 减少显存读写和中间矩阵存储，计算的仍是精确注意力，不自动变成线性时间。", "KV cache 服务于自回归推理，复用历史 token 的键和值，避免每次重新计算它们，但新增查询仍需关注历史。", "缓存内存随层数、批量和上下文增长，训练激活问题也不能靠它解决。"], "f": ["注意力混合 O(BT²D)，线性投影 O(BTD²)", "分数存储 O(BHT²)", "KV 元素数约 2LBTH_kv d_h。"], "fq": "为什么不能把训练时所有激活都缓存后重复使用？", "fa": "训练更新参数后，旧激活对应旧参数，直接复用会改变梯度计算。 KV cache 通常用于固定参数的自回归推理，不能当成通用训练省显存方法。", "viz": "heads", "src": "1.3 Attention 注意力；10.3 Transformer量化分析计算", "id": "g4-4"}, {"topic": "Transformer 与注意力", "q": "为什么需要位置编码，RoPE 怎样使注意力含有相对位置？", "tag": "必背", "key": "没有位置等信号的自注意力，对输入的共同置换具有等变性，不能仅凭内容区分排列", "a": ["RoPE 把每个位置上的 Q、K 按二维对子空间旋转，不同维度对使用不同频率。", "位置 m 和 n 的旋转向量做内积时，可化为原向量之间包含 n 减 m 的旋转，因此把相对位置信息带进分数。", "它保留向量范数，但不保证超出训练长度后效果不变。", "长上下文扩展还需要检查频率、插值方案、训练分布和实际长序列评价。"], "f": ["(R_m q)ᵀ(R_n k)=qᵀR_(n-m)k。"], "fq": "RoPE 一般是否要同样作用于 V？", "fa": "常见实现将旋转施加于 Q 和 K，让相对位置信息进入匹配分数，V 通常不这样旋转。 具体变体应按模型定义说明，不能把一种实现当唯一可能。", "viz": "rope", "src": "1.5 Positional Encoding 位置编码；0.19 DL 注意力与 Transformer", "id": "g4-5"}, {"topic": "Transformer 与注意力", "q": "MHA、MQA、GQA 如何影响 KV cache，prefill 与 decode 有何区别？", "tag": "必背", "key": "MHA 为每个查询头配独立的键值头，MQA 让所有查询头共享一组键值，GQA 则把查询头分组，每组共享键值", "a": ["减少键值头数可以降低缓存和解码时读取它的带宽需求，但效果取决于训练及架构，不能保证无损。", "prefill 处理整段已有输入并建立缓存，decode 则逐步产生新 token，每步读取历史键值。", "长输入、长输出和批量增大影响不同阶段的成本，估算时应使用实际键值头数，而不是一律拿查询头数代入。"], "f": ["KV 字节数≈2×层数×batch×序列长度×KV头数×每头维度×每元素字节数。"], "fq": "把已经训练好的 MHA 模型直接删掉大部分 KV 头就行吗？", "fa": "不应直接等同。 转换通常需要合理的参数聚合与继续训练，并测质量退化。 架构节省缓存的原理不意味着任意现成权重都能零成本转换。", "viz": "heads", "src": "1.3 Attention 注意力", "id": "g4-6"}, {"topic": "Transformer 与注意力", "q": "Greedy、temperature、top-k、top-p 和 beam search 有何区别？", "tag": "必背", "key": "Greedy 每步选概率最大 token", "a": ["temperature 缩放 logits，改变分布尖锐程度。", "top-k 保留固定数量的高分候选。", "top-p 保留累计概率达到阈值的最小候选集合后采样。", "beam search 保留若干高序列分数的前缀，追求较高概率序列，和随机采样不同。", "开放生成需要兼顾质量与多样性，工具参数则更看重结构约束和语义正确。", "降低温度不保证事实正确，解码策略的组合顺序会影响结果，应按具体实现固定并报告。"], "f": ["p_i=softmax(z_i/T)", "top-p 先按概率降序选累计质量至少为 p 的最小集合。"], "fq": "temperature=0 是否应在公式里直接除以零？", "fa": "不应该。 很多接口把零温度当作贪心模式的约定，属于单独处理。 数学公式中的温度应为正。 即使贪心，数值和服务实现也未必保证跨环境逐位一致。", "viz": "sampling", "src": "1.6 Structure & Decoding 结构和解码", "id": "g4-7"}, {"topic": "Transformer 与注意力", "q": "随机森林和 GBDT 分别怎样集成，为什么不能混称？", "tag": "必背", "key": "随机森林在样本和特征上引入随机性，训练多棵树后平均或投票，常用于降低高方差树模型的方差", "a": ["各棵树可独立训练，但预测在统计上并非完全无关，降低相关性是集成有效的关键之一。", "GBDT 则逐轮向当前加法模型加入新树，沿损失下降方向修正已有模型。", "平方误差下可理解为拟合残差，一般损失下是拟合负梯度。", "Boosting 的轮次有依赖，但单棵树的分裂统计仍可并行。", "两者都需控制深度和过拟合。"], "f": ["GBDT：F_m(x)=F_(m-1)(x)+η f_m(x)。"], "fq": "为什么说 GBDT 不是总在拟合“上一棵树”的残差？", "fa": "它针对的是当前全部树组成的模型输出。 新树拟合损失对当前预测的负梯度。 只有特定损失下，这个量才直接等于真实值减预测值。", "viz": "gbdt", "src": "10.6 机器学习深度学习八股（初稿）", "id": "g4-8"}, {"topic": "Transformer 与注意力", "q": "完整讲一遍 Transformer 的结构与数据流。", "tag": "必背", "key": "原论文是编码器解码器结构", "a": ["输入先过词嵌入并加上位置信息，然后堆 N 个相同的块。", "编码器块有两个子层，多头自注意力（双向，不加掩码）与逐位置前馈层，每个子层后面接残差相加与归一化。", "解码器块有三个子层，带因果掩码的多头自注意力、以编码器输出为键值的交叉注意力、前馈层，同样各接残差与归一化。", "最后一层隐状态过一个线性层映射到词表维度，softmax 得到下一个 token 的分布。", "一句话概括数据流，注意力在 token 之间混合信息，前馈层在每个位置上独立做非线性变换，两者交替堆叠。", "当前主流大模型是 Decoder-only，去掉编码器与交叉注意力，并把原论文的 Post-Norm 换成 Pre-Norm，归一化换 RMSNorm，前馈层换 SwiGLU，位置编码换 RoPE。"], "f": ["单块的计算顺序，Pre-Norm 写作 x 加上 Attn(Norm(x))，再对结果加上 FFN(Norm(该结果))。"], "fq": "注意力后面为什么一定要接前馈层？", "fa": "注意力对值向量做的是加权求和，权重虽由输入算出，但对值本身是线性混合，堆再多层也缺少逐位置的非线性变换能力。 前馈层在每个位置上独立升维、过非线性、再降维，提供模型的主要容量。 一个混序列维，一个混特征维，缺一不可。", "viz": "tflayer", "id": "g4-9"}, {"topic": "Transformer 与注意力", "q": "Transformer 的参数量怎么估？7B 这个数是怎么来的？", "tag": "必背", "key": "按层算", "a": ["注意力有查询、键、值、输出四个 d 乘 d 的矩阵，合计 4 倍 d 的平方。", "前馈层若是标准两层、中间维取 4d，则是两个 d 乘 4d 的矩阵，合计 8 倍 d 的平方。", "一层共约 12 倍 d 的平方，L 层就是 12 乘 L 乘 d 的平方。", "再加词嵌入与输出头，各约词表大小乘 d。", "归一化与偏置项占比很小，估算时可以忽略。", "换成 SwiGLU 时有三个矩阵、中间维取三分之八倍 d，参数量仍是 8 倍 d 的平方，所以这个估算不变。"], "f": ["参数量约等于 12 乘 L 乘 d 的平方，再加词表大小乘以 d。取 d 为 4096、L 为 32，主体约为 64.4 亿", "再加词表 32000 乘 4096 的输入嵌入与输出头，总量约 67 亿，这就是所谓 7B 的来源。"], "fq": "用了 GQA 之后这个估算还准吗？", "fa": "注意力部分会变小。 查询与输出仍是各一个 d 乘 d 的矩阵，键与值缩成 d 乘键值头数乘头维，所以注意力从 4 倍 d 的平方降到 2 倍多一点。 前馈层不变，总量略低于 12 倍 d 的平方。", "id": "g4-10"}, {"topic": "Transformer 与注意力", "q": "多头注意力的头数与头维怎么选？头是不是越多越好？", "tag": "理解", "key": "隐维固定时，头数乘头维等于隐维，两者此消彼长", "a": ["头数多则每个头的维度小，能关注更多种不同的模式，但每个头自身的表达能力弱，且头维过小时点积的区分度下降。", "头数少则每个头更强，但关注模式单一。", "常见做法是把头维固定在 64 或 128，头数随隐维增大而增加。", "注意力的参数量只和隐维有关，与头数无关，所以改头数不改参数量，改的是注意力的并行粒度与子空间划分。"], "f": ["头维等于隐维除以头数所得的商。d 为 4096、头数为 32 时，头维为 128。"], "fq": "既然头数不影响参数量，多设一些有坏处吗？", "fa": "有。 头维太小会让点积落在很窄的数值范围里，softmax 区分度变差。 另外研究发现训练好的模型里很多头是冗余的，剪掉相当比例的头对效果影响很小，说明盲目加头并不带来收益。 GQA 与 MQA 减的是键值头数，查询头数不变，目的是压缩缓存而不是改变表达能力。", "id": "g4-11"}, {"topic": "Transformer 与注意力", "q": "RMSNorm 相比 LayerNorm 省了什么？为什么现代大模型普遍用 Pre-Norm 加 RMSNorm？", "tag": "必背", "key": "LayerNorm 先减均值再除以标准差，然后做缩放和平移", "a": ["RMSNorm 去掉了减均值和平移，只用均方根做缩放，计算量与访存都更少，实测质量相当。", "Pre-Norm 把归一化放在子层输入侧，使残差路径成为从输入到输出的恒等通路，梯度可以无衰减地直达浅层，深层模型训练稳定，不需要复杂的学习率预热。", "Post-Norm 表达能力略强但深层容易梯度消失。", "两者结合是当前的默认选择。"], "f": ["RMSNorm 的输出等于输入除以其均方根后再乘以可学习增益。均方根等于各维度平方均值的平方根。"], "fq": "Pre-Norm 有什么已知缺点？", "fa": "残差流的幅值随层数累积增长，深层子层的相对贡献被稀释，表达能力略有损失。 缓解办法包括在输出前加一次归一化、对残差做缩放，或采用 Sandwich 式在子层前后都加归一化。", "viz": "norm", "id": "g4-12"}, {"topic": "Transformer 与注意力", "q": "SwiGLU 相比 ReLU 和 GELU 好在哪？为什么中间维度要取三分之八倍？", "tag": "必背", "key": "SwiGLU 是门控线性单元的一种，把输入分别过两个线性层，一路经 Swish 激活作为门控，与另一路逐元素相乘，再过第三个线性层", "a": ["门控机制让网络按输入动态调节信息通过量，实测困惑度优于 ReLU 与 GELU。", "代价是需要三个权重矩阵而非两个，为了保持参数量与标准前馈层一致，中间维度从四倍隐维降到三分之八倍隐维，因为四倍乘以三分之二恰好等于三分之八。"], "f": ["SwiGLU 的输出写作，第三个线性层作用于 Swish 门控向量与另一路线性输出的逐元素乘积。Swish 等于输入乘以其 sigmoid。"], "fq": "激活函数换了还需要调其他超参吗？", "fa": "需要调学习率与初始化尺度。 门控结构的输出方差与非门控不同，沿用原配置可能导致早期训练不稳。 实践中会缩小初始化标准差并适当延长预热。", "id": "g4-13"}, {"topic": "Transformer 与注意力", "q": "MLA（多头隐注意力）怎样压缩 KV 缓存？和 GQA 有什么区别？", "tag": "理解", "key": "GQA 让多个查询头共享同一组键值头，缓存量按分组数缩减，是对头数的直接削减，会损失一部分表达多样性", "a": ["MLA 换思路，把键值先投影到一个低维隐空间，缓存只存这个低维隐向量，使用时再上投影还原成各头的键值。", "由于上投影矩阵可以与查询投影吸收合并，推理时不必显式还原，缓存量大幅下降而每头仍保留独立参数。", "代价是引入额外投影计算，且与 RoPE 的结合需要特殊处理，要另加一段在各头之间共享的位置键，这一段不参与低秩压缩，缓存里多存这一小段。"], "f": ["标准多头注意力每层每 token 缓存键与值各一份，共 2 乘头数乘头维个数。MLA 只缓存压缩隐向量与共享位置键。DeepSeek-V2 中二者分别为 512 维与 64 维，合计 576 维，而同配置的标准多头注意力为 2 乘 128 乘 128，即 32768 维，压缩约 57 倍。"], "fq": "为什么 RoPE 和 MLA 会冲突？", "fa": "RoPE 按位置对键做旋转，旋转与上投影矩阵不可交换，无法把上投影吸收进查询侧。 DeepSeek 的办法是解耦 RoPE，位置键由隐状态经一组单独投影生成并施加 RoPE，在所有头之间共享，每头维度取普通头维的一半，不参与低秩压缩。 位置查询由查询的压缩隐向量投影得到，每头一份。 位置部分与由压缩隐向量还原出的内容部分拼接后一起参与注意力。", "viz": "heads", "id": "g4-14"}, {"topic": "Transformer 与注意力", "q": "位置编码外推为什么会失效？NTK 缩放与 YaRN 分别怎样解决？", "tag": "必背", "key": "RoPE 各维度对应不同频率，训练时模型只见过训练长度内的相位范围", "a": ["直接外推到更长序列，高频维度的相位超出见过的区间，注意力分布崩坏。", "位置插值把位置索引整体压缩到训练范围内，等价于降低所有频率，虽然不再越界，但高频细节被压扁，短距离分辨能力下降。", "NTK 缩放按频率做非均匀调整，低频维度多压缩以承担长程，高频维度少压缩以保留局部分辨。", "YaRN 在此基础上分三段处理，高频完全不变，低频完全插值，中频线性过渡，并对注意力温度做补偿缩放，在少量长文本上微调即可稳定扩展。"], "f": ["位置插值把位置 m 替换为 m 乘以训练长度与目标长度之比。NTK 缩放改为调整旋转基数，把基数乘以扩展倍数的某个幂次。"], "fq": "上下文变长后除了位置编码还有什么问题？", "fa": "注意力计算与 KV 缓存都随长度增长，显存与延迟成为瓶颈，需要配合稀疏注意力或缓存压缩。 数据侧也缺少真正需要长程依赖的训练样本，若只用拼接短文本做长序列训练，模型学不到跨段推理，长文本评测上表现虚高。", "viz": "rope", "id": "g4-15"}, {"topic": "Transformer 与注意力", "q": "稀疏注意力有哪几类做法？DeepSeek NSA 的思路是什么？", "tag": "理解", "key": "按稀疏模式来源分三类", "a": ["固定模式包括滑动窗口、全局 token、条带与块稀疏，实现简单但与内容无关。", "基于内容的动态稀疏先估计重要性再选取，例如按查询与键的粗粒度相似度挑选块，精度更高但选择本身有开销且不易高效实现。", "基于聚类或哈希的方法把相似的键分组，只在组内计算。", "NSA 采用分层可训练稀疏，把序列压缩成粗粒度块得到全局概览，同时按块重要性选取少量块做细粒度计算，再叠加一个滑动窗口保证局部信息，三路结果做门控融合，并且整套结构对硬件友好，训练与推理都能实际加速。"], "f": ["块稀疏注意力的复杂度从序列长度的平方降到序列长度乘以选中块总长度。"], "fq": "稀疏注意力为什么很多方案只在推理用而不在训练用？", "fa": "训练需要稀疏模式可导或者至少稳定，动态选择引入不可导的 top-k，且稀疏算子的反向实现复杂、访存不规则，实际加速往往不及理论值。 NSA 强调原生可训练正是针对这一点。", "id": "g4-16"}, {"topic": "多模态与 RAG", "q": "InfoNCE 为什么是交叉熵，温度与负样本怎样影响学习？", "tag": "必背", "key": "InfoNCE 将一个查询对应的正样本视为正确类别，把候选相似度当成分类 logits，所以可以用交叉熵提高正例相对概率", "a": ["温度控制分数的尖锐程度，较小温度会突出高相似候选的影响，也可能放大噪声或假负例。", "batch 内其他配对常作为负例，但只有它们确实不匹配时，这个假设才合理。", "增加负例会改变训练难度与计算成本，不保证单调提高效果。"], "f": ["L_i=-log[(exp(s_ii/τ))/(Σ_j exp(s_ij/τ))]", "L=(L_audio→text+L_text→audio)/2。"], "fq": "温度趋近零时会怎样？", "fa": "概率更接近集中在最大分数项，非最大项信号可能很弱，最大错误匹配的影响也可能很大。 学习效果与稳定性需要验证，温度不能按越小越好选择。", "viz": "contras
