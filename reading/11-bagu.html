<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f13"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow,noarchive"><title>八股速记</title><style>:root{--bg:#f7f8f5;--paper:#fff;--ink:#20332f;--muted:#5a6a65;--line:#d9dfd7;--acc:#176c63;--acc2:#e3f0ec;--easy:#2f8a5b;--mid:#b07a14;--hard:#b4443c;--code:#f3f5f1;--warn:#fbf1e2;--warnink:#8a5413;--blue:#2c5d8f;--blue2:#e6eef7;--red2:#f8e3e1}
.hidden{display:none!important}
html,body{height:100%;margin:0;background:#0d0f13;overscroll-behavior:none}
body{font:15px/1.65 system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#111}
#feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar,.hx::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;
  background:radial-gradient(120% 70% at 15% 0%,hsl(var(--h) 80% 64% / .95),transparent 62%),linear-gradient(165deg,hsl(var(--h) 62% 44%),hsl(calc(var(--h) + 45) 58% 20%))}
.hx{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.pane{flex:0 0 100%;height:100%;box-sizing:border-box;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) 12px 70px;-webkit-overflow-scrolling:touch}
.prec,.pexp{overscroll-behavior-y:contain;padding-bottom:28px}
.card{background:rgba(255,255,255,.97);border-radius:22px;padding:16px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.slide.in .pmain .card{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
/* top bar */
#top{position:absolute;left:0;right:0;top:0;z-index:20;padding:calc(6px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));color:#fff;pointer-events:none}
#top>*{pointer-events:auto}
#top .r1{display:flex;align-items:center;gap:6px}
#top a.back,#top .ib{color:#fff;text-decoration:none;font-size:15px;background:rgba(255,255,255,.16);border:0;border-radius:999px;height:32px;min-width:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
#tabs{flex:1;display:flex;justify-content:center;gap:18px}
#tabs button{background:none;border:0;color:rgba(255,255,255,.62);font:600 16px/1 inherit;padding:6px 0 7px;position:relative;cursor:pointer;transition:color .2s}
#tabs button.on{color:#fff}
#tabs button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:3px;border-radius:2px;background:#fff}
#top .bar{height:3px;background:rgba(255,255,255,.22);border-radius:2px;margin:8px 2px 4px;overflow:hidden}
#top .bar i{display:block;height:100%;width:0;background:#fff;transition:width .3s}
#top .r2{display:flex;justify-content:space-between;font-size:12px;opacity:.92;padding:0 2px}
#top .fire{display:inline-block}
#top .fire.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.6)}}
/* main pane */
.pmain{position:relative;overflow:hidden;padding:0}
.mscroll{position:relative;z-index:2;height:100%;box-sizing:border-box;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) 12px 70px}
.pmain .card{margin-right:62px}
.bigemo{position:absolute;left:-18px;bottom:60px;font-size:150px;line-height:1;opacity:.22;transform:rotate(-14deg);pointer-events:none;z-index:1;filter:saturate(.6)}
.slide.in .bigemo{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:rotate(-8deg) translateY(-10px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{font-size:12px;border-radius:999px;padding:1px 9px;background:#eef2ee;color:#3b4b46;white-space:nowrap}
.chip.d-简单{background:#e1f2e8;color:var(--easy)}
.chip.d-中等{background:#f8eedb;color:var(--mid)}
.chip.d-困难{background:#f8e3e1;color:var(--hard)}
.chip.must{background:var(--hard);color:#fff}
.chip.ali{background:#fde9dc;color:#c2521b}
.pmain h2{font-size:22px;line-height:1.35;margin:4px 0 8px}
.pmain h2 .no{display:inline-block;font-size:13px;color:#fff;background:hsl(var(--h) 55% 42%);border-radius:7px;padding:1px 7px;margin-right:8px;vertical-align:3px}
.desc{margin:0 0 10px;font-size:15.5px}
.ex{background:#f3f5f1;border-radius:12px;padding:8px 11px;font-size:13.5px}
.ex div{display:flex;gap:8px;align-items:baseline}
.ex b{flex:0 0 auto;font-size:12.5px;color:var(--muted)}
.ex code{font:13px/1.55 ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.think{margin-top:12px;font-size:13.5px;color:var(--muted);border-left:3px solid hsl(var(--h) 60% 50%);padding-left:9px}
.rail{position:absolute;right:8px;bottom:84px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:5}
.rb{display:flex;flex-direction:column;align-items:center;background:none;border:0;color:#fff;text-decoration:none;cursor:pointer;padding:0}
.rb span{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;font-size:25px;transition:transform .15s,background .2s,box-shadow .2s}
.rb i{font-style:normal;font-size:11.5px;margin-top:3px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.rb:active span{transform:scale(.88)}
.rb.on span{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.edge{position:absolute;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;z-index:4}
.edge button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:999px;padding:7px 14px;font:600 14px/1 inherit;cursor:pointer;backdrop-filter:blur(4px)}
.edge .up{color:#fff;font-size:12.5px;opacity:.85;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
/* explain / recall */
.phd{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 10px}
.phd b{font-size:16px}
.phd button,.phd span{min-width:64px}
.phd button{background:#eef2ee;border:0;border-radius:999px;padding:4px 10px;font:13px inherit;color:var(--ink);cursor:pointer}
.phd span{display:inline-block}
.hookbig{background:linear-gradient(135deg,#fff3c4,#ffe28a);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:600;line-height:1.55;margin-bottom:10px}
.tpl{font-size:13.5px;background:#eef4f1;border-radius:10px;padding:8px 10px;margin-bottom:10px}
.sec{margin:10px 0}
.sec>b{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.sec p{margin:0}
.cx{display:grid;gap:6px;margin:10px 0}
.cx div{background:#f3f5f1;border-radius:10px;padding:7px 10px;font-size:13.5px}
.cx b{color:hsl(var(--h) 55% 38%);margin-right:6px}
.foot{display:flex;gap:8px;margin-top:14px}
.big{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;background:hsl(var(--h) 58% 40%);color:#fff;border:0;border-radius:14px;padding:11px 12px;font:600 15px/1.2 inherit;text-decoration:none;cursor:pointer}
.big.ghost{background:#eef2ee;color:var(--ink)}
.big.lc{background:#1f2328}
.big:active{transform:scale(.97)}
.hint{background:#fff8e1;border-radius:10px;padding:7px 10px;font-size:13.5px;margin-bottom:10px}
.hint summary{cursor:pointer;color:#8a5413}
.hint p{margin:6px 0 0;font-weight:600}
.draft{display:block;width:100%;box-sizing:border-box;min-height:150px;border:1px solid var(--line);border-radius:12px;padding:10px;font:16px/1.5 ui-monospace,Menlo,monospace;background:#fbfcfa;resize:vertical;tab-size:4}
.draft:focus{outline:2px solid hsl(var(--h) 60% 50%);border-color:transparent}
.btns{display:flex;gap:8px;margin:10px 0}
.ansbar{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.ansbar b{font-size:14px;margin-right:auto}
.ansbar .cnt{font-size:12px;color:var(--muted)}
.ansbar button{background:#eef2ee;border:0;border-radius:999px;padding:4px 11px;font:13px inherit;color:var(--ink);cursor:pointer}
.ansbar button[data-rv=next]{background:hsl(var(--h) 58% 40%);color:#fff}
.pane pre.code{font-size:12.2px;margin:8px 0;cursor:pointer}
.pane pre.code .ln{white-space:pre-wrap;overflow-wrap:anywhere;padding:0 10px 0 32px}
.pane pre.code .ln::before{width:24px}
.pane pre.code .ln.hide::after{left:32px}
.pane pre.code .ln.hit{background:#dff3e6}
.pane pre.code .ln.miss{background:#fbe1de}
.pane pre.code .ln.near{background:#fdf1cc}
.score{font-size:14px;margin:4px 0 0;min-height:4px}
.score .pct{font-size:22px;font-weight:700;color:hsl(var(--h) 55% 38%);margin-right:6px}
.grade{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.grade span{width:100%;font-size:13px;color:var(--muted)}
.grade button{flex:1;background:#f3f5f1;border:0;border-radius:12px;padding:10px 4px;font:600 14px inherit;cursor:pointer}
.grade button:active{transform:scale(.95)}
.grade button.on{background:hsl(var(--h) 58% 40%);color:#fff}
.nextbtn{margin-top:10px}
/* demo inside panes */
.pane .anim{padding:10px;margin:6px 0;border-radius:12px}
.pane .stage{overflow:hidden;min-height:0}
.pane .stage svg{height:auto}
.pane .arr{gap:3px;padding:22px 0 18px}
.pane .arr .cell{flex:1 1 0;min-width:15px;max-width:44px;padding:0 1px;font-size:12px;overflow:visible}
.pane .grid .cell{min-width:26px;height:28px;font-size:12px}
.pane .ll .node{min-width:30px;height:30px;font-size:13px}
.pane .ll .arrow{width:16px;font-size:14px}
.pane .anim .ah{gap:6px}
.pane .anim .ah code{font-size:12.5px;overflow-wrap:anywhere}
.pane .anim .ah b{font-size:13px}
.pane .anim .ah .btn{padding:4px 10px;font-size:13px}
.pane .note{font-size:13.5px}
.pane .vizbox .grid{row-gap:16px;padding-top:16px}
/* end slide */
.endslide .pane{display:flex;align-items:center}
.endslide .card{width:100%;text-align:center}
.endslide h2{font-size:24px;margin:6px 0}
.endstats{display:flex;justify-content:center;gap:16px;margin:14px 0;font-size:14px}
.endstats div{display:flex;flex-direction:column;align-items:center}
.endstats b{font-size:26px}
.endslide .big{width:100%;margin-top:8px}
/* sheet */
#sheet{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none}
#sheet.on{display:block}
#sheet .body{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:#d4dad5;margin:4px auto 8px}
#sheet h3{font-size:16px;margin:10px 0 8px}
.srow{display:flex;align-items:flex-start;gap:10px;margin:10px 0}
.srow>b{flex:0 0 58px;font-size:14px;padding-top:5px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{background:#f1f4f1;border:1px solid transparent;border-radius:999px;padding:5px 11px;font:13.5px inherit;cursor:pointer;color:var(--ink)}
.opts button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.map button{height:34px;border:0;border-radius:8px;font:12px ui-monospace,Menlo,monospace;background:#eceff0;color:#4b5853;cursor:pointer}
.map button.s2{background:#cfeedd;color:#1f6b45}
.map button.s1{background:#fbeccb;color:#8a5f0a}
.map button.s0{background:#f8d9d5;color:#9b3129}
.map button.cur{outline:2px solid var(--ink)}
.legend{display:flex;gap:10px;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* guide */
#guide{position:absolute;inset:0;z-index:50;background:rgba(10,12,16,.78);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
#guide.on{display:flex}
#guide .gbox{background:#fff;border-radius:22px;padding:18px 18px 16px;width:100%;max-width:380px}
#guide h3{margin:0 0 10px;font-size:19px;text-align:center}
.g{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #eef1ee;font-size:14.5px}
.g:last-of-type{border-bottom:0}
.g .hand{flex:0 0 44px;height:44px;border-radius:12px;background:#f2f5f2;display:flex;align-items:center;justify-content:center;font-size:24px}
.g .hand span{display:inline-block}
.g .hand.up span{animation:gu 1.4s ease-in-out infinite}
.g .hand.left span{animation:gl 1.4s ease-in-out infinite}
.g .hand.right span{animation:gr 1.4s ease-in-out infinite}
@keyframes gu{0%,100%{transform:translateY(7px)}50%{transform:translateY(-7px)}}
@keyframes gl{0%,100%{transform:translateX(7px)}50%{transform:translateX(-7px)}}
@keyframes gr{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
.g small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
#guide .big{width:100%;margin-top:12px;background:#176c63}
/* toast and burst */
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);z-index:60;background:rgba(20,22,26,.86);color:#fff;border-radius:16px;padding:10px 18px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.fly{position:fixed;z-index:70;font-size:24px;pointer-events:none;animation:fly .95s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--rot))}}
/* desktop side hints */
#side{display:none}
@media (min-width:900px){
  #side{display:block;position:fixed;left:calc(50% + 260px);top:50%;transform:translateY(-50%);color:#cfd6d2;font-size:13.5px;line-height:2}
  #side .kbd{background:#2a2f36;border:1px solid #3a4048;border-radius:5px;padding:0 6px;color:#fff;font:12px ui-monospace,Menlo,monospace}
  #app{border-left:1px solid #222;border-right:1px solid #222}
}
@media (prefers-reduced-motion:reduce){.slide.in .pmain .card,.edge .up,.g .hand span{animation:none}}
/* v2 learning features */
.hidden{display:none!important}
.chip.again{background:#2b2f36;color:#fff}
.quiz{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.qh{font-size:13.5px;color:var(--muted);margin-bottom:4px}
.qq{font-weight:600;font-size:14.5px;margin:6px 0}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qlist{display:flex;flex-direction:column;gap:6px}
.qopts button,.qlist button{background:#f2f5f2;border:1.5px solid transparent;border-radius:12px;padding:9px 8px;font:14px/1.35 inherit;color:var(--ink);cursor:pointer}
.qlist button{text-align:left;padding:9px 11px;font-size:13.5px}
.qopts button:active,.qlist button:active{transform:scale(.97)}
.qopts button.right,.qlist button.right{background:#dff3e6;border-color:var(--easy)}
.qopts button.wrong,.qlist button.wrong{background:#fbe1de;border-color:var(--hard)}
.qopts button:disabled,.qlist button:disabled{color:var(--ink);cursor:default}
.qr{font-size:13.5px;margin-top:6px}
.qdone p{margin:10px 0 4px;font-size:14px}
.qdone .foot{margin-top:8px}
.seg2{display:flex;background:#eef2ee;border-radius:12px;padding:3px;margin-bottom:10px}
.seg2 button{flex:1;border:0;background:none;border-radius:9px;padding:7px;font:600 14px inherit;color:var(--muted);cursor:pointer}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.ctl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ctl button{background:#eef2ee;border:0;border-radius:999px;padding:3px 10px;font:13px inherit;color:var(--ink);cursor:pointer}
.ctl button.on{background:hsl(var(--h) 58% 40%);color:#fff}
.ctl .ccnt{margin-left:auto}
.pane pre.code.cz{cursor:default;line-height:1.9}
.bk{display:inline-block;height:1.3em;vertical-align:-4px;max-width:100%;border:0;border-radius:5px;background:repeating-linear-gradient(90deg,hsl(var(--h) 60% 87%) 0 7px,hsl(var(--h) 55% 79%) 7px 14px);cursor:pointer;padding:0;margin:0 1px}
.bk:active{transform:scale(.94)}
.bk-on{background:#fff1bd;border-radius:4px;animation:flash .6s}
@keyframes flash{from{background:#ffcf4a}}
.tip{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.sib{display:flex;flex-direction:column;gap:6px}
.sib button{display:flex;gap:8px;align-items:flex-start;text-align:left;background:#f6f8f5;border:0;border-radius:12px;padding:8px 10px;font:13px/1.45 inherit;color:var(--ink);cursor:pointer}
.sib .sno{flex:0 0 auto;font:600 12px ui-monospace,Menlo,monospace;background:hsl(var(--h) 55% 42%);color:#fff;border-radius:6px;padding:1px 6px;margin-top:1px}
.sib .stx{flex:1}
.sib .stx b{display:block;font-size:13.5px}
.sib .sst{flex:0 0 auto}
#due{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:999px;padding:1px 9px;font:12px inherit;cursor:pointer;margin-right:4px}
.quiz>div{scroll-margin-top:96px;scroll-margin-bottom:84px}
.prec,.pexp,.mscroll{-webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent calc(env(safe-area-inset-top) + 66px),#000 calc(env(safe-area-inset-top) + 84px));mask-image:linear-gradient(to bottom,transparent 0,transparent calc(env(safe-area-inset-top) + 66px),#000 calc(env(safe-area-inset-top) + 84px))}
/* v3 explain pane */
.toc{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}
.toc button{background:#eef2ee;border:0;border-radius:999px;padding:3px 10px;font:12.5px inherit;color:var(--ink);cursor:pointer}
.xq{background:#f4f7f3;border-radius:12px;padding:8px 11px;margin:8px 0}
.xq b{display:block;font-size:13px;color:hsl(var(--h) 50% 34%);margin-bottom:2px}
.xq p{margin:0;font-size:14.5px}
.xq.ob{background:#eef4fb}
.xq.vs{background:#f6f0fb}
.steps{margin:4px 0 0;padding-left:22px}
.steps li{margin:3px 0;font-size:14.5px}
.steps li::marker{color:hsl(var(--h) 55% 40%);font-weight:700}
.pit{margin:4px 0 0;padding-left:20px}
.pit li{margin:3px 0;font-size:14px;color:#7a2f28}
.run{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fbfcfa}
.rctl{display:flex;gap:4px;flex-wrap:wrap}
.rctl button{flex:1;min-width:36px;background:#eef2ee;border:0;border-radius:9px;padding:6px 4px;font:600 13px inherit;color:var(--ink);cursor:pointer}
.rctl button.pri{flex:2;background:hsl(var(--h) 58% 40%);color:#fff}
.rctl .spd{flex:0 0 42px}
.rsl{width:100%;margin:8px 0 4px;touch-action:none;accent-color:hsl(var(--h) 58% 40%)}
.rhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px;font-size:12px;color:var(--muted);margin-bottom:4px}
.rstack span{background:#eceff0;border-radius:6px;padding:0 6px;font-family:ui-monospace,Menlo,monospace}
.rstack span.on{background:hsl(var(--h) 58% 40%);color:#fff}
.rstack b{margin:0 2px;font-weight:400}
.rcode{position:relative;max-height:236px;overflow-y:auto;overscroll-behavior:contain;border-radius:8px}
.rcode pre.code{margin:0;font-size:11.8px}
.pane .rcode pre.code .ln.cur{background:#ffe9a0}
.pane .rcode pre.code .ln.done{background:#e0f2e6}
.rret{font-size:13px;color:#7a4d00;margin:4px 0}
.rret:empty{display:none}
.rvis{margin:6px 0}
.rvis:empty{display:none}
.rll{display:flex;flex-wrap:wrap;align-items:center;row-gap:20px;padding:18px 0 4px}

-8", "g2-9", "g2-10", "g2-11", "g2-12", "g3-1", "g3-2", "g3-3", "g3-4", "g3-5", "g3-6", "g3-7", "g3-8", "g3-9", "g3-10", "g3-11", "g4-1", "g4-2", "g4-3", "g4-4", "g4-5", "g4-6", "g4-7", "g4-8", "g4-9", "g4-10", "g4-11", "g4-12", "g4-13", "g4-14", "g4-15", "g4-16", "g5-1", "g5-2", "g5-3", "g5-4", "g5-5", "g5-6", "g5-7", "g5-8", "g5-10", "g6-1", "g6-2", "g6-3", "g6-4", "g6-5", "g6-6", "g6-7", "g6-8", "g6-9", "g6-10", "g6-11", "g6-12", "g6-13", "g7-1", "g7-2", "g7-3", "g7-4", "g7-5", "g7-6", "g7-7", "g7-8", "g7-9", "g7-10", "g7-11", "g7-12", "g8-1", "g9-2", "g9-3", "g9-5", "g9-9", "g9-14", "g9-15", "g9-16"]}, {"id": "defs", "emo": "📖", "name": "基础定义", "desc": "一句定义加一句区别", "ids": ["d1", "d2", "d3", "d4", "d5", "d6", "d7", "d8", "d9", "d10", "d11", "d12", "d13", "d14", "d15", "d16", "d17", "d18", "d19", "d20", "d21", "d22", "d23", "d24", "d25", "d26", "d27", "d28", "d29", "d30", "d31", "d32", "d33", "d34", "d35", "d36", "d37", "d38", "d39", "d40", "d41", "d42", "d43", "d44", "d45", "d46", "d47", "d48", "d49", "d50", "d51", "d52", "d53", "d54", "d55", "d56", "d57", "d58", "d59", "d60", "d61", "d62", "d63", "d64", "d65", "d66", "d67", "d68", "d69", "d70", "d71", "d72", "d73", "d74", "d75", "d76", "d77", "d78", "d79", "d80", "d81", "d82", "d83", "d84"]}], "cards": [{"topic": "机器学习基础", "q": "机器学习到底在做什么？", "key": "用数据自动调参数，让一个函数的输出贴近真实答案", "plain": "你做数据清洗时，常写规则把脏值改对。机器学习不手写规则，而是给一个带参数的函数和一堆有答案的样本，让程序自动调参数，使函数的输出尽量接近答案。调好之后，函数就能给新样本输出预测。", "a": ["模型是一个带参数的函数，例如直线 ŷ = w·x + b，w 和 b 是参数。", "损失函数衡量预测和真实答案差多少，例如误差平方的平均。", "训练就是找让损失最小的参数，最常用的方法是梯度下降。", "预测时把新样本的特征代入训练好的函数，得到输出。"], "terms": ["参数", "损失函数", "训练", "梯度下降", "预测"], "viz": "linreg", "tag": "入门", "id": "i1"}, {"topic": "机器学习基础", "q": "损失函数和梯度下降是什么？学习率起什么作用？", "key": "梯度指向损失上升最快的方向，沿反方向走一小步", "plain": "损失是参数的函数。梯度是这个函数在当前参数处的斜率，沿梯度的反方向移动参数，损失就下降。每一步移动多少由学习率决定，太小收敛慢，太大会越过最低点，甚至越走越高。", "a": ["梯度是损失对每个参数的偏导数组成的向量，指向损失增加最快的方向。", "梯度下降每一步把参数减去学习率乘梯度。", "学习率太小收敛慢，太大会在谷底两侧振荡甚至发散。", "实际训练每步只用一小批样本估计梯度，叫随机梯度下降，Adam 等优化器在此基础上自适应地调整步长。"], "terms": ["梯度", "偏导数", "学习率", "发散", "随机梯度下降", "Adam"], "viz": "gd", "f": ["θ ← θ − η · ∇L(θ)"], "tag": "入门", "id": "i2"}, {"topic": "机器学习基础", "q": "什么是过拟合和欠拟合？怎么判断和缓解？", "key": "训练误差小测试误差大是过拟合，两个都大是欠拟合", "plain": "过拟合是模型把训练数据里的随机噪声也拟合进去了，在训练数据上误差很小，换一批新数据误差就变大。欠拟合是模型太简单，连训练数据里的主要规律都没有拟合好。判断的关键是看模型在没见过的数据上的表现。", "a": ["欠拟合是模型太简单，训练误差和测试误差都大。", "过拟合是模型太复杂，把训练数据里的噪声也拟合了，训练误差很小、测试误差大。", "缓解过拟合可以增加数据、降低模型复杂度、加正则化（L1、L2、Dropout）、早停。", "要用模型没见过的验证集来判断，不能只看训练误差。"], "terms": ["欠拟合", "过拟合", "噪声", "正则化", "Dropout", "早停", "验证集"], "viz": "poly", "tag": "入门", "id": "i3"}, {"topic": "机器学习基础", "q": "分类模型怎样输出概率？逻辑回归是什么？", "key": "先算线性分数，再用 sigmoid 压到 0 到 1 之间", "plain": "要判断一个客户会不会违约，可以先给他算一个分数，分数越高越危险。sigmoid 函数把任意分数变成 0 到 1 之间的数，当作违约概率。", "a": ["逻辑回归先计算 z = w·x + b，再输出 p = σ(z)，σ 是 sigmoid 函数。", "训练用交叉熵损失，也就是让真实标签的预测概率尽量大。", "多分类时用 softmax 把多个分数变成和为 1 的概率。", "虽然叫回归，逻辑回归是分类模型，在风控评分卡里非常常用。"], "terms": ["sigmoid", "交叉熵", "softmax", "评分卡"], "viz": "sigmoid", "f": ["p = σ(w·x + b) = 1 / (1 + e^{−(w·x+b)})"], "tag": "入门", "id": "i4"}, {"topic": "机器学习基础", "q": "决策树怎么做预测？怎么选择切分？", "key": "一连串的是非问题，每次选让两边最“纯”的切分", "plain": "决策树是一串是非判断，先判断“收入是否大于一万”，再根据结果判断下一个条件，最后落到一个叶子上给出预测。每次选的判断条件，是能把好坏样本分得最干净的那个。", "a": ["决策树从根节点开始，每个内部节点按一个特征和阈值把样本分成两部分。", "选择切分的标准是让子节点尽量纯，分类常用 Gini 系数或信息增益，回归用平方误差。", "树太深会过拟合，要限制深度、叶子样本数，或做剪枝。", "单棵树不稳定，实际常用多棵树组成随机森林或梯度提升树。"], "terms": ["特征", "阈值", "Gini", "信息增益", "剪枝", "随机森林"], "viz": "tree", "tag": "入门", "id": "i5"}, {"topic": "机器学习基础", "q": "Bagging 和 Boosting 有什么区别？", "key": "Bagging 并行投票降方差，Boosting 串行纠错降偏差", "plain": "多个模型组合有两种方式。一种是在不同的抽样数据上各自独立训练很多个模型，预测时投票或平均，这是 Bagging，代表是随机森林。另一种是一个接一个地训练，后面的模型专门拟合前面模型的残差，这是 Boosting，代表是 GBDT、XGBoost。", "a": ["Bagging 对训练集有放回抽样得到多份数据，各训练一个模型，预测时平均或投票，主要降低方差。", "随机森林在 Bagging 基础上，每次分裂还随机挑一部分特征。", "Boosting 串行训练，每个新模型重点拟合前面模型的残差或错误，主要降低偏差。", "表格任务上梯度提升树通常是最强的传统方法。"], "terms": ["有放回抽样", "方差", "随机森林", "残差", "偏差", "梯度提升树"], "viz": "gbdt", "tag": "入门", "id": "i6"}, {"topic": "神经网络", "q": "神经网络是什么？激活函数有什么用？", "key": "一层层的加权求和加非线性，叠起来能拟合复杂函数", "plain": "一个神经元就是把输入乘上权重加起来，再过一个非线性函数。很多神经元组成一层，很多层叠起来就是神经网络。逻辑回归可以看作只有一个神经元的网络。", "a": ["每个神经元计算 z = Σ w_i·x_i + b，再输出 h = f(z)，f 是激活函数。", "常用激活函数有 ReLU、Sigmoid、GELU。", "没有激活函数，多层线性变换叠起来仍然等价于一层线性变换，表达能力不会增加。", "训练就是用梯度下降调整所有层的权重。"], "terms": ["神经元", "权重", "激活函数", "ReLU", "GELU", "线性变换"], "viz": "mlp", "tag": "入门", "id": "i7"}, {"topic": "神经网络", "q": "反向传播是怎么计算梯度的？", "key": "正向算损失，反向用链式法则把梯度一层层传回去", "plain": "网络有成百上千万个参数，要知道每个参数该往哪边调。反向传播先正常算一遍得到损失，然后从损失开始往回推，每经过一个计算步骤就乘上这一步的导数，很快就能得到每个参数的梯度。", "a": ["正向传播按顺序计算每层输出，最后得到损失。", "反向传播从损失开始，按链式法则逐层计算损失对中间结果和参数的偏导数。", "每个参数的梯度算出后，用优化器统一更新。", "PyTorch 记录计算图后，调用 loss.backward() 会自动完成反向传播。"], "terms": ["正向传播", "链式法则", "偏导数", "计算图", "backward"], "viz": "backprop", "f": ["∂L/∂w = ∂L/∂z · ∂z/∂w"], "tag": "入门", "id": "i8"}, {"topic": "神经网络", "q": "训练集、验证集、测试集和交叉验证分别做什么？", "key": "训练集调参数，验证集挑模型，测试集最后打分", "plain": "训练集用来调参数。验证集用来比较不同模型和超参数，挑出最好的那个。测试集在一切确定之后只用一次，给出最终分数。如果反复看测试集来调整，测试分数就会偏乐观，不再可信。", "a": ["训练集用来拟合模型参数。", "验证集用来选超参数、比较模型、决定何时早停。", "测试集只在流程全部确定后评估一次。", "K 折交叉验证把数据分成 K 份轮流当验证集，结果更稳，适合数据少的情况。"], "terms": ["训练集", "验证集", "测试集", "超参数", "K 折交叉验证"], "viz": "kfold", "tag": "入门", "id": "i9"}, {"topic": "大模型基础", "q": "嵌入（Embedding）是什么？", "key": "把词或类别映射成一个可训练的向量", "plain": "模型只能处理数字。“猫”这个词怎么变成数字？嵌入给每个词分配一个向量，比如 768 个数。训练之后，意思相近的词向量也相近，计算机就能比较词之间的关系。", "a": ["嵌入是一个查找表，词表里每个 token 对应一行向量。", "嵌入向量是模型参数，随训练一起更新。", "向量之间用点积或余弦相似度衡量相似程度，这也是向量检索的基础。", "表格模型里的类别特征也常用嵌入表示，比 one-hot 更紧凑。"], "terms": ["查找表", "token", "余弦相似度", "向量检索", "one-hot"], "viz": "embed", "tag": "入门", "id": "i10"}, {"topic": "大模型基础", "q": "注意力机制在做什么？", "key": "每个位置按相关程度加权汇总其他位置的信息", "plain": "在句子“小明把苹果给了她，因为她饿了”里，“她”的含义取决于前面的词。注意力让每个词计算它和其他每个词的相关程度，再按这个程度把其他词的信息加权合并到自己的表示里。", "a": ["每个 token 生成查询 Q、键 K、值 V 三个向量。", "查询和所有键做点积得到相关分数，除以 √d 后做 softmax 得到权重。", "用这些权重对值向量加权求和，得到这个 token 的新表示。", "多头注意力并行做多组，每组关注不同的关系。语言模型生成时加因果掩码，只能看前面的词。"], "terms": ["查询", "键", "值", "softmax", "多头注意力", "因果掩码"], "viz": "attn", "f": ["Attention(Q, K, V) = softmax(QKᵀ / √d) · V"], "tag": "入门", "id": "i11"}, {"topic": "大模型基础", "q": "Transformer 的一层里有哪些部分？", "key": "注意力加前馈网络，每个子层都有残差和归一化", "plain": "Transformer 是现在大模型的基本结构，由很多相同的层堆起来。每一层先让各个位置互相交流信息（注意力），再让每个位置各自加工一下（前馈网络）。", "a": ["每层包含多头自注意力和前馈网络两个子层。", "每个子层外面有残差连接，输出等于输入加上子层的变化，让很深的网络也能训练。", "每个子层配一个归一化，现代大模型常用放在子层前面的 RMSNorm。", "堆叠几十层后接输出层，语言模型输出下一个词的概率。"], "terms": ["自注意力", "前馈网络", "残差连接", "RMSNorm", "堆叠"], "viz": "tflayer", "tag": "入门", "id": "i12"}, {"topic": "大模型基础", "q": "语言模型是怎样一个词一个词生成文本的？", "key": "每步输出下一个词的概率分布，按某种策略选一个，接到后面再继续", "plain": "语言模型就是不断回答“下一个词是什么”。它给词表里每个词一个概率，挑一个接到句子后面，再把新句子输进去预测下一个词，直到生成结束符。", "a": ["模型输出每个词的 logits，经过 softmax 变成概率分布。", "贪心解码每步选概率最大的词，采样则按概率随机选。", "温度、top-k、top-p 控制采样的随机程度。", "生成时会缓存前面词的键和值（KV 缓存），避免重复计算。"], "terms": ["logits", "softmax", "贪心", "温度", "top-p", "KV 缓存"], "viz": "sampling", "tag": "入门", "id": "i13"}, {"topic": "大模型基础", "q": "预训练、微调和上下文学习有什么区别？", "key": "预训练打基础，微调改参数适配任务，上下文学习不改参数只给例子", "plain": "预训练在海量文本上训练，得到通用的语言能力。微调用少量带标注的数据继续训练，会改变模型参数，让它适配具体任务。上下文学习不改参数，只在输入里放几个例子，模型按例子的格式对新输入给出结果。", "a": ["预训练在海量数据上用自监督目标训练，消耗算力最多。", "监督微调用带标注的示范数据继续训练，参数会更新。", "偏好对齐用 RLHF 或 DPO 让输出更符合人的偏好。", "上下文学习不更新参数，把示例放进输入，模型在一次前向中完成新任务。TabPFN 对表格就是这种方式。"], "terms": ["预训练", "自监督", "监督微调", "RLHF", "DPO", "上下文学习"], "viz": "learnmodes", "tag": "入门", "id": "i14"}, {"topic": "表格模型入门", "q": "表格数据和图像、文本有什么不同？", "key": "列各有含义、类型混合、行列顺序无意义、样本量常常不大", "plain": "你天天处理的表格，和图像、文本差别很大。图像的相邻像素有关系，文本的词序有意义，而表格的列可以随便换顺序，每列单位和含义都不一样，还混着数值、类别和缺失。", "a": ["表格每列是不同的特征，有不同的单位、分布和含义，不能像像素那样一视同仁。", "数值、类别、时间、缺失混在一起，需要专门的编码。", "行和列的顺序没有意义，模型应该对它们不敏感。", "很多业务表只有几千到几十万行，深度模型容易过拟合，所以树模型长期占优，表格基础模型借助预训练弥补这一点。"], "terms": ["特征", "类别", "缺失", "顺序", "树模型", "表格基础模型"], "cmp": {"head": ["", "图像", "文本", "表格"], "rows": [["基本单位", "像素", "token", "单元格"], ["顺序是否有意义", "空间位置有意义", "词序有意义", "行列顺序都无意义"], ["数据类型", "统一的数值", "统一的离散符号", "数值、类别、缺失混合"], ["传统强方法", "卷积网络、ViT", "Transformer", "梯度提升树"]]}, "tag": "入门", "id": "i15"}, {"topic": "表格模型入门", "q": "用一句话说清什么是表格基础模型？", "key": "在海量合成或真实表格上预训练，新表不用训练，放进上下文就能预测", "plain": "传统做法是每张新表都训练一个 XGBoost 并调参。表格基础模型先在几亿张表上预训练好，遇到新表时，把有标签的行整个放进输入，模型直接给出没标签行的预测，和大语言模型根据示例完成任务的方式相同。", "a": ["代表模型有 TabPFN 系列、TabICL、TabDPT、LimiX 等。", "它们大多用 Transformer，在行和列上做注意力。", "预训练数据可以是按因果图生成的合成表格，也可以是真实表格。", "优势是小数据上准、不需要调参、速度快，挑战是扩展到大表和线上部署。"], "terms": ["TabPFN", "TabICL", "Transformer", "合成表格", "不需要调参"], "viz": "pfn", "tag": "入门", "id": "i16"}, {"topic": "表格模型入门", "q": "精确率、召回率、AUC 应该怎么理解？", "key": "精确率是抓得准不准，召回率是抓得全不全，AUC 看整体排序", "plain": "风控里要找出坏人。精确率回答“被模型标成坏人的里面，有多少真是坏人”，召回率回答“所有坏人里，被找出来了多少”。两者常常此消彼长，阈值定严了精确率高、召回率低。", "a": ["精确率等于 TP 除以 (TP + FP)，召回率等于 TP 除以 (TP + FN)。", "F1 是两者的调和平均。", "AUC 是随机抽一个正样本和一个负样本，正样本得分更高的概率，和阈值无关。", "样本不平衡时准确率会误导，要看精确率、召回率、AUC 和 KS。"], "terms": ["精确率", "召回率", "F1", "AUC", "不平衡"], "viz": "roc", "f": ["P = TP / (TP + FP)", "R = TP / (TP + FN)"], "tag": "入门", "id": "i17"}, {"topic": "表格模型入门", "q": "缺失值为什么麻烦？有哪几类？", "key": "缺失的原因决定处理方法，完全随机、依赖其他列、依赖自身", "plain": "你做数据清洗时一定遇到过大量空值。处理之前要先想清楚它为什么空。如果空值是随机出现的，删掉或填均值问题不大。如果是收入高的人故意不填，填均值就会把整体收入估低。", "a": ["MCAR 完全随机缺失，删除不会引入偏差。", "MAR 缺失只依赖其他已观测的列，可以用其他列建模填补。", "MNAR 缺失依赖缺失值本身，需要对缺失机制建模或补充信息。", "“是否缺失”本身常常有预测价值，可以加缺失指示列，树模型和 TabPFN v2 都能直接处理缺失。"], "terms": ["MCAR", "MAR", "MNAR", "缺失指示列"], "viz": "missing", "tag": "入门", "id": "i18"}, {"topic": "表格基础模型", "q": "什么是 PFN（Prior-data Fitted Network）？为什么说它在做近似贝叶斯推断？", "key": "在先验采样的海量合成数据集上训练，一次前向就输出后验预测分布", "a": ["PFN 先定义一个生成数据集的先验，从中采样大量合成数据集，每个数据集切成训练部分和测试部分。", "Transformer 把训练部分整个当作上下文输入，学习预测测试样本的标签，损失是测试标签的负对数似然在先验上的期望。", "最小化这个期望损失的最优解，正是该先验下的后验预测分布 p(y | x, D)，所以训练好的网络一次前向就近似完成了贝叶斯推断。", "推理时不更新参数，把新任务的训练集放进上下文即可预测，这就是表格上的 In-Context Learning。"], "terms": ["后验预测分布", "负对数似然", "先验", "In-Context Learning", "一次前向"], "f": ["L(θ) = E_{D∼p(D)} [ −log q_θ(y_test | x_test, D_train) ]", "q_θ*(y | x, D) ≈ p(y | x, D) = ∫ p(y | x, φ) p(φ | D) dφ"], "viz": "pfn", "fq": "PFN 的效果上限由什么决定？", "fa": "由先验决定。先验覆盖的数据生成机制越接近真实任务，近似的后验越有用。所以表格基础模型的核心工作之一是设计先验，也就是合成数据体系。", "tag": "高频", "id": "j1", "plain": "普通做法是每来一张新表就训练一个新模型。PFN 反过来，先用电脑造出几亿张带答案的假表，训练一个 Transformer 专门做“看一张表的已知行，猜未知行的标签”。训练完以后，遇到真实的新表，不用再训练，把已知行整个喂进去，一次前向就给出预测。它猜的方式在数学上等价于贝叶斯推断里的“后验预测”。"}, {"topic": "表格基础模型", "q": "TabPFN v1 的输入、结构、限制和推理方式是什么？", "key": "每行一个 token，测试行只看训练行，小数据一秒出结果", "a": ["TabPFN v1 发表于 ICLR 2023，面向小规模表格分类。", "每个样本整行线性嵌入成一个 token，训练样本带上标签嵌入。训练样本之间互相注意，测试样本只注意训练样本，测试样本之间不互相看。", "限制是训练样本不超过 1000 条、特征不超过 100 个、类别不超过 10 个，只做分类。", "先验由结构因果模型和贝叶斯神经网络组成，并偏好简单的数据生成机制。", "推理不调参，靠对特征顺序、类别顺序和预处理做多次变换后集成来降低偏差，小数据集上达到调参一小时的 AutoML 水平。"], "terms": ["1000", "100", "10", "结构因果模型", "贝叶斯神经网络", "集成"], "viz": "pfn", "tag": "必背", "id": "j2", "plain": "TabPFN v1 是第一代。一行数据被当成一个词，已知标签的训练行之间互相参考，要预测的测试行只参考训练行。它只能处理小表，最多 1000 行、100 列、10 个类别，但在这种小表上一秒钟就能达到调参一小时的效果。"}, {"topic": "表格基础模型", "q": "TabPFN v2 相比 v1 做了哪些关键改进？", "key": "每个单元格一个表示，行内看特征、列内看样本的双向注意力，规模扩到一万行五百列", "a": ["TabPFN v2 于 2025 年 1 月发表在 Nature。", "结构上每个单元格有自己的表示，每层交替做两种一维注意力，一种在同一行内跨特征，一种在同一列内跨样本，测试样本同样只看训练样本。", "规模扩到 10,000 个训练样本和 500 个特征，并支持回归。", "先验改为基于随机计算图的结构因果模型，生成了约 1.3 亿个合成数据集，覆盖缺失值、类别特征、异常值和无信息特征，所以原生支持这些情况。", "论文报告在分类任务上用 2.8 秒超过调参 4 小时的最强基线集成，还能做微调、生成数据、密度估计和提取嵌入。"], "terms": ["Nature", "双向注意力", "10,000", "500", "回归", "1.3 亿", "2.8 秒", "4 小时"], "cmp": {"head": ["", "TabPFN v1", "TabPFN v2"], "rows": [["token 单位", "一行一个", "一个单元格一个"], ["注意力", "样本之间", "行内跨特征加列内跨样本"], ["规模上限", "1000 行、100 列", "10,000 行、500 列"], ["任务", "分类", "分类和回归"], ["缺失值和类别", "不擅长", "先验中覆盖，原生支持"]]}, "viz": "pfn", "tag": "必背", "id": "j3", "plain": "v2 把粒度从“一行”细化到“一个格子”。每个格子既看同一行的其他列，也看同一列的其他训练行，这叫双向注意力。表的规模放大到一万行、五百列，还能做回归，并且造假表时就加入了缺失值、类别列、异常值，所以真实表里这些脏情况它都能直接处理。"}, {"topic": "表格基础模型", "q": "TabPFN-2.5 又往哪个方向推进？", "key": "规模再扩约二十倍单元格，并能蒸馏成小模型部署", "a": ["Prior Labs 在 2025 年底发布 TabPFN-2.5，把支持规模扩到约 50,000 个样本、2,000 个特征，可处理的单元格数约为 v2 的 20 倍。", "技术报告在 TabArena 上评测，显示它在中小规模数据上和调参加集成后的强基线竞争。", "它提供蒸馏能力，把 TabPFN 的预测能力迁移到 MLP 或树集成上，解决在线推理延迟的问题。", "面试时把版本演进讲成一条线，v1 证明可行，v2 换结构和先验扩到中等规模，2.5 继续扩规模并解决部署。"], "terms": ["50,000", "2,000", "20 倍", "蒸馏", "TabArena"], "viz": "versions", "fq": "为什么部署时需要蒸馏？", "fa": "TabPFN 预测时要把整个训练集放进上下文，计算量随训练样本数增长，在线逐条打分的延迟和成本高。蒸馏成树或 MLP 后，推理只依赖小模型。", "tag": "高频", "id": "j4", "plain": "2.5 是 v2 的放大版，能吃下大约五万行、两千列的表。另一个重点是部署，它可以把自己的能力“压缩”给一个小的树模型或 MLP，线上打分时只跑小模型，速度快。"}, {"topic": "表格基础模型", "q": "TabPFN 的合成先验数据是怎样生成的？", "key": "随机建因果图，从根节点噪声出发逐层传播，挑节点当特征和标签，再加缺失和离散化", "a": ["先随机生成一张有向无环图，图的节点是变量。", "根节点采样噪声，沿着边用随机函数向下传播，函数可以是小神经网络、决策树或离散化等操作，并加入噪声。", "从图里随机选一部分节点当特征、一个节点当标签，标签离散化后得到分类任务。", "再做后处理，例如随机置缺失、把部分特征变成类别、加入异常值和无信息特征、随机扭曲数值分布。", "因为变量之间是因果关系生成的，模型在预训练里见到的就是“特征和标签之间存在机制”的数据，这比完全随机的函数更接近真实表格。"], "terms": ["有向无环图", "根节点", "随机函数", "特征", "标签", "缺失"], "viz": "scm", "tag": "必背", "id": "j5", "plain": "造假表的过程像一个随机的因果故事。先随机画一张“谁影响谁”的箭头图，比如年龄影响收入、收入影响是否违约。从源头随机取值，沿着箭头用随机函数算出下游的值，再挑几个节点当表的列、挑一个当标签。最后像真实数据一样故意弄脏，随机挖掉一些格子、把一些数变成类别。"}, {"topic": "表格基础模型", "q": "TabPFN 怎样做回归？为什么能输出整个预测分布？", "key": "把连续目标切成很多桶，输出每个桶的概率，相当于一条分段常数密度", "a": ["TabPFN 把目标值的范围切分成许多区间，输出层对每个区间给出概率，组合成分段常数的密度，论文称为条形分布。", "训练仍然用负对数似然，所以回归和分类共享同一套交叉熵式的训练方式。", "有了整条分布，可以取均值、中位数或分位数，也能给出预测区间，适合需要不确定性的风控和医疗场景。"], "terms": ["区间", "分段常数", "负对数似然", "分位数", "不确定性"], "viz": "bins", "tag": "高频", "id": "j6", "plain": "分类时模型输出“属于每个类别的概率”。回归的目标是连续的数，TabPFN 把数值范围切成很多小段，比如 0 到 1、1 到 2，输出“落在每一段的概率”。这样得到的是一整条概率分布，不只是一个数，所以能直接说“有 90% 的把握在某个区间内”。"}, {"topic": "表格基础模型", "q": "TabPFN 为什么不需要调参？推理时的集成怎么做？", "key": "超参数被先验和预训练吸收了，推理时对预处理和特征顺序做多份变换再平均", "a": ["传统模型要针对每个数据集调超参数，TabPFN 的“调参”在预训练阶段已经通过先验完成，推理时只需一次前向。", "为了减少对输入表示的敏感，推理时会生成多份变换后的数据，例如打乱特征顺序和类别编号、换不同的数值预处理，分别预测后取平均。", "训练集只需编码一次，可以缓存下来，预测新样本时复用，类似语言模型的 KV 缓存。"], "terms": ["先验", "一次前向", "打乱特征顺序", "取平均", "缓存"], "viz": "ensemble", "tag": "高频", "id": "j7", "plain": "调参的意义是让模型适应这个数据集。TabPFN 在造假表训练时已经见过各种各样的数据集，相当于提前把这件事做了，所以拿来就用。为了更稳，它会把同一张表换几种写法，比如打乱列顺序、换个数值变换，各预测一次再取平均。"}, {"topic": "表格基础模型", "q": "表格基础模型为什么要处理好行和列的置换？", "key": "样本顺序和列顺序都不该影响预测，所以样本维不加位置编码、列维靠结构或集成处理", "a": ["一张表的行交换顺序含义不变，所以样本之间的注意力不加位置编码，模型对训练样本的顺序是置换不变的。", "列的顺序同样没有含义，但不同列又必须被区分开。v1 用多次打乱特征顺序再集成来缓解，v2 每个单元格单独表示并在行内做跨特征注意力。", "这也是表格和文本最大的区别，文本的位置信息有意义，表格的位置信息是噪声。"], "terms": ["置换不变", "位置编码", "跨特征注意力", "集成"], "viz": "perm", "tag": "高频", "id": "j8", "plain": "一张表把第 3 行和第 5 行换个位置，内容完全没变，预测也不该变。列的顺序同样没有意义。文本不一样，“我爱你”和“你爱我”意思不同。所以表格模型不能像语言模型那样给每个位置编号，要专门设计成对行和列的顺序不敏感。"}, {"topic": "表格基础模型", "q": "TabPFN 的规模瓶颈在哪里？大数据上有哪些扩展思路？", "key": "样本之间的注意力随样本数平方增长，靠子采样、检索局部上下文、换结构和蒸馏来扩展", "a": ["所有训练样本都在上下文里，样本维注意力的计算和显存随样本数平方增长，这是主要瓶颈。", "第一种思路是子采样或分块，每次只用一部分训练集做上下文，再集成。", "第二种是检索，对每个测试样本取它的近邻训练样本做局部上下文。", "第三种是换结构，例如 TabICL 先把每行压成一个向量，再在行向量上做上下文学习。", "第四种是部署时蒸馏成树或 MLP。"], "terms": ["平方", "子采样", "近邻", "TabICL", "蒸馏"], "viz": "attncost", "tag": "高频", "id": "j9", "plain": "TabPFN 预测时要让每个测试行和所有训练行逐一比较，训练行翻一倍，比较量翻四倍。表太大就算不动。办法有几种，只拿一部分训练行、只拿和测试行最像的那些行、先把每行压成一个向量再比较，或者部署时换成小模型。"}, {"topic": "表格基础模型", "q": "TabICL 的结构有什么特点？", "key": "先按列嵌入、再按行交互压成行向量、最后在行向量上做上下文学习", "a": ["TabICL 发表于 ICML 2025，目标是把表格上下文学习扩展到大数据。", "第一步对每一列用集合 Transformer 做分布感知的嵌入，第二步在每一行内让特征交互，把整行压缩成固定维度的行向量。", "第三步只在行向量上做样本之间的上下文学习，注意力的单位从单元格变成行，所以能处理到约 50 万样本。", "它同样只用合成数据预训练。"], "terms": ["集合 Transformer", "行向量", "50 万", "合成数据"], "viz": "tabicl", "tag": "高频", "id": "j10", "plain": "TabICL 为了处理大表，先把每一行压缩成一个固定长度的向量，再让测试行和训练行的向量比较。比较的单位从“格子”变成“行”，计算量小得多，能处理几十万行。"}, {"topic": "表格基础模型", "q": "TabDPT 和 TabPFN 在训练数据上有什么不同？", "key": "TabPFN 只用合成数据，TabDPT 用真实表格加自监督和检索", "a": ["TabPFN 系列在合成先验上预训练。TabDPT 在大量真实表格上预训练，用随机选一列当目标的自监督任务构造训练样本。", "它在训练和推理时都用检索，为每个查询取近邻样本作为上下文。", "论文展示了随着真实数据量和模型规模增加，效果按规律提升，说明真实数据也能支持表格模型的 Scaling。"], "terms": ["真实表格", "自监督", "检索", "Scaling"], "viz": "tabdpt", "tag": "高频", "id": "j11", "plain": "TabPFN 只用电脑造的假表训练，TabDPT 用网上收集的真实表格训练。真实表没有现成的“标签列”，它就随机挑一列当成要预测的目标，自己给自己出题。"}, {"topic": "表格基础模型", "q": "怎样用一个模型同时做分类、回归、缺失值填补和生成？", "key": "把整张表看成变量的联合分布，随机遮住一部分单元格让模型补全", "a": ["分类、回归、填补本质都是在已知部分单元格的条件下预测其他单元格。", "如果预训练目标是随机遮住表里的一部分单元格，让模型根据上下文预测被遮住的值，模型拟合的就是变量之间的联合分布。", "推理时遮住标签列就是分类或回归，遮住缺失位置就是填补，逐步采样被遮住的值就是生成。", "2025 年的 LimiX 就采用了这种掩码联合分布建模的思路，岗位描述里分类、回归、缺失值填补和生成并列，指向的正是这种统一建模。"], "terms": ["联合分布", "遮住", "填补", "生成", "LimiX"], "viz": "mask", "tag": "高频", "id": "j12", "plain": "分类、回归、填缺失、造数据，其实都是“已知一部分格子，猜另一部分格子”。如果训练时就随机遮住表里的一些格子让模型补全，那么遮住标签列就是预测，遮住缺失位置就是填补，一格一格补出整行就是生成。一个模型就能做四件事。"}, {"topic": "表格基础模型", "q": "表格基础模型和直接用大语言模型处理表格有什么区别？", "key": "LLM 要把表格序列化成文本，数值和长表都吃亏，表格基础模型直接在数值单元格上建模", "a": ["大语言模型处理表格要先把每行序列化成文本，数值被切成多个 token，模型对大小关系和精度不敏感。", "上下文长度限制了能放进去的样本数，几百行就很长。", "它的优势是能利用列名和类别值的语义，以及跨任务的世界知识，例如 TabuLa-8B 在大量表格序列化文本上微调 Llama 3 8B。", "表格基础模型直接把单元格数值作为输入，样本规模和数值建模更强，但通常不理解列名语义。两者结合是一个研究方向。"], "terms": ["序列化", "数值", "上下文长度", "列名", "TabuLa-8B"], "tag": "高频", "id": "j13", "plain": "让大语言模型读表，要先把每行写成一句话，比如“年龄是 35，收入是 1.2 万”。数字被拆成好几个字符，模型对大小不敏感，几百行就把上下文塞满了。好处是它看得懂列名的意思。表格基础模型直接读数字，规模和精度强，但不理解列名。"}, {"topic": "表格基础模型", "q": "表格模型上的检索增强怎么做？", "key": "为每个查询检索相似样本当上下文，相当于局部的贝叶斯推断", "a": ["对每个测试样本，在训练集中按距离取 k 个近邻，只把这些近邻放进上下文预测。", "这样做把全局的上下文换成局部上下文，既解决样本太多放不下的问题，也让模型更关注和查询相关的区域。", "可以在检索得到的局部上下文上再微调模型，进一步提升大数据上的效果。", "深度表格模型 TabR 也是检索思路，把近邻的标签和表示融合进预测。"], "terms": ["近邻", "局部上下文", "微调", "TabR"], "viz": "knn", "tag": "高频", "id": "j14", "plain": "预测一个新客户时，先在历史客户里找出最像他的 50 个，只把这 50 个当参考。这就是检索增强。参考的样本更相关，表再大也放得下。"}, {"topic": "表格基础模型", "q": "结构化数据模型的推理时计算扩展有哪些做法？", "key": "多份预处理集成、更多上下文、检索、测试时微调，都是用推理算力换效果", "a": ["集成，对同一个任务生成多份不同预处理或特征顺序的输入，预测后平均，份数越多越稳。", "上下文扩展，放进更多训练样本，或用检索挑更相关的样本。", "测试时训练，在当前任务的训练集上做少量步数的微调。", "这些方法和 LLM 的推理时扩展类似，代价是推理延迟和算力，部署时要和蒸馏结合。"], "terms": ["集成", "上下文", "检索", "测试时训练", "延迟"], "viz": "ensemble", "tag": "高频", "id": "j15", "plain": "训练完的模型参数不变，但预测时多花一点算力也能更准。比如同一张表换几种写法多预测几次再平均，或者多放一些参考样本，或者在当前这张表上再微调几步。代价是预测变慢。"}, {"topic": "树模型与 AutoML", "q": "GBDT 的核心思想是什么？", "key": "每棵新树拟合当前模型的负梯度，平方损失下就是残差", "a": ["GBDT 把多棵回归树加起来，第 m 步在已有模型 F_{m−1} 的基础上加一棵新树。", "新树拟合损失函数对当前预测的负梯度，平方损失时负梯度就是残差 y − F(x)。", "每棵树的输出乘上学习率再累加，学习率小、树多通常泛化更好。", "Boosting 主要降低偏差，Bagging 主要降低方差。"], "terms": ["负梯度", "残差", "学习率", "偏差", "方差"], "f": ["F_m(x) = F_{m−1}(x) + η · h_m(x)", "h_m 拟合 r_i = −∂L(y_i, F(x_i)) / ∂F(x_i)"], "viz": "gbdt", "tag": "必背", "id": "j16", "plain": "GBDT 是一棵一棵地种树。第一棵树先粗略预测，算出每个样本还差多少，也就是残差。第二棵树专门去预测这些残差，加上去以后误差变小。如此反复，每棵新树都在修补前面的错误。"}, {"topic": "树模型与 AutoML", "q": "XGBoost 的目标函数、叶子权重和分裂增益怎么推？", "key": "二阶泰勒展开加正则，叶子权重是负的 G 除以 H 加 λ", "a": ["XGBoost 对损失做二阶泰勒展开，每个样本有一阶梯度 g 和二阶导 h。", "正则项惩罚叶子数 T 和叶子权重的平方，系数分别是 γ 和 λ。", "把同一叶子里样本的 g 和 h 求和得到 G、H，最优叶子权重是 −G 除以 (H+λ)。", "分裂增益比较分裂前后的结构分数，增益小于 γ 就不分裂，相当于自带剪枝。"], "terms": ["二阶泰勒展开", "γ", "λ", "G", "H", "剪枝"], "f": ["Obj ≈ Σ_j [ G_j w_j + ½ (H_j + λ) w_j² ] + γT", "w_j* = −G_j / (H_j + λ)", "Gain = ½ [ G_L²/(H_L+λ) + G_R²/(H_R+λ) − (G_L+G_R)²/(H_L+H_R+λ) ] − γ"], "viz": "gbdt", "tag": "必背", "id": "j17", "plain": "XGBoost 在 GBDT 的基础上做得更精细。它不只看“往哪个方向改”（一阶导），还看“改多少合适”（二阶导），并且对树的叶子数和叶子值加了惩罚，防止树长得太复杂。由此可以直接推出每个叶子该输出多少，以及一次切分值不值得做。"}, {"topic": "树模型与 AutoML", "q": "XGBoost 怎样处理缺失值和稀疏特征？", "key": "分裂时为缺失值学一个默认方向，左右都试一次选增益大的", "a": ["寻找分裂点时只遍历非缺失的样本。", "缺失样本分别放到左边和右边各算一次增益，取增益大的方向作为这个节点的默认方向。", "预测时遇到缺失值就走默认方向，稀疏的 one-hot 特征也用同样的方式加速。"], "terms": ["默认方向", "增益", "稀疏"], "viz": "xgbmiss", "tag": "高频", "id": "j18", "plain": "数据里经常有缺失。XGBoost 在每个切分点上试两次，把缺失的样本全放左边算一次、全放右边算一次，哪边效果好就记住这个方向。以后遇到缺失值，直接走这个方向。"}, {"topic": "树模型与 AutoML", "q": "LightGBM 为什么比 XGBoost 快？", "key": "直方图、按叶子生长、GOSS 采样、EFB 捆绑特征", "a": ["直方图算法，把连续特征分成若干个桶，只在桶边界上找分裂点，父节点直方图减去兄弟节点得到另一个子节点。", "按叶子生长，每次选增益最大的叶子分裂，比按层生长损失下降更快，但要限制最大深度防止过拟合。", "GOSS，保留梯度最大的 a 比例样本，在其余样本里随机采 b 比例，并把采到的小梯度样本权重放大为 (1−a) 除以 b。", "EFB，把很少同时非零的互斥特征捆成一个特征，减少特征数。"], "terms": ["直方图", "按叶子生长", "GOSS", "EFB", "最大深度"], "f": ["小梯度样本权重 = (1 − a) / b"], "viz": "goss", "tag": "必背", "id": "j19", "plain": "LightGBM 快在四个地方。把连续值分成几十个桶，只在桶之间找切分点。每次挑最值得分的那个叶子去分。梯度小的样本已经预测得不错，只抽一部分来算。很少同时有值的列合并成一列。"}, {"topic": "树模型与 AutoML", "q": "CatBoost 的有序提升和有序目标统计解决什么问题？", "key": "用排列只拿“之前的样本”算统计量和梯度，避免目标泄漏造成的预测偏移", "a": ["类别特征常用目标统计编码，即用同类别样本的标签均值代替类别值。如果用包含当前样本的全部样本计算，就把当前样本的标签泄漏进了特征。", "CatBoost 随机排列样本，每个样本只用排在它前面的样本计算目标统计，并加先验平滑。", "梯度估计也有同样的偏移问题，有序提升让每个样本的残差由没见过它的模型计算。", "CatBoost 还用对称树，同一层所有节点用同一个分裂条件，预测快、不易过拟合。"], "terms": ["目标统计", "泄漏", "排列", "先验", "对称树"], "f": ["TS(x_i) = ( Σ_{j<i, x_j=x_i} y_j + a·p ) / ( Σ_{j<i, x_j=x_i} 1 + a )"], "viz": "orderedts", "tag": "高频", "id": "j20", "plain": "类别特征常用“同类别的平均标签”来编码，比如“城市 A 的平均违约率”。但如果算这个平均时把当前样本自己的标签也算进去，就等于把答案泄漏进了特征。CatBoost 把样本排个顺序，每个样本只用排在它前面的样本算平均，避免泄漏。"}, {"topic": "树模型与 AutoML", "q": "XGBoost、LightGBM、CatBoost 怎么对比？", "key": "XGB 稳，LGB 快，Cat 擅长类别特征", "a": ["三者都是梯度提升树，区别在于树的生长方式、对类别特征和缺失值的处理以及速度。", "默认参数下 CatBoost 往往更省心，大数据追求速度用 LightGBM，XGBoost 生态最成熟。", "实际比赛和业务里常把三者都训练后集成。"], "terms": ["生长方式", "类别特征", "集成"], "cmp": {"head": ["", "XGBoost", "LightGBM", "CatBoost"], "rows": [["生长方式", "按层（默认）", "按叶子", "对称树"], ["分裂查找", "预排序或直方图", "直方图", "直方图"], ["类别特征", "需编码，新版支持", "原生分组分裂", "有序目标统计"], ["缺失值", "学默认方向", "学默认方向", "视作特殊值"], ["加速手段", "二阶信息、列块", "GOSS、EFB", "对称树、有序提升"]]}, "tag": "高频", "id": "j21", "plain": "三个都是梯度提升树，可以理解成同一种方法的三种实现。XGBoost 最老牌稳定，LightGBM 最快适合大数据，CatBoost 处理类别特征最省心。"}, {"topic": "树模型与 AutoML", "q": "AutoGluon-Tabular 为什么效果强？", "key": "多层堆叠集成加重复 K 折装袋，把功夫花在集成而不是调参上", "a": ["AutoGluon 同时训练多种模型族，包括梯度提升树、随机森林、神经网络等。", "对每个模型做 K 折装袋，得到每个样本的折外预测。", "把折外预测和原始特征拼起来作为下一层的输入，训练多层堆叠，最后用加权集成合并。", "它的设计观点是在固定时间预算内，集成多样的模型比给单个模型做超参数搜索更有效。新版本也接入了 TabPFN 这类表格基础模型作为成员。"], "terms": ["堆叠", "K 折", "折外预测", "集成", "超参数搜索"], "viz": "autogluon", "tag": "高频", "id": "j22", "plain": "AutoGluon 的思路是不纠结调参，而是把很多不同的模型都训练一遍，再训练一个模型来综合它们的意见，还可以一层套一层地综合。在表格比赛里这种“集体投票”往往比精调单个模型更稳。"}, {"topic": "树模型与 AutoML", "q": "为什么树模型长期在表格数据上强于深度学习？", "key": "表格目标函数不平滑、无用特征多、列没有旋转不变性", "a": ["NeurIPS 2022 的一篇基准研究总结了三个原因。", "第一，表格的目标函数常常不平滑、有突变，神经网络偏好平滑解，树按阈值切分更合适。", "第二，表格里无信息特征多，MLP 容易被它们干扰，树会自然忽略。", "第三，表格的列各有含义，数据不具备旋转不变性，而 MLP 的学习过程对旋转不变，丢掉了列的个体性。", "表格基础模型用大量合成任务的先验弥补了这些劣势，在中小数据上开始超过调参的树模型。"], "terms": ["不平滑", "无信息特征", "旋转不变性", "先验"], "viz": "treevsnn", "tag": "高频", "id": "j23", "plain": "表格数据有三个特点让神经网络吃亏。规律常常是突变的，比如收入超过某个值风险骤降，树按阈值切分正好合适。表里常有很多没用的列，树会自动忽略。每一列含义不同，不能像图片那样随便旋转混合。"}, {"topic": "表格深度学习与自监督", "q": "表格深度学习有哪些代表模型？", "key": "MLP 加数值嵌入、FT-Transformer、TabNet、SAINT、TabR、TabM", "a": ["MLP 和 ResNet 是强基线，给数值特征加周期或分段线性嵌入后提升明显。", "FT-Transformer 把每个特征变成一个 token，在特征之间做注意力。", "TabNet 用逐步的注意力做特征选择，可解释性较好。", "SAINT 同时做特征之间和样本之间的注意力。TabR 是检索增强的模型，TabM 用参数高效的方式在一个 MLP 里实现多个成员的集成。"], "terms": ["FT-Transformer", "TabNet", "SAINT", "TabR", "TabM"], "viz": "tabdl", "tag": "高频", "id": "j24", "plain": "这些是专门为表格设计的神经网络。有的给每列一个向量再做注意力，有的在行和列两个方向都做注意力，有的预测时参考相似样本，有的在一个网络里装多个子模型做集成。"}, {"topic": "树模型与 AutoML", "q": "类别特征有哪些编码方式？目标编码怎样避免泄漏？", "key": "one-hot、序号、哈希、嵌入、目标编码，目标编码必须用折外或有序方式算", "a": ["低基数用 one-hot，高基数 one-hot 维度爆炸，可以用哈希或嵌入。", "目标编码用同类别样本的标签均值代替类别，信息量大但容易泄漏。", "避免泄漏的做法是 K 折折外计算，每折的编码只用其他折的标签，或者像 CatBoost 一样用有序目标统计，并加先验平滑处理样本少的类别。", "风控里常用的 WOE 编码也属于用标签信息编码，同样要在训练折内计算。"], "terms": ["one-hot", "哈希", "目标编码", "折外", "先验平滑", "WOE"], "viz": "targetenc", "tag": "高频", "id": "j25", "plain": "模型只认数字，类别要转成数。one-hot 是每个类别一列 0 或 1，类别太多时列数爆炸。目标编码用这个类别的平均标签代替，信息多但容易泄漏标签，所以要分折计算，每折只用别的折的标签。"}, {"topic": "缺失值与数据合成", "q": "MCAR、MAR、MNAR 有什么区别？对建模有什么影响？", "key": "完全随机、依赖已观测变量、依赖缺失值本身", "a": ["MCAR 是完全随机缺失，是否缺失和任何变量都无关，直接删掉缺失样本也不会带来偏差，只损失样本量。", "MAR 是随机缺失，是否缺失只依赖已观测的其他变量，例如年轻人更常不填收入。用已观测变量建模做填补可以消除偏差。", "MNAR 是非随机缺失，是否缺失依赖缺失值本身，例如收入越高越不愿意填。只靠观测数据无法完全纠正，需要对缺失机制建模或引入额外信息。", "风控里“是否缺失”本身常常是强特征，可以加缺失指示变量。"], "terms": ["MCAR", "MAR", "MNAR", "缺失指示变量"], "viz": "missing", "tag": "必背", "id": "j26", "plain": "数据为什么缺，决定了能不能放心处理。MCAR 是随机丢的，比如录入员偶尔漏填。MAR 是缺失和别的已知列有关，比如年轻人更常不填收入。MNAR 是缺失和它自己的值有关，比如收入很高的人故意不填，这种最难处理。"}, {"topic": "缺失值与数据合成", "q": "常见的缺失值填补方法有哪些？各自适用什么情况？", "key": "统计量、KNN、MICE、MissForest、GAIN、扩散模型，越往后越能建模复杂依赖", "a": ["均值、中位数、众数填补简单快速，但会压缩方差、破坏变量之间的关系。", "KNN 填补用相似样本的值，依赖距离定义。", "MICE 对每个有缺失的变量轮流建回归模型，用其他变量预测它，迭代多轮，并可多次填补估计不确定性。MissForest 是用随机森林做同样的迭代。", "GAIN 用生成对抗网络，生成器填补、判别器判断哪些位置是填补的。扩散模型把缺失位置当作要生成的部分，以观测部分为条件去噪。", "树模型和 TabPFN v2 可以原生处理缺失，不一定要先填补。"], "terms": ["均值", "KNN", "MICE", "MissForest", "GAIN", "扩散模型"], "viz": "impute", "tag": "高频", "id": "j27", "plain": "填缺失从简单到复杂。最简单是填平均值，但会让数据变得过于集中。可以找相似样本的值来填，也可以用其他列建模来预测缺的那列，反复迭代。更复杂的用生成模型，根据已知的格子生成缺失的格子。"}, {"topic": "缺失值与数据合成", "q": "填补效果怎么评估？", "key": "把已知值人为遮住再填回来比误差，同时看下游任务", "a": ["在完整数据上按指定机制人为遮住一部分值，填补后和真值比较，数值列看 RMSE，类别列看准确率。", "还要看下游任务的效果，填补误差小不一定让预测更好。", "要分别报告 MCAR、MAR、MNAR 三种遮挡机制下的结果，因为 MNAR 下很多方法会失效。", "多重填补还可以评估区间是否覆盖真值。"], "terms": ["遮住", "RMSE", "下游任务", "MNAR"], "viz": "impute", "tag": "高频", "id": "j28", "plain": "把一些已知的格子故意遮住，用方法填回去，和真值比差多少。同时要看填补后训练出的模型效果如何，因为填得准不一定预测得好。"}, {"topic": "缺失值与数据合成", "q": "CTGAN、TVAE、TabDDPM、TabSyn 这些表格生成方法有什么区别？", "key": "GAN、VAE、直接扩散、潜空间扩散", "a": ["CTGAN 用条件生成对抗网络，对数值列做按模式的归一化来处理多峰分布，并按类别条件采样训练来照顾稀有类别。TVAE 是同样预处理下的变分自编码器。", "TabDDPM 直接在数据空间做扩散，数值列用高斯扩散，类别列用多项分布扩散。", "TabSyn 先用 VAE 把混合类型的行编码到连续潜空间，再在潜空间里训练扩散模型，采样后解码。", "扩散类方法在保真度上通常优于 GAN 和 VAE，代价是采样步数多、速度慢。"], "terms": ["CTGAN", "TVAE", "TabDDPM", "TabSyn", "多项分布扩散", "潜空间"], "viz": "diffusion", "tag": "高频", "id": "j29", "plain": "这些都是“造假数据”的方法，目标是生成和真实表格分布一样的新数据。CTGAN 用生成器和判别器互相对抗，TVAE 用编码再解码，TabDDPM 和 TabSyn 用扩散模型，先把数据加噪成随机数，再训练网络一步步去噪还原。"}, {"topic": "缺失值与数据合成", "q": "扩散模型怎样用于表格生成和填补？", "key": "前向逐步加噪，网络学去噪，填补时把观测值作为条件", "a": ["前向过程按噪声调度逐步给数据加高斯噪声，第 t 步的样本可以由原始数据一步得到。", "网络学习预测加入的噪声，训练目标是预测噪声和真实噪声的均方误差。", "生成时从纯噪声出发逐步去噪。填补时把观测到的单元格作为条件，只对缺失位置去噪。", "类别列可以用多项分布扩散，或先嵌入到连续空间。"], "terms": ["加噪", "预测噪声", "去噪", "条件"], "f": ["x_t = √(ᾱ_t) · x_0 + √(1 − ᾱ_t) · ε", "L = ‖ ε − ε_θ(x_t, t) ‖²"], "viz": "diffusion", "tag": "必背", "id": "j30", "plain": "扩散模型训练时，把真实数据一点点加噪声，直到变成纯随机数，然后训练网络预测加了什么噪声。生成时反过来，从随机数开始一步步去噪。填缺失时，已知的格子保持不变，只对缺失的格子去噪。"}, {"topic": "缺失值与数据合成", "q": "合成数据怎么评价？", "key": "保真度、可用性、隐私三方面", "a": ["保真度看单列分布和列之间的相关性是否和真实数据一致。", "可用性常用“合成训练、真实测试”，用合成数据训练模型，在真实测试集上看效果。", "隐私看合成样本离最近真实样本的距离，距离过近说明可能复制了真实记录。", "对表格基础模型的预训练来说，合成先验的价值最终看它在真实基准上带来的下游效果。"], "terms": ["保真度", "合成训练、真实测试", "隐私", "最近真实样本"], "tag": "高频", "id": "j31", "plain": "评价假数据看三点。像不像，各列分布和列之间的关系是否和真数据一致。好不好用，用假数据训练模型，在真数据上测效果。安不安全，假数据有没有直接复制某条真实记录。"}, {"topic": "数据质量与预训练数据", "q": "预训练数据配比怎样确定？", "key": "小模型代理实验扫配比，或按各域损失动态调权，评测要覆盖所有分组", "a": ["配比是不同来源、领域、质量档在训练数据中的比例。", "DoReMi 先训练一个小的代理模型，用分组鲁棒优化找出各领域的权重，再用这组权重训练大模型。", "也可以用多个小规模实验拟合“配比到损失”的规律后外推，或者在训练中按各组损失下降速度动态调权。", "对结构化数据模型，配比的对象可以是不同先验的合成数据、不同领域的真实表格、不同规模和特征类型的任务。"], "terms": ["代理模型", "DoReMi", "分组鲁棒优化", "动态调权"], "viz": "mixflow", "tag": "高频", "id": "j32", "plain": "训练数据来自多个来源，每个来源放多少的比例叫配比。一般先用小模型试几种比例，看哪种效果好，再用这个比例训练大模型。"}, {"topic": "数据质量与预训练数据", "q": "表格基础模型预训练怎样结合合成数据和真实数据？", "key": "合成先验打底，真实数据继续预训练补机制，同时防止和评测集重叠", "a": ["合成数据规模无限、机制可控，适合打底，让模型具备通用的推断能力。", "真实数据包含合成先验没覆盖的机制，例如特定的分布形状和变量关系。在合成预训练之后用真实表格继续预训练，可以进一步提升真实基准上的效果。", "真实数据有和评测基准重叠的风险，需要按数据集去重，并把评测集排除在训练之外。", "还可以把多种先验混合，例如结构因果模型加基于树的先验，提升覆盖面。"], "terms": ["合成先验", "继续预训练", "去重", "混合先验"], "viz": "synreal", "tag": "高频", "id": "j33", "plain": "假数据可以无限造、规律可控，适合先打基础。真实数据里有假数据没覆盖到的规律，后面再用真实表格接着训练。要特别注意，真实训练数据里不能混进评测要用的数据集，否则分数是虚高的。"}, {"topic": "评测", "q": "TabArena 是什么？有哪些主要发现？", "key": "持续更新的表格基准，精选数据集、充分调参和集成、用 Elo 排名", "a": ["TabArena 是 2025 年推出的持续更新表格基准，从大量候选数据集中人工筛选出一批高质量的真实数据集。", "它对每个模型做充分的超参数调优和集成，并多次重复交叉验证，用 Elo 等方式排名，减少评测协议不同带来的偏差。", "主要发现包括调参加集成后的梯度提升树仍然很强，深度模型通过集成能追上来，TabPFN v2 和 TabICL 这类基础模型在中小数据上表现突出。", "岗位描述把它列为主要的公开基准之一。"], "terms": ["持续更新", "超参数调优", "集成", "Elo", "TabPFN v2"], "tag": "高频", "id": "j34", "plain": "TabArena 是一个持续更新的表格模型排行榜。它挑选了一批高质量真实数据集，给每个模型都认真调参，用类似下棋的积分排名，比较方式更公平。"}, {"topic": "评测", "q": "TALENT 是什么？", "key": "南京大学团队的表格学习基准和工具箱，覆盖几百个数据集和几十种方法", "a": ["TALENT 是南京大学团队发布的表格学习基准与工具箱，包含数百个分类和回归数据集，以及树模型、深度表格模型等数十种方法的统一实现。", "它的配套研究分析了不同方法在什么样的数据集上更好，例如按样本量、特征数、特征类型划分。", "用它可以在统一协议下快速比较新方法。"], "terms": ["南京大学", "数百个", "统一实现", "统一协议"], "tag": "高频", "id": "j35", "plain": "TALENT 是南京大学团队做的一套表格模型评测工具，收集了几百个数据集和几十种方法，统一接口，方便公平比较。"}, {"topic": "评测", "q": "表格模型评测要注意哪些问题？", "key": "固定划分和重复、等调参预算、归一化汇总、防止预训练泄漏、做显著性检验", "a": ["划分要固定并重复多次，报告均值和波动，小数据集上单次划分方差很大。", "比较要给各方法相同的调参预算和时间，否则是在比较调参投入。", "跨数据集汇总要用平均排名、归一化分数或 Elo，不能直接平均原始指标。", "表格基础模型可能在预训练时见过评测集，要检查数据集重叠。", "多方法比较用 Friedman 检验和临界差图判断差异是否显著。"], "terms": ["重复", "调参预算", "平均排名", "Elo", "重叠", "临界差图"], "viz": "cdplot", "tag": "高频", "id": "j36", "plain": "比较表格模型容易出现不公平。划分只做一次的话运气成分大，要重复多次。有的方法调参一天、有的不调，不能直接比。多个数据集的分数量纲不同，不能直接平均。表格基础模型可能训练时就见过评测集。"}, {"topic": "评测", "q": "怎样分析一个表格模型的能力边界？", "key": "按数据集元特征分组看表现，找它在哪类数据上输", "a": ["把评测数据集按元特征分组，例如样本量、特征数、类别特征比例、缺失率、类别数、不平衡程度。", "在每组里比较模型和强基线的差距，找出它明显变差的区域。", "再用合成数据控制单一因素，例如只改变无信息特征的比例，验证是不是这个因素导致变差。", "分析结论反过来指导数据、架构和训练策略，例如补充对应机制的合成先验。"], "terms": ["元特征", "分组", "控制单一因素", "合成先验"], "tag": "高频", "id": "j37", "plain": "看一个模型擅长什么、不擅长什么，就把数据集按特点分组，比如行数多少、有没有类别列、缺失多不多，看它在哪一组输得最多，再针对性地改进。"}, {"topic": "风控与业务", "q": "KS 值怎么计算？和 AUC 是什么关系？", "key": "好坏样本累计分布之差的最大值，即 TPR 减 FPR 的最大值", "a": ["把样本按模型分数排序，分别计算坏样本和好样本在各分数阈值下的累计占比。", "KS 等于两条累计分布曲线之间的最大差距，也等于所有阈值上真正率减假正率的最大值。", "KS 只看最佳阈值这一点的区分度，AUC 看所有阈值的整体排序能力。", "风控里 KS 常用来选切分点，经验上 0.3 以上有区分度，过高要怀疑泄漏。"], "terms": ["累计分布", "最大差距", "真正率", "假正率", "0.3", "泄漏"], "f": ["KS = max_t | F_bad(t) − F_good(t) | = max_t ( TPR(t) − FPR(t) )"], "viz": "roc", "tag": "必背", "id": "j38", "plain": "风控模型给每个人打一个风险分。KS 衡量的是，在某个分数线上，坏人被识别出来的比例和好人被误判的比例最多能拉开多大差距。差距越大说明模型越能区分好坏人。"}, {"topic": "风控与业务", "q": "PSI 怎么计算？阈值代表什么？", "key": "按分箱比较期望和实际占比，0.1 以下稳定、0.25 以上明显漂移", "a": ["PSI 衡量特征或模型分数的分布在两个时期之间的变化。", "先按建模期的分布分箱，计算每箱在建模期的占比 E 和当前时期的占比 A。", "PSI 对各箱的 (A − E) 乘 ln(A 除以 E) 求和。", "经验上小于 0.1 视为稳定，0.1 到 0.25 需要关注，大于 0.25 说明分布明显漂移，要考虑重新建模。"], "terms": ["分箱", "占比", "0.1", "0.25", "漂移"], "f": ["PSI = Σ_i (A_i − E_i) · ln(A_i / E_i)"], "viz": "psi", "tag": "必背", "id": "j39", "plain": "PSI 用来检查数据有没有变。比如上线半年后，客户的分数分布和建模时还一样吗？把分数分成几段，比较两个时期每段的人数占比，差得越多 PSI 越大。"}, {"topic": "风控与业务", "q": "WOE 和 IV 是什么？", "key": "WOE 是每箱坏好比的对数，IV 汇总整个特征的区分能力", "a": ["把特征分箱，每箱的 WOE 等于这一箱坏样本占全部坏样本的比例，除以好样本占全部好样本的比例，再取对数。", "IV 对各箱的 (坏占比 − 好占比) 乘 WOE 求和，衡量这个特征整体的区分能力。", "经验上 IV 小于 0.02 几乎没用，0.1 到 0.3 中等，大于 0.5 要怀疑泄漏。", "WOE 编码后特征和对数几率近似线性，适合逻辑回归评分卡。"], "terms": ["WOE", "IV", "0.02", "评分卡", "对数几率"], "f": ["WOE_i = ln( (B_i / B) / (G_i / G) )", "IV = Σ_i ( B_i/B − G_i/G ) · WOE_i"], "viz": "woe", "tag": "必背", "id": "j40", "plain": "把一个特征分成几段，比如年龄分成五段。WOE 看每一段里坏人是不是特别集中，IV 把各段汇总，衡量这个特征整体对区分好坏人有多大用处。"}, {"topic": "风控与业务", "q": "什么是时间外验证 OOT？什么是样本穿越？", "key": "用时间上更晚的数据验证，特征只能用观察点之前的信息", "a": ["风控数据有时间顺序，随机划分会让模型见到未来的模式，验证结果虚高。", "OOT 是用时间上晚于训练期的样本做验证，更接近上线后的真实表现。", "样本穿越是特征里混进了观察点之后才能获得的信息，例如用到了表现期内的还款记录，上线后这些信息拿不到。", "防止穿越要为每个样本定义观察点，所有特征只用观察点之前的数据计算。"], "terms": ["OOT", "观察点", "穿越", "表现期"], "viz": "split", "tag": "必背", "id": "j41", "plain": "风控数据是按时间来的。如果随机划分，模型在训练时就见过“未来”的数据，验证分数会偏高。OOT 是用更晚的一段时间做验证。样本穿越是特征里用到了预测时刻之后才能拿到的信息，上线后这个信息不存在，模型就失效了。"}, {"topic": "风控与业务", "q": "风控样本极度不平衡怎么处理？", "key": "先换指标，再考虑重采样、加权和阈值调整", "a": ["坏样本可能只占百分之一，准确率没有意义，要看 AUC、KS、PR 曲线和召回。", "可以对坏样本过采样或对好样本欠采样，也可以在损失里给坏样本更大权重。", "重采样或加权会改变预测概率的绝对值，需要校准后才能当概率用。", "最终按业务成本选择阈值，例如误拒好客户和放过坏客户的损失不同。"], "terms": ["AUC", "KS", "过采样", "加权", "校准", "阈值"], "tag": "高频", "id": "j42", "plain": "一万个客户里可能只有一百个坏人。模型全猜“好人”就有 99% 的准确率，但毫无用处。所以要看能不能把坏人找出来，可以多复制坏人样本，或者在训练时给坏人更大的权重。"}, {"topic": "风控与业务", "q": "什么是拒绝推断？", "key": "被拒绝的申请没有表现标签，只用通过的样本建模会有偏", "a": ["信贷模型只能观察到被批准客户的还款表现，被拒绝的客户没有标签。", "只用通过的样本训练，样本分布和全部申请人不一致，模型在低分人群上有偏。", "拒绝推断用各种方法给被拒样本推断标签，例如用已有模型打分后按分数赋予伪标签，或分组加权，再一起训练。", "这本质上是一个非随机缺失标签的问题。"], "terms": ["被拒绝", "没有标签", "伪标签", "非随机缺失"], "tag": "高频", "id": "j43", "plain": "银行只知道被批准贷款的人后来有没有还钱，被拒绝的人没有结果。只用被批准的人训练，模型就没见过被拒的那类人。拒绝推断就是想办法给被拒的人估一个结果，一起训练。"}, {"topic": "风控与业务", "q": "风控模型为什么强调可解释性和稳定性？", "key": "监管要求解释拒绝原因，业务要求分数长期稳定", "a": ["金融监管要求能向客户和审计说明决策原因，所以评分卡和单调约束的树模型很常见。", "复杂模型可以用 SHAP 值解释单个预测的特征贡献。", "模型上线后要监控分数和特征的 PSI，以及按月的 KS，发现漂移及时迭代。", "对抗环境下欺诈模式会变化，需要快速更新特征和模型。"], "terms": ["监管", "单调约束", "SHAP", "PSI", "漂移"], "viz": "psi", "tag": "高频", "id": "j44", "plain": "贷款被拒，客户和监管都会问原因，模型必须讲得清楚。上线后数据会慢慢变化，模型效果会下降，所以要持续监控分数分布，变化大了就重新训练。"}, {"topic": "训练推理与 Scaling", "q": "Scaling Law 的主要结论是什么？Chinchilla 改变了什么？", "key": "损失随参数、数据、算力按幂律下降，算力最优时数据量约是参数量的二十倍", "a": ["Kaplan 等人发现语言模型的损失随参数量、数据量和算力都按幂律下降。", "训练算力可以估为 C ≈ 6ND，N 是参数量，D 是训练 token 数。", "Chinchilla 重新做实验后发现，给定算力时参数和数据应该同比例增长，最优的训练 token 数约为参数量的 20 倍，此前的大模型普遍训练数据不足。", "表格模型也开始研究 Scaling，例如 TabDPT 展示了真实数据量和模型规模的规律，TabPFN 的演进本身就是数据规模和模型能力一起扩展。"], "terms": ["幂律", "6ND", "20 倍", "Chinchilla", "TabDPT"], "f": ["C ≈ 6 · N · D", "L(N, D) ≈ E + A / N^α + B / D^β"], "viz": "scaling", "tag": "必背", "id": "j45", "plain": "模型越大、数据越多、算力越多，效果越好，而且提升有稳定的规律，可以提前预测。Chinchilla 的结论是，模型变大的同时数据也要同比例变多，大约每个参数配 20 个训练词最划算。"}, {"topic": "训练推理与 Scaling", "q": "ZeRO 的三个阶段分别切分什么？FSDP 是什么？", "key": "ZeRO-1 切优化器状态，ZeRO-2 再切梯度，ZeRO-3 连参数一起切", "a": ["数据并行时每张卡都保存完整的参数、梯度和优化器状态，Adam 的优化器状态通常是参数的好几倍。", "ZeRO-1 把优化器状态切分到各卡，ZeRO-2 再切分梯度，ZeRO-3 把参数也切分，用到时再临时收集。", "切得越多显存越省，但通信越多。", "PyTorch 的 FSDP 是类似 ZeRO-3 的实现，按模块包装，前向和反向时收集参数，算完释放。"], "terms": ["优化器状态", "梯度", "参数", "通信", "FSDP"], "viz": "parallel", "tag": "必背", "id": "j46", "plain": "训练大模型时显存不够用。每张卡除了存模型参数，还要存梯度和优化器的状态，后者占得最多。ZeRO 的办法是让多张卡分摊这些东西，每张卡只存一部分，用到时再互相传。"}, {"topic": "训练推理与 Scaling", "q": "表格基础模型的推理怎样加速？", "key": "训练集只编码一次并缓存，分批预测，必要时蒸馏", "a": ["TabPFN 类模型的预测分成两步，先把训练集编码成上下文，再让测试样本注意上下文。训练集的表示可以缓存，多批测试样本复用。", "大训练集可以子采样或检索局部上下文，减少注意力的计算量。", "数值精度上可以用 bf16 推理，配合 FlashAttention 一类的高效注意力实现。", "在线低延迟场景把它蒸馏成树或 MLP。"], "terms": ["缓存", "子采样", "bf16", "FlashAttention", "蒸馏"], "viz": "attncost", "tag": "高频", "id": "j47", "plain": "TabPFN 预测一批新样本，都要参考同一份训练集。训练集只需处理一次存起来，后面每批新样本直接复用。表太大可以只用一部分行，线上要求快的场景就换成蒸馏出的小模型。"}, {"topic": "Transformer 与注意力", "q": "In-Context Learning 为什么能工作？有哪些解释？", "key": "隐式贝叶斯推断、在前向里模拟梯度下降、归纳头复制模式", "a": ["贝叶斯视角的解释是，预训练后的模型在前向中从上下文推断潜在的任务，再按这个任务预测，TabPFN 的训练目标把这一点做得很明确。", "另一种解释证明 Transformer 的注意力可以在前向中实现类似梯度下降的更新，上下文样本相当于训练数据。", "机制可解释性研究发现了归纳头，它能找到上下文中出现过的模式并复制后续内容。", "ICL 的效果对示例的选择、顺序和格式敏感，这也是表格模型要做集成和检索的原因之一。"], "terms": ["隐式贝叶斯推断", "梯度下降", "归纳头", "示例的选择"], "viz": "learnmodes", "tag": "必背", "id": "j48", "plain": "在输入里放几个例子，大模型就能对新输入给出同样格式的结果，这叫上下文学习。一种解释是模型在前向计算中从例子里推断出了“这是什么任务”。TabPFN 把这件事做得很直接，训练目标本身就是“看例子做预测”。"}, {"topic": "评测", "q": "模型校准是什么？怎么衡量和修正？", "key": "预测概率等于真实频率，用 ECE 衡量，用温度缩放或保序回归修正", "a": ["校准好的模型，所有预测为 0.8 的样本里，真实正例比例应该接近 0.8。", "ECE 把预测概率分箱，按样本数加权平均每箱的平均预测和实际正例率之差。", "修正方法有 Platt 缩放、温度缩放和保序回归，都在验证集上拟合。", "风控里分数要当概率用于定价和额度时，校准尤其重要，重采样后的模型必须重新校准。"], "terms": ["ECE", "温度缩放", "保序回归", "Platt"], "f": ["ECE = Σ_b (n_b / n) · | acc_b − conf_b |"], "tag": "高频", "id": "j49", "plain": "模型说“80% 是坏人”，那么在所有被它这样说的人里，实际上应该真有 80% 左右是坏人，这叫校准好。风控里分数要直接用于定价和额度，所以概率必须准，不准就要修正。"}, {"topic": "统计与因果", "q": "因果推断的基本概念有哪些？和预测建模有什么区别？", "key": "预测看相关，因果看干预效果，要处理混杂", "a": ["预测建模学习 p(y | x)，只要相关就有用。因果推断关心干预 x 之后 y 会怎样变化。", "平均处理效应 ATE 是处理组和对照组潜在结果的期望之差，观测数据里两组往往不可比。", "混杂变量同时影响处理和结果，会造成虚假关联。常用倾向分匹配或加权、双重稳健估计来调整。", "营销和风控里的“发券是否提升转化”“提额是否增加坏账”都是因果问题，不能直接用预测模型的特征重要性回答。"], "terms": ["干预", "ATE", "混杂", "倾向分", "双重稳健"], "tag": "高频", "id": "j50", "plain": "预测模型回答“这个人违约的可能性多大”。因果推断回答“如果给他提额度，违约率会变多少”。后者要排除其他因素的干扰，比如收入既影响提额又影响违约，不处理就会得出错误结论。"}, {"topic": "评测", "q": "Bootstrap 和置信区间在实验比较里怎么用？", "key": "有放回重采样估计统计量的分布，配对比较两个模型", "a": ["Bootstrap 从样本中有放回地重采样很多次，每次算一遍统计量，得到它的经验分布，进而给出置信区间。", "比较两个模型时用配对 bootstrap，在同一组重采样上比较两者的差值，比分别算区间更灵敏。", "如果差值的置信区间不包含 0，说明差异较可靠。", "小数据集上单次评测波动大，这一步能避免把噪声当成提升。"], "terms": ["有放回", "经验分布", "配对", "置信区间"], "viz": "bootstrap", "tag": "高频", "id": "j51", "plain": "只有一次评测结果时，不知道它是真的好还是运气好。Bootstrap 从测试样本里有放回地重新抽很多次，每次算一遍分数，看分数波动多大，进而判断两个模型的差距是否可靠。"}, {"topic": "表格基础模型", "q": "TabPFN 在什么情况下表现不好？使用时要注意什么？", "key": "超出规模上限、强时间结构、高基数类别和需要低延迟时要谨慎", "plain": "再好的模型也有适用范围。TabPFN 擅长中小规模的普通表格，遇到特别大的表、按时间变化的数据、或者要求毫秒级响应的线上场景，就要配合其他方法。", "a": ["样本数或特征数超过预训练覆盖的规模后，效果没有保证，需要子采样、分块或换用面向大数据的模型。", "数据有明显时间顺序或分布漂移时，上下文里的旧样本可能误导预测，要按时间选择上下文。", "类别取值非常多的高基数特征、长文本列需要先做编码或降维。", "线上逐条打分要求低延迟时，预测成本随训练集变大而增长，通常蒸馏成树或 MLP。"], "terms": ["规模", "时间顺序", "高基数", "低延迟", "蒸馏"], "viz": "versions", "tag": "高频", "id": "j52"}, {"topic": "表格基础模型", "q": "怎样微调 TabPFN？微调和直接上下文学习怎么取舍？", "key": "在目标数据上继续训练，用一部分当上下文、一部分当查询计算损失", "plain": "直接用 TabPFN 不需要训练。如果手里有一批同类型的任务数据，也可以在这些数据上再训练一下，让它更贴合这个领域，这就是微调。", "a": ["微调时把目标数据切成上下文部分和查询部分，让模型根据上下文预测查询的标签，用交叉熵更新参数，和预训练的形式一致。", "可以在单个大数据集上反复采样子集微调，也可以在同领域的多个数据集上微调。", "数据少时直接上下文学习更稳，微调容易过拟合。数据多、领域特殊时微调收益更明显。", "微调要留独立的验证集早停，并比较微调前后的效果。"], "terms": ["上下文", "查询", "交叉熵", "过拟合", "早停"], "viz": "tabft", "tag": "高频", "id": "j53"}, {"topic": "表格基础模型", "q": "表格基础模型的预训练目标和普通监督学习有什么不同？", "key": "普通监督学习是在一个数据集上学一个函数，预训练是在很多数据集上学“怎样从数据集推断函数”", "plain": "普通训练只针对一张表。表格基础模型训练时每一步都换一张新表，训练完成后，输入任何一张表都能直接输出预测。", "a": ["普通监督学习在固定数据集上最小化损失，得到一个只适用于这个任务的模型。", "表格基础模型的每个训练样本是一整个数据集，切成上下文和查询，损失在大量不同数据集上平均。", "这是一种元学习，学到的是从样本推断预测规则的算法本身。", "因此预训练数据的多样性比单个数据集的大小更重要。"], "terms": ["元学习", "数据集", "上下文", "多样性"], "viz": "pfntrain", "tag": "高频", "id": "j54"}, {"topic": "表格基础模型", "q": "TabPFN 能处理多少类别？类别很多时怎么办？", "key": "原生支持有限的类别数，超出时拆成多个子任务再合并", "plain": "模型的输出层大小是固定的，类别太多时装不下。办法是把一个多类别问题拆成几个小问题，分别预测再拼回去。", "a": ["TabPFN v1 和 v2 原生支持的分类类别数为 10。", "类别更多时可以用一对多、纠错输出码或分层的方式，拆成多个类别数较少的子任务，再把子任务的概率合并。", "回归任务没有这个限制，因为输出是对目标值分桶后的分布。"], "terms": ["10", "一对多", "纠错输出码", "分桶"], "viz": "ovr", "tag": "高频", "id": "j55"}, {"topic": "表格基础模型", "q": "TabPFN 怎样处理类别特征和缺失值？", "key": "v2 在合成先验里就加入了类别和缺失，推理时按约定编码直接输入", "plain": "真实表格常有类别列和空值。TabPFN v2 在造训练用的假表时，就故意加入了类别列和空值，所以真实数据里的这些情况可以直接输入，不需要先填补。", "a": ["TabPFN v2 的先验在生成数据时会随机把部分数值特征离散成类别，并按不同机制置入缺失值。", "推理时类别特征按约定编码后输入，缺失值用专门的方式表示，模型在预训练中见过这类输入。", "因此通常不需要先做均值填补，填补反而可能抹掉“是否缺失”这一信息。"], "terms": ["先验", "离散成类别", "缺失", "是否缺失"], "viz": "missing", "tag": "高频", "id": "j56"}, {"topic": "表格基础模型", "q": "表格基础模型可以怎样用于时间序列预测？", "key": "把预测问题改写成表格回归，时间和日历特征当列", "plain": "时间序列也能变成一张表，每个时间点一行，列是时间索引、星期几、月份这些特征，要预测的值当标签，然后交给 TabPFN 做回归。", "a": ["把每个时间点构造成一行，特征包括时间索引、周期性的日历特征，以及可选的滞后值。", "历史时间点作为上下文，未来时间点作为查询，用表格回归直接预测。", "TabPFN-TS 等工作用这种方式在时间序列基准上取得了有竞争力的结果，而且可以输出预测分布。", "注意上下文只能包含预测时刻之前的数据，避免信息泄漏。"], "terms": ["日历特征", "滞后值", "上下文", "预测分布", "泄漏"], "viz": "ts2tab", "tag": "高频", "id": "j57"}, {"topic": "表格基础模型", "q": "用 LLM 为表格模型做特征工程是怎么回事？", "key": "LLM 读数据集描述写特征代码，用表格模型交叉验证决定是否保留", "plain": "表格模型只处理数值，不使用列名的含义。大语言模型可以处理列名和数据说明这类文本，所以可以让大语言模型根据数据集的说明写出新特征的计算代码，再用表格模型测试这些新特征有没有用。", "a": ["CAAFE 把数据集描述和列信息交给 LLM，让它生成计算新特征的 Python 代码。", "每次生成后用 TabPFN 做交叉验证，效果提升就保留这个特征，否则丢弃，迭代多轮。", "这种做法把 LLM 的语义知识和表格模型的数值建模结合起来，生成的特征代码可读、可审查。"], "terms": ["CAAFE", "Python 代码", "交叉验证", "语义知识"], "viz": "caafe", "tag": "高频", "id": "j58"}, {"topic": "数据质量与预训练数据", "q": "设计表格预训练的合成先验时，要覆盖哪些方面？", "key": "因果结构、函数形式、噪声、数据类型、规模、缺失和不平衡", "plain": "假数据要尽量像真实世界的各种表格。变量之间怎么影响、影响是线性还是非线性、有多少噪声、有没有类别列和空值、表有多大，这些都要随机变化。", "a": ["结构，随机生成不同大小和稀疏程度的因果图。", "函数，节点之间的关系覆盖线性、非线性、阈值型和交互型。", "噪声和数据类型，噪声大小和分布不同，数值列、类别列、序数列混合。", "任务规模，样本数、特征数、类别数在范围内变化，并加入缺失、不平衡、无信息特征和异常值。", "覆盖越广，模型面对真实表格时越不容易遇到“没见过的情况”。"], "terms": ["因果图", "非线性", "噪声", "缺失", "不平衡"], "viz": "scm", "tag": "高频", "id": "j59"}, {"topic": "数据质量与预训练数据", "q": "怎样评估一个合成先验好不好？", "key": "最终看在真实基准上的下游效果，过程中看合成数据和真实数据的统计特征是否接近", "plain": "造的假数据好不好，最直接的检验是用它训练出来的模型在真实表格上考得怎么样。也可以比较假表和真表在各种统计特征上像不像。", "a": ["下游评测，用该先验预训练模型，在留出的真实基准上比较效果，这是最终标准。", "统计对比，比较合成表和真实表的元特征分布，例如特征相关性、类别比例、缺失率、可预测难度。", "消融，去掉先验中的某个组件，看在哪类真实数据上效果下降，从而知道这个组件补的是什么。", "用小模型和较少训练步做代理实验，降低比较成本。"], "terms": ["下游评测", "元特征", "消融", "代理实验"], "viz": "prioreval", "tag": "高频", "id": "j60"}, {"topic": "数据质量与预训练数据", "q": "引入真实表格数据做预训练要处理哪些问题？", "key": "格式统一、清洗去重、许可合规、和评测集隔离", "plain": "从网上收集的真实表格五花八门，要先统一格式、清洗、去掉重复，还要确认能不能用，并且不能把将来要用来评测的表混进去。", "a": ["格式统一，列类型识别、编码方式、缺失标记都要标准化。", "质量清洗，去掉常数列、标识列、泄漏标签的列和明显错误的数据。", "去重和隔离，按数据集和行级别去重，排除评测基准中的数据集，必要时检查近似重复。", "许可和隐私，确认数据的使用许可，敏感数据要脱敏。", "真实数据没有天然的目标列，可以随机挑列当目标构造自监督任务。"], "terms": ["标准化", "去重", "评测基准", "许可", "自监督"], "viz": "realdata", "tag": "高频", "id": "j61"}, {"topic": "数据质量与预训练数据", "q": "怎样检测和处理表格里的标签噪声？", "key": "用交叉验证的预测概率找出和给定标签明显矛盾的样本", "plain": "标签写错的样本会把错误的规律带进训练。一个思路是先用模型做交叉验证，看哪些样本的标签和模型的预测严重不符，这些就是可疑的错标。", "a": ["置信学习用交叉验证得到每个样本的预测概率，估计真实标签和观测标签的联合分布，找出很可能错标的样本。", "也可以看训练过程中损失一直很高的样本。", "处理方式有删除、修正、降权，或使用对噪声更鲁棒的损失。", "要注意难样本和错标样本都表现为高损失，最好结合人工抽检。"], "terms": ["置信学习", "交叉验证", "高损失", "降权", "人工抽检"], "viz": "labelnoise", "tag": "高频", "id": "j62"}, {"topic": "数据质量与预训练数据", "q": "数据去重为什么重要？表格数据怎么去重？", "key": "重复会让模型偏向重复内容并造成评测泄漏，用精确哈希加近似匹配去重", "plain": "同一条记录出现很多次，它在损失里的权重就被放大了。如果训练集和测试集里有同一条记录，测试分数也会虚高。", "a": ["精确去重对整行或关键列做哈希比较。", "近似去重处理格式差异，例如先规范化数值精度和字符串大小写，再用 MinHash 或嵌入近邻找相似行。", "跨集合去重最重要，训练集和测试集之间的重复直接造成泄漏。", "有些重复是真实的业务现象，比如同一客户多次申请，要按业务实体分组划分，而不是简单删除。"], "terms": ["哈希", "MinHash", "泄漏", "按业务实体分组"], "viz": "dedup", "tag": "高频", "id": "j63"}, {"topic": "数据质量与预训练数据", "q": "什么是数据泄漏？表格任务里常见的泄漏有哪些？", "key": "训练时用到了预测时拿不到的信息", "plain": "训练时用到了上线后拿不到的信息，离线分数就会虚高。你做数据清洗时要特别留意这类问题。", "a": ["目标泄漏，特征是标签的结果或近似，例如用“是否催收”预测“是否违约”。", "时间泄漏，特征包含预测时刻之后的信息，也就是风控里说的样本穿越。", "预处理泄漏，在全量数据上做标准化、填补、特征选择后再划分。", "分组泄漏，同一实体的多条记录分散在训练集和测试集。", "排查方法是检查重要性异常高的特征，以及离线指标好得不合理的情况。"], "terms": ["目标泄漏", "时间泄漏", "预处理泄漏", "分组泄漏"], "viz": "split", "tag": "必背", "id": "j64"}, {"topic": "表格深度学习与自监督", "q": "表格数据的自监督预训练有哪些做法？", "key": "遮住或打乱部分特征，让模型恢复，或者做对比学习", "plain": "没有标签时，可以从数据本身构造训练目标，比如遮住一些格子让模型预测原值，或者把一行的部分特征打乱，训练模型区分两行是否来自同一个样本。", "a": ["掩码重建，随机遮住部分单元格，预测被遮住的值。", "VIME 同时预测哪些位置被替换以及原始特征值。", "SCARF 把一行的部分特征替换成从该列边缘分布随机采样的值，作为正样本对做对比学习。", "自监督主要用于标签少的场景，学到的表示再用于下游任务。"], "terms": ["掩码重建", "VIME", "SCARF", "对比学习"], "viz": "corrupt", "tag": "高频", "id": "j65"}, {"topic": "表格深度学习与自监督", "q": "跨表迁移难在哪里？有哪些方法？", "key": "不同表的列不同、含义不同，要找到能共享的表示", "plain": "图片都是像素，文本都是词，可以直接通用。不同的表列不一样，一张是信贷表、一张是医疗表，没有统一的输入格式，参数很难直接共用。", "a": ["难点是列的数量、顺序、含义和单位各不相同，没有统一的输入空间。", "一类方法利用列名和类别值的文本语义，用语言模型把它们嵌入同一空间，例如 CARTE。", "一类方法给每张表配专用的输入层，共享中间的 Transformer，例如 XTab。", "TabPFN 这类方法绕开了列语义，只从数值模式中做上下文推断，因此天然适用于任意表格。"], "terms": ["列名", "语义", "CARTE", "XTab", "上下文推断"], "viz": "crosstab", "tag": "高频", "id": "j66"}, {"topic": "表格深度学习与自监督", "q": "数值特征怎样输入到 Transformer 里？", "key": "线性映射、分段线性或周期嵌入，把一个数变成一个向量", "plain": "神经网络里每个输入通常是一个向量。一个数怎么变成向量？可以乘一个可训练的向量，也可以先按大小分段再编码。", "a": ["最简单的是线性嵌入，数值乘一个可训练向量再加偏置。", "分段线性嵌入先按分位数切段，再在每段内线性编码，能表达非线性。", "周期嵌入用不同频率的正弦余弦函数编码数值。", "研究表明好的数值嵌入能显著提升表格深度模型的效果。"], "terms": ["线性嵌入", "分段线性", "分位数", "周期嵌入"], "viz": "numemb", "tag": "高频", "id": "j67"}, {"topic": "特征工程与建模实践", "q": "数值特征常见的预处理有哪些？树模型和神经网络的需求有什么不同？", "key": "标准化、分位数变换、对数变换、截尾，树模型基本不需要缩放", "plain": "同样是年龄和收入，单位和范围差很多。神经网络对数值大小敏感，需要先缩放到差不多的范围。树模型只看大小顺序，缩放不缩放结果一样。", "a": ["标准化把特征减均值除标准差，归一化缩放到固定区间。", "分布偏斜时用对数变换或分位数变换，把长尾拉平。", "异常值可以截尾处理，例如截到 1% 和 99% 分位数。", "树模型只依赖特征的排序，单调变换不改变切分结果，所以一般不需要缩放。神经网络、逻辑回归、KNN 对尺度敏感。"], "terms": ["标准化", "分位数变换", "对数变换", "截尾", "排序"], "viz": "transform", "tag": "必背", "id": "j68"}, {"topic": "特征工程与建模实践", "q": "什么是特征分箱？有什么作用？", "key": "把连续值切成若干区间，增强稳定性和可解释性", "plain": "把年龄这样的连续数切成几段，比如 18 到 25、25 到 35，每段当一个类别。这样能减弱异常值的影响，也方便解释。", "a": ["等频分箱让每箱样本数相近，等距分箱让每箱宽度相同。", "有监督分箱按标签信息合并相邻区间，例如卡方分箱，让箱之间的坏样本率差异显著。", "分箱能降低异常值影响、捕捉非线性、提高稳定性，是风控评分卡的标准步骤。", "代价是损失箱内的细节信息。"], "terms": ["等频", "等距", "卡方分箱", "评分卡"], "viz": "binning", "tag": "高频", "id": "j69"}, {"topic": "特征工程与建模实践", "q": "特征选择有哪些方法？", "key": "过滤法看统计量，包装法看模型效果，嵌入法在训练中选", "plain": "特征太多会带来噪声和过拟合。可以先按统计指标粗筛，再看去掉某个特征后模型效果有没有变化。", "a": ["过滤法用相关系数、互信息、IV、卡方检验等统计量排序，速度快。", "包装法把特征子集放进模型评估，例如递归特征消除，效果好但慢。", "嵌入法在训练过程中完成选择，例如 L1 正则让部分系数为零，树模型的特征重要性。", "要在训练集上做选择，避免在全量数据上选造成泄漏。"], "terms": ["过滤法", "互信息", "包装法", "嵌入法", "L1"], "tag": "高频", "id": "j70"}, {"topic": "特征工程与建模实践", "q": "怎样处理高基数类别特征？", "key": "目标编码、频率编码、哈希、嵌入，或者合并稀有类别", "plain": "像城市、商户编号这种类别成千上万的列，直接做 one-hot 会生成成千上万列。需要换一种更紧凑的编码方式。", "a": ["频率编码用该类别出现的次数或比例代替。", "目标编码用该类别的平均标签代替，必须折外计算并平滑。", "哈希编码把类别哈希到固定数量的桶里，允许少量冲突。", "神经网络可以给每个类别学一个嵌入向量，稀有类别可以合并成“其他”。"], "terms": ["频率编码", "目标编码", "哈希", "嵌入", "稀有类别"], "viz": "targetenc", "tag": "高频", "id": "j71"}, {"topic": "特征工程与建模实践", "q": "超参数怎么调？网格搜索、随机搜索和贝叶斯优化有什么区别？", "key": "网格穷举、随机采样、贝叶斯用代理模型挑下一组", "plain": "超参数是训练前要定好的设置，比如树的深度、学习率。调参就是找一组效果最好的设置。", "a": ["网格搜索穷举所有组合，维度一高就很慢。", "随机搜索在空间中随机采样，重要超参数少时比网格更高效。", "贝叶斯优化用高斯过程或 TPE 等代理模型拟合“超参数到效果”的关系，挑最有希望的点继续试，例如 Optuna。", "调参必须用验证集或交叉验证，测试集只在最后用一次。"], "terms": ["网格搜索", "随机搜索", "贝叶斯优化", "TPE", "Optuna"], "viz": "hpo", "tag": "高频", "id": "j72"}, {"topic": "特征工程与建模实践", "q": "异常检测有哪些常用方法？", "key": "统计阈值、孤立森林、局部离群因子、自编码器重建误差", "plain": "找出和大多数数据不一样的记录，比如欺诈交易。你做数据清洗时找异常值也用得到这些方法。", "a": ["统计方法用 3 倍标准差或箱线图的四分位距判断单个特征的异常。", "孤立森林随机切分特征空间，异常点更容易被很少几次切分孤立出来，路径越短越异常。", "局部离群因子比较一个点和邻居的密度，密度明显低于邻居就是离群点。", "自编码器用正常数据训练，重建误差大的样本视为异常。"], "terms": ["四分位距", "孤立森林", "局部离群因子", "自编码器"], "viz": "iforest", "tag": "高频", "id": "j73"}, {"topic": "特征工程与建模实践", "q": "PCA 是什么？在表格任务里怎么用？", "key": "找方差最大的正交方向，把数据投影到少数几个主成分上", "plain": "很多列之间高度相关时，可以把它们压缩成少数几个新的综合指标，尽量保留原来的信息。", "a": ["PCA 找到数据方差最大的方向作为第一主成分，再在与它正交的方向里找方差最大的，依次类推。", "计算上是对协方差矩阵做特征值分解，或对中心化数据做 SVD。", "用于降维、去相关和可视化，做之前要先标准化，否则量纲大的特征主导结果。", "主成分是原特征的线性组合，可解释性会变差。"], "terms": ["方差", "正交", "特征值分解", "SVD", "标准化"], "viz": "pca", "tag": "高频", "id": "j74"}, {"topic": "特征工程与建模实践", "q": "聚类算法 K-Means 怎么工作？有什么局限？", "key": "交替分配最近中心和更新中心，适合球状簇", "plain": "把客户按特征分成几群，每群一个中心，不断把客户分给最近的中心，再重新算中心的位置，直到不再变化。", "a": ["K-Means 先选 K 个初始中心，然后交替执行两步，把每个点分给最近的中心，再把中心更新为该簇的均值。", "目标是最小化簇内平方距离和，结果依赖初始化，K-Means++ 让初始中心尽量分散。", "局限是要预先指定 K，对尺度和异常值敏感，只适合大致球形、大小相近的簇。", "密度不均或形状复杂时可以用 DBSCAN 或高斯混合模型。"], "terms": ["K 个初始中心", "均值", "K-Means++", "DBSCAN", "高斯混合"], "viz": "kmeans", "tag": "高频", "id": "j75"}, {"topic": "可解释性", "q": "SHAP 值是什么？怎么理解？", "key": "把一次预测拆成基准值加上每个特征的贡献，来自博弈论的 Shapley 值", "plain": "模型给这个客户打了高风险分，原因是什么？SHAP 把预测分数拆开，告诉你收入拉低了多少、负债拉高了多少，所有贡献加起来正好等于预测值。", "a": ["Shapley 值来自合作博弈，衡量每个参与者在所有可能加入顺序下的平均边际贡献。", "SHAP 把特征当参与者，预测值等于基准值加上各特征 SHAP 值之和，满足可加性。", "TreeSHAP 利用树结构可以高效精确地计算树模型的 SHAP 值。", "要注意 SHAP 解释的是模型的行为，不代表因果关系，特征高度相关时贡献的分配也会受影响。"], "terms": ["Shapley", "边际贡献", "可加性", "TreeSHAP", "因果关系"], "viz": "shap", "tag": "必背", "id": "j76"}, {"topic": "可解释性", "q": "特征重要性有哪几种算法？各有什么问题？", "key": "分裂增益、分裂次数、置换重要性、SHAP，各有偏差", "plain": "树模型自带的特征重要性有好几种算法，结果可能不一样，要知道每种的含义。", "a": ["基于分裂增益的重要性统计每个特征带来的损失下降总和。基于分裂次数的统计被用来分裂的次数。", "这两种都偏向取值多的特征，并且在训练集上计算，可能反映过拟合。", "置换重要性在验证集上打乱某一列，看效果下降多少，更可靠但相关特征会互相掩盖。", "SHAP 的平均绝对值也常用作全局重要性。"], "terms": ["分裂增益", "分裂次数", "置换重要性", "SHAP"], "viz": "permimp", "tag": "高频", "id": "j77"}, {"topic": "可解释性", "q": "什么是单调约束？风控里为什么常用？", "key": "强制模型输出随某个特征单调变化，保证符合业务常识", "plain": "业务上，负债越高风险应该越大。如果模型学出来某一段负债越高风险反而越低，就很难向业务和监管解释。单调约束可以强制模型遵守这种方向。", "a": ["XGBoost、LightGBM 都支持对指定特征设置单调递增或单调递减约束。", "约束在分裂时检查，保证左右子节点的输出满足指定方向。", "代价是可能损失少量精度，换来稳定性和可解释性，也能减少对噪声的过拟合。"], "terms": ["单调递增", "单调递减", "可解释性", "稳定性"], "viz": "mono", "tag": "高频", "id": "j78"}, {"topic": "表格基础模型", "q": "TabPFN 除了分类和回归，还能做哪些任务？", "key": "密度估计、异常检测、数据生成、填补和提取嵌入", "plain": "TabPFN 本质上学到了“给定一张表，每个值大概是什么分布”。有了分布，就能判断哪行不正常、能按分布造新数据、能猜空格里的值。", "a": ["TabPFN v2 的论文展示了分类、回归之外的多种用法。", "密度估计，把每个特征依次当作预测目标，用链式法则组合出整行的似然，似然很低的样本可视为异常。", "数据生成，按特征顺序逐个从预测分布中采样，得到合成样本。", "缺失值填补，把缺失的列当作目标，用其余列预测。", "提取嵌入，取模型中间层的表示，供聚类或下游模型使用。"], "terms": ["密度估计", "链式法则", "异常", "数据生成", "嵌入"], "viz": "mask", "tag": "高频", "id": "j79"}, {"topic": "表格基础模型", "q": "为什么说表格基础模型在小数据上优势最大？", "key": "先验相当于强归纳偏置，样本少时比从零拟合更可靠", "plain": "样本很少时，从头训练的模型很容易记住噪声。表格基础模型在预训练里见过上亿张表，先验里已经包含了大量表格的规律，所以样本少时优势最明显。", "a": ["样本少时，传统模型的方差大，调参本身也会在验证集上过拟合。", "PFN 的预测近似先验下的后验预测分布，先验在数据少时起主导作用，提供了合理的归纳偏置。", "数据量变大以后，数据本身的信息越来越多，先验的作用减弱，调好的树模型和集成方法会追上来。", "所以面试中常说表格基础模型在中小规模数据上最强，大规模数据要结合检索、微调或换结构。"], "terms": ["方差", "后验预测分布", "归纳偏置", "先验"], "viz": "bayes", "tag": "高频", "id": "j80"}, {"topic": "表格基础模型", "q": "上下文学习的表格模型和 KNN 有什么相似和不同？", "key": "都在预测时直接参考训练样本，但前者的“相似度”是学出来的", "plain": "KNN 预测时找最像的几个邻居投票。TabPFN 预测时也使用训练样本，每个训练样本的权重由注意力计算，计算方式是在海量合成表上训练得到的。", "a": ["相同点是都不在目标数据上训练参数，预测时直接利用训练样本，都属于非参数风格的推断。", "不同点是 KNN 的距离是人为指定的，例如欧氏距离，对特征尺度和无信息特征敏感。", "TabPFN 通过多层注意力计算样本之间的关系，并且结合了特征之间的交互，相当于学到了依赖任务的相似度。", "检索增强的表格模型把两者结合，先用 KNN 找近邻，再交给 Transformer 做上下文推断。"], "terms": ["非参数", "欧氏距离", "注意力", "相似度", "检索增强"], "viz": "knn", "tag": "高频", "id": "j81"}, {"topic": "表格基础模型", "q": "关系型数据库上的基础模型和单表模型有什么不同？", "key": "多张表通过主外键连成图，需要沿关系聚合信息", "plain": "真实业务数据常分散在很多张表里，比如用户表、交易表、设备表，用编号互相关联。单表模型只能看一张表，关系型模型要沿着关联把多张表的信息合起来。", "a": ["传统做法是人工写 SQL 做连接和聚合，生成宽表后再建模。", "关系深度学习把每行当作节点、主外键关系当作边，构成异构图，用图神经网络或 Transformer 沿边聚合信息。", "关系型基础模型在多个数据库上预训练，目标是在新数据库上直接做预测，例如 KumoRFM 一类的工作。", "风控里的用户、交易、设备、商户天然是关系型数据，这个方向与业务关系密切。"], "terms": ["主外键", "宽表", "异构图", "图神经网络"], "viz": "relational", "tag": "高频", "id": "j82"}, {"topic": "树模型与 AutoML", "q": "GBDT 的常用超参数有哪些？怎么调？", "key": "先固定较小学习率用早停定树数，再调树结构，最后调采样和正则", "plain": "GBDT 的超参数可以分成三组，控制每棵树长多大、控制学多快学多少棵、控制随机性和惩罚。按顺序调，效率最高。", "a": ["学习率和树的数量相互制约，学习率小需要更多树，通常固定一个较小学习率，用验证集早停决定树的数量。", "树结构参数包括最大深度、LightGBM 的叶子数、每个叶子的最小样本数或最小 Hessian 和，控制模型复杂度。", "采样参数包括行采样比例和列采样比例，增加随机性，降低过拟合。", "正则参数包括叶子权重的 L1 和 L2 惩罚、分裂的最小增益。", "类别不平衡时还要调正样本权重。"], "terms": ["学习率", "早停", "叶子数", "行采样", "列采样", "L2"], "viz": "boostcurve", "tag": "必背", "id": "j83"}, {"topic": "树模型与 AutoML", "q": "随机森林的原理是什么？袋外误差怎么算？", "key": "对样本和特征都随机采样，训练很多棵深树后投票，没被抽到的样本用来估计误差", "plain": "随机森林训练很多棵树，每棵树只看一部分随机抽出来的样本和特征，最后大家投票。因为每棵树都有一些样本没见过，可以用这些样本直接估计误差，不用另外划验证集。", "a": ["每棵树用有放回抽样得到训练样本，每次分裂只在随机选的部分特征里找最优切分。", "两种随机性让各棵树的相关性降低，平均之后方差显著下降，这是 Bagging 降低方差的原理。", "每次有放回抽样，约有 36.8% 的样本没有被抽到，称为袋外样本。", "对每个样本，只用没见过它的树做预测，汇总得到袋外误差，近似于交叉验证误差。"], "terms": ["有放回抽样", "随机选的部分特征", "方差", "36.8%", "袋外误差"], "f": ["P(样本未被抽中) = (1 − 1/n)^n → 1/e ≈ 0.368"], "viz": "oob", "tag": "高频", "id": "j84"}, {"topic": "树模型与 AutoML", "q": "Bagging、Boosting 和 Stacking 有什么区别？", "key": "Bagging 并行降方差，Boosting 串行降偏差，Stacking 用模型组合模型", "plain": "三种都是把多个模型组合起来。Bagging 让很多模型各自独立学再平均，Boosting 让后一个模型专门修正前一个的错误，Stacking 再训练一个模型来决定怎么组合前面的模型。", "a": ["Bagging 在自助采样的数据上并行训练多个模型取平均，主要降低方差，代表是随机森林。", "Boosting 串行训练，每一轮拟合当前的残差或负梯度，主要降低偏差，代表是 GBDT。", "Stacking 用基模型的折外预测作为新特征训练元模型，必须用折外预测，否则元模型会学到基模型在训练集上的过拟合。", "Blending 用一个留出集代替折外预测，更简单但浪费数据。"], "terms": ["自助采样", "方差", "残差", "偏差", "折外预测", "元模型"], "cmp": {"head": ["方法", "训练方式", "主要降低", "代表"], "rows": [["Bagging", "并行，自助采样", "方差", "随机森林"], ["Boosting", "串行，拟合残差", "偏差", "XGBoost"], ["Stacking", "分层，折外预测", "组合误差", "AutoGluon"]]}, "viz": "bbs", "tag": "必背", "id": "j85"}, {"topic": "树模型与 AutoML", "q": "树模型能外推吗？这会带来什么问题？", "key": "叶子输出是训练样本的平均，超出训练范围时预测保持常数", "plain": "树模型预测时把样本分到某个叶子，输出叶子里训练样本的平均值。如果新样本的特征值比训练时见过的都大，它还是落在最边上的叶子里，预测不会继续增长。", "a": ["决策树的预测是分段常数函数，特征超出训练范围时落入边界叶子，输出不再变化。", "因此树模型不能外推趋势，例如随时间增长的销量或金额。", "常见处理是先对目标做差分或比例变换去掉趋势，或者让线性模型负责趋势、树模型拟合残差。", "LightGBM 也提供带线性叶子的选项，在叶子里拟合线性函数。"], "terms": ["分段常数", "边界叶子", "外推", "差分", "线性叶子"], "viz": "extrap", "tag": "高频", "id": "j86"}, {"topic": "树模型与 AutoML", "q": "GBDT 怎样做多分类？", "key": "每一轮为每个类别各建一棵树，用 softmax 交叉熵", "plain": "二分类时每轮建一棵树输出一个分数。多分类有 K 个类别，每轮就建 K 棵树，每个类别一个分数，再用 softmax 变成概率。", "a": ["K 分类时模型维护 K 个累计分数，每一轮共训练 K 棵树，每个类别一棵。", "分数经过 softmax 得到各类概率，损失是多分类交叉熵。", "每个类别的树拟合该类别分数的负梯度，也就是 one-hot 标签减去当前预测概率。", "所以训练成本约为二分类的 K 倍。"], "terms": ["K 棵树", "softmax", "交叉熵", "负梯度"], "viz": "gbmulti", "tag": "高频", "id": "j87"}, {"topic": "树模型与 AutoML", "q": "XGBoost 怎样寻找分裂点？", "key": "精确贪心枚举所有切分，近似算法只在加权分位点上找", "plain": "找分裂点就是决定按哪个特征、在哪个值上把样本分成两边。数据小时可以把所有可能的切分都试一遍，数据大时只在少数候选点上试。", "a": ["精确贪心算法对每个特征排序，枚举所有可能的切分点，计算分裂增益。", "近似算法先按分位数给每个特征提出候选切分点，只在候选点上计算增益。", "XGBoost 的分位数按二阶导数 h 加权，因为目标函数里 h 相当于样本权重，这就是加权分位数草图。", "数据按列预先排序存成块结构，便于并行计算各特征的增益。"], "terms": ["精确贪心", "候选切分点", "二阶导数", "加权分位数草图", "块结构"], "viz": "splitfind", "tag": "高频", "id": "j88"}, {"topic": "树模型与 AutoML", "q": "Boosting 为什么要用早停？怎么设置？", "key": "验证集指标连续若干轮不提升就停，防止树越加越过拟合", "plain": "Boosting 每加一棵树，训练误差都会下降，但到某个时候验证误差开始上升，说明开始记噪声了。早停就是在验证误差不再下降时停止。", "a": ["每加一轮就在验证集上计算指标，记录最佳轮数。", "如果连续若干轮没有提升，就停止训练，并回退到最佳轮数的模型。", "早停相当于把树的数量当作正则化参数自动选择。", "交叉验证时每折的最佳轮数不同，最终模型常用平均轮数在全量训练数据上重训。"], "terms": ["验证集", "最佳轮数", "正则化", "平均轮数"], "viz": "boostcurve", "tag": "高频", "id": "j89"}, {"topic": "表格深度学习与自监督", "q": "FT-Transformer 的结构是什么？", "key": "每个特征变成一个 token，加一个 CLS token，做特征之间的自注意力", "plain": "FT-Transformer 把一行里的每一个特征都变成一个向量，就像一句话里的每个词。然后用 Transformer 让这些特征互相参考，最后用一个专门的汇总向量做预测。", "a": ["特征分词器把数值特征乘以各自的可学习向量再加偏置，类别特征查嵌入表，每个特征得到一个 token。", "在序列前加一个 CLS token，经过多层 Transformer 后，用 CLS 的输出做预测。", "注意力在同一行的特征之间进行，计算量随特征数平方增长。", "它和 TabPFN 的区别是，FT-Transformer 在每个数据集上从头训练，注意力只在特征维度，不在样本维度。"], "terms": ["特征分词器", "CLS", "特征之间", "特征数平方", "从头训练"], "viz": "ftt", "tag": "高频", "id": "j90"}, {"topic": "表格深度学习与自监督", "q": "TabNet 怎样做特征选择？", "key": "多步决策，每一步用稀疏注意力掩码挑出要用的特征", "plain": "TabNet 分几步做决定，每一步只选用一部分特征。每一步选了哪些特征可以直接读出来，所以有一定的可解释性。", "a": ["TabNet 由多个决策步骤组成，每一步用注意力变换器生成一个特征掩码。", "掩码用 sparsemax 得到，大部分权重为 0，实现稀疏的特征选择。", "先验尺度项记录每个特征已经被用过多少，鼓励后续步骤选择不同的特征。", "把各步的掩码汇总，就得到每个样本的特征重要性。实践中它的效果通常不如调好的 GBDT。"], "terms": ["决策步骤", "特征掩码", "sparsemax", "先验尺度", "特征重要性"], "viz": "tabnet", "tag": "高频", "id": "j91"}, {"topic": "表格深度学习与自监督", "q": "表格 MLP 有哪些提升效果的技巧？", "key": "数值嵌入、批量集成、正则化和学习率调度", "plain": "普通 MLP 在表格上通常不如树模型，但加上几个技巧以后差距能明显缩小，甚至在一些数据集上超过树模型。", "a": ["数值特征用分段线性或周期嵌入，比直接输入原始数值效果好。", "集成能显著提升 MLP，TabM 用类似 BatchEnsemble 的方式在一个网络里共享大部分参数，同时训练多个成员。", "正则化包括 Dropout、权重衰减和早停，表格数据小，过拟合是主要风险。", "输入要做分位数变换或标准化，学习率配合预热和衰减。"], "terms": ["分段线性", "周期嵌入", "TabM", "BatchEnsemble", "Dropout"], "viz": "ensemble", "tag": "高频", "id": "j92"}, {"topic": "表格深度学习与自监督", "q": "自编码器和变分自编码器有什么区别？", "key": "AE 学一个压缩编码，VAE 学一个编码分布并能采样生成", "plain": "自编码器先把数据压缩成短向量，再还原回去。变分自编码器把压缩结果变成一个概率分布，这样可以从分布里随机抽样，生成新的数据。", "a": ["自编码器由编码器和解码器组成，最小化重建误差，中间的低维表示可用于降维和异常检测。", "VAE 的编码器输出均值和方差，从这个分布中采样隐变量再解码。", "损失是重建误差加上隐变量分布与标准正态分布的 KL 散度，二者合起来是证据下界 ELBO。", "重参数化技巧把采样写成 μ + σ·ε，让梯度能传回编码器。TVAE 是 VAE 在表格上的版本。"], "terms": ["重建误差", "均值和方差", "KL 散度", "ELBO", "重参数化"], "f": ["ELBO = E_q[ log p(x | z) ] − KL( q(z | x) ‖ p(z) )", "z = μ + σ ⊙ ε，ε ∼ N(0, I)"], "viz": "vae", "tag": "高频", "id": "j93"}, {"topic": "特征工程与建模实践", "q": "分层、分组和时间序列交叉验证分别什么时候用？", "key": "不平衡用分层，同实体多条用分组，有时间顺序用滚动", "plain": "普通 K 折随机切分，有时会出问题。类别很少时某折可能一个正样本都没有。同一客户的多条记录分在两边会泄漏。有时间顺序时用未来预测过去也不合理。", "a": ["分层交叉验证让每折的类别比例与总体一致，适合类别不平衡。", "分组交叉验证保证同一组的样本只出现在同一折，例如同一用户、同一设备。", "时间序列交叉验证按时间滚动或扩展窗口，训练集总在验证集之前，可以在两者之间留间隔防止标签重叠。", "风控场景常把分组和时间两种约束同时用上。"], "terms": ["分层", "分组", "扩展窗口", "间隔"], "viz": "cvsplit", "tag": "必背", "id": "j94"}, {"topic": "特征工程与建模实践", "q": "回归任务有哪些评价指标？各自适合什么情况？", "key": "MSE 惩罚大误差，MAE 对异常值稳健，R² 看解释了多少方差", "plain": "预测一个数值时，误差有不同的算法。平方误差特别讨厌大错，绝对误差对偶尔的离谱值不那么敏感，R² 是和“只猜平均值”相比好了多少。", "a": ["MSE 是误差平方的平均，对大误差惩罚重，对应高斯噪声假设，RMSE 是它的平方根，和目标同量纲。", "MAE 是绝对误差的平均，对异常值更稳健，最优点是条件中位数。", "R² 等于 1 减去残差平方和与总平方和之比，1 表示完美，0 表示和预测均值一样。", "MAPE 是相对误差，目标接近 0 时会失效。"], "terms": ["MSE", "RMSE", "MAE", "条件中位数", "R²", "MAPE"], "f": ["R² = 1 − SS_res / SS_tot", "SS_res = Σ (y_i − ŷ_i)²，SS_tot = Σ (y_i − ȳ)²"], "viz": "regmetric", "tag": "高频", "id": "j95"}, {"topic": "特征工程与建模实践", "q": "分位数回归是什么？有什么用？", "key": "用不对称的弹球损失预测条件分位数，给出预测区间", "plain": "普通回归预测的是平均值。分位数回归可以预测“90% 的情况下不会超过多少”，这样能给出一个区间，而不只是一个点。", "a": ["分位数回归最小化弹球损失，低估和高估的惩罚权重分别是 τ 和 1 − τ。", "τ 取 0.5 时等价于 MAE，预测条件中位数。", "同时预测 0.05 和 0.95 分位数，就得到 90% 的预测区间。", "GBDT 支持分位数损失，TabPFN 的回归输出整个分布，可以直接读出任意分位数。"], "terms": ["弹球损失", "τ", "条件中位数", "预测区间"], "f": ["L_τ(y, ŷ) = max( τ(y − ŷ), (τ − 1)(y − ŷ) )"], "viz": "pinball", "tag": "高频", "id": "j96"}, {"topic": "特征工程与建模实践", "q": "Focal Loss 是什么？和加权交叉熵有什么区别？", "key": "给容易样本降权，让训练集中在难样本上", "plain": "样本极度不平衡时，大量容易分对的负样本会主导训练。Focal Loss 让已经分得很好的样本损失变小，梯度就主要来自那些还分不清的样本。", "a": ["Focal Loss 在交叉熵前乘以 (1 − p_t) 的 γ 次方，p_t 是正确类别的预测概率。", "样本越容易，p_t 越接近 1，这一项越小，损失被压低。γ 越大，对容易样本的抑制越强。", "加权交叉熵按类别给固定权重，Focal Loss 按样本难度动态加权，两者可以同时使用。", "它最早用于目标检测里前景和背景极度不平衡的问题。"], "terms": ["(1 − p_t)", "γ", "难度", "加权交叉熵"], "f": ["FL(p_t) = − α_t (1 − p_t)^γ log p_t"], "viz": "focal", "tag": "高频", "id": "j97"}, {"topic": "特征工程与建模实践", "q": "逻辑回归为什么用交叉熵，不用均方误差？", "key": "交叉熵对应伯努利似然且关于参数是凸的，均方误差加 sigmoid 后非凸且梯度会消失", "plain": "逻辑回归输出的是概率。用交叉熵相当于在做最大似然估计，训练稳定。用均方误差的话，预测错得很离谱时梯度反而很小，训练很慢。", "a": ["逻辑回归假设标签服从伯努利分布，最大化似然等价于最小化交叉熵。", "交叉熵损失对参数是凸函数，梯度为 (p − y)·x，误差越大梯度越大。", "均方误差配合 sigmoid 后关于参数非凸，梯度里多一个 p(1 − p) 因子，预测接近 0 或 1 时梯度接近 0。", "所以分类问题一般用交叉熵。"], "terms": ["伯努利", "最大化似然", "凸函数", "(p − y)", "非凸"], "viz": "cemse", "tag": "高频", "id": "j98"}, {"topic": "特征工程与建模实践", "q": "KNN 的原理是什么？什么是维度灾难？", "key": "找最近的 K 个邻居投票，维度高时所有点的距离都差不多", "plain": "KNN 预测一个新样本时，找训练集里离它最近的 K 个样本，看它们大多是什么类别。特征太多时，任意两个点之间的距离都变得差不多，“最近”就没有意义了。", "a": ["KNN 不需要训练，预测时计算与所有训练样本的距离，取最近 K 个做投票或加权平均。", "K 小时方差大、容易受噪声影响，K 大时偏差大、边界变得平滑。", "维度灾难指维度升高后数据变得极其稀疏，最近距离与最远距离之比趋近于 1，距离失去区分力。", "使用前要标准化特征，并去掉无信息特征或降维。"], "terms": ["最近 K 个", "方差", "偏差", "维度灾难", "标准化"], "viz": "knn", "tag": "高频", "id": "j99"}, {"topic": "特征工程与建模实践", "q": "SVM 的核心思想是什么？核函数起什么作用？", "key": "找间隔最大的分类超平面，核函数把内积换成高维空间里的相似度", "plain": "SVM 要找一条分界线，让它离两边最近的样本都尽量远，这样更稳。数据在原空间里分不开时，用核函数把数据映射到更高的维度里，在那里可能就能分开。", "a": ["SVM 最大化分类超平面到最近样本的间隔，最近的那些样本叫支持向量，决定了超平面。", "软间隔允许部分样本越界，用合页损失加惩罚系数 C 控制，C 越大越不允许出错。", "对偶形式中只出现样本之间的内积，把内积替换成核函数，就等价于在高维空间里做线性分类。", "常用 RBF 核，样本量很大时计算成本高，所以在大规模表格上不如树模型常用。"], "terms": ["间隔", "支持向量", "合页损失", "核函数", "RBF"], "viz": "svm", "tag": "高频", "id": "j100"}, {"topic": "特征工程与建模实践", "q": "EM 算法是什么？和缺失值有什么关系？", "key": "含隐变量时交替做期望和最大化，缺失值就是一种隐变量", "plain": "有些量看不到，比如每个点属于哪一群，或者表格里缺的值。EM 先根据当前参数猜这些看不到的量，再根据猜测更新参数，反复交替直到稳定。", "a": ["E 步在当前参数下计算隐变量的后验分布，得到完整数据对数似然的期望。", "M 步最大化这个期望，更新参数。", "每次迭代观测数据的似然都不下降，但可能收敛到局部最优。", "高斯混合模型的聚类用 EM 求解。缺失值也可看作隐变量，在 MAR 假设下用 EM 估计参数并做填补。"], "terms": ["E 步", "M 步", "局部最优", "高斯混合模型", "MAR"], "viz": "gmm", "tag": "高频", "id": "j101"}, {"topic": "评测", "q": "多个模型在多个数据集上比较时，怎样做统计检验？", "key": "先用 Friedman 检验是否有差异，再用 Nemenyi 画临界差图，两两比较用 Wilcoxon", "plain": "在 20 个数据集上比较 5 个模型，不能只看平均分。要检验“排名的差异是不是偶然”。临界差图把模型按平均排名排好，差距小于临界值的用横线连起来，表示没有显著差别。", "a": ["Friedman 检验在每个数据集上给模型排名，检验各模型平均排名是否相同。", "如果拒绝原假设，再用 Nemenyi 事后检验计算临界差，平均排名之差超过临界差才算显著。", "结果画成临界差图，平均排名差距小于临界差的模型之间用横线连接。", "只比较两个模型时，可以对各数据集上的差值做 Wilcoxon 符号秩检验，它不要求差值服从正态分布。"], "terms": ["Friedman", "Nemenyi", "临界差", "Wilcoxon", "平均排名"], "viz": "cdplot", "tag": "必背", "id": "j102"}, {"topic": "评测", "q": "表格基准里常用的汇总方式有哪些？Elo 是怎么算的？", "key": "平均排名、归一化得分、胜率和 Elo，各有偏差", "plain": "不同数据集的指标不能直接平均，比如一个任务的 AUC 是 0.99，另一个是 0.7。所以要把每个数据集上的结果先转换成可比的形式，再汇总。", "a": ["平均排名在每个数据集上排序后取平均，简单但忽略差距大小。", "归一化得分把每个数据集上的指标按最好和最差模型线性缩放到 0 到 1，再取平均。", "胜率统计两两对比中赢的比例。", "Elo 把每个数据集上的两两比较当作一场比赛，按预期胜率和实际结果更新分数，分差 400 对应约 10 比 1 的预期胜率，TabArena 使用这种方式。"], "terms": ["平均排名", "归一化得分", "胜率", "Elo", "400"], "f": ["E_A = 1 / (1 + 10^{(R_B − R_A) / 400})", "R_A ← R_A + K (S_A − E_A)"], "tag": "高频", "id": "j103"}, {"topic": "统计与因果", "q": "假设检验的基本逻辑是什么？p 值怎么理解？", "key": "假设原假设成立，看观测到这么极端结果的概率", "plain": "假设检验像反证法。先假设“没有差别”，如果在这个假设下看到现在这样的数据非常不可能，就推翻这个假设。p 值就是这个“不可能”的程度。", "a": ["先提出原假设，通常是没有差异或没有效果，再选择检验统计量。", "p 值是在原假设成立时，得到至少和观测值一样极端的统计量的概率。", "p 值小于显著性水平 α 时拒绝原假设。p 值不是原假设为真的概率，也不衡量效应大小。", "第一类错误是原假设为真却拒绝了，概率为 α。第二类错误是原假设为假却没拒绝，1 减去它是检验功效。"], "terms": ["原假设", "p 值", "显著性水平", "第一类错误", "第二类错误", "功效"], "viz": "pvalue", "tag": "必背", "id": "j104"}, {"topic": "统计与因果", "q": "t 检验、卡方检验分别用在什么场景？", "key": "t 检验比均值，卡方检验比频数和独立性", "plain": "比较两组的平均值有没有差别用 t 检验，比如两个模型的平均误差。比较两个类别变量有没有关系用卡方检验，比如性别和是否违约有没有关联。", "a": ["单样本 t 检验比较均值与给定值，独立双样本 t 检验比较两组均值。", "配对 t 检验用于同一批对象的前后测量，或者两个模型在同一批数据上的结果，对差值做检验，更灵敏。", "卡方检验比较观测频数与期望频数，用于检验两个类别变量是否独立，也用于卡方分箱。", "数据明显不服从正态分布时，用 Mann-Whitney U 或 Wilcoxon 等非参数检验。"], "terms": ["t 检验", "配对 t 检验", "卡方检验", "独立", "非参数检验"], "f": ["χ² = Σ (O − E)² / E"], "tag": "高频", "id": "j105"}, {"topic": "统计与因果", "q": "多重比较问题是什么？怎么校正？", "key": "检验次数多了总会碰到假阳性，用 Bonferroni 或 BH 校正", "plain": "做一次检验有 5% 的概率误判。如果同时检验 20 个指标，至少有一个误判的概率就很高了。所以检验次数多时要把门槛定得更严。", "a": ["每次检验的显著性水平为 α，做 m 次独立检验，至少一次假阳性的概率是 1 − (1 − α)^m。", "Bonferroni 校正把每次的阈值设为 α 除以 m，控制族错误率，偏保守。", "Benjamini-Hochberg 方法控制错误发现率，把 p 值排序后与逐步放宽的阈值比较，功效更高。", "在很多特征中筛选显著特征、在很多数据集上比较模型时都会遇到这个问题。"], "terms": ["假阳性", "Bonferroni", "族错误率", "Benjamini-Hochberg", "错误发现率"], "tag": "高频", "id": "j106"}, {"topic": "统计与因果", "q": "A/B 测试怎么设计？要注意什么？", "key": "随机分流，事先算样本量，看显著性也看实际效果", "plain": "想知道新策略是不是比旧策略好，就随机把用户分成两组，一组用新的、一组用旧的，比较结果。要事先算好需要多少用户，测完再做统计检验。", "a": ["确定核心指标和最小可检测效应，根据显著性水平和功效计算每组所需样本量。", "按用户随机分流，保证两组可比，检查实际分流比例是否和设计一致，称为样本比例不匹配检查。", "实验期间不要反复查看结果并在显著时提前停止，这样会抬高假阳性率，需要时用序贯检验。", "除统计显著性，还要看效应大小和业务意义。风控策略的坏账有表现期，实验周期要覆盖这段时间。"], "terms": ["最小可检测效应", "样本量", "随机分流", "样本比例不匹配", "序贯检验", "表现期"], "tag": "高频", "id": "j107"}, {"topic": "统计与因果", "q": "中心极限定理和大数定律分别说了什么？", "key": "大数定律说样本均值收敛到期望，中心极限定理说均值的分布近似正态", "plain": "抽的样本越多，平均值越接近真实的平均值，这是大数定律。并且不管原来的数据是什么分布，样本平均值的分布都接近正态分布，这是中心极限定理。", "a": ["大数定律指独立同分布的样本均值随样本量增大收敛到总体期望。", "中心极限定理指样本均值减去期望、再除以标准误后，分布趋近标准正态分布，标准误为 σ 除以根号 n。", "这是很多检验和置信区间使用正态近似的依据。", "要求独立同分布和方差有限，重尾分布下收敛很慢。"], "terms": ["大数定律", "中心极限定理", "标准误", "正态近似", "方差有限"], "f": ["(X̄ − μ) / (σ / √n) → N(0, 1)"], "tag": "高频", "id": "j108"}, {"topic": "统计与因果", "q": "风控建模中常用的概率分布有哪些？", "key": "伯努利管违约，泊松管次数，对数正态管金额，指数管等待时间", "plain": "不同的量适合用不同的分布描述。是否违约只有两种结果，一段时间内的交易次数是计数，交易金额通常有很长的右尾。", "a": ["伯努利分布描述一次是否违约，二项分布描述 n 次中违约的次数。", "泊松分布描述固定时间内事件发生的次数，均值等于方差。", "金额类变量常呈右偏，近似对数正态分布，建模前常做对数变换。", "指数分布描述事件之间的等待时间，具有无记忆性，生存分析里用来描述违约时间。"], "terms": ["伯努利", "泊松", "对数正态", "指数分布
