", "生存分析"], "tag": "高频", "id": "j109"}, {"topic": "统计与因果", "q": "Pearson 相关和 Spearman 相关有什么区别？", "key": "Pearson 衡量线性关系，Spearman 衡量单调关系", "plain": "两个变量一起变大，相关系数就高。Pearson 只认直线关系，Spearman 只看排名，只要一个变大另一个也变大就行，对异常值也更稳。", "a": ["Pearson 相关系数是协方差除以两个标准差的乘积，衡量线性相关，对异常值敏感。", "Spearman 相关先把数据转成排名，再计算排名的 Pearson 相关，衡量单调关系。", "相关系数为 0 只说明没有线性或单调关系，不代表独立。", "相关不等于因果，特征之间高度相关会导致线性模型系数不稳定，称为多重共线性。"], "terms": ["线性", "排名", "单调", "多重共线性"], "tag": "高频", "id": "j110"}, {"topic": "统计与因果", "q": "倾向分方法和双重差分怎样估计因果效应？", "key": "倾向分平衡可观测混杂，双重差分用前后两次差值抵消不随时间变的差异", "plain": "没法做随机实验时，要从历史数据里估计效果。倾向分方法把条件相似的人放在一起比较。双重差分比较两组在政策前后的变化量，抵消两组原本的差异。", "a": ["倾向分是给定协变量时接受处理的概率，按倾向分匹配或加权后，两组在协变量上近似平衡。", "它只能处理观测到的混杂，需要满足可忽略性假设和重叠假设。", "双重差分用处理组前后变化减去对照组前后变化，要求平行趋势假设，即没有处理时两组的趋势相同。", "风控中评估提额、降息等策略的效果时常用这些方法。"], "terms": ["倾向分", "可忽略性", "重叠", "双重差分", "平行趋势"], "tag": "高频", "id": "j111"}, {"topic": "统计与因果", "q": "什么是 uplift 模型？和普通响应模型有什么区别？", "key": "预测干预带来的增量，而不是预测会不会响应", "plain": "普通模型预测“这个人会不会买”。uplift 模型预测“给这个人发券，他买的可能性会增加多少”。有些人不发券也会买，给他们发券就浪费了。", "a": ["uplift 是个体处理效应的估计，等于接受干预和不接受干预时结果的差。", "常见做法有双模型法，分别在处理组和对照组建模再相减，以及单模型把处理标记当作特征。", "还可以用因果森林等方法直接估计异质性处理效应。", "评价用 uplift 曲线或 Qini 曲线，训练数据最好来自随机实验。"], "terms": ["个体处理效应", "双模型法", "因果森林", "异质性处理效应", "Qini"], "tag": "高频", "id": "j112"}, {"topic": "风控与业务", "q": "信用评分卡的完整建模流程是什么？", "key": "定义样本，分箱算 WOE，逻辑回归，转成分数，上线监控", "plain": "评分卡是银行最经典的风控模型，最后给每个人一个分数，分数越高越安全。从数据准备到上线，每一步都有固定的做法。", "a": ["定义观察期、表现期和好坏标签，划分开发样本和时间外样本。", "对变量做分箱，计算每箱的 WOE 和变量的 IV，按 IV 和业务含义筛选变量，并检查箱的单调性。", "用 WOE 值替换原始值，训练逻辑回归，检查系数符号与共线性。", "把对数几率线性转换成分数，按 PDO 确定刻度，每个变量的每箱对应一个分值。", "上线后监控 PSI、KS 和各分数段坏账率。"], "terms": ["观察期", "表现期", "WOE", "IV", "逻辑回归", "PDO"], "viz": "scorecard", "tag": "必背", "id": "j113"}, {"topic": "风控与业务", "q": "评分卡的分数怎么从概率换算过来？PDO 是什么？", "key": "分数等于 A 减 B 乘以对数几率，几率翻倍分数变化 PDO", "plain": "模型输出的是违约概率，业务上更习惯看分数。约定一个基准，比如几率为 1 比 50 时 600 分，每当坏好比翻一倍分数就减少 20 分，这个 20 就是 PDO。", "a": ["几率 odds 定义为坏样本概率与好样本概率之比，逻辑回归的线性部分就是对数几率。", "分数为 A 减去 B 乘以对数几率，B 等于 PDO 除以 ln 2。", "A 由基准分和基准几率确定，例如基准几率下对应 600 分。", "因为逻辑回归是线性的，总分可以拆成每个变量每个箱的分值之和，便于解释和人工审查。"], "terms": ["几率", "对数几率", "PDO", "ln 2", "基准分"], "f": ["Score = A − B · ln(odds)", "B = PDO / (ln 2)，A = Score₀ + B · ln(odds₀)"], "viz": "scorecard", "tag": "高频", "id": "j114"}, {"topic": "风控与业务", "q": "什么是观察期、表现期、Vintage 分析和滚动率？", "key": "观察期取特征，表现期定标签，Vintage 看同批放款的坏账成熟曲线，滚动率看逾期状态转移", "plain": "风控的标签要等一段时间才知道。比如借款后要观察几个月才知道会不会逾期。Vintage 和滚动率就是用来决定要等多久、多严重的逾期算“坏”的工具。", "a": ["观察期是取特征的时间窗口，表现期是观察是否违约的时间窗口，两者以申请时点为界。", "Vintage 分析把同一个月放款的贷款作为一批，跟踪各批在放款后第几个月的累计坏账率，曲线趋平的时间点用来确定表现期长度。", "滚动率分析统计逾期状态之间的转移比例，例如逾期 30 天的客户有多少比例会滚到逾期 60 天，用来确定坏样本的定义。", "标签定义直接影响模型，所以要先做这些分析。"], "terms": ["观察期", "表现期", "Vintage", "累计坏账率", "滚动率"], "tag": "高频", "id": "j115"}, {"topic": "风控与业务", "q": "Lift 和 Gini 系数是什么？", "key": "Lift 看前若干分数段比随机好几倍，Gini 等于 2 倍 AUC 减 1", "plain": "把客户按模型分数从高风险到低风险排好，如果最前面 10% 里抓到的坏人比例是平均水平的 3 倍，Lift 就是 3。Gini 是衡量整体排序能力的另一种写法。", "a": ["Lift 是模型选出的前一部分样本中坏样本比例，除以整体坏样本比例。", "累计增益曲线画出按分数排序后，覆盖样本比例与捕获坏样本比例的关系。", "Gini 系数等于 2 乘以 AUC 减去 1，取值从 0 到 1，0 相当于随机排序。", "KS、AUC、Gini 都衡量排序能力，Lift 更贴近按比例拒绝的业务策略。"], "terms": ["Lift", "累计增益曲线", "Gini", "2 乘以 AUC 减去 1"], "f": ["Gini = 2 · AUC − 1", "Lift@k = (前 k 中坏样本比例) / (整体坏样本比例)"], "tag": "高频", "id": "j116"}, {"topic": "风控与业务", "q": "模型分数怎样转成审批策略？", "key": "按通过率和坏账率的权衡选切分点，分段制定策略", "plain": "模型只给分数，最终要决定批不批、批多少额度。分数线定高了，通过的人少但更安全，定低了通过的多但坏账高。要在两者之间找业务能接受的平衡。", "a": ["把分数分段，统计每段的样本数、坏账率和累计通过率，得到通过率与坏账率的对应关系。", "根据风险容忍度和收益模型选择切分点，例如在坏账率不超过目标值的前提下最大化通过率。", "中间分数段可以转人工审核或降额度，形成分层策略。", "新模型替换旧模型时，分析换入换出的客群，用冠军挑战者实验验证效果。"], "terms": ["切分点", "通过率", "坏账率", "人工审核", "冠军挑战者"], "tag": "高频", "id": "j117"}, {"topic": "风控与业务", "q": "什么是换入换出分析和冠军挑战者实验？", "key": "比较新旧模型拒绝的人群差异，小流量对照验证新模型", "plain": "换了新模型以后，有些旧模型拒掉的人被新模型接受了，叫换入，有些旧模型接受的人被拒了，叫换出。要分析这两群人的风险，判断新模型是不是真的更好。", "a": ["在相同通过率下比较新旧模型，统计换入和换出客群的规模和风险表现。", "换出客群的坏账率可以观察到，换入客群原来被拒，没有表现数据，需要用拒绝推断或小流量放款估计。", "冠军挑战者实验让新模型在一部分流量上运行，与现有模型对比坏账率和通过率。", "验证通过后再逐步扩大流量。"], "terms": ["换入", "换出", "拒绝推断", "冠军挑战者"], "tag": "高频", "id": "j118"}, {"topic": "风控与业务", "q": "模型上线后要监控什么？发现漂移怎么办？", "key": "监控输入分布、分数分布和效果指标，按原因决定重训或调整", "plain": "模型上线后数据会变，比如经济环境变化或者获客渠道变化。要持续检查输入的数据、模型的分数和最终的坏账情况，发现变化及时处理。", "a": ["输入层监控特征的缺失率、取值范围和 CSI，分数层监控分数分布的 PSI。", "效果层在标签成熟后按月计算 KS、AUC 和各分数段坏账率，标签成熟前可以用短期逾期指标做早期预警。", "漂移分为协变量漂移、先验漂移和概念漂移，分别对应特征分布、坏样本比例和特征与标签关系的变化。", "处理方式包括重新校准分数、调整策略切分点，以及用新数据重训模型。"], "terms": ["CSI", "PSI", "标签成熟", "协变量漂移", "先验漂移", "概念漂移"], "viz": "psi", "tag": "高频", "id": "j119"}, {"topic": "风控与业务", "q": "反欺诈建模和信用风险建模有什么不同？", "key": "欺诈有对抗、标签稀缺且滞后，更依赖实时特征、规则和关系网络", "plain": "信用风险看的是“有没有能力和意愿还钱”，欺诈看的是“是不是一开始就想骗”。骗子会不断换手法，所以反欺诈更需要实时、更需要看人和人之间的关联。", "a": ["信用风险的标签来自还款表现，相对稳定，评分卡和 GBDT 是主流。", "欺诈样本极少，标签依赖调查确认，有明显滞后，欺诈方会针对模型调整手法，属于对抗环境。", "反欺诈更依赖实时行为特征、设备指纹、规则引擎和无监督的异常检测。", "团伙欺诈通过共享设备、手机号、地址关联，常用关系图、社区发现和图神经网络识别。"], "terms": ["对抗", "滞后", "设备指纹", "规则引擎", "团伙", "社区发现"], "tag": "高频", "id": "j120"}, {"topic": "风控与业务", "q": "风控里常见的特征有哪些？怎样批量衍生？", "key": "按时间窗口、统计函数和维度交叉批量生成", "plain": "风控特征大多来自用户的历史行为，比如最近 7 天借了几次、最近 30 天逾期金额是多少。把时间窗口、统计方式和维度组合起来，就能批量生成很多特征。", "a": ["基础信息包括年龄、职业、收入，以及征信报告里的账户数、查询次数、逾期记录。", "行为特征按时间窗口统计，例如近 7 天、30 天、90 天的申请次数、交易金额、逾期天数。", "统计函数包括次数、求和、均值、最大值、占比、趋势，再和渠道、商户类型等维度交叉。", "衍生之后用 IV、PSI 和相关性筛选，并检查每个特征的取数时点，避免样本穿越。"], "terms": ["征信", "时间窗口", "统计函数", "维度交叉", "样本穿越"], "viz": "featgen", "tag": "高频", "id": "j121"}, {"topic": "训练推理与 Scaling", "q": "梯度累积和激活重计算分别解决什么问题？", "key": "梯度累积用多次小批模拟大批，激活重计算用算力换显存", "plain": "显存不够时有两个常用办法。一个是把大批次拆成几个小批次，算完梯度先攒起来再一起更新。另一个是前向时不保存中间结果，反向需要时再算一遍。", "a": ["梯度累积把一个大批次拆成若干微批次，依次前向和反向，梯度累加后再更新一次参数，等效批大小是微批大小乘以累积步数。", "它不减少单步计算量，只降低峰值显存。用 BatchNorm 时统计量仍按微批计算，结果与真正的大批次不同。", "激活重计算只保存部分层的输入，反向时重新执行前向得到激活，显存从随层数线性增长降到约平方根级别，代价是多约三分之一的前向计算。", "两者常和混合精度、ZeRO 一起使用。"], "terms": ["微批次", "等效批大小", "峰值显存", "BatchNorm", "激活重计算"], "tag": "高频", "id": "j122"}, {"topic": "训练推理与 Scaling", "q": "MFU 是什么？怎么估算？", "key": "实际达到的模型浮点运算吞吐占硬件峰值的比例", "plain": "GPU 有一个理论上的最高算力。MFU 衡量训练时实际用上了多少，比如 40% 表示只用了理论算力的四成，剩下的时间花在等数据、等通信上。", "a": ["MFU 等于每秒处理的 token 数乘以每个 token 的训练计算量，再除以硬件峰值浮点运算能力。", "Transformer 训练每个 token 的计算量约为 6N，N 是参数量，前向 2N，反向 4N。", "大模型训练的 MFU 通常在 30% 到 50% 之间，损失主要来自通信、内存带宽和流水线气泡。", "提升方法包括更大的批、算子融合、FlashAttention、计算与通信重叠。"], "terms": ["6N", "峰值浮点运算", "通信", "流水线气泡", "算子融合"], "f": ["MFU = (每秒 token 数 × 6N) / (峰值 FLOPS)"], "tag": "高频", "id": "j123"}, {"topic": "训练推理与 Scaling", "q": "训练中出现损失尖峰怎么处理？", "key": "降低学习率、加强梯度裁剪、跳过坏批次，检查数据和数值稳定性", "plain": "训练大模型时，损失有时突然跳高，严重时会发散。原因可能是学习率太高、某批数据异常，或者数值溢出。", "a": ["先检查是否有异常数据，例如重复、乱码或极端数值，必要时跳过对应批次。", "从尖峰之前的检查点恢复，降低学习率或延长预热。", "使用梯度裁剪，监控梯度范数和各层激活的数值范围。", "结构上可以用 Pre-Norm、QK-Norm 和 z-loss 稳定注意力和输出 logits，bf16 比 fp16 更不容易溢出。"], "terms": ["异常数据", "检查点", "预热", "梯度裁剪", "QK-Norm", "z-loss"], "tag": "高频", "id": "j124"}, {"topic": "训练推理与 Scaling", "q": "量化的粒度和对称方式有哪些？", "key": "按张量、按通道、按组量化，对称量化零点为 0，非对称多一个零点", "plain": "量化是把 32 位或 16 位的小数换成 8 位或 4 位的整数，以节省显存和加速。粒度越细，误差越小，但要存的缩放系数越多。", "a": ["量化公式是把浮点数除以缩放系数、四舍五入后截断到整数范围，反量化时乘回缩放系数。", "对称量化零点固定为 0，适合以 0 为中心的权重。非对称量化额外存一个零点，适合激活等偏移分布。", "按张量量化整个张量共用一个缩放系数，按通道量化每个输出通道一个，按组量化每若干个元素一个，4 比特量化通常按组进行。", "激活里常有离群值，权重量化比激活量化容易，所以常见 W4A16 和 W8A8 等配置。"], "terms": ["缩放系数", "零点", "按通道", "按组", "离群值"], "f": ["q = clip( round(x / s) + z, q_min, q_max )", "x̂ = s · (q − z)"], "viz": "quant", "tag": "高频", "id": "j125"}, {"topic": "训练推理与 Scaling", "q": "MoE 模型的参数量和计算量怎么理解？", "key": "总参数大，每个 token 只激活少数专家，所以计算量取决于激活参数", "plain": "混合专家模型里有很多个“专家”子网络，但每个词只交给其中两三个处理。所以模型总参数可以很大，每次计算用到的参数却不多。", "a": ["MoE 把 FFN 换成多个专家和一个路由器，每个 token 由路由器选出 top-k 个专家。", "总参数量包括所有专家，决定显存需求。激活参数量只算被选中的专家，决定每个 token 的计算量。", "因此相同计算量下 MoE 能放更多参数，但需要专家并行，通信和负载均衡是主要难点。", "推理时所有专家都要放在显存里，小批量时内存带宽利用率低。"], "terms": ["路由器", "top-k", "总参数量", "激活参数量", "专家并行"], "viz": "moe", "tag": "高频", "id": "j126"}, {"topic": "训练推理与 Scaling", "q": "数据有限时 Scaling Law 有什么变化？", "key": "重复数据的边际价值递减，约 4 轮以内接近新数据", "plain": "模型越大越需要更多数据，但高质量数据会用完。研究发现同一批数据重复用几轮还行，重复太多次收益就快速下降。", "a": ["数据受限的 Scaling 研究发现，同一数据重复约 4 个 epoch 以内，效果接近使用等量的新数据。", "重复次数继续增加，额外计算的收益迅速下降。", "因此数据不足时，可以增加数据多样性、使用合成数据，或者把计算转移到更大的模型和更长的推理上。", "表格基础模型用合成先验生成数据，数据量不受限，瓶颈转移到先验的覆盖面和训练算力。"], "terms": ["4 个 epoch", "多样性", "合成数据", "先验"], "tag": "高频", "id": "j127"}, {"topic": "检索与时间序列", "q": "向量检索的近似最近邻算法有哪些？", "key": "HNSW 走分层图，IVF 先聚类再查少数簇，PQ 压缩向量", "plain": "从上亿条向量里找最相似的几条，逐个比较太慢。近似算法用一点精度换大量速度，常见的做法是建图、分簇和压缩。", "a": ["HNSW 构建多层近邻图，上层稀疏用于快速定位，下层稠密用于精细搜索，召回率高但内存占用大。", "IVF 先用 K-Means 把向量分成若干簇，查询时只搜索最近的几个簇。", "PQ 乘积量化把向量切成几段，每段用码本中最近的中心编号表示，大幅压缩存储并加速距离计算。", "FAISS 等库常组合使用 IVF 和 PQ。评估指标是召回率和查询延迟的权衡。"], "terms": ["HNSW", "IVF", "K-Means", "乘积量化", "召回率"], "tag": "高频", "id": "j128"}, {"topic": "检索与时间序列", "q": "时间序列的平稳性是什么？ARIMA 怎么建模？", "key": "均值方差和自相关不随时间变化，ARIMA 先差分到平稳再用自回归和移动平均", "plain": "平稳就是时间序列的统计规律不随时间变化。很多经典方法要求平稳，所以先用差分去掉趋势，再用过去的值和过去的误差来预测。", "a": ["平稳序列的均值、方差和自协方差不随时间变化，可用 ADF 检验判断。", "ARIMA(p, d, q) 中 d 是差分次数，用于去掉趋势，使序列平稳。", "AR 部分用过去 p 个值做线性回归，MA 部分用过去 q 个预测误差。", "阶数可参考自相关图和偏自相关图，或按 AIC 选择。有季节性时用 SARIMA。"], "terms": ["平稳", "ADF", "差分", "AR", "MA", "AIC"], "tag": "高频", "id": "j129"}, {"topic": "检索与时间序列", "q": "时间序列特征工程和建模要注意什么？", "key": "滞后、滚动窗口、日历特征，只用预测时刻之前的数据", "plain": "用树模型做时间序列预测时，要把时间序列改造成表格。关键是每一行的特征只能用这个时间点之前能看到的数据。", "a": ["滞后特征取过去若干期的值，滚动窗口特征计算过去一段时间的均值、方差、最大值。", "日历特征包括星期、月份、节假日，周期性可以用正弦余弦编码。", "所有特征只能使用预测时刻之前的数据，滚动统计要先移位再计算，否则会泄漏当期标签。", "多步预测可以递归预测，也可以对每个预测步长单独建模。"], "terms": ["滞后", "滚动窗口", "日历特征", "移位", "多步预测"], "viz": "ts2tab", "tag": "高频", "id": "j130"}, {"topic": "检索与时间序列", "q": "时间序列基础模型有哪些？思路是什么？", "key": "在大量序列上预训练，零样本预测新序列", "plain": "和表格基础模型类似，时间序列基础模型在海量不同的时间序列上训练，拿到一条新序列时不用训练就能直接预测未来。", "a": ["Chronos 把序列值缩放并量化成离散 token，用语言模型结构做下一个 token 预测，输出概率分布。", "TimesFM 把序列切成片段作为 token，用仅解码器的 Transformer 预测后续片段。", "Moirai 支持多变量和不同采样频率。", "训练数据包括真实序列和合成序列，评测重点是零样本预测和概率预测的质量。"], "terms": ["Chronos", "量化", "TimesFM", "片段", "Moirai", "零样本"], "tag": "高频", "id": "j131"}, {"topic": "缺失值与数据合成", "q": "合成数据有哪些隐私风险？怎么评估和防护？", "key": "生成模型可能记住并复现真实记录，用最近距离和成员推断评估，用差分隐私防护", "plain": "用真实数据训练出来的生成模型，有可能把训练数据里的某些记录几乎原样生成出来，这样就泄露了隐私。", "a": ["DCR 计算每条合成记录到最近真实记录的距离，距离过小说明可能复制了训练数据。", "成员推断攻击判断某条记录是否在训练集中，攻击成功率越高，隐私风险越大。", "差分隐私在训练中裁剪单样本梯度并加噪声，例如 DP-SGD，给出可证明的隐私保证，代价是数据质量下降。", "金融数据涉及个人信息，合成数据对外使用前要做这些评估。"], "terms": ["DCR", "成员推断", "差分隐私", "DP-SGD"], "viz": "dcr", "tag": "高频", "id": "j132"}, {"topic": "缺失值与数据合成", "q": "Flow Matching 和扩散模型有什么关系？", "key": "都把噪声变成数据，Flow Matching 直接回归从噪声到数据的速度场", "plain": "扩散模型通过一步步去噪把随机噪声变成数据。Flow Matching 换了个思路，直接学一个“速度”，告诉每个点该往哪个方向移动，沿着直线路径从噪声走到数据。", "a": ["扩散模型定义逐步加噪的前向过程，训练网络预测噪声，采样时逐步去噪。", "Flow Matching 在噪声和数据之间定义插值路径，例如直线 x_t = (1 − t)·x₀ + t·x₁，训练网络回归路径上的速度 x₁ − x₀。", "采样时从噪声出发，用常微分方程求解器沿速度场积分到数据。", "直线路径让采样步数更少，扩散模型在特定参数化下也可以看作一种流。"], "terms": ["加噪", "插值路径", "速度", "常微分方程"], "f": ["x_t = (1 − t) · x₀ + t · x₁", "L = E ‖ v_θ(x_t, t) − (x₁ − x₀) ‖²"], "viz": "flowmatch", "tag": "高频", "id": "j133"}, {"topic": "表格基础模型", "q": "TabPFN v2 对列的顺序不敏感，那它怎样区分不同的列？", "key": "给每一列加一个随机的列嵌入，既能区分列，又不依赖列的位置", "plain": "如果模型把所有列一视同仁，两列数值分布一样时它就分不清谁是谁。TabPFN v2 给每一列附上一个随机生成的标识向量，用来区分列，这个标识和列排在第几位无关。", "a": ["表格的列没有天然顺序，所以不使用语言模型那样的位置编码，结构上对列的排列保持等变。", "完全等变会带来一个问题，分布相似的两列得到几乎相同的表示，模型难以区分。", "TabPFN v2 给每一列加上随机采样的列嵌入，用来打破这种对称，同时不引入对列位置的依赖。", "推理时再配合打乱列顺序的集成，进一步降低对输入顺序的敏感性。"], "terms": ["位置编码", "等变", "随机采样的列嵌入", "对称", "集成"], "viz": "perm", "tag": "高频", "id": "j134"}, {"topic": "表格基础模型", "q": "怎样把 TabPFN 蒸馏成树模型或 MLP？", "key": "用教师模型给大量样本打软标签，学生模型拟合这些软标签", "plain": "TabPFN 预测准但慢，树模型和小网络快但需要大量数据才准。蒸馏就是让 TabPFN 当老师，给很多样本打出概率，再让快的小模型去学这些概率。", "a": ["以训练集作为上下文，让 TabPFN 对训练样本和额外生成的样本输出预测概率。", "额外样本可以通过对训练样本加噪声、在特征之间插值或从生成模型采样得到，用来扩大学生模型的训练集。", "学生模型以这些软标签为目标训练，分类用交叉熵或 KL 散度，回归用均方误差。", "软标签携带类别之间的相对概率信息，比原始硬标签更平滑，学生模型可以用较少的真实数据学到接近教师的决策边界。", "上线后只部署学生模型，延迟满足毫秒级要求。"], "terms": ["软标签", "加噪声", "插值", "KL 散度", "决策边界"], "viz": "distill", "tag": "高频", "id": "j135"}, {"topic": "表格基础模型", "q": "什么是置换不变的集合函数？Deep Sets 和 Set Transformer 是什么？", "key": "输入顺序打乱输出不变，Deep Sets 先逐个编码再求和，Set Transformer 用注意力做集合内交互", "plain": "一张表的训练样本没有先后之分，打乱行的顺序预测结果应该不变。能满足这个要求的网络叫集合函数。", "a": ["置换不变函数满足任意打乱输入元素的顺序，输出保持不变。置换等变函数满足输入打乱后输出按同样方式打乱。", "Deep Sets 证明了置换不变函数可以写成先对每个元素做变换、再求和、最后再变换的形式。", "Set Transformer 用不加位置编码的自注意力实现元素之间的交互，并用诱导点把计算量从平方降到线性。", "TabPFN 的样本维注意力和 TabICL 的列嵌入都利用了这种结构。"], "terms": ["置换不变", "置换等变", "求和", "诱导点", "样本维注意力"], "f": ["f(X) = ρ( Σ_i φ(x_i) )"], "viz": "perm", "tag": "高频", "id": "j136"}, {"topic": "表格基础模型", "q": "元学习和上下文学习有什么关系？", "key": "都是学会“在新任务上快速适应”，MAML 适应时更新参数，上下文学习不更新参数", "plain": "元学习的目标是让模型面对新任务时，只给少量样本就能很快表现好。一种做法是学一组好的初始参数，再在新任务上微调几步。另一种做法是把新任务的样本直接放进输入，不更新参数。", "a": ["元学习在任务分布上训练，每个训练单元是一个任务，目标是在新任务上用少量样本快速适应。", "MAML 学习一组初始参数，使得在新任务上做几步梯度下降后效果最好，适应阶段要更新参数。", "基于黑盒模型的元学习把支持集直接输入网络，一次前向输出预测，适应阶段不更新参数。", "PFN 属于后一类，它的训练目标是在先验定义的任务分布上做元学习。"], "terms": ["任务分布", "MAML", "初始参数", "支持集", "先验"], "tag": "高频", "id": "j137"}, {"topic": "表格基础模型", "q": "用大语言模型处理表格时，表格怎样序列化？各有什么问题？", "key": "转成 Markdown、CSV、JSON 或自然语言句子，长表受上下文限制且数值精度差", "plain": "大语言模型只读文字，所以要先把表格写成一段文本。常见的写法有 Markdown 表格、CSV、JSON，或者每行写成一句话。", "a": ["常见序列化格式有 Markdown 表格、CSV、JSON，以及把每行写成“年龄是 35，收入是 2 万”这样的自然语言句子。", "不同格式对效果有影响，自然语言句子在少样本分类上常常更好，但长度更长。", "问题包括上下文长度限制了行数，数值被分词后精度和大小关系难以保持，行列顺序会影响结果。", "TabLLM 等工作用序列化加少样本微调做分类，在样本极少时有优势，但样本多时通常不如树模型和表格基础模型。"], "terms": ["Markdown", "CSV", "JSON", "自然语言句子", "分词", "TabLLM"], "viz": "serial", "tag": "高频", "id": "j138"}, {"topic": "表格基础模型", "q": "Text-to-SQL 是什么？大模型怎样做表格问答？", "key": "把自然语言问题翻译成 SQL 在数据库上执行，关键在于模式链接和执行校验", "plain": "业务人员用中文提问“上个月逾期最多的五个渠道是哪些”，系统把问题翻译成 SQL 查询，到数据库里执行得到答案。", "a": ["Text-to-SQL 把自然语言问题转换为可执行的 SQL，再在数据库上执行得到结果。", "模式链接是关键步骤，要找出问题涉及的表、列和取值，大型数据库需要先检索相关的表结构。", "常用的提升方法有少样本示例、分解复杂问题、生成多个候选并按执行结果投票，以及根据执行报错自我修正。", "评测看执行准确率，即执行结果与标准答案是否一致，常用基准有 Spider 和 BIRD。"], "terms": ["模式链接", "少样本示例", "执行结果投票", "执行准确率", "Spider", "BIRD"], "viz": "text2sql", "tag": "高频", "id": "j139"}, {"topic": "表格基础模型", "q": "大上下文的表格模型可以用哪些高效注意力？", "key": "线性注意力、诱导点、分块和检索，把样本维的平方复杂度降下来", "plain": "训练样本越多，样本之间两两计算注意力的成本越高。有几种办法可以减少计算，比如先压缩成少数代表点，或者只和最相关的样本计算。", "a": ["标准注意力的计算量和显存随样本数平方增长，FlashAttention 降低显存和访存开销，但计算量仍是平方级。", "线性注意力用核函数近似 softmax，改变计算顺序，使复杂度随样本数线性增长，代价是精度损失。", "诱导点方法先让少量可学习向量汇总全部训练样本，再让测试样本注意这些向量。", "分块和检索方法只让每个测试样本注意一部分训练样本，再集成多个子上下文的结果。"], "terms": ["平方", "FlashAttention", "线性注意力", "诱导点", "检索"], "viz": "attncost", "tag": "高频", "id": "j140"}, {"topic": "统计与因果", "q": "贝叶斯推断里的先验、似然、后验和后验预测分布是什么关系？", "key": "后验正比于似然乘先验，后验预测分布是按后验对所有参数的预测取平均", "plain": "先验是看数据之前对参数的猜测，似然是参数取某个值时出现当前数据的可能性。看到数据后把两者结合，得到后验。预测新样本时不只用一个最好的参数，而是把所有可能的参数按后验加权平均。", "a": ["贝叶斯公式给出后验正比于似然乘以先验。", "MAP 只取后验最大的那一个参数，完整的贝叶斯推断保留整个后验分布。", "后验预测分布对参数积分，把每个参数下的预测按后验概率加权平均，自然包含了参数的不确定性。", "PFN 直接学习从数据集到后验预测分布的映射，跳过了显式求后验这一步，这一步在复杂先验下通常无法解析计算。"], "terms": ["后验", "似然", "先验", "MAP", "后验预测分布", "积分"], "f": ["p(θ | D) ∝ p(D | θ) · p(θ)", "p(y | x, D) = ∫ p(y | x, θ) · p(θ | D) dθ"], "viz": "bayes", "tag": "必背", "id": "j141"}, {"topic": "统计与因果", "q": "高斯过程回归是什么？和 PFN 有什么关系？", "key": "函数的先验是一个高斯过程，后验预测有解析解，但计算随样本数立方增长", "plain": "高斯过程直接给“函数长什么样”设定一个概率分布，不预设固定的模型形式。核函数规定相近的输入应该有相近的输出。", "a": ["高斯过程假设任意有限个输入对应的函数值服从联合高斯分布，由均值函数和核函数决定。", "给定训练数据后，测试点的后验预测分布有解析形式，同时给出均值和方差。", "精确计算需要对 n 乘 n 的核矩阵求逆，复杂度是 n 的立方，大数据上要用近似方法。", "最早的 PFN 论文用高斯过程先验做验证，PFN 的预测与精确的高斯过程后验非常接近，说明 PFN 确实在近似贝叶斯推断。"], "terms": ["联合高斯分布", "核函数", "解析形式", "n 的立方", "近似贝叶斯推断"], "tag": "高频", "id": "j142"}, {"topic": "统计与因果", "q": "什么是保形预测？为什么适合风控这类需要可靠性的场景？", "key": "用校准集的残差分位数构造预测区间，在可交换假设下保证覆盖率", "plain": "模型给出一个预测值，我们还想知道它有多可靠。保形预测给出一个区间或一组候选类别，并保证真实值落在里面的比例不低于设定的水平，比如 90%。", "a": ["分裂保形预测把数据分成训练集和校准集，在校准集上计算非一致性分数，例如回归残差的绝对值。", "取校准分数的 1 − α 分位数作为阈值，预测区间为预测值加减这个阈值。", "只要数据满足可交换性，覆盖率至少为 1 − α，这个保证与模型和数据分布无关。", "分布漂移时可交换性不成立，需要加权或按时间滚动更新校准集。"], "terms": ["校准集", "非一致性分数", "分位数", "可交换性", "覆盖率"], "tag": "高频", "id": "j143"}, {"topic": "统计与因果", "q": "偶然不确定性和认知不确定性有什么区别？", "key": "偶然不确定性来自数据本身的噪声，认知不确定性来自模型知识不足，可以通过更多数据降低", "plain": "有些预测天生说不准，比如同样条件的两个人一个违约一个不违约，这是偶然不确定性。有些是因为模型没见过类似的样本，这是认知不确定性，补充数据就能减少。", "a": ["偶然不确定性由数据中固有的随机性造成，增加数据也无法消除，可以用预测分布的宽度表示。", "认知不确定性由训练数据不足或模型不确定造成，在远离训练数据的区域更大，增加数据可以降低。", "估计认知不确定性的常用方法有深度集成、MC Dropout 和贝叶斯方法，看多个模型的预测分歧有多大。", "在风控中，认知不确定性高的样本适合转人工审核或收集更多信息。"], "terms": ["偶然不确定性", "认知不确定性", "深度集成", "MC Dropout", "人工审核"], "tag": "高频", "id": "j144"}, {"topic": "统计与因果", "q": "生存分析是什么？在风控里怎么用？", "key": "建模事件发生的时间，能处理还没发生事件的删失样本", "plain": "普通分类只问会不会违约。生存分析问的是什么时候违约，并且能利用那些观察期结束时还没违约、以后可能违约的样本。", "a": ["生存分析研究事件发生前的时间，核心概念是生存函数和风险函数。", "删失指观察结束时事件还没发生，只知道事件时间大于观察时长，直接当作负样本会产生偏差。", "Kaplan-Meier 估计非参数的生存曲线，Cox 比例风险模型假设协变量对风险函数的影响是乘性的。", "风控中可以预测违约或提前还款的时间，也可以避免因表现期不足而丢弃新近样本。"], "terms": ["生存函数", "风险函数", "删失", "Kaplan-Meier", "Cox 比例风险"], "tag": "高频", "id": "j145"}, {"topic": "统计与因果", "q": "结构因果模型和 do 运算是什么？", "key": "每个变量由它的父节点和噪声决定，do 运算把某个变量强制设为固定值", "plain": "结构因果模型用一张有向图描述“谁影响谁”，每个变量由它的直接原因加上随机噪声算出来。do 运算模拟的是“如果我们强行把这个变量设成某个值，会发生什么”。", "a": ["结构因果模型由有向无环图和一组结构方程组成，每个变量是其父节点和独立噪声的函数。", "do(X = x) 表示干预，把 X 的结构方程替换成常数 x，切断指向 X 的边。", "p(y | do(x)) 一般不等于 p(y | x)，后者包含了混杂造成的关联。", "TabPFN 的先验用随机生成的结构因果模型产生数据，所以有研究用它来估计因果效应。"], "terms": ["有向无环图", "结构方程", "干预", "混杂", "先验"], "tag": "高频", "id": "j146"}, {"topic": "风控与业务", "q": "预期损失怎么计算？PD、LGD、EAD 分别是什么？", "key": "预期损失等于违约概率乘以违约损失率乘以违约风险敞口", "plain": "银行算一笔贷款预计会亏多少钱，要看三件事，借款人违约的可能性有多大，违约后收不回来的比例是多少，违约时还欠多少钱。", "a": ["PD 是违约概率，评分卡和分类模型输出的就是它。", "LGD 是违约损失率，即违约后扣除回收之后的损失比例，常用回归或 Beta 回归建模。", "EAD 是违约风险敞口，即违约时的未偿余额，信用卡等循环额度要估计未来的额度使用率。", "预期损失是三者的乘积，用于定价、拨备和资本计算，模型分数最终要和损失挂钩。"], "terms": ["PD", "LGD", "EAD", "预期损失", "拨备"], "f": ["EL = PD × LGD × EAD"], "tag": "必背", "id": "j147"}, {"topic": "风控与业务", "q": "申请评分卡、行为评分卡和催收评分卡有什么区别？", "key": "A 卡管贷前准入，B 卡管贷中管理，C 卡管贷后催收", "plain": "一笔贷款从申请到还清，不同阶段要回答的问题不同。申请时决定批不批，放款后决定要不要调额度，逾期后决定怎么催收。", "a": ["申请评分卡用于贷前审批，主要使用申请信息和外部征信数据，新客户没有内部行为记录。", "行为评分卡用于贷中管理，使用放款后的还款和消费行为，用于调额、交叉营销和早期预警。", "催收评分卡用于贷后，预测逾期客户的还款概率，决定催收的方式、力度和顺序。", "三者的样本、特征和标签定义不同，表现期一般依次变短。"], "terms": ["申请评分卡", "行为评分卡", "催收评分卡", "调额", "表现期"], "tag": "高频", "id": "j148"}, {"topic": "风控与业务", "q": "GBDT+LR 是什么？为什么在风控和广告里常见？", "key": "用 GBDT 的叶子编号做特征交叉，再交给逻辑回归", "plain": "GBDT 擅长自动发现特征组合，逻辑回归结构简单、方便上线和解释。把两者接起来，先让树把样本分到各个叶子，再把落在哪个叶子当作新特征给逻辑回归用。", "a": ["先训练 GBDT，每个样本在每棵树上落入一个叶子，把叶子编号做 one-hot 编码，得到高维稀疏特征。", "每个叶子对应一条从根到叶的路径，相当于自动构造的特征组合。", "再用逻辑回归在这些特征上训练，可以加入原始特征一起建模。", "这种做法来自 2014 年 Facebook 的广告点击率预估，风控里也用它兼顾非线性和可部署性。"], "terms": ["叶子编号", "one-hot", "特征组合", "逻辑回归", "点击率"], "tag": "高频", "id": "j149"}, {"topic": "风控与业务", "q": "怎样保证模型线上线下一致？", "key": "同一份特征逻辑、同一份时间口径、上线前做逐条比对", "plain": "离线训练效果很好的模型，上线后效果变差，常见原因是线上算出来的特征和离线训练时的不一样。", "a": ["特征计算逻辑要统一，避免离线用 SQL、线上用另一套代码各写一遍，常用特征平台统一管理。", "时间口径要一致，离线回溯特征必须只用当时能拿到的数据，和线上实时计算的口径一致。", "上线前把同一批样本的线上特征和离线特征逐条比对，再比对模型分数。", "上线后监控特征分布和分数分布，发现不一致及时排查数据源和计算链路。"], "terms": ["特征计算逻辑", "特征平台", "时间口径", "逐条比对", "分数分布"], "tag": "高频", "id": "j150"}, {"topic": "风控与业务", "q": "图神经网络的基本原理是什么？在风控里怎么用？", "key": "每个节点聚合邻居的信息来更新自己的表示", "plain": "在关系网络里，一个人是否可疑，和他联系的人是否可疑有很大关系。图神经网络让每个节点不断汇总邻居的信息，从而把关系结构也用上。", "a": ["图神经网络按消息传递的方式工作，每一层里每个节点汇总邻居的表示，再和自身表示结合更新。", "GCN 用归一化的邻接矩阵做加权平均，GraphSAGE 对邻居采样再聚合，可以处理大图和新节点，GAT 用注意力给不同邻居不同的权重。", "层数对应感受野，层数过多会导致节点表示趋同，称为过平滑。", "风控中用设备、手机号、IP、收货地址把用户连成图，用于识别团伙欺诈和风险传播。"], "terms": ["消息传递", "GCN", "GraphSAGE", "GAT", "过平滑", "团伙欺诈"], "tag": "高频", "id": "j151"}, {"topic": "特征工程与建模实践", "q": "什么是对抗验证？有什么用？", "key": "训练一个分类器区分训练集和测试集，分得开就说明分布不一致", "plain": "想知道训练数据和上线数据有没有差别，可以把两份数据混在一起，训练一个模型去分辨每条样本来自哪一份。如果模型能轻松分辨，说明两份数据的分布差别很大。", "a": ["把训练集标为 0、测试集或新时期数据标为 1，训练分类器并计算交叉验证 AUC。", "AUC 接近 0.5 说明两者分布相近，明显高于 0.5 说明存在分布差异。", "分类器的特征重要性指出哪些特征漂移最严重，可以考虑删除或改造这些特征。", "也可以挑出最像测试集的训练样本作为验证集，使验证结果更接近线上表现。"], "terms": ["分类器", "AUC", "分布差异", "特征重要性", "验证集"], "viz": "advval", "tag": "高频", "id": "j152"}, {"topic": "特征工程与建模实践", "q": "LightGBM 怎样直接处理类别特征？", "key": "按每个类别的梯度统计量排序，再像连续特征一样找最优切分", "plain": "one-hot 编码会把一个类别特征拆成很多列，每次只能把一个类别分出去。LightGBM 先把类别按“平均坏样本程度”排好队，再在队列上找一个切分点，一次就能把类别分成两组。", "a": ["对类别特征，LightGBM 统计每个类别的梯度和与 Hessian 和，按两者之比对类别排序。", "在排好序的类别上像连续特征一样寻找最优切分点，把类别分成两组，复杂度从指数级降到 k log k。", "这比 one-hot 一次只分出一个类别更高效，树也更浅。", "类别很多且样本少时容易过拟合，要调大最小样本数和类别平滑参数。"], "terms": ["梯度和", "Hessian 和", "排序", "k log k", "过拟合"], "viz": "catsort", "tag": "高频", "id": "j153"}, {"topic": "训练推理与 Scaling", "q": "Ring All-Reduce 是怎么工作的？通信量是多少？", "key": "分成 Reduce-Scatter 和 All-Gather 两段，每张卡的通信量约为 2 倍参数量，与卡数基本无关", "plain": "数据并行时，每张卡算出自己的梯度，需要把所有卡的梯度加起来再发回每张卡。Ring All-Reduce 让卡排成一个环，每次只和邻居传一小块，带宽利用率高。", "a": ["N 张卡排成环，梯度切成 N 块。", "Reduce-Scatter 阶段经过 N − 1 步，每步把一块发给下一张卡并累加，结束时每张卡持有一块完整的求和结果。", "All-Gather 阶段再经过 N − 1 步，把各自完整的块传遍整个环。", "每张卡发送的数据量约为 2(N − 1) 除以 N 倍的梯度大小，接近 2 倍，几乎不随卡数增长，所以扩展性好，但步数随卡数增加，延迟会变大。"], "terms": ["Reduce-Scatter", "All-Gather", "N − 1", "2(N − 1)", "延迟"], "f": ["每卡通信量 = 2(N − 1) / N × Ψ"], "tag": "高频", "id": "j154"}, {"topic": "训练推理与 Scaling", "q": "梯度消失和梯度爆炸是怎么产生的？怎么缓解？", "key": "反向传播是很多雅可比矩阵连乘，乘积持续小于 1 就消失，大于 1 就爆炸", "plain": "网络很深时，梯度要从最后一层一层传回第一层，每传一层就乘一个系数。系数一直小于 1，传到前面就几乎为 0。系数一直大于 1，就会越乘越大。", "a": ["反向传播中浅层的梯度等于深层梯度依次乘以各层的雅可比矩阵，连乘导致梯度按层数指数级缩小或放大。", "sigmoid 的导数最大只有 0.25，深层网络里容易梯度消失，ReLU 在正区间导数为 1，缓解了这个问题。", "残差连接让梯度可以经过恒等路径直接回传，归一化层稳定每层的数值范围，合适的初始化使各层方差保持不变。", "梯度爆炸常用梯度裁剪处理。"], "terms": ["雅可比矩阵", "指数级", "0.25", "ReLU", "残差连接", "初始化", "梯度裁剪"], "tag": "高频", "id": "j155"}, {"topic": "缺失值与数据合成", "q": "扩散模型的噪声调度是什么？DDIM 为什么能加速采样？", "key": "噪声调度决定每一步加多少噪声，DDIM 用确定性的非马尔可夫采样跳步", "plain": "扩散模型训练时一步步往数据里加噪声，加噪声的节奏就是噪声调度。生成时原本要一步步倒着走上千步，DDIM 找到了一种可以跳着走的方法，几十步就能生成。", "a": ["噪声调度规定每一步的噪声方差，常见的有线性调度和余弦调度，余弦调度在开始和结束阶段加噪更平缓。", "前向过程有闭式解，可以直接从原始数据一步得到任意时刻的加噪样本，训练时随机抽取时刻。", "DDPM 的采样是随机的马尔可夫过程，需要和训练一样多的步数。", "DDIM 使用相同的训练目标，但把采样过程改写为确定性的非马尔可夫过程，可以只在一部分时刻上采样，用几十步得到接近的质量。"], "terms": ["噪声方差", "余弦调度", "闭式解", "马尔可夫", "确定性", "DDIM"], "f": ["x_t = √ᾱ_t · x₀ + √(1 − ᾱ_t) · ε"], "viz": "schedule", "tag": "高频", "id": "j156"}, {"topic": "缺失值与数据合成", "q": "分数匹配和扩散模型是什么关系？", "key": "分数是对数密度的梯度，预测噪声等价于估计分数", "plain": "分数指的是在每个位置，概率密度上升最快的方向。只要知道这个方向，就能从随机噪声出发，沿着它一步步走到数据密集的区域，这就是从噪声生成数据。", "a": ["分数函数定义为对数概率密度关于输入的梯度，它不需要知道密度的归一化常数。", "去噪分数匹配表明，训练网络从加噪样本中预测所加的噪声，等价于估计加噪分布的分数。", "采样时可以用朗之万动力学沿分数方向移动并加入少量噪声，或者求解对应的反向随机微分方程。", "因此 DDPM 和基于分数的模型是同一类方法的两种表述。"], "terms": ["对数概率密度", "归一化常数", "去噪分数匹配", "朗之万动力学", "随机微分方程"], "f": ["s(x) = ∇_x log p(x)"], "viz": "score", "tag": "高频", "id": "j157"}, {"topic": "机器学习与评估", "q": "交叉熵、负对数似然与 KL 散度有什么关系？", "tag": "必背", "key": "交叉熵是在目标分布下，对预测概率取负对数后的平均", "a": ["分类标签可看成经验目标分布，因此最小化交叉熵就是最大化观测标签的似然。", "目标分布固定时，交叉熵等于目标熵加上目标到预测的 KL 散度，所以两者有相同的最优解。", "比如真实类别的预测概率从零点二升到零点八，该样本损失会下降。", "KL 一般不对称。", "若目标概率为正而预测为零，损失可趋于无穷。", "这里的等价关系也不意味着深层网络对参数是凸优化。"], "f": ["H(P,Q)=-Σ p_i log q_i", "KL(P∥Q)=Σ p_i log(p_i/q_i)=H(P,Q)-H(P)。"], "fq": "为什么分类实现通常直接接收 logits，而不是先做 softmax？", "fa": "把 log-softmax 与负对数似然合并，可以用 logsumexp 稳定计算，减少先指数化再取对数造成的上溢或下溢。 交叉熵函数的输入约定要看接口，不能重复 softmax。", "viz": "ce", "src": "0.16 DL Softmax回归与多分类；0.5 ML 逻辑回归 (Logistic Regression)", "id": "g1-1"}, {"topic": "机器学习与评估", "q": "Precision、Recall、F1、macro-F1 与 AUC 分别衡量什么？", "tag": "必背", "key": "精确率回答预测为正的样本有多少是真的，召回率回答真实正例找回了多少，F1 是两者的调和平均", "a": ["假设真阳性八个、假阳性两个、假阴性四个，精确率是零点八，召回率约零点六七，F1 约零点七三。", "macro-F1 先分别算每类 F1，再等权平均，更容易暴露少数类问题。", "AUC 衡量随机正例得分高于随机负例的排序能力，平分按一半计。", "F1 依赖分类阈值，AUC 不对应某一个固定阈值，二者不能替代。"], "f": ["P=TP/(TP+FP)", "R=TP/(TP+FN)", "F1=2TP/(2TP+FP+FN)。"], "fq": "AUC 很高是否意味着上线使用的阈值效果一定好？", "fa": "不能。 AUC 是跨阈值的排序摘要，业务还受类比例、阈值、误报与漏报成本影响。 需要在验证集上按目标选择阈值，并在独立测试集检查该工作点的指标。", "viz": "roc", "src": "0.10 ML 评估指标与模型选择；10.6 机器学习深度学习八股（初稿）", "id": "g1-2"}, {"topic": "机器学习与评估", "q": "训练、验证、测试集各做什么，反复用验证集会有什么问题？", "tag": "必背", "key": "训练集用于拟合参数，验证集用于选择超参数、数据策略和早停位置，测试集用于流程确定后的最终评价", "a": ["虽然验证集没有直接反向传播，但反复比较大量方案，会把验证集的随机波动也选进结果，造成选择偏差。", "预处理中的均值、特征选择和清洗规则也应只用允许的训练信息拟合。", "更严格的做法是预先固定划分，在独立数据上确认最终方案，并保留重复实验的不确定性。"], "fq": "随机划分一次以后，为什么仍可能有数据泄漏？", "fa": "划分只是第一步，还要检查每个处理步骤和样本之间的关联。", "viz": "split", "src": "0.10 ML 评估指标与模型选择；12.2 Pretrain 阶段的评估", "id": "g1-3"}, {"topic": "机器学习与评估", "q": "怎样求伯努利参数的极大似然估计，MLE 与 MAP 有何区别？", "tag": "必背", "key": "先假设各次观测独立、成功概率都为 p", "a": ["十次里成功四次，对这条观测序列的似然与 p 的四次方乘一减 p 的六次方成正比。", "取对数、对 p 求导并令其为零，可得到最大似然估计零点四。", "MLE 只利用当前观测的似然，MAP 还把先验加入目标，选择后验密度最大的参数。", "比如认为概率不应太接近边界，可以使用合适的 Beta 先验。", "先验强度必须明确，MAP 也不等于后验均值，不能把几种估计混称。"], "f": ["ℓ(p)=k log p+(n-k)log(1-p)", "p_MLE=k/n", "p_MAP=argmax_p[ℓ(p)+log prior(p)]。"], "fq": "如果一次成功都没有，MLE 会是多少？", "fa": "在允许 p 取零的伯努利模型里，MLE 位于边界 p=0。 它不证明真实成功概率就是零，有限样本仍有不确定性。 可以报告区间，或声明先验后使用贝叶斯估计。", "viz": "mle", "src": "0.5 ML 逻辑回归 (Logistic Regression)；10.6 机器学习深度学习八股（初稿）", "id": "g1-4"}, {"topic": "Transformer 与注意力", "q": "Tokenization 为什么影响成本，BPE 怎样构造子词？", "tag": "必背", "key": "分词把文本映射成离散 token 序列，再供模型查表得到嵌入", "a": ["词级词表大且有稀有词问题，字符或字节级词表小但序列更长，子词在两者之间折中。", "BPE 从基础符号开始，反复合并频繁相邻片段并保存合并规则。", "标准实现会保留基础符号及已学 token，不会因为旧符号在当前语料计数为零就随意删除。", "词表与预处理影响中文、数字和代码的长度，也影响训练与推理成本，但模型算术差不能全部归因于分词。"], "fq": "为什么不同 tokenizer 的 token 级困惑度不能直接比较？", "fa": "同一文本会被分成不同数量和粒度的 token，平均损失的单位不同。 应固定 tokenizer 和文本协议，或使用清楚定义的字节归一化指标，同时保留任务评测。", "viz": "bpe", "src": "1.1 Tokenization 分词", "id": "g1-5"}, {"topic": "强化学习与 Agent", "q": "Agent、Workflow 和普通 LLM 调用有什么区别？", "tag": "必背", "key": "普通 LLM 调用主要根据输入生成输出，Workflow 用预定义的代码路径组织模型和工具，Agent 则让模型结合环境反馈动态选择下一步动作", "a": ["是否用了框架或多个模型，并不能决定它属于哪一种。", "步骤明确、风险和延迟约束强时，固定工作流通常更容易验证。", "步骤难以预知时，可以把局部决策交给 Agent。", "Agent 不必在运行时更新权重，也不必具有长期记忆。", "选择重点是任务是否需要动态行动，以及多步执行的额外成本是否值得。"], "fq": "用一个例子说明怎样组合 Workflow 与 Agent。", "fa": "描述含糊时，由 Agent 决定补查哪些元数据。 确定性校验和写入权限仍由程序控制。", "viz": "agent", "src": "6.2 LLM-based Agent 基于大模型的智能体", "id": "g1-6"}, {"topic": "多模态与 RAG", "q": "RAG、微调和工具调用怎样选择？", "tag": "必背", "key": "RAG 在回答时检索外部资料，适合知识更新快、需要来源或访问私有文档的任务", "a": ["微调更新模型参数，更适合改善格式、任务行为和特定能力。", "工具调用让系统查询实时状态、计算或执行动作，不只是提供文字知识。", "三者可以组合，但不能把向量库当实时业务状态，也不能依靠微调记住不断变化的事实。", "先建立可测基线，再决定增加哪一层。"], "fq": "有 RAG 就不会产生幻觉了吗？", "fa": "不会。 检索可能漏掉证据或返回错误资料，生成也可能曲解证据。 需要检索与生成分开评测，支持引用核对，并在证据不足时说明不确定性。", "viz": "rag", "src": "6.3 RAG 检索增强生成；3.1 SFT 监督微调", "id": "g1-7"}, {"topic": "机器学习与评估", "q": "线性回归与逻辑回归的输出、损失和假设有什么区别？", "tag": "必背", "key": "线性回归用特征的线性组合预测连续值，常通过最小化平方误差拟合", "a": ["若误差是同方差独立高斯噪声，最小二乘与最大似然估计相联系。", "逻辑回归先计算线性分数，再用 sigmoid 得到二分类概率，通常最小化伯努利负对数似然，也就是交叉熵。", "两者对参数都是线性的打分结构，但输出空间和训练目标不同。", "线性模型可以加入非线性特征，却不自动学出任意复杂边界。", "处理共线性、异常值和类别不平衡时，还需要检查假设与评测。"], "f": ["线性回归：ŷ=wᵀx+b", "logistic：p(y=1|x)=σ(wᵀx+b)。"], "fq": "线性回归为什么不建议总用显式矩阵求逆求解？", "fa": "设计矩阵可能奇异或病态，显式逆还会放大数值误差。 可用 QR、SVD、正则化或合适的优化方法。 数据规模和稀疏性也影响选择。", "viz": "sigmoid", "src": "10.6 机器学习深度学习八股（初稿）；0.15 DL 线性回归", "id": "g1-8"}, {"topic": "机器学习与评估", "q": "基准污染指什么？怎样检测和缓解？", "tag": "理解", "key": "污染指测试集内容以某种形式出现在训练数据中，导致评测分数虚高", "a": ["形式包括原文泄漏、改写泄漏、以及题目来源网站被整体抓取。", "检测方法有 n-gram 重叠扫描，检查测试样本与训练语料的最长公共子串。", "有基于困惑度的检测，模型对见过的样本困惑度异常低。", "还有顺序敏感检测，把选项顺序打乱后若分数大幅下降说明记忆而非理解。", "缓解手段包括使用训练截止日期之后发布的新基准、用私有held-out集合、以及报告时同时给出去污染后的结果。"], "f": ["重叠率可定义为测试样本中被训练语料覆盖的 n-gram 数量与总 n-gram 数量之比。"], "fq": "如果面试官质疑你论文的实验存在数据泄漏，怎样回答？", "fa": "先说明划分方式与去重手段，例如按数据集或按实体分组划分、跨集合做近重复检测。 再说明做了哪些对照实验验证，例如把疑似泄漏部分剔除后重跑，指标变化在误差范围内。 承认无法穷尽证明，但给出已经排查的范围，这比断言完全没有泄漏更可信。", "id": "g1-9"}, {"topic": "优化与训练", "q": "logistic 交叉熵对参数与输入的梯度分别是什么？", "tag": "必背", "key": "设线性输出为权重与输入的内积加偏置，经过 sigmoid 得到正类概率 p", "a": ["二分类交叉熵对线性输出的导数是 p 减标签 y。", "继续用链式法则，对权重的梯度是残差乘输入，对偏置是残差，对输入则是残差乘权重。", "两种梯度形状和含义不同，前者描述怎样更新模型，后者描述输入扰动怎样影响损失。", "比如预测很错时残差可能较大，但梯度还取决于输入或权重尺度，所以高梯度不能直接等同于错误样本或高价值样本。"], "f": ["z=wᵀx+b，p=σ(z)", "∂L/∂z=p-y", "∇wL=(p-y)x", "∇xL=(p-y)w。"], "fq": "如果加入 L2 正则，参数梯度怎样变化？", "fa": "若目标额外加 λ∥w∥²/2，权重梯度增加 λw，偏置是否正则要另行定义。 输入梯度一般没有这项，因为正则项不依赖输入。 也不要把这种耦合正则直接称为 AdamW。", "viz": "ce", "src": "0.5 ML 逻辑回归 (Logistic Regression)", "id": "g2-1"}, {"topic": "优化与训练", "q": "非均匀采样为什么需要重要性权重，梯度范数采样在什么条件下有效？", "tag": "必背", "key": "假设目标是全部样本梯度的平均，而每次按非均匀概率抽一个样本", "a": ["直接使用被抽样本的梯度，会更偏向高概率样本，改变原目标。", "将它除以样本数和抽样概率的乘积，期望才能回到原平均。", "在梯度固定、抽样概率有效且估计无偏的条件下，最小化估计的二阶矩会得到概率与梯度范数成正比。", "它解释的是随机梯度估计的方差，不证明确定性删数据或清洗排序全局最优。", "概率太小还会放大权重，实际需关注数值与方差。"], "f": ["ḡ=(1/n)Σg_i", "I∼p，ĝ=g_I/(n p_I)，E[ĝ]=ḡ", "最优 p_i∝∥g_i∥。"], "fq": "可以把这个公式直接用于任意无放回采样吗？", "fa": "不可以。 无放回方案的样本包含概率和联合分布不同，需要对应的无偏估计，例如按包含概率构造权重。 面试推导应先说明这里讨论的是单次有放回抽样。", "src": "10.4 八股面经（含答案）", "id": "g2-2"}, {"topic": "优化与训练", "q": "SGD、Adam 与 AdamW 的主要区别是什么？", "tag": "必背", "key": "SGD 沿当前小批量梯度更新，动量版本会累积方向", "a": ["Adam 维护梯度的一阶矩和平方梯度的二阶矩，并做偏差修正，让各参数使用不同的有效步长。", "AdamW 保留这一自适应更新，同时把权重衰减作为单独的参数收缩步骤。", "对普通 SGD，适当缩放后的 L2 正则与权重衰减可等价，但在 Adam 中正则梯度会进入矩估计，通常不再等价。", "优化器不存在对所有任务都最好的选择，还要比较学习率、调度、正则和同等训练预算。"], "f": ["m_t=β₁m_(t-1)+(1-β₁)g_t", "v_t=β₂v_(t-1)+(1-β₂)g_t²", "AdamW 独立执行 θ←(1-ηλ)θ。"], "fq": "为什么 Adam 要做偏差修正？", "fa": "矩估计常从零初始化，早期会偏向零。 分别除以 1-β₁ᵗ 和 1-β₂ᵗ，可以修正这种初始化偏差。 它不代表消除了小批量噪声或保证达到全局最优。", "viz": "gd", "src": "0.14 DL 优化与训练基础；10.6 机器学习深度学习八股（初稿）", "id": "g2-3"}, {"topic": "优化与训练", "q": "过拟合与 loss NaN 应怎样分别排查？", "tag": "必背", "key": "训练损失下降而验证变差时，先确认划分、评价流程和训练验证模式，再看样本量、标签噪声与分布差异，之后尝试早停、正则或数据改进", "a": ["NaN 是另一类问题，应定位第一个非有限张量，检查输入异常、标签越界、除零、对数定义域、全 mask 行和混合精度溢出。", "用固定小批量与较高精度复现，可以缩小范围，再检查学习率和梯度范数。", "梯度裁剪只控制有限梯度大小，不能修复非法标签、已经溢出的数值或错误的数学操作。"], "fq": "softmax 减去最大值后为什么仍可能出现 NaN？", "fa": "输入 logits 可能此前已经含有 inf，做 inf 减 inf 会成为 NaN。 全 mask 行也可能全为负无穷。 需要处理异常来源与无有效键的情况，不能只在 softmax 后替换结果。", "viz": "poly", "src": "3.1 SFT 监督微调；10.4 八股面经（含答案）", "id": "g2-4"}, {"topic": "强化学习与 Agent", "q": "ReAct 的循环是什么，和单纯写思维链有什么区别？", "tag": "必背", "key": "ReAct 把任务推理与行动交替组织", "a": ["系统根据当前问题和已有观察选择动作，外部工具实际执行后返回新观察，再据此决定继续、改变计划或结束。", "关键是行动后取得真实环境反馈，不能把模型自行写出的工具结果当作事实。", "单纯思维链主要在模型内部展开推理，不一定改变或查询环境。", "部署时只需保留必要的决策摘要、动作与结果，重点验证每步是否有效。", "ReAct 是组织方式，不保证计划正确，也不能取代工具校验和停止规则。"], "f": ["任务状态→决策→工具执行→观察→更新状态→继续或结束。"], "fq": "工具返回与原先推理冲突时怎么办？", "fa": "先核对调用参数、返回状态与数据来源，再更新结论或补充验证。 不能为了维持原答案忽略真实反馈，也不能把单次工具异常直接当成最终事实。", "viz": "agent", "src": "6.2 LLM-based Agent 基于大模型的智能体", "id": "g2-5"}, {"topic": "强化学习与 Agent", "q": "一个可靠的工具 schema 应包含什么，JSON 合法就能执行吗？", "tag": "必背", "key": "工具定义要写清名称、用途、适用边界、参数类型、必填项、单位、枚举和返回值", "a": ["模型生成调用请求后，程序先解析和校验 schema，再检查参数语义及权限，最后才执行。", "例如开始时间和结束时间即使都是合法数字，也可能前后颠倒。", "约束解码能提高结构正确率，却不能保证选对工具或数据真实。", "错误返回应结构化说明问题，允许有限次数修正，不能靠无限重试。", "工具输出还应区分成功、业务失败和系统异常，便于下一步决策。"], "fq": "所有字段都设成可选会不会更灵活？", "fa": "可能减少表面校验失败，却把缺省语义和不确定性转移到执行层。 核心参数应明确必填，缺省值必须有业务含义。 缺少必要信息时应补查或澄清。", "src": "10.4 八股面经（含答案）", "id": "g2-6"}, {"topic": "强化学习与 Agent", "q": "模型发起工具调用后，执行器需要负责哪些事情？", "tag": "必背", "key": "模型负责提出动作，执行器负责把动作变成受控的真实操作", "a": ["执行前核对工具是否允许、参数是否符合业务约束，以及当前任务是否具备权限。", "执行时设置超时和资源限制。", "执行后记录返回状态并检查目标是否实现。", "凭据应保留在受控服务端，不能把任意模型文本直接当 shell 或数据库语句执行。", "即使工具调用格式完全正确，也可能访问错误对象或超出任务范围。", "模型声称执行成功不是验收证据，必须依赖工具结果或目标系统状态。"], "fa": "不意味着。 权限应按操作、资源和任务范围区分。 读取、修改和对外发布具有不同后果，执行器必须分别检查，不根据模型的自然语言理由自动扩大权限。", "src": "10.4 八股面经（含答案）；Harness Engineering: 为 Agent 设计闭环系统", "id": "g2-7"}, {"topic": "优化与训练", "q": "偏差方差与正则化如何解释，L1、L2 和 Dropout 有何不同？", "tag": "必背", "key": "偏差描述学习方法平均预测与真实规律的差距，方差描述它对训练样本变化的敏感性", "a": ["经典平方误差可分为偏差平方、方差和不可约噪声。", "正则化限制模型选择，可能以增加一些偏差换取较低方差。", "L1 惩罚倾向产生稀疏解，L2 使权重整体收缩，但不能断言所有权重永远非零。", "Dropout 训练时随机屏蔽激活，常见实现同时按保留率缩放，普通推理关闭。", "正则强度应通过验证选择，过强也会欠拟合。"], "f": ["E[(y-f̂(x))²]=Bias²+Variance+Noise", "L1=λ∥w∥₁，L2=λ∥w∥²₂。"], "fq": "训练和验证损失都高，就一定该增大模型吗？", "fa": "不一定。 还应检查特征、目标、优化是否收敛和数据质量。 欠拟合可能来自模型限制，也可能是训练流程、学习率或标签问题，先定位再增加复杂度。", "viz": "biasvar", "src": "10.6 机器学习深度学习八股（初稿）；0.9 ML 偏差-方差权衡 (Bias-Variance Tradeoff)", "id": "g2-8"}, {"topic": "优化与训练", "q": "训练和推理的计算量怎么估？6N 是怎么来的？", "tag": "必背", "key": "把参数量记作 N", "a": ["前向时每个参数对每个 token 参与一次乘法和一次加法，约 2N 次浮点运算。", "反向要算输入梯度与参数梯度两部分，约为前向的两倍，即 4N。", "训练一个 token 合计约 6N，训练总量约等于 6 乘 N 乘训练 token 数。", "推理只有前向，每个 token 约 2N。", "这个估算没算注意力矩阵本身，注意力还有与序列长度平方相关的项，短序列可忽略，长上下文下不能忽略。"], "f": ["训练总计算量约等于 6 乘 N 乘 D。取 N 为 70 亿、D 为 1 万亿 token，约为 4.2 乘 10 的 22 次方次浮点运算。"], "fq": "知道这个估算有什么用？", "fa": "一是排算力预算与训练时长，用总计算量除以卡数与单卡有效算力就得到大致天数。 二是理解 Chinchilla 的结论，给定计算量下参数量与 token 数应同比例增长，经验上每个参数配约 20 个 token。 三是判断瓶颈，若实测吞吐远低于这个估算给出的理论值，问题通常在数据管线或通信而不是算力。", "viz": "scaling", "id": "g2-9"}, {"topic": "优化与训练", "q": "混合精度训练为什么需要损失缩放？bf16 和 fp16 怎样选？", "tag": "必背", "key": "fp16 的指数位只有 5 位，可表示的最小正规数约为十的负五次方量级，反向传播中小梯度容易下溢为零，训练停滞", "a": ["损失缩放把损失乘以一个较大系数，使梯度整体放大到可表示范围，更新前再除回去，并对出现溢出的步做跳过与动态调整系数。", "bf16 指数位与 fp32 相同，动态范围一致，只是尾数精度低，因此不需要损失缩放，训练稳定性明显更好，代价是数值精度略低。", "在支持 bf16 的硬件上优先选 bf16。", "无论哪种，主权重与优化器状态通常仍保留 fp32 副本以保证更新精度。"], "f": ["有效更新量级与参数量级之比若小于精度分辨率，更新会被舍入丢失，这是保留 fp32 主权重的原因。"], "fq": "梯度检查点省了什么，代价是什么？", "fa": "省激活显存。 前向只保存分段边界处的激活，反向时重新计算段内激活。 显存从与层数成正比降到与层数平方根成正比的量级，代价是多一次前向计算，训练时间增加约三成。", "viz": "mixed", "id": "g2-10"}, {"topic": "优化与训练", "q": "学习率预热和余弦衰减各起什么作用？批大小变化时学习率怎样调？", "tag": "理解", "key": "预热在训练初期用较小学习率线性升到峰值，此时参数随机、梯度方向噪声大，直接用大学习率容易让自适应优化器的二阶矩估计失真并发散", "a": ["余弦衰减在后期平滑降低学习率，使参数在损失盆地中收敛而非持续震荡，末端通常保留一个很小的常数学习率。", "批大小增大时梯度噪声降低，可以用更大学习率，经验规则是线性缩放或平方根缩放，线性缩放适用于中等批量，超大批量下平方根缩放更稳，并需要同步延长预热步数。"], "f": ["线性缩放规则写作，新学习率等于基准学习率乘以新批大小与基准批大小之比。"], "fq": "为什么大批量训练常常泛化更差？", "fa": "梯度噪声本身有正则作用，帮助逃离尖锐极小点。 批量增大后噪声减小，容易收敛到尖锐极小点，测试集上表现下降。 缓解手段包括延长预热、配合更强的数据增广或权重衰减、使用逐层自适应的优化器。", "viz": "lrsched", "id": "g2-11"}, {"topic": "优化与训练", "q": "梯度裁剪解决什么问题？按范数裁剪和按值裁剪有什么区别？", "tag": "理解", "key": "解决梯度爆炸", "a": ["深层网络或长序列上偶发的极大梯度会让一步更新把参数推离合理区域，损失出现尖峰甚至变成非数。", "按范数裁剪计算全部梯度的全局范数，若超过阈值则整体等比缩放，保持梯度方向不变，只压缩幅度，是标准做法。", "按值裁剪逐元素截断到区间内，会改变梯度方向，破坏不同参数间的相对比例，一般不用于大模型。", "实践中还会监控梯度范数曲线，突然的尖峰往往提示数据中存在异常样本。"], "f": ["按范数裁剪的缩放因子等于阈值与全局范数之比，取该比值与一的较小者。"], "fq": "训练中途 loss 变成 NaN，排查顺序是什么？", "fa": "先看是否某个批次触发，定位到具体样本检查是否有异常输入。 再看是否学习率过大或预热不足。 然后检查混合精度是否溢出，softmax 或 log 是否出现零输入，归一化层分母是否加了 epsilon。 最后检查是否有除以零的自定义算子。 定位方法是回滚到最近检查点并开启异常检测逐算子定位。", "id": "g2-12"}, {"topic": "强化学习与 Agent", "q": "如何把一个数据准备任务写成 MDP？", "tag": "必背", "key": "MDP 用状态、动作、转移和奖励描述序列决策，再通过折扣或有限时域定义累计收益", "a": ["以数据准备为例，状态可以包含当前错误证据、模型反馈、保留率和剩余预算，动作可以是保留、删除、估计修复或付费查询真值，转移则由动作执行后数据和预算的变化决定。", "奖励可结合下游收益与成本。", "关键是当前状态是否足以描述未来所需信息。", "只堆几个统计量不自动满足 Markov 性。", "若遗漏重要历史，应扩充状态或承认部分可观测近似。"], "f": ["MDP=(S,A,P,r,γ)", "J(π)=E_π[Σ_t γᵗ r_t]。"], "fq": "为什么剩余预算和剩余步数可能需要进入状态？", "fa": "相同数据在不同剩余资源下，最优动作和可行动作可能不同。 若把这两种情形映成同一状态，策略就缺少决策信息。 有限时域中时间也可能是状态的一部分。", "src": "3.2 RL 强化学习基础", "id": "g3-1"}, {"topic": "强化学习与 Agent", "q": "经验回放、目标网络与 Double DQN 分别解决什么问题？", "tag": "必背", "key": "经验回放把历史转移存起来随机抽取，降低相邻样本相关性并提高利用率", "a": ["目标网络让回归目标在一段时间内较稳定，减轻一边预测一边快速改变目标的问题。", "普通 DQN 在目标中取最大动作价值，同一估计既选动作又评分，噪声可能造成高估。", "Double DQN 用在线网络选下一动作，再由目标网络评价它。", "它缓解这种选择偏差，但不保证估值完全无偏或训练必然稳定，还依赖探索、数据覆盖和目标更新设置。"], "f": ["a*=argmax_a Q_online(s′,a)", "y=r+γ(1-terminated)Q_target(s′,a*)。"], "fq": "online=[10,1]、target=[2,20]、r=1、γ=0.5，未终止目标是多少？", "fa": "在线网络选择第一个动作，目标网络对它的估值是 2，所以目标是 1+0.5×2=2。 若自然终止则为 1。 若算成 11，就是错误地取了目标网络的最大值。", "src": "3.2 RL 强化学习基础", "id": "g3-2"}, {"topic": "强化学习与 Agent", "q": "Dueling、Double 与两阶段动作结构有什么区别？", "tag": "必背", "key": "Dueling 是价值网络的参数化方式，把状态整体好坏与各动作相对优势分开建模，再组合成 Q 值", "a": ["因为给价值加常数、同时给优势减常数不会改变 Q，常用减去优势均值来固定这种自由度。", "Double 改的是 TD 目标，用不同估计完成动作选择与评价。", "两阶段则是任务动作的分解，例如先判断是否干预，再决定采用估计值还是真值。", "三者处于不同层面，可以组合，但组合有效仍需对照实验，不能凭名称就认定消除了所有价值偏差。"], "f": ["Q(s,a)=V(s)+A(s,a)-(1/|A|)Σ_b A(s,b)。"], "fq": "减去优势均值之后，A 就必然是真实优势函数吗？", "fa": "不是。 它主要约束网络分解并便于学习。 网络估计仍可能有误差，V 分支也不能自动解释成任意指定策略的精确状态价值。", "id": "g3-3"}, {"topic": "强化学习与 Agent", "q": "如何处理稀疏奖励，为什么预算约束不能只靠惩罚？", "tag": "必背", "key": "稀疏反馈可以用较低成本的中间评价或奖励塑形补充，例如用局部证据引导，再周期性测代理模型，最终用真实任务收益验收", "a": ["这样提高反馈密度，却可能让策略学会追求代理分数，因此要检查动作分布和最终目标的一致性。", "一般经验塑形会改变优化目标，不能随意宣称保持原最优策略。", "硬预算更应由环境检查可行动作，阻止无法支付的修复。", "只设大额惩罚仍允许探索时违规，也可能因奖励尺度失衡产生错误偏好。"], "f": ["势函数塑形的常见形式 F(s,a,s′)=γΦ(s′)-Φ(s)", "保持策略的结论依赖对应假设。"], "fq": "自然终止与达到外部时间限制都应该把 bootstrap 置零吗？", "fa": "自然终止通常不再 bootstrap。 仅因外部时间限制截断、而任务本身仍可继续时通常应保留 bootstrap。 若有限时域就是任务定义的一部分，应把时间纳入状态并按终止定义处理。", "src": "3.2 RL 强化学习基础；6.2 LLM-based Agent 基于大模型的智能体", "id": "g3-4"}, {"topic": "强化学习与 Agent", "q": "Agent 怎样判断结束，如何控制死循环和预算？", "tag": "必背", "key": "结束条件应在任务开始时定义，包括目标完成、不可恢复失败、需要补充信息和预算耗尽", "a": ["除了最大步数，还要限制总时间、token、调用次数与费用，并检查重复动作和重复观察是否带来进展。", "完成判断最好由可验证结果支持，例如文件已生成且通过检查。", "检测到循环后，可以缩小任务、换工具或返回当前证据和未完成项。", "单靠模型说已经足够并不可靠，预算也应在执行层扣减，避免模型估计错误或一次昂贵调用超出上限。"], "fq": "达到步数上限能否直接返回成功？", "fa": "不能。 应区分正常完成与预算中止，保留已有结果、失败原因和可恢复状态。 若部分目标未验证，最终结果必须明确表达未完成部分。", "src": "6.2 LLM-based Agent 基于大模型的智能体", "id": "g3-5"}, {"topic": "强化学习与 Agent", "q": "工具调用超时后为什么不能直接重试，幂等如何设计？", "tag": "必背", "key": "超时只表示没有及时收到结果，不代表服务端没有执行", "a": ["只读查询通常容易重试，但写入、扣费或发布可能已成功，再执行会产生重复副作用。", "可为一次逻辑操作生成稳定的幂等键，服务端记录处理状态与结果，相同键重试返回同一结果。", "重试前也可以查询状态。", "瞬时网络错误适合有限重试和退避，参数错误、权限拒绝或确定的业务失败应先处理原因。", "任务状态要持久化，恢复时识别已完成步骤，不能把整个流程无条件再跑一次。"], "fq": "同一个幂等键重试时，可以换一套参数吗？", "fa": "通常不应允许。 服务端应把幂等键与请求语义或参数摘要绑定，参数不同返回冲突。 否则同一个键可能意外复用旧结果，掩盖真正的新操作。", "src": "10.4 八股面经（含答案）；1. 相关工作概述", "id": "g3-6"}, {"topic": "强化学习与 Agent", "q": "Agent 的短期记忆、长期记忆与上下文压缩如何区分？", "tag": "必背", "key": "短期记忆保存当前任务的消息、计划和工具状态，通常进入上下文或任务状态", "a": ["长期记忆跨任务保留事实、偏好和经验，可以放在数据库、文件或检索系统中。", "长期记忆不等于向量库，更不等于模型权重。", "上下文压缩应保留目标、约束、已验证事实、待办和失败原因，把可恢复的长日志移到外部并保存引用。", "写入长期记忆前要检查来源和有效期，避免把幻觉反复回灌。", "读取还要遵守用户与资源隔离，不能把不同用户的信息混用。"], "fq": "为什么不是把全部历史放进更长的窗口就行？", "fa": "长上下文仍有成本和噪声，旧信息也可能过时或冲突。 应按当前决策需要检索，并保留来源、时间和状态，使压缩后的事实能被核查。", "src": "6.2 LLM-based Agent 基于大模型的智能体；先看本质", "id": "g3-7"}, {"topic": "机器学习与评估", "q": "决策树怎样选分裂，信息增益、Gini 与剪枝是什么？", "tag": "必背", "key": "决策树在每个节点比较候选特征和阈值，选择能降低目标不纯度或回归误差的划分，再递归处理子节点", "a": ["分类常用熵或 Gini，不纯度下降要按子节点样本比例加权。", "信息增益容易偏向取值很多的特征，信息增益率用分裂信息归一化来缓解。", "树长得很深时可能记住噪声，可限制深度、叶子最小样本量或使用剪枝。", "贪心地选每一步最好划分并不保证整棵树全局最优，最终仍要看独立验证表现。"], "f": ["H=-Σ_k p_k log p_k", "Gini=1-Σ_k p_k²", "Gain=I(parent)-Σ_c(n_c/n)I(child_c)。"], "fq": "为什么树通常不需要像线性模型那样先做标准化？", "fa": "普通轴对齐树主要利用单个特征的排序和阈值，严格单调变换通常保持可选划分。 仍要处理数据类型、缺失值和编码。 涉及近似分桶时还要看实现。", "viz": "tree", "src": "10.6 机器学习深度学习八股（初稿）；0.8 ML 决策树与集成学习 (Decision Trees and Ensembles)", "id": "g3-8"}, {"topic": "强化学习与 Agent", "q": "RLHF 的完整流程包含哪几个模型？各自的作用和显存开销是什么？", "tag": "必背", "key": "标准 PPO 流程涉及四个模型", "a": ["策略模型是被优化的对象。", "参考模型是 SFT 后的冻结副本，用于计算 KL 惩罚防止策略偏离过远。", "奖励模型给完整回复打分。", "价值模型估计状态价值以计算优势，通常从奖励模型初始化。", "显存上策略需要参数、梯度与优化器状态，价值模型同样需要训练，参考与奖励模型只需前向。", "四模型同驻是 PPO 工程复杂度高的主因。", "DPO 去掉奖励模型与价值模型，只需策略与参考两个模型。", "GRPO 去掉价值模型，用同一提示下多条采样的组内奖励标准化替代优势估计，显著降低显存。"], "f": ["PPO 的优势用广义优势估计计算，目标为概率比率乘以优势与其裁剪版本的较小者，再减去 KL 惩罚项。"], "fq": "GRPO 的组内标准化有什么隐患？", "fa": "当组内所有样本奖励相同时标准差为零，优势退化为零或数值不稳，该提示对梯度无贡献。 需要做过滤或加小常数。 另外组内标准化会抹掉提示之间的难度差异，简单提示上的微小差异被放大，可能导致训练偏向易题。", "viz": "rlhf", "id": "g3-9"}, {"topic": "强化学习与 Agent", "q": "可验证奖励的强化学习（RLVR）适用于什么场景？", "tag": "必背", "key": "RLVR 用规则或程序直接判定正确性作为奖励，例如数学答案比对、代码单元测试、格式校验", "a": ["优势是奖励无噪声且无法被语言层面的讨好行为欺骗，因此可以长时间大幅度优化而不出现奖励投机。", "局限是需要任务本身可自动验证。", "可行做法是把这些可验证约束作为规则奖励，与基于人类偏好的奖励模型组合，规则部分提供硬约束，偏好部分提供审美信号。"], "f": ["组合奖励等于规则奖励与偏好奖励的加权和，规则不满足时可直接置为下界以形成硬约束。"], "fa": "对规则奖励设上限，满足即给满分不再加分，避免过度优化。 同时保留 KL 约束并定期用人评抽检，监控偏好奖励是否在规则奖励上升时下降，出现该现象即为投机信号。", "id": "g3-10"}, {"topic": "强化学习与 Agent", "q": "过程奖励模型和结果奖励模型有什么区别？各自怎样标注？", "tag": "理解", "key": "结果奖励只对最终输出打分，标注成本低，但对长推理链只能提供稀疏信号，无法指出错在哪一步", "a": ["过程奖励对中间每一步打分，信号密集，能定位错误步骤，训练出的模型在搜索时可用于剪枝。", "过程标注成本高，人工逐步标注不现实，常用自动方法，从某个中间步骤出发多次采样到终点，用能否到达正确答案的比例作为该步骤的价值估计。", "这类估计存在偏差，正确步骤也可能因后续采样失败而被低估。"], "f": ["某步骤的过程分可估计为从该步续采样若干条轨迹中最终正确的比例。"], "fa": "有。 分段打分就是过程奖励的形式，对生成的每个小节或每个段落分别评估调性一致性、节奏稳定性与过渡自然度，而不是只对整首打一个分。 这能定位到具体是哪一段崩坏，训练信号也更密集。", "id": "g3-11"}, {"topic": "Transformer 与注意力", "q": "Self-attention、cross-attention 和多头注意力怎样区分？", "tag": "必背", "key": "注意力用 Q 与 K 的相似度生成权重，再对 V 加权", "a": ["自注意力中三者来自同一序列，交叉注意力中 Q 来自当前序列，K 和 V 可来自另一序列或模态，所以查询长度与键长度可以不同。", "多头将表示映射到多个子空间，分别计算后拼接并投影。", "输入形状为批量、长度、总维度时，每头通常是批量、头数、长度、头维。"], "f": ["Attention(Q,K,V)=softmax(QKᵀ/√d_k+M)V", "head 形状 [B,H,T,d_k]。"], "fq": "交叉注意力的注意力矩阵形状是什么？", "fa": "若查询长度为 Tq、键长度为 Tk，则每头分数形状为 [B,H,Tq,Tk]，输出长度跟随查询，值维跟随 V。 Tq 与 Tk 不必相等，但 K/V 的键位置必须对应。", "viz": "attn", "src": "1.3 Attention 注意力", "id": "g4-1"}, {"topic": "Transformer 与注意力", "q": "为何除以根号 d，mask 与稳定 softmax 怎样处理？", "tag": "必背", "key": "在分量近似独立、均值为零且方差相近的简化条件下，点积方差会随维度增加", "a": ["除以根号维度可控制分数尺度，减少 softmax 过度饱和。", "causal mask 阻止读取未来位置，padding mask 排除无效键。", "计算 softmax 时减去行最大值，不改变概率，却能减小指数上溢风险。", "若一整行没有合法键，直接对全负无穷取 softmax 会出问题，需要显式定义空行输出。", "不同接口对布尔 mask 的真值含义可能相反，必须检查约定。"], "f": ["softmax(z)_i=(exp(z_i-m))/(Σ_j exp(z_j-m))，m=max_j z_j。"], "fq": "softmax 能直接换成 sigmoid 吗？", "fa": "可以设计使用 sigmoid 的注意力变体，但它不是标准 softmax 注意力的等价替换。 各权重不再共同归一到一，输出尺度和位置间竞争都会变化，需要相应的结构设计与验证。", "viz": "attn", "src": "0.16 DL Softmax回归与多分类；0.19 DL 注意力与 Transformer", "id": "g4-2"}, {"topic": "Transformer 与注意力", "q": "LayerNorm 与 BatchNorm 的统计维度和训练推理行为有何区别？", "tag": "必背", "key": "BatchNorm 通常对每个通道沿批量及相应空间维统计，训练时用当前批统计并维护运行统计，常规推理使用运行均值与方差", "a": ["LayerNorm 对单个样本指定的特征维归一化，例如对每个 token 的隐藏维计算均值方差，训练和推理使用同一类当前输入统计。", "它较少依赖批大小，因此适合长度变化的序列场景。", "两者都可包含可学习的缩放和偏置。", "应按具体张量与 normalized_shape 说明归一化轴，不能笼统说沿所有维度归一化。"], "f": ["LN(x)=γ⊙(x-μ)/√(σ²+ε)+β，μ、σ² 沿指定特征维计算。"], "fq": "RMSNorm 与 LayerNorm、Pre-Norm 与 Post-Norm 各有什么区别？", "fa": "RMSNorm 按均方根缩放而不减均值。 它不是假设实际均值为零。 Pre-Norm 在子层前归一化，保留更直接的残差路径。 Post-Norm 在残差相加后归一化。 训练稳定性依具体设计而定，Pre-Norm 不意味着永远不需要 warmup。", "viz": "norm", "src": "1.4 FFN & Add & LN 前馈层、残差、层归一化；10.6 机器学习深度学习八股（初稿）", "id": "g4-3"}, {"topic": "Transformer 与注意力", "q": "Attention 的开销是什么，FlashAttention 和 KV cache 优化哪里？", "tag": "必背", "key": "对长度为 T、隐藏维为 D 的标准全注意力，两个主要矩阵乘法有二次序列长度项，直接保存注意力矩阵也需要二次空间", "a": ["FlashAttention 利用分块与在线 softmax 减少显存读写和中间矩阵存储，计算的仍是精确注意力，不自动变成线性时间。", "KV cache 服务于自回归推理，复用历史 token 的键和值，避免每次重新计算它们，但新增查询仍需关注历史。", "缓存内存随层数、批量和上下文增长，训练激活问题也不能靠它解决。"], "f": ["注意力混合 O(BT²D)，线性投影 O(BTD²)", "分数存储 O(BHT²)", "KV 元素数约 2LBTH_kv d_h。"], "fq": "为什么不能把训练时所有激活都缓存后重复使用？", "fa": "训练更新参数后，旧激活对应旧参数，直接复用会改变梯度计算。 KV cache 通常用于固定参数的自回归推理，不能当成通用训练省显存方法。", "viz": "heads", "src": "1.3 Attention 注意力；10.3 Transformer量化分析计算", "id": "g4-4"}, {"topic": "Transformer 与注意力", "q": "为什么需要位置编码，RoPE 怎样使注意力含有相对位置？", "tag": "必背", "key": "没有位置等信号的自注意力，对输入的共同置换具有等变性，不能仅凭内容区分排列", "a": ["RoPE 把每个位置上的 Q、K 按二维对子空间旋转，不同维度对使用不同频率。", "位置 m 和 n 的旋转向量做内积时，可化为原向量之间包含 n 减 m 的旋转，因此把相对位置信息带进分数。", "它保留向量范数，但不保证超出训练长度后效果不变。", "长上下文扩展还需要检查频率、插值方案、训练分布和实际长序列评价。"], "f": ["(R_m q)ᵀ(R_n k)=qᵀR_(n-m)k。"], "fq": "RoPE 一般是否要同样作用于 V？", "fa": "常见实现将旋转施加于 Q 和 K，让相对位置信息进入匹配分数，V 通常不这样旋转。 具体变体应按模型定义说明，不能把一种实现当唯一可能。", "viz": "rope", "src": "1.5 Positional Encoding 位置编码；0.19 DL 注意力与 Transformer", "id": "g4-5"}, {"topic": "Transformer 与注意力", "q": "MHA、MQA、GQA 如何影响 KV cache，prefill 与 decode 有何区别？", "tag": "必背", "key": "MHA 为每个查询头配独立的键值头，MQA 让所有查询头共享一组键值，GQA 则把查询头分组，每组共享键值", "a": ["减少键值头数可以降低缓存和解码时读取它的带宽需求，但效果取决于训练及架构，不能保证无损。", "prefill 处理整段已有输入并建立缓存，decode 则逐步产生新 token，每步读取历史键值。", "长输入、长输出和批量增大影响不同阶段的成本，估算时应使用实际键值头数，而不是一律拿查询头数代入。"], "f": ["KV 字节数≈2×层数×batch×序列长度×KV头数×每头维度×每元素字节数。"], "fq": "把已经训练好的 MHA 模型直接删掉大部分 KV 头就行吗？", "fa": "不应直接等同。 转换通常需要合理的参数聚合与继续训练，并测质量退化。 架构节省缓存的原理不意味着任意现成权重都能零成本转换。", "viz": "heads", "src": "1.3 Attention 注意力", "id": "g4-6"}, {"topic": "Transformer 与注意力", "q": "Greedy、temperature、top-k、top-p 和 beam search 有何区别？", "tag": "必背", "key": "Greedy 每步选概率最大 token", "a": ["temperature 缩放 logits，改变分布尖锐程度。", "top-k 保留固定数量的高分候选。", "top-p 保留累计概率达到阈值的最小候选集合后采样。", "beam search 保留若干高序列分数的前缀，追求较高概率序列，和随机采样不同。", "开放生成需要兼顾质量与多样性，工具参数则更看重结构约束和语义正确。", "降低温度不保证事实正确，解码策略的组合顺序会影响结果，应按具体实现固定并报告。"], "f": ["p_i=softmax(z_i/T)", "top-p 先按概率降序选累计质量至少为 p 的最小集合。"], "fq": "temperature=0 是否应在公式里直接除以零？", "fa": "不应该。 很多接口把零温度当作贪心模式的约定，属于单独处理。 数学公式中的温度应为正。 即使贪心，数值和服务实现也未必保证跨环境逐位一致。", "viz": "sampling", "src": "1.6 Structure & Decoding 结构和解码", "id": "g4-7"}, {"topic": "机器学习与评估", "q": "随机森林和 GBDT 分别怎样集成，为什么不能混称？", "tag": "必背", "key": "随机森林在样本和特征上引入随机性，训练多棵树后平均或投票，常用于降低高方差树模型的方差", "a": ["各棵树可独立训练，但预测在统计上并非完全无关，降低相关性是集成有效的关键之一。", "GBDT 则逐轮向当前加法模型加入新树，沿损失下降方向修正已有模型。", "平方误差下可理解为拟合残差，一般损失下是拟合负梯度。", "Boosting 的轮次有依赖，但单棵树的分裂统计仍可并行。", "两者都需控制深度和过拟合。"], "f": ["GBDT：F_m(x)=F_(m-1)(x)+η f_m(x)。"], "fq": "为什么说 GBDT 不是总在拟合“上一棵树”的残差？", "fa": "它针对的是当前全部树组成的模型输出。 新树拟合损失对当前预测的负梯度。 只有特定损失下，这个量才直接等于真实值减预测值。", "viz": "gbdt", "src": "10.6 机器学习深度学习八股（初稿）", "id": "g4-8"}, {"topic": "Transformer 与注意力", "q": "完整讲一遍 Transformer 的结构与数据流。", "tag": "必背", "key": "原论文是编码器解码器结构", "a": ["输入先过词嵌入并加上位置信息，然后堆 N 个相同的块。", "编码器块有两个子层，多头自注意力（双向，不加掩码）与逐位置前馈层，每个子层后面接残差相加与归一化。", "解码器块有三个子层，带因果掩码的多头自注意力、以编码器输出为键值的交叉注意力、前馈层，同样各接残差与归一化。", "最后一层隐状态过一个线性层映射到词表维度，softmax 得到下一个 token 的分布。", "一句话概括数据流，注意力在 token 之间混合信息，前馈层在每个位置上独立做非线性变换，两者交替堆叠。", "当前主流大模型是 Decoder-only，去掉编码器与交叉注意力，并把原论文的 Post-Norm 换成 Pre-Norm，归一化换 RMSNorm，前馈层换 SwiGLU，位置编码换 RoPE。"], "f": ["单块的计算顺序，Pre-Norm 写作 x 加上 Attn(Norm(x))，再对结果加上 FFN(Norm(该结果))。"], "fq": "注意力后面为什么一定要接前馈层？", "fa": "注意力对值向量做的是加权求和，权重虽由输入算出，但对值本身是线性混合，堆再多层也缺少逐位置的非线性变换能力。 前馈层在每个位置上独立升维、过非线性、再降维，提供模型的主要容量。 一个混序列维，一个混特征维，缺一不可。", "viz": "tflayer", "id": "g4-9"}, {"topic": "Transformer 与注意力", "q": "Transformer 的参数量怎么估？7B 这个数是怎么来的？", "tag": "必背", "key": "按层算", "a": ["注意力有查询、键、值、输出四个 d 乘 d 的矩阵，合计 4 倍 d 的平方。", "前馈层若是标准两层、中间维取 4d，则是两个 d 乘 4d 的矩阵，合计 8 倍 d 的平方。", "一层共约 12 倍 d 的平方，L 层就是 12 乘 L 乘 d 的平方。", "再加词嵌入与输出头，各约词表大小乘 d。", "归一化与偏置项占比很小，估算时可以忽略。", "换成 SwiGLU 时有三个矩阵、中间维取三分之八倍 d，参数量仍是 8 倍 d 的平方，所以这个估算不变。"], "f": ["参数量约等于 12 乘 L 乘 d 的平方，再加词表大小乘以 d。取 d 为 4096、L 为 32，主体约为 64.4 亿", "再加词表 32000 乘 4096 的输入嵌入与输出头，总量约 67 亿，这就是所谓 7B 的来源。"], "fq": "用了 GQA 之后这个估算还准吗？", "fa": "注意力部分会变小。 查询与输出仍是各一个 d 乘 d 的矩阵，键与值缩成 d 乘键值头数乘头维，所以注意力从 4 倍 d 的平方降到 2 倍多一点。 前馈层不变，总量略低于 12 倍 d 的平方。", "id": "g4-10"}, {"topic": "Transformer 与注意力", "q": "多头注意力的头数与头维怎么选？头是不是越多越好？", "tag": "理解", "key": "隐维固定时，头数乘头维等于隐维，两者此消彼长", "a": ["头数多则每个头的维度小，能关注更多种不同的模式，但每个头自身的表达能力弱，且头维过小时点积的区分度下降。", "头数少则每个头更强，但关注模式单一。", "常见做法是把头维固定在 64 或 128，头数随隐维增大而增加。", "注意力的参数量只和隐维有关，与头数无关，所以改头数不改参数量，改的是注意力的并行粒度与子空间划分。"], "f": ["头维等于隐维除以头数所得的商。d 为 4096、头数为 32 时，头维为 128。"], "fq": "既然头数不影响参数量，多设一些有坏处吗？", "fa": "有。 头维太小会让点积落在很窄的数值范围里，softmax 区分度变差。 另外研究发现训练好的模型里很多头是冗余的，剪掉相当比例的头对效果影响很小，说明盲目加头并不带来收益。 GQA 与 MQA 减的是键值头数，查询头数不变，目的是压缩缓存而不是改变表达能力。", "id": "g4-11"}, {"topic": "Transformer 与注意力", "q": "RMSNorm 相比 LayerNorm 省了什么？为什么现代大模型普遍用 Pre-Norm 加 RMSNorm？", "tag": "必背", "key": "LayerNorm 先减均值再除以标准差，然后做缩放和平移", "a": ["RMSNorm 去掉了减均值和平移，只用均方根做缩放，计算量与访存都更少，实测质量相当。", "Pre-Norm 把归一化放在子层输入侧，使残差路径成为从输入到输出的恒等通路，梯度可以无衰减地直达浅层，深层模型训练稳定，不需要复杂的学习率预热。", "Post-Norm 表达能力略强但深层容易梯度消失。", "两者结合是当前的默认选择。"], "f": ["RMSNorm 的输出等于输入除以其均方根后再乘以可学习增益。均方根等于各维度平方均值的平方根。"], "fq": "Pre-Norm 有什么已知缺点？", "fa": "残差流的幅值随层数累积增长，深层子层的相对贡献被稀释，表达能力略有损失。 缓解办法包括在输出前加一次归一化、对残差做缩放，或采用 Sandwich 式在子层前后都加归一化。", "viz": "norm", "id": "g4-12"}, {"topic": "Transformer 与注意力", "q": "SwiGLU 相比 ReLU 和 GELU 好在哪？为什么中间维度要取三分之八倍？", "tag": "必背", "key": "SwiGLU 是门控线性单元的一种，把输入分别过两个线性层，一路经 Swish 激活作为门控，与另一路逐元素相乘，再过第三个线性层", "a": ["门控机制让网络按输入动态调节信息通过量，实测困惑度优于 ReLU 与 GELU。", "代价是需要三个权重矩阵而非两个，为了保持参数量与标准前馈层一致，中间维度从四倍隐维降到三分之八倍隐维，因为四倍乘以三分之二恰好等于三分之八。"], "f": ["SwiGLU 的输出写作，第三个线性层作用于 Swish 门控向量与另一路线性输出的逐元素乘积。Swish 等于输入乘以其 sigmoid。"], "fq": "激活函数换了还需要调其他超参吗？", "fa": "需要调学习率与初始化尺度。 门控结构的输出方差与非门控不同，沿用原配置可能导致早期训练不稳。 实践中会缩小初始化标准差并适当延长预热。", "id": "g4-13"}, {"topic": "Transformer 与注意力", "q": "MLA（多头隐注意力）怎样压缩 KV 缓存？和 GQA 有什么区别？", "tag": "理解", "key": "GQA 让多个查询头共享同一组键值头，缓存量按分组数缩减，是对头数的直接削减，会损失一部分表达多样性", "a": ["MLA 换思路，把键值先投影到一个低维隐空间，缓存只存这个低维隐向量，使用时再上投影还原成各头的键值。", "由于上投影矩阵可以与查询投影吸收合并，推理时不必显式还原，缓存量大幅下降而每头仍保留独立参数。", "代价是引入额外投影计算，且与 RoPE 的结合需要特殊处理，要另加一段在各头之间共享的位置键，这一段不参与低秩压缩，缓存里多存这一小段。"], "f": ["标准多头注意力每层每 token 缓存键与值各一份，共 2 乘头数乘头维个数。MLA 只缓存压缩隐向量与共享位置键。DeepSeek-V2 中二者分别为 512 维与 64 维，合计 576 维，而同配置的标准多头注意力为 2 乘 128 乘 128，即 32768 维，压缩约 57 倍。"], "fq": "为什么 RoPE 和 MLA 会冲突？", "fa": "RoPE 按位置对键做旋转，旋转与上投影矩阵不可交换，无法把上投影吸收进查询侧。 DeepSeek 的办法是解耦 RoPE，位置键由隐状态经一组单独投影生成并施加 RoPE，在所有头之间共享，每头维度取普通头维的一半，不参与低秩压缩。 位置查询由查询的压缩隐向量投影得到，每头一份。 位置部分与由压缩隐向量还原出的内容部分拼接后一起参与注意力。", "viz": "heads", "id": "g4-14"}, {"topic": "Transformer 与注意力", "q": "位置编码外推为什么会失效？NTK 缩放与 YaRN 分别怎样解决？", "tag": "必背", "key": "RoPE 各维度对应不同频率，训练时模型只见过训练长度内的相位范围", "a": ["直接外推到更长序列，高频维度的相位超出见过的区间，注意力分布崩坏。", "位置插值把位置索引整体压缩到训练范围内，等价于降低所有频率，虽然不再越界，但高频细节被压扁，短距离分辨能力下降。", "NTK 缩放按频率做非均匀调整，低频维度多压缩以承担长程，高频维度少压缩以保留局部分辨。", "YaRN 在此基础上分三段处理，高频完全不变，低频完全插值，中频线性过渡，并对注意力温度做补偿缩放，在少量长文本上微调即可稳定扩展。"], "f": ["位置插值把位置 m 替换为 m 乘以训练长度与目标长度之比。NTK 缩放改为调整旋转基数，把基数乘以扩展倍数的某个幂次。"], "fq": "上下文变长后除了位置编码还有什么问题？", "fa": "注意力计算与 KV 缓存都随长度增长，显存与延迟成为瓶颈，需要配合稀疏注意力或缓存压缩。 数据侧也缺少真正需要长程依赖的训练样本，若只用拼接短文本做长序列训练，模型学不到跨段推理，长文本评测上表现虚高。", "viz": "rope", "id": "g4-15"}, {"topic": "Transformer 与注意力", "q": "稀疏注意力有哪几类做法？DeepSeek NSA 的思路是什么？", "tag": "理解", "key": "按稀疏模式来源分三类", "a": ["固定模式包括滑动窗口、全局 token、条带与块稀疏，实现简单但与内容无关。", "基于内容的动态稀疏先估计重要性再选取，例如按查询与键的粗粒度相似度挑选块，精度更高但选择本身有开销且不易高效实现。", "基于聚类或哈希的方法把相似的键分组，只在组内计算。", "NSA 采用分层可训练稀疏，把序列压缩成粗粒度块得到全局概览，同时按块重要性选取少量块做细粒度计算，再叠加一个滑动窗口保证局部信息，三路结果做门控融合，并且整套结构对硬件友好，训练与推理都能实际加速。"], "f": ["块稀疏注意力的复杂度从序列长度的平方降到序列长度乘以选中块总长度。"], "fq": "稀疏注意力为什么很多方案只在推理用而不在训练用？", "fa": "训练需要稀疏模式可导或者至少稳定，动态选择引入不可导的 top-k，且稀疏算子的反向实现复杂、访存不规则，实际加速往往不及理论值。 NSA 强调原生可训练正是针对这一点。", "id": "g4-16"}, {"topic": "多模态与 RAG", "q": "InfoNCE 为什么是交叉熵，温度与负样本怎样影响学习？", "tag": "必背", "key": "InfoNCE 将一个查询对应的正样本视为正确类别，把候选相似度当成分类 logits，所以可以用交叉熵提高正例相对概率", "a": ["温度控制分数的尖锐程度，较小温度会突出高相似候选的影响，也可能放大噪声或假负例。", "batch 内其他配对常作为负例，但只有它们确实不匹配时，这个假设才合理。", "增加负例会改变训练难度与计算成本，不保证单调提高效果。"], "f": ["L_i=-log[(exp(s_ii/τ))/(Σ_j exp(s_ij/τ))]", "L=(L_audio→text+L_text→audio)/2。"], "fq": "温度趋近零时会怎样？", "fa": "概率更接近集中在最大分数项，非最大项信号可能很弱，最大错误匹配的影响也可能很大。 学习效果与稳定性需要验证，温度不能按越小越好选择。", "viz": "contrast", "src": "CLIP", "id": "g5-1"}, {"topic": "多模态与 RAG", "q": "CLIP 怎样对齐图像和文本，错误配对和多个正例怎么办？", "tag": "必背", "key": "这类方法用不同编码器处理两种模态，再投影到共同的表示空间，通常归一化后计算相似度，通过配对监督拉高正确组合相对其他组合的分数", "a": ["应先明确匹配语义，再考虑去重、关系掩码或多正例目标。", "共享空间不意味着两种模态完全等价，也不保证所有细粒度时间信息都保留下来，仍需具体任务验证。"], "f": ["s_ij=normalize(f_audio(a_i))ᵀnormalize(f_text(t_j))", "匹配标签由数据关系定义。"], "fa": "不必。 可以定义多个正例，用相应多正例损失或采样规则训练。 关键是让目标函数承认这些关系，避免把其他正确描述作为负例。 还要控制重复对训练权重的影响。", "viz": "contrast", "src": "CLIP；Section0.1 多模态大模型综述", "id": "g5-2"}, {"topic": "多模态与 RAG", "q": "掩码建模、因果建模与对比预训练的目标有何区别？", "tag": "必背", "key": "掩码建模隐藏部分输入，让模型利用可见上下文恢复缺失内容，BERT 预测被选 token，MAE 重建图像被掩码部分", "a": ["因果建模按照序列顺序，只用历史预测下一项，因此适合自回归采样。", "对比学习则区分匹配与不匹配的表示，重点塑造相似关系，不必直接重建原始内容。", "三者可以结合，但输出对象、可见信息和损失不同。", "选择取决于下游需要生成能力、重建细节还是检索表示，不能仅凭预训练损失低就断言迁移任务最好。"], "f": ["因果目标 L=-Σ_t log p(x_t|x_<t)", "掩码目标只在指定隐藏位置或内容上计算重建损失。"], "fq": "双向编码器是不是不能用于生成任务？", "fa": "它可以作为生成系统的编码器，也可以参与迭代式生成设计。 这里只是说其原始掩码目标与从左到右下一 token 目标不同，不能把架构用途说成绝对限制。", "src": "4.1 BERT及变体；4.3 GPT系列", "id": "g5-3"}, {"topic": "多模态与 RAG", "q": "为什么不能只按一个相似度分数清洗多模态预训练数据？", "tag": "必背", "key": "相似度主要反映某个编码器认可的语义关系，并不完整代表事实正确性、声音质量、时间对齐和覆盖度", "a": ["低分样本可能是错配，也可能是模型不熟悉的稀有风格。", "只保留高分容易扩大原有偏差。", "合理流程是先明确下游任务，分别检查配对、重复、长度与长尾，再用可信验证集比较保留、降权或删除策略。", "比较时还应固定训练时长与总计算预算，计入筛选开销。"], "fq": "如何区分困难但有价值的样本和错误样本？", "fa": "结合标注证据、近邻或多模型分歧、人工抽检和下游干预实验。 高损失或低相似度只能提出候选，不能单独证明样本错误。 最好分类型查看实际例子。", "src": "2.2 预训练数据；10.4 八股面经（含答案）", "id": "g5-4"}, {"topic": "多模态与 RAG", "q": "多模态编码器怎样接入 LLM，投影层与 Q-Former 有何区别？", "tag": "必背", "key": "常见结构先用模态编码器得到特征，再通过连接器映射到语言模型能处理的表示", "a": ["投影层逐 token 变换维度，结构简单，但保留的模态 token 可能较多。", "Q-Former 使用可学习查询通过交叉注意力提取和压缩相关信息，再适配到语言模型。", "训练可先冻结已有编码器和 LLM，只训练连接器建立对齐，再按任务放开部分参数做指令微调，但并非所有模型都采用同一阶段。"], "fq": "为什么对齐维度相同不代表语义已经对齐？", "fa": "同维度只是矩阵运算可连接，表示分布和信息含义仍可能不同。 需要配对训练目标与下游任务验证，检查模型是否真的使用模态信息，而不是依赖文本偏置。", "src": "Section0.1 多模态大模型综述；BLIP-2", "id": "g5-5"}, {"topic": "多模态与 RAG", "q": "一个 RAG 系统从文档到答案包含哪些关键步骤？", "tag": "必背", "key": "离线先解析文档、清理结构、切分片段并保存来源和权限元数据，再建立稀疏或向量索引", "a": ["在线先理解查询，按需要改写或分解，用关键词与语义召回找到候选，再重排、去重和裁剪上下文，最后基于证据生成答案并保留引用。", "切块太小可能丢上下文，太大则混入噪声并增加成本。", "索引与文档要有更新和版本机制，权限过滤应在检索和结果返回时生效。", "RAG 不是把向量库接上模型就完成，必须能定位每一阶段的失效。"], "fq": "BM25 与向量召回为什么经常组合？", "fa": "关键词召回对专名、编号等精确词匹配有效，向量召回能处理部分语义改写。 组合可补充覆盖，但要统一候选、去重和重排，并验证额外成本是否换来收益。", "viz": "rag", "src": "6.3 RAG 检索增强生成", "id": "g5-6"}, {"topic": "多模态与 RAG", "q": "怎样分别评价 RAG 的检索和生成，失败时怎样定位？", "tag": "必背", "key": "检索侧检查相关文档是否召回以及排名，可用召回、MRR 或 NDCG", "a": ["生成侧检查答案正确性、对证据的忠实性、完整性和引用是否支持主张。", "可以把正确证据直接给生成器，判断问题是否仍存在，再固定候选测试重排，逐层定位。", "MRR 只取每个查询首个相关项的倒数排名，命中率也不同于前 K 项的精确率。", "模型评审可扩展规模，但要用人工样本校准，并记录检索、上下文和答案，不能只看一个端到端分数。"], "f": ["MRR=(1/N)Σ_q (1)/(rank_first(q))，无命中记0", "Hit@K 对每个查询只记是否命中。"], "fq": "答案和参考答案词面不同，BLEU 或 ROUGE 很低，一定错了吗？", "fa": "不一定。 开放问答可能有多种正确表达，应检查事实、证据和任务约束。 词面指标只是补充，不能代替语义正确性与引用支持度评价。", "viz": "rag", "src": "6.3 RAG 检索增强生成", "id": "g5-7"}, {"topic": "机器学习与评估", "q": "类别不平衡怎样处理，为什么高准确率不代表模型有效？", "tag": "必背", "key": "先看业务中的正负定义、错误代价与真实类比例", "a": ["极少正例时，永远预测负类也可能有很高准确率，应检查逐类召回、精确率、宏平均和合适的 PR 指标。", "训练上可以比较类别权重、过采样、欠采样或更好的特征，推理上可根据验证集调整阈值。", "采样只作用于训练折，不能在划分前对全数据复制或合成样本，否则可能泄漏。", "改变训练类比例还会影响概率校准，应在接近真实分布的独立数据上检查。"], "fq": "把正负样本采成一比一后，测试集也要改成一比一吗？", "fa": "一般应保留目标部署分布来评估，除非评测协议明确规定。 人为平衡测试集会改变精确率等与类比例相关的量，可能让业务效果判断失真。", "viz": "roc", "src": "0.10 ML 评估指标与模型选择；10.6 机器学习深度学习八股（初稿）", "id": "g5-8"}, {"topic": "多模态与 RAG", "q": "SigLIP 相比 CLIP 改了什么？为什么小批量下更有优势？", "tag": "理解", "key": "CLIP 用 softmax 形式的对比损失，归一化项要在整个批次上计算，因此需要极大批量才能提供足够的负样本，且分布式训练需要跨卡收集全部特征", "a": ["SigLIP 把损失换成逐对的 sigmoid 二分类，每个图文对独立判断是否匹配，不依赖批内归一化。", "这样批大小不再直接决定负样本质量，小批量下性能下降小得多，分布式实现也只需分块计算而无需全局收集。", "另外 softmax 形式隐含批内只有一个正例的假设，现实数据中同批出现语义重复样本时会产生错误的负梯度，sigmoid 形式没有这个问题。"], "f": ["SigLIP 损失对每一对计算带标签的 logistic 损失，标签在对角线为正、其余为负，并引入可学习的偏置补偿正负不平衡。"], "id": "g5-10"}, {"topic": "微调与压缩", "q": "ICL、SFT 与预训练有什么区别，示范数据如何形成训练目标？", "tag": "必背", "key": "预训练通常用较大范围的数据学习通用能力，SFT 用带示范输出的数据继续更新参数，让行为适配任务或指令", "a": ["二者的区别更多在数据、目标和训练阶段，不是两种必然不同的网络。", "ICL 则把示例放进当前上下文，在通常推理设置下不更新参数。", "语言 SFT 可用 teacher forcing，对目标回答的 token 计算交叉熵。", "是否监督提示部分要由训练设计确定。", "不能因为模型在上下文里模仿了示例，就说已经完成微调，也不能用训练损失替代独立任务评价。"], "f": ["L_SFT=-(Σ_t m_t log pθ(y_t|x,y_<t))/(Σ_t m_t)，m_t 指定受监督位置。"], "fq": "为什么 SFT 常把 prompt 或 padding 位置的标签设为忽略？", "fa": "若目标是学习回答，就只在需要预测的回答位置计算损失，排除无效 padding。 prompt 是否监督不是普遍定律，要看数据与目标。 实现还应正确对齐输入和下一 token 标签。", "viz": "learnmodes", "src": "3.1 SFT 监督微调；10.4 八股面经（含答案）", "id": "g6-1"}, {"topic": "微调与压缩", "q": "LoRA 的数学形式、参数量和局限是什么？", "tag": "必背", "key": "LoRA 冻结预训练权重，用两个低秩矩阵的乘积表示更新，再把这个更新加到原线性映射上", "a": ["若输入维度和输出维度都很大，而秩较小，可训练参数明显少于完整矩阵，从而减少梯度和优化器状态。", "它假设任务适配所需的更新可以低秩近似，并不是说原权重本身低秩。", "基座权重和训练激活仍占显存，梯度也需要沿冻结层传播到可训练模块。", "秩、插入位置和数据决定适配能力，不能保证所有任务都与全参数微调等效。"], "f": ["W′=W+(α/r)BA", "A∈R^(r×d_in)，B∈R^(d_out×r)", "新增参数 r(d_in+d_out)。"], "fq": "LoRA 中 A 随机、B=0 时，哪个矩阵先有任务损失梯度？", "fa": "按 ΔW=sBA，令 G 为更新矩阵的梯度，则 ∇B=sGAᵀ，∇A=sBᵀG。 B=0、A 随机时，B 可以先得到非零任务梯度，A 的任务梯度为零。 两者同时为零会使两侧任务梯度都为零。", "viz": "lora", "src": "3.5 PEFT 参数高效微调；10.4 八股面经（含答案）", "id": "g6-2"}, {"topic": "微调与压缩", "q": "训练和推理显存由什么构成，各种节省方法影响哪部分？", "tag": "必背", "key": "训练显存至少包括模型权重、前向保留的激活、梯度和优化器状态，还可能有高精度副本、临时工作区与通信缓冲", "a": ["推理通常不需要梯度和优化器状态，但自回归服务会增加 KV 缓存。", "减小 batch 或序列长度主要降低激活及缓存。", "LoRA 主要减少可训练参数的梯度和优化器状态。", "激活重计算用额外计算换存储。", "FlashAttention 减少注意力中间量。", "估算要声明精度、参数是否可训练和框架设置，不能只拿参数量乘一个固定倍数。"], "f": ["总显存≈权重+激活+梯度+优化器状态+缓存/工作区", "各项随训练或推理设置变化。"], "fq": "一个七十亿参数模型，用两字节存权重，大约需要多少空间？", "fa": "仅权重约十四 GB，按十进制计算。 换成 GiB 数值不同。 完整训练或推理还需额外内存，尤其长上下文缓存和训练激活，因此这不是显卡容量的完整要求。", "viz": "parallel", "src": "10.3 Transformer量化分析计算；3.1 SFT 监督微调", "id": "g6-3"}, {"topic": "微调与压缩", "q": "加权交叉熵如何定义，删除与降权有什么关系？", "tag": "必背", "key": "样本加权交叉熵先计算每条记录的损失，再乘非负权重，最后按权重和归一化", "a": ["权重为零意味着该样本不直接贡献这项损失，介于零和一则降低相对贡献。", "修复还会改变样本内容，和单纯降权不同。", "把所有权重乘同一正数，归一化后的损失不变。", "权重和为零时应跳过或明确拒绝，不能除零。", "样本级权重也不同于接口中的类别权重。", "存在 BatchNorm、对比负例或其他批内耦合时，零权重样本仍可能间接影响训练。"], "f": ["L=(Σ_i w_i CE_i)/(Σ_i w_i)，w_i≥0，Σ_i w_i>0。"], "fq": "为什么 w=0 有时并不等同于物理删除该样本？", "fa": "如果它仍参与批统计、对比学习的分母或随机采样过程，即使直接损失为零，也会影响其他样本。 完全等同需要逐样本损失可分且不存在这些耦合，并控制批量及训练步数。", "src": "10.4 八股面经（含答案）", "id": "g6-4"}, {"topic": "微调与压缩", "q": "PPL 怎样计算，为什么 SFT loss 不能用固定阈值判断好坏？", "tag": "必背", "key": "困惑度是有效预测 token 的平均负对数似然取指数，计算时要固定 tokenizer、文本、上下文窗口和哪些位置计入损失", "a": ["SFT 常只监督回答位置，因此与全序列预训练损失不能直接比。", "更低的训练 loss 可能表示拟合更好，也可能来自更容易的数据、重复、掩码口径或过拟合，没有低于零点五就只会一句话的通用规则。", "packing 还会改变文档边界及批内权重，需要控制跨样本注意力和归一化。", "最终仍看独立任务指标与能力保持。"], "f": ["PPL=exp[-(Σ_t m_t log p(x_t|context))/(Σ_t m_t)]。"], "fq": "多个 batch 的 PPL 可以直接平均吗？", "fa": "通常应先按有效 token 数加权汇总负对数似然，再取指数。 不同长度 batch 的 PPL 直接算术平均，和整体语料困惑度一般不相等。", "src": "12.2 Pretrain 阶段的评估；3.1 SFT 监督微调", "id": "g6-5"}, {"topic": "强化学习与 Agent", "q": "Agent 为什么要记录 trace，应该评价哪些指标？", "tag": "必背", "key": "最终答案成功率能说明任务是否完成，却不能解释失败发生在哪一步", "a": ["trace 应记录任务、模型和工具版本、输入摘要、工具调用参数、返回状态、耗时、费用与关键状态变化，再结合任务成功率、子目标进度、工具选择和参数正确率、重复动作与违规率分析。", "涉及外部副作用时，还要核对最终系统状态，而不是要求轨迹逐字等于参考答案。", "评测用固定任务集和可复现环境，敏感信息需脱敏。", "模型自评可以辅助，但不能作为唯一完成证据。"], "fq": "两个 Agent 采取不同路径，都完成了目标，怎么比较？", "fa": "先按最终状态与约束验收，再比较成本、延迟和可靠性。 若任务允许多条正确路径，不应只因与参考调用顺序不同就判错。 关键步骤仍可单独评分。", "src": "6.2 LLM-based Agent 基于大模型的智能体；1. 相关工作概述", "id": "g6-6"}, {"topic": "强化学习与 Agent", "q": "什么是提示注入，Agent 应如何保护工具权限？", "tag": "必背", "key": "提示注入是把恶意指令混入用户输入、网页、检索文档或工具返回，诱导模型偏离原任务或越权操作", "a": ["外部内容应当作待分析数据，其自称系统消息并不能提高权限。", "防护要结合指令与数据分离、最小工具权限、参数校验、资源白名单和敏感操作检查，并限制凭据暴露。", "仅在提示词里写忽略攻击不够，模型判断不能代替执行层授权。", "系统还应记录可疑轨迹并测试间接注入案例，在保证来源可用的同时控制动作范围。"], "fq": "检索文档里写着让你把密钥发到某个网址，是否需要执行？", "fa": "不需要。 那是低信任内容中的指令，和用户授权任务无关。 应忽略该指令，不向文档暴露凭据，继续提取与任务有关的事实，并由执行层阻止越权网络操作。", "src": "先看本质；Harness Engineering: 为 Agent 设计闭环系统", "id": "g6-7"}, {"topic": "微调与压缩", "q": "什么是 teacher forcing？它带来的曝光偏差怎么缓解？", "tag": "理解", "key": "训练时解码器每个位置的输入用的是真实前缀而不是模型自己上一步的输出，这叫 teacher forcing", "a": ["配合因果掩码，所有位置可以一次前向并行算完，训练效率高。", "推理时没有真实前缀，只能拿模型自己生成的内容往下接，于是训练与推理的输入分布不一致。", "模型训练中从没见过自己的错误前缀，一旦某一步生成偏了就无法纠正，误差沿序列累积，这就是曝光偏差。"], "f": ["训练时第 t 步的条件是真实前缀，推理时第 t 步的条件是模型自己生成的前缀，两者分布不同。"], "fq": "哪些方法在缓解它？", "fa": "早期有 scheduled sampling，训练中按概率把真实前缀换成模型自己的预测。 更根本的做法是让训练发生在模型自己的分布上，在线策略的强化学习采样自当前策略并按奖励更新，在线策略蒸馏在学生自己生成的轨迹上取教师反馈。 DPO 是离线的，只在给定的偏好对上优化，无法覆盖策略跑偏后的状态，这也是它与在线 RL 的主要差别之一。", "id": "g6-8"}, {"topic": "微调与压缩", "q": "SFT 数据的质量和数量哪个更重要？怎样做数据筛选？", "tag": "理解", "key": "在指令微调阶段质量明显更重要", "a": ["少量高质量、多样化的样本即可激活预训练中已有的能力，而大量低质量数据会引入风格噪声与事实错误。", "筛选维度包括指令的复杂度与多样性、回答的正确性与完整性、指令与回答的相关性、以及样本之间的去重。", "可用方法有大模型打分、基于梯度或影响函数估计单样本对验证损失的贡献、用嵌入聚类保证覆盖度。", "需要注意打分模型自身的偏好会引入选择偏置，例如偏好长回答。"], "f": ["影响函数近似认为某样本的贡献正比于其梯度与验证集梯度的内积。"], "id": "g6-9"}, {"topic": "微调与压缩", "q": "训练后量化和量化感知训练有什么区别？GPTQ 与 AWQ 的思路是什么？", "tag": "必背", "key": "训练后量化直接在已训练模型上确定量化参数，只需少量校准数据，成本低但低比特下精度损失明显", "a": ["量化感知训练在训练中插入伪量化算子，用直通估计回传梯度，让模型适应量化误差，精度更高但需要完整训练流程。", "GPTQ 做逐层重建误差最小化，沿用 OBQ 的二阶误差补偿，但放弃了 OBQ 按海森信息贪心挑选下一个权重的顺序策略，改成所有行按同一个固定顺序逐列量化，论文称之为任意顺序洞察。", "固定顺序让未量化集合与海森逆对所有行共用，复杂度大幅下降。", "每量化完一列，再用海森逆把该列的量化误差补偿到尚未量化的列上。", "AWQ 观察到少数激活幅值大的通道对精度影响远超其余，通过按通道缩放把这些重要通道的权重放大再量化，等价于保护显著权重，无需反向传播即可在四比特下保持精度。"], "f": ["对称均匀量化的缩放因子等于张量绝对值最大值除以量化上限所得的商，反量化等于整数值乘以缩放因子。"], "fq": "KV 缓存量化有什么特殊之处？", "fa": "KV 缓存是逐 token 动态生成的激活，分布随内容变化，不能像权重那样离线标定。 通常按通道或按 token 分组做动态量化，键对量化误差比值更敏感，常给键更高比特。 异常值通道需要单独保留高精度，否则长上下文下误差累积明显。", "viz": "quant", "id": "g6-10"}, {"topic": "微调与压缩", "q": "知识蒸馏有哪几种形式？温度起什么作用？", "tag": "理解", "key": "响应蒸馏让学生拟合教师的软标签概率分布，软标签包含类间相似结构，信息量大于硬标签", "a": ["特征蒸馏对齐中间层表示，需要维度映射。", "关系蒸馏对齐样本之间的相似度结构而非单点输出。", "在大模型上还有序列级蒸馏，直接用教师生成的文本做学生的监督数据，以及在线策略蒸馏，让学生自己生成、教师逐 token 打分反馈，避免学生只在教师分布上训练而在自己分布上失准的偏移问题。", "温度用于软化概率分布，温度越高分布越平滑，类间相对关系越突出，梯度需要乘以温度平方来补偿尺度。"], "f": ["蒸馏损失等于温度平方乘以学生与教师软分布的 KL 散度，通常再与真实标签的交叉熵加权求和。"], "fq": "为什么在线策略蒸馏比离线序列蒸馏更有效？", "fa": "离线蒸馏的训练数据来自教师分布，学生在推理时走的是自己的分布，一旦偏离就没有监督信号，误差累积。 在线策略蒸馏在学生自己生成的轨迹上取教师反馈，监督信号覆盖学生实际会遇到的状态，缓解了这种分布不匹配。", "viz": "sampling", "id": "g6-11"}, {"topic": "微调与压缩", "q": "结构化剪枝和非结构化剪枝的取舍是什么？", "tag": "理解", "key": "非结构化剪枝按权重重要性逐元素置零，理论压缩率高，但产生不规则稀疏，通用硬件无法直接加速，需要专门的稀疏算子或特定稀疏模式支持", "a": ["结构化剪枝整体删除注意力头、前馈通道、甚至整层，得到的仍是稠密小模型，可以直接获得实际加速，但同样稀疏率下精度损失更大。", "半结构化的 N 比 M 稀疏是折中，在每 M 个连续权重中保留 N 个非零，能被特定硬件加速。", "剪枝后通常需要少量微调恢复精度。"], "f": ["重要性常用权重绝对值与对应激活范数的乘积估计，也可用损失对该权重的二阶敏感度近似。"], "fq": "大模型时代剪枝为什么不如量化流行？", "fa": "大模型的瓶颈主要在显存带宽与容量，量化对这两者都直接见效且几乎不损精度。 剪枝要达到可观压缩率往往需要恢复训练，成本高，且结构化剪枝在大模型上精度损失明显。 实践中量化是首选，剪枝多用于特定部署约束。", "id": "g6-12"}, {"topic": "对齐与分布式推理", "q": "大模型作为评判者有哪些系统性偏置？", "tag": "理解", "key": "位置偏置指对先出现的候选打分偏高，缓解办法是交换顺序各评一次取平均", "a": ["长度偏置指偏好更长的回答，缓解办法是控制长度或在提示中明确要求不以长度判断。", "自我偏好指模型偏好自己或同族模型生成的文本。", "格式偏置指偏好带列表与标题的结构化输出。", "还有分数分布集中，多数样本被打成中间值，区分度低，改用成对比较可以缓解。", "使用前应在有人工标注的子集上校准，报告评判者与人类的一致率。"], "f": ["一致率可用 Cohen kappa 衡量，扣除随机一致后的净一致程度。"], "id": "g6-13"}, {"topic": "对齐与分布式推理", "q": "有 SFT 为什么还做偏好优化，怎样选择 SFT、DPO 或在线 RL？", "tag": "必背", "key": "SFT 学习示范输出，适合把明确的任务格式和正确行为教给模型，但单个示范未必表达多个可接受答案之间的偏好", "a": ["标准离线 DPO 使用同一提示下的优劣回答对，适合已有可靠比较数据的情形。", "在线 RL 通过当前策略采样，结合环境或奖励反馈探索新输出，但成本通常更高。", "选择应从反馈来源、覆盖范围、可验证性和计算预算出发。", "偏好噪声、基础能力不足和奖励错位都可能限制效果，所以不能把后训练理解成按固定顺序叠加越多越好。"], "fq": "某个错误 SFT 没改好，DPO 就一定能改好吗？", "fa": "不一定。 先判断是能力、知识、数据覆盖还是偏好排序问题。 若没有正确候选或可靠偏好，DPO 也可能没有足够监督。 应对具体 bad case 做同预算对照。", "src": "10.4 八股面经（含答案）", "id": "g7-1"}, {"topic": "对齐与分布式推理", "q": "PPO 的概率比率、优势与 clip 目标分别起什么作用？", "tag": "必背", "key": "PPO 用当前策略相对于收集样本的旧策略的概率比率，对优势进行加权更新", "a": ["优势为正的动作应更可能出现，优势为负的动作应被抑制。", "裁剪目标取未裁剪与裁剪项的较小值，在更新过度沿有利方向推进时停止增加该项收益，从而降低一次更新过大的风险。", "它允许一批采样做多轮小批量优化，但样本过旧仍有问题。", "clip 不是把全部概率变化硬截断，也不保证真实 KL 永远低于某个阈值，实际仍要监控分布偏移。"], "f": ["r_t(θ)=πθ(a_t|s_t)/πold(a_t|s_t)", "Lclip=E[min(r_t A_t,clip(r_t,1-ε,1+ε)A_t)]。"], "fq": "为什么一定是取 min，而不是总把比率截断以后乘优势？", "fa": "min 对正负优势都构造较保守的目标。 只对比率做无条件替换会改变某些方向的梯度，和原 PPO 裁剪目标不等价。 应分别检查 A 为正与为负时的分段情况。", "viz": "ppo", "src": "3.2 RL 强化学习基础；3.3 RLHF 基于人类反馈的强化学习", "id": "g7-2"}, {"topic": "对齐与分布式推理", "q": "DPO 的参考策略、偏好对与损失怎样解释？", "tag": "必背", "key": "DPO 对同一提示下的优选和劣选回答，比较它们相对于参考策略的序列对数概率提升，再用逻辑损失推动优选回答占优", "a": ["参考策略提供相对变化的基准，避免只比较当前模型的绝对概率。", "标准形式无需在训练时单独拟合奖励模型，也不需要像 PPO 那样每步在线采样，但仍依赖偏好对质量与覆盖。", "序列概率应按有效回答 token 求和，提示与 padding 的口径要统一。", "随意改成长度平均会改变目标，不能当作原始公式的无影响实现细节。"], "f": ["Δ=log[πθ(y+|x)/πref(y+|x)]-log[πθ(y-|x)/πref(y-|x)]", "L=-log σ(βΔ)。"], "fq": "DPO 可以只不断降低劣选回答的概率吗？", "fa": "损失主要约束相对差值，并不单独保证优选回答的绝对概率必然上升。 因此要检查实际生成行为、优选概率和能力保持，不能只看训练偏好准确率。", "viz": "dpo", "src": "3.4 DPO 直接偏好优化；10.4 八股面经（含答案）", "id": "g7-3"}, {"topic": "对齐与分布式推理", "q": "GRPO 怎样构造组内优势，奖励怎样避免被投机利用？", "tag": "必背", "key": "GRPO 对同一提示采样多条输出，利用组内奖励的相对位置构造优势，减少对独立价值模型的依赖", "a": ["常见做法是奖励减组均值，再按组标准差归一化。", "若同组奖励完全相同，奖励部分没有区分信号。", "增加一个小常数只能避免除零，不能创造有效反馈。", "需要独立评测、失败样本和盲听检查，因为策略可能提高奖励分数却降低实际质量。"], "f": ["A_i=(R_i-mean(R))/(std(R)+ε)", "同组 R_i 相等时 A_i=0。"], "fq": "组内优势全为零，是否表示任何参数更新都必然为零？", "fa": "不一定。 奖励加权的策略梯度没有区分信号，但实现中若还有 KL 正则、辅助损失或其他非零项，仍可能更新。 应分别检查各损失项，而不是只看总 loss。", "viz": "grpo", "src": "3.3 RLHF 基于人类反馈的强化学习；10.4 八股面经（含答案）", "id": "g7-4"}, {"topic": "对齐与分布式推理", "q": "old policy、reference、reward model 与 critic 的角色分别是什么？", "tag": "必背", "key": "old policy 是生成本批训练样本的策略，用于计算新旧动作概率比", "a": ["reference 是参考策略，用于限制偏离。", "reward model 为结果或过程评分。", "critic 估计状态价值，辅助计算优势和长期收益。", "四者功能不同，不能因为初始权重相同就混称。", "PPO 常用 critic，GRPO 利用组内相对奖励减少独立价值模型需求。", "旧策略会随采样批次更新，参考策略可长期固定。", "删除参考 KL 项也不会自动产生最大熵目标。"], "fq": "old policy 与 reference 都不更新，为什么还要区分？", "fa": "old policy 通常随采样批次更新，是本批 rollout 的行为策略。 reference 可以长期固定。 前者处理采样分布校正，后者定义参考约束，生命周期和数学作用不同。", "viz": "rlhf", "src": "3.3 RLHF 基于人类反馈的强化学习；10.4 八股面经（含答案）", "id": "g7-5"}, {"topic": "强化学习与 Agent", "q": "Agent 链路很慢，如何判断该并行、缓存还是减少调用？", "tag": "必背", "key": "先按 trace 拆分模型推理、工具执行、网络和等待时间，再画出真实依赖", "a": ["相互独立的只读查询可以并行，有前置状态依赖的操作不能硬并行。", "固定重复子流程可下沉成确定性服务，减少模型决策轮数。", "稳定查询结果可以带版本和有效期缓存。", "长工具输出则保留摘要与引用，控制上下文。", "优化需要比较端到端成功率与尾延迟，不能为速度跳过验证。", "也不能把旧缓存用于已经变化的业务状态，或重复执行有副作用的操作。"], "fq": "有四个工具，是不是每轮同时调用四个最省时间？", "fa": "不是。 先确认是否都需要、是否相互独立及是否有共享写状态。 并行可以缩短独立任务的关键路径，但无用调用会增加成本，依赖错误还会降低正确性。", "src": "10.4 八股面经（含答案）", "id": "g7-6"}, {"topic": "机器学习与评估", "q": "XGBoost 如何利用一阶和二阶信息，怎样处理复杂度和缺失值？", "tag": "必背", "key": "XGBoost 在当前模型附近对损失做二阶展开，用样本的一阶梯度和 Hessian 汇总计算叶子权重及分裂收益，并加入树复杂度和叶权重正则", "a": ["它还利用分桶、稀疏感知等工程设计提高效率。", "训练时可为缺失值学习分裂的默认方向，不等于恢复该字段的真实值。", "Boosting 轮次仍需顺序推进，并行主要发生在统计或分裂搜索等环节。", "二阶信息和正则也不保证任何数据上都优于其他方法，仍要调参并控制相同评测条件。"], "f": ["固定叶结构、仅L2时：w_j*=-G_j/(H_j+λ)", "G_j=Σ_i g_i，H_j=Σ_i h_i。"], "fq": "缺失值学到默认方向，能否声称完成了数据修复？", "fa": "不能。 它是预测模型内部的路由策略，不输出或证明缺失字段的真实内容。 讨论数据质量与修复正确率时，应把这种模型容错和显式修复区分。", "viz": "gbdt", "src": "10.6 机器学习深度学习八股（初稿）", "id": "g7-7"}, {"topic": "对齐与分布式推理", "q": "KV 缓存占多少显存？给个算例。", "tag": "必背", "key": "每个 token 在每一层要存键和值两份，每份是键值头数乘以头维", "a": ["乘上层数、序列长度、批大小与每个数的字节数，就是总占用。", "用 MHA 的 7B 模型举例，层数 32、键值头数 32、头维 128、半精度每个数 2 字节，每 token 每层是 2 乘 32 乘 128 乘 2，等于 16 KB，乘 32 层得每 token 512 KB。", "4096 长度的一条序列就要 2 GiB，批大小 8 是 16 GiB，而这个模型的半精度权重约 13 GiB，缓存已经比权重还大。", "换成键值头数为 8 的 GQA，这个数直接降到四分之一。"], "f": ["缓存字节数等于 2 乘层数乘键值头数乘头维乘批大小乘序列长度乘每数字节数。"], "fq": "除了换 GQA 还有什么办法降？", "fa": "缓存量化到 8 比特或 4 比特，键对误差更敏感通常给更高比特。 用 MLA 把键值压到低维隐空间只存隐向量。 滑动窗口只保留最近若干 token 加上开头几个作为注意力汇聚点。 用 PagedAttention 消除预留浪费并让相同前缀共享块。", "viz": "heads", "id": "g7-8"}, {"topic": "对齐与分布式推理", "q": "MoE 的路由怎样工作？负载不均衡会造成什么后果，怎样缓解？", "tag": "必背", "key": "MoE 把前馈层替换成多个专家，路由网络对每个 token 计算各专家的打分，取 top-k 个激活并按归一化权重加权求和", "a": ["参数总量随专家数增长，但每个 token 的计算量只和 k 有关，因此实现参数扩展与计算解耦。", "负载不均衡指少数专家被大量 token 选中而其余闲置，后果是这些专家所在设备成为瓶颈，超出容量的 token 被丢弃或走残差直连，训练信号损失且质量下降。", "缓解手段包括辅助负载均衡损失、专家容量因子加溢出处理、路由加噪增加探索，以及 DeepSeek-V3 的无辅助损失方案。", "该方案给每个专家配一个偏置加到亲和度打分上，偏置只影响 top-k 选择，不进入最终的加权系数。", "每个训练步结束后，过载专家的偏置减去固定步长，欠载专家的偏置加上固定步长，按规则更新而不靠梯度。", "共享专家始终激活，负责通用能力，其余路由专家负责专精，减少知识冗余。"], "f": ["负载均衡损失等于专家数乘以各专家实际分配比例与路由概率均值的内积。理想均衡时该值等于一。"], "fq": "MoE 推理的瓶颈和稠密模型有什么不同？", "fa": "稠密模型解码阶段受显存带宽限制。 MoE 参数量大但激活稀疏，显存占用按总参数计而带宽按激活参数计，因此显存容量压力大而算力利用率低。 分布式部署时专家并行引入全对全通信，批内 token 路由分散会放大通信开销，需要做专家放置优化与批内路由聚合。", "viz": "moe", "id": "g7-9"}, {"topic": "对齐与分布式推理", "q": "数据并行、张量并行、流水线并行、专家并行各切分什么？怎样组合？", "tag": "必背", "key": "数据并行切分样本，每张卡持有完整模型副本，反向后对梯度做全归约，通信量与参数量成正比", "a": ["张量并行切分单层内的权重矩阵，前向与反向在层内做全归约，通信频繁且对带宽敏感，通常限制在单机内的高速互联域。", "流水线并行按层切分模型，不同卡负责不同阶段，通过微批次流水填充减少空泡，通信量小但存在气泡损失且显存在各阶段不均。", "专家并行把 MoE 的专家分散到不同卡，引入全对全通信。", "实际训练采用三维或四维组合，机内用张量并行与专家并行，机间用流水线并行与数据并行，按互联带宽从高到低分配通信最密集的维度。"], "f": ["流水线气泡比例约等于阶段数减一，除以微批次数加阶段数减一所得的商。增大微批次数可压低气泡。"], "fq": "ZeRO 的三个阶段分别切什么？", "fa": "阶段一切优化器状态，阶段二再切梯度，阶段三再切参数。 显存随并行度线性下降，代价是阶段三在前向反向时需要按需收集参数，通信量增加。 ZeRO 属于数据并行的显存优化，不改变计算切分方式。", "viz": "parallel", "id": "g7-10"}, {"topic": "对齐与分布式推理", "q": "prefill 和 decode 阶段的瓶颈分别是什么？连续批处理为什么有效？", "tag": "必背", "key": "prefill 一次处理整个提示，矩阵乘法规模大，算力利用率高，受算力限制", "a": ["decode 每步只产生一个 token，权重读取量与计算量之比极高，受显存带宽限制，批大小小时 GPU 大量空闲。", "连续批处理不等整批请求都结束才换批，而是在每个解码步动态加入新到达的请求、移出已完成的请求，使批内始终保持较高的有效并发。", "这把带宽受限阶段的权重读取分摊到更多请求上，吞吐显著提升，同时因为新请求不必排队等待整批结束，首 token 延迟也下降。"], "f": ["算术强度等于浮点运算次数与访存字节数之比。decode 阶段该比值接近批大小，因此提高批大小直接提高利用率。"], "fq": "PagedAttention 解决什么问题？", "fa": "解决 KV 缓存的显存碎片与预留浪费。 传统实现按最大长度为每个请求预留连续显存，实际长度远小于上限时浪费严重。 PagedAttention 借鉴虚拟内存分页，把缓存切成固定大小的块，按需分配并用页表索引，显存利用率大幅提高，还使多个请求共享相同前缀的块成为可能。", "viz": "heads", "id": "g7-11"}, {"topic": "对齐与分布式推理", "q": "投机解码为什么能加速？它会改变输出分布吗？", "tag": "必背", "key": "草稿模型快速生成若干候选 token，目标模型对这几个位置做一次并行前向即可拿到全部位置的概率，再逐位置做接受或拒绝判定", "a": ["加速来源于把多个串行的带宽受限步骤合并成一次并行前向，而一次前向处理多个位置几乎不增加时间。", "接受采样的设计保证最终输出分布与直接用目标模型采样完全一致，因此不损失质量。", "加速比取决于接受率，接受率由草稿与目标模型的分布接近程度决定，草稿模型太弱则频繁拒绝，收益消失。"], "f": ["接受概率取目标概率与草稿概率之比与一的较小者。拒绝时从两者之差的正部归一化后重采样，保证边缘分布不变。"], "fq": "除了小模型做草稿还有什么变体？", "fa": "自投机用同一模型跳层或早退出产生草稿。 Medusa 在模型上加多个预测头一次预测多个未来位置。 前瞻解码用雅可比迭代并行求解多个位置。 还可以用 n-gram 缓存直接从历史文本中检索候选，对重复性强的场景特别有效。", "viz": "specdec", "id": "g7-12"}, {"topic": "强化学习与 Agent", "q": "什么时候用多 Agent，为什么多个角色不一定更好？", "tag": "必背", "key": "它能隔离上下文并利用不同工具，但增加通信、重复工作和状态一致性成本", "a": ["若任务很短或步骤固定，单 Agent 加工作流可能更简单。", "任务分配应明确输入输出、责任、共享状态和验收标准，避免多个 Agent 同时修改同一对象。", "多角色互相赞同也不代表独立证据，最终仍要依据真实数据和执行结果。"], "fq": "如何避免两个 Agent 重复调用同一个昂贵工具？", "fa": "共享任务状态、去重键和结果缓存，明确子任务边界。 需要写状态的步骤通过单一协调者或明确的并发控制执行。 先看依赖与资源，不只给角色起不同名字。", "src": "6.2 LLM-based Agent 基于大模型的智能体；先看本质", "id": "g8-1"}, {"topic": "生成模型", "q": "残差向量量化（RVQ）怎样工作？相比单码本有什么优势？", "tag": "必背", "key": "单码本要达到 N 比特精度需要 2 的 N 次方个条目，参数量与查找开销随比特数指数增长", "a": ["RVQ 把量化拆成多级，第一级量化原向量并输出索引，随后计算残差，第二级量化该残差，依此类推，最终重建是各级码字之和。", "K 个码本各含 M 条目，等效容量为 M 的 K 次方，但存储只有 K 乘以 M。", "另一个好处是天然支持可变码率，推理时只用前若干级即可得到粗糙但可用的重建，这被称为量化器丢弃训练，使同一模型覆盖多个码率点。"], "f": ["重建向量等于各级码字之和。第 k 级的输入是原向量减去前 k 减 1 级码字之和得到的残差。"], "fq": "码本坍缩指什么，怎样缓解？", "fa": "坍缩指大部分码字从不被选中，有效码本远小于名义大小，量化误差居高不下。 缓解手段包括码字的指数滑动平均更新、对长期未使用的码字做随机重启、码本与输入都做 L2 归一化后按余弦距离查找、加入多样性或熵正则鼓励均匀使用。 DAC 采用因子分解降维查找并配合归一化，显著提升利用率。", "id": "g9-2"}, {"topic": "生成模型", "q": "向量量化不可导，训练时梯度怎样回传？", "tag": "必背", "key": "用直通估计", "a": ["前向传播输出量化后的码字，反向传播时把量化算子当作恒等映射，直接把解码器传来的梯度复制给编码器输出。", "为了让码本靠近编码器输出、编码器输出也不要漂离码本，额外加两项损失，一项更新码本使其逼近编码器输出，另一项是承诺损失约束编码器输出靠近所选码字，后者带系数。", "工程实现常用指数滑动平均更新码本替代梯度更新，更稳定。"], "f": ["量化输出写作编码器输出加上码字减去编码器输出后再取停止梯度的差。承诺损失等于系数乘以编码器输出与停止梯度后码字之差的平方范数。"], "fq": "承诺损失系数取太大或太小会怎样？", "fa": "太小则编码器输出自由漂移，码本追不上，量化误差增大且训练不稳。 太大则编码器被过度约束，表达能力受限，重建质量下降。 常用取值在 0.25 附近。", "id": "g9-3"}, {"topic": "生成模型", "q": "FSQ 相比 RVQ 有什么不同？为什么有人用它替代 VQ？", "tag": "理解", "key": "有限标量量化不维护显式码本，而是把隐向量投影到很低的维度，对每个维度做固定网格的标量四舍五入，隐式码本大小等于各维度取值数的连乘", "a": ["它没有码本更新过程，因此不存在坍缩问题，也不需要承诺损失，实现简单且利用率接近满。", "代价是码字分布受限于规则网格，在同等容量下重建质量通常略逊于精心训练的 RVQ，并且维度必须压得很低。"], "f": ["隐式码本大小等于各维度量化级数的连乘。例如 6 维每维 8 级得到 8 的 6 次方，即 262144。"], "fq": "什么场景下优先考虑 FSQ？", "fa": "训练不稳定、码本利用率长期偏低，或者希望简化工程链路时。 生成式建模里若下游只需要离散序列而不追求极限保真，FSQ 的稳定性收益往往超过质量损失。", "id": "g9-5"}, {"topic": "生成模型", "q": "无分类器引导（CFG）怎样工作？引导强度越大越好吗？", "tag": "必背", "key": "训练时以一定概率丢弃条件，使同一模型同时学会条件生成和无条件生成", "a": ["采样时把两路预测做外推，得到强化条件方向的预测。", "引导强度控制外推幅度。", "强度过小则条件相关性弱，文本描述得不到体现。"], "f": ["引导后的预测等于无条件预测，加上引导系数乘以条件预测与无条件预测之差。"], "fq": "除了调强度还有什么办法改善条件遵循？", "fa": "用动态引导，在采样早期用大强度确定整体结构，后期减小以保留细节。 或者引入负向提示，把不想要的属性作为额外的无条件分支。 也可以在数据侧提高描述质量与覆盖度，从根本上减少对强引导的依赖。", "id": "g9-9"}, {"topic": "生成模型", "q": "DDPM 的前向与反向过程是什么？预测噪声、预测原图、预测速度三种参数化有什么区别？", "tag": "必背", "key": "前向过程按预定方差表逐步加高斯噪声，任意步的边缘分布可以闭式写出，训练时可直接采样任意时刻而不必迭代", "a": ["反向过程学习逐步去噪，训练目标简化为预测所加噪声的均方误差。", "三种参数化的差别体现在高低噪声两端。", "预测噪声在低噪声区表现好。", "到了高噪声区，输入几乎全是噪声，预测噪声近乎平凡，而由预测的噪声反推原图要除以累积保留系数的平方根，该系数趋近零，预测误差被成倍放大。", "预测原图正好相反，在高噪声区数值稳定，在低噪声区输入几乎就是原图，目标近乎平凡，反推噪声要除以一减该系数后的平方根，误差同样被放大。", "预测速度是两者的线性组合，在高低噪声两端都不会退化成平凡目标，训练更稳定，也便于少步采样与蒸馏，Progressive Distillation 正是为此改用速度参数化。", "流匹配回归的目标同样是速度场，只是概率路径的定义不同。"], "f": ["任意步的样本等于累积保留系数的平方根乘以原样本，加上一减该系数后的平方根乘以标准高斯噪声。速度参数化的目标等于该系数平方根乘以噪声，减去一减该系数的平方根乘以原样本。"], "fq": "DDIM 相比 DDPM 快在哪？", "fa": "DDIM 把采样改成确定性的非马尔可夫过程，允许跳步，用远少于训练步数的步数完成采样，且同一初始噪声对应确定输出，便于做插值与可控编辑。 代价是多样性略低于随机采样。", "viz": "diffusion", "id": "g9-14"}, {"topic": "生成模型", "q": "DiT 相比 UNet 有什么优势？条件怎样注入？", "tag": "理解", "key": "DiT 把隐空间切成 patch 序列用 Transformer 处理，去掉了 UNet 的卷积归纳偏置", "a": ["优势是扩展性好，模型规模与计算量增加时质量持续提升且规律可预测，便于套用语言模型成熟的并行训练与优化经验。", "条件注入主流做法是自适应层归一化，把时间步与类别或文本嵌入映射成归一化层的缩放和平移参数，再加上一个门控系数控制残差分支强度，这种方式比直接拼接 token 或交叉注意力更参数高效。", "对长文本条件仍会保留交叉注意力。"], "f": ["自适应归一化写作，输出等于归一化后的特征乘以由条件预测的缩放，加上由条件预测的平移，残差分支再乘以由条件预测的门控。"], "fa": "Seed-Music 与 Stable Audio 一类系统都采用扩散 Transformer 生成连续隐变量。", "id": "g9-15"}, {"topic": "生成模型", "q": "VAE、VQ-VAE、VQGAN 的关系是什么？", "tag": "理解", "key": "VAE 学习连续隐变量的后验分布，用重参数化技巧采样，损失为重建误差加隐分布与先验的 KL 散度", "a": ["问题是重建偏模糊，KL 项过强时还会出现后验坍缩。", "VQ-VAE 把隐空间换成离散码本，用最近邻查找替代采样，避免了 KL 项与后验坍缩，且离散序列可以交给自回归先验建模，但仅用重建损失时细节仍然不足。", "VQGAN 在 VQ-VAE 上加入对抗损失与感知损失，让解码器生成锐利纹理，使离散隐空间在高分辨率上可用，成为后续离散生成模型的标准组件。"], "f": ["VAE 损失等于重建负对数似然，加上后验与先验的 KL 散度。VQ-VAE 把 KL 项换成码本损失与承诺损失。"], "fq": "为什么生成模型普遍要先压到隐空间再建模？", "fa": "原始信号维度高且大量容量被感知无关的细节占据。 先用自编码器压缩掉这些细节，让生成模型专注于语义与结构层面的分布，显著降低计算量并提升生成质量。", "id": "g9-16"}, {"topic": "分词", "q": "什么是 BPE？", "tag": "定义", "key": "从字符或字节出发，反复统计相邻符号对的频次，把最高频的一对合并成新符号，直到词表达到目标大小", "a": ["从字符或字节出发，反复统计相邻符号对的频次，把最高频的一对合并成新符号，直到词表达到目标大小。", "字节级 BPE 以字节为初始单元，不会出现未登录词。", "分词粒度决定序列长度，直接影响训练与推理成本。"], "terms": ["BPE"], "id": "d1"}, {"topic": "评估", "q": "什么是 困惑度 PPL？", "tag": "定义", "key": "对数似然取负后按 token 平均再取指数，衡量模型对文本的预测不确定性", "a": ["对数似然取负后按 token 平均再取指数，衡量模型对文本的预测不确定性。", "只能在同一 tokenizer 与同分布语料上横比，不能跨模型直接比较，也不反映指令遵循质量。"], "terms": ["困惑度 PPL"], "id": "d2"}, {"topic": "评估", "q": "什么是 BLEU 与 ROUGE？", "tag": "定义", "key": "BLEU 看生成里有多少 n-gram 出现在参考里（偏准确率），ROUGE 看参考里有多少被生成覆盖（偏召回）", "a": ["BLEU 看生成里有多少 n-gram 出现在参考里（偏准确率），ROUGE 看参考里有多少被生成覆盖（偏召回）。", "都依赖字面重叠，对同义改写不敏感，开放生成任务上与人评相关性弱。"], "terms": ["BLEU 与 ROUGE"], "id": "d3"}, {"topic": "评估", "q": "什么是 检索指标 mAP、Recall@K、MRR？", "tag": "定义", "key": "mAP 衡量整体排序质量，Recall@K 看前 K 个里召回了多少相关项，MRR 是第一个正确结果排名倒数的平均", "a": ["mAP 衡量整体排序质量，Recall@K 看前 K 个里召回了多少相关项，MRR 是第一个正确结果排名倒数的平均。"], "terms": ["检索指标 mAP、Recall@K、MRR"], "id": "d4"}, {"topic": "评估", "q": "什么是 LLM-as-judge？", "tag": "定义", "key": "用大模型给生成结果打分或做成对比较", "a": ["用大模型给生成结果打分或做成对比较。", "存在位置偏置、长度偏置、自我偏好与格式偏置。", "用前需在人工标注子集上校准并报告一致率。"], "terms": ["LLM-as-judge"], "id": "d5"}, {"topic": "数据", "q": "什么是 去重？", "tag": "定义", "key": "精确去重用哈希或指纹，近重复用嵌入近邻或 MinHash", "a": ["精确去重用哈希或指纹，近重复用嵌入近邻或 MinHash。", "重复数据让模型反复看到同一内容，表现为生成趋同与评测虚高。"], "terms": ["去重"], "id": "d6"}, {"topic": "数据", "q": "什么是 配比 Data Mixture？", "tag": "定义", "key": "不同来源、领域、质量档在训练集里的混合比例", "a": ["不同来源、领域、质量档在训练集里的混合比例。", "常用小规模代理实验扫描后外推，或按各组损失下降速度在线调权。", "评测集必须覆盖所有分组，否则配比会被优化到只利于头部。"], "terms": ["配比 Data Mixture"], "id": "d7"}, {"topic": "数据", "q": "什么是 课程学习？", "tag": "定义", "key": "按难度或质量排序，先易后难或先高质量后全量", "a": ["按难度或质量排序，先易后难或先高质量后全量。", "在数据质量参差时收益明显。", "风险是排序信号本身有偏，把某类数据系统性推后。"], "terms": ["课程学习"], "id": "d8"}, {"topic": "数据", "q": "什么是 数据选择？", "tag": "定义", "key": "在预算约束下挑选对下游任务收益最大的子集", "a": ["在预算约束下挑选对下游任务收益最大的子集。", "单一质量分数容易与任务目标错配，实践中用互补的多路信号。", "验证收益必须用等预算对照实验，固定样本量与训练步数。"], "terms": ["数据选择"], "id": "d9"}, {"topic": "数据", "q": "什么是 长尾分布？", "tag": "定义", "key": "少数类别占据大部分样本，多数类别样本极少", "a": ["少数类别占据大部分样本，多数类别样本极少。", "直接按自然分布训练会让头部主导，尾部条件遵循弱。", "可用温度采样把类别概率取幂压平，评价时必须分组报告。"], "terms": ["长尾分布"], "id": "d10"}, {"topic": "归一化", "q": "什么是 LayerNorm 与 BatchNorm？", "tag": "定义", "key": "LayerNorm 在单个样本的特征维上算均值方差，BatchNorm 在批次维上算并维护滑动统计", "a": ["LayerNorm 在单个样本的特征维上算均值方差，BatchNorm 在批次维上算并维护滑动统计。", "LayerNorm 与批大小无关且训练推理行为一致，适合变长序列。", "BatchNorm 在小批量和序列任务上不稳。"], "terms": ["LayerNorm 与 BatchNorm"], "id": "d11"}, {"topic": "归一化", "q": "什么是 RMSNorm？", "tag": "定义", "key": "只用均方根缩放，去掉减均值与平移", "a": ["只用均方根缩放，去掉减均值与平移。", "比 LayerNorm 少一次归约与一组参数，质量相当，是当前大模型默认。"], "terms": ["RMSNorm"], "id": "d12"}, {"topic": "归一化", "q": "什么是 Pre-Norm 与 Post-Norm？", "tag": "定义", "key": "Pre-Norm 把归一化放在子层输入侧，Post-Norm 放在残差相加之后", "a": ["Pre-Norm 把归一化放在子层输入侧，Post-Norm 放在残差相加之后。", "Pre-Norm 的残差路径是恒等通路，深层训练稳定，不必复杂预热。", "Post-Norm 表达力略强但深层易梯度消失。"], "terms": ["Pre-Norm 与 Post-Norm"], "id": "d13"}, {"topic": "激活", "q": "什么是 GELU、Swish、SwiGLU？", "tag": "定义", "key": "GELU 用高斯累积分布做平滑门控，Swish 是输入乘自身 sigmoid，SwiGLU 是用 Swish 做门的门控线性单元", "a": ["GELU 用高斯累积分布做平滑门控，Swish 是输入乘自身 sigmoid，SwiGLU 是用 Swish 做门的门控线性单元。", "SwiGLU 需要三个权重矩阵，为保持参数量一致把中间维从四倍隐维改成三分之八倍隐维。"], "terms": ["GELU、Swish、SwiGLU"], "id": "d14"}, {"topic": "架构", "q": "什么是 残差连接？", "tag": "定义", "key": "把子层输出与输入相加再传给下一层", "a": ["把子层输出与输入相加再传给下一层。", "提供梯度直达浅层的通路，使深层网络可训练。", "没有残差，几十层的 Transformer 无法收敛。"], "terms": ["残差连接"], "id": "d15"}, {"topic": "架构", "q": "什么是 三种 Transformer 形态？", "tag": "定义", "key": "Encoder-only 双向编码适合理解，代表 BERT，Decoder-only 因果解码适合生成，代表 GPT，Encoder-Decoder 先编码输入再用交叉注意力解码，代表 T5", "a": ["Encoder-only 双向编码适合理解，代表 BERT，Decoder-only 因果解码适合生成，代表 GPT，Encoder-Decoder 先编码输入再用交叉注意力解码，代表 T5。", "当前大模型几乎都是 Decoder-only，原因是训练目标统一、零样本泛化好、KV 缓存推理简单。"], "terms": ["三种 Transformer 形态"], "id": "d16"}, {"topic": "架构", "q": "什么是 MoE 混合专家？", "tag": "定义", "key": "把前馈层换成多个专家，路由网络为每个 token 选 top-k 个专家激活并加权求和", "a": ["把前馈层换成多个专家，路由网络为每个 token 选 top-k 个专家激活并加权求和。", "总参数随专家数增长而每 token 计算量只和 k 有关。", "它和混合注意力不是一回事，MoE 混的是前馈层专家，混合注意力混的是注意力层的类型。", "核心难点是负载均衡。"], "terms": ["MoE 混合专家"], "id": "d17"}, {"topic": "正则", "q": "什么是 Dropout 与权重衰减？", "tag": "定义", "key": "Dropout 训练时随机置零一部分激活，权重衰减在损失里加参数范数惩罚", "a": ["Dropout 训练时随机置零一部分激活，权重衰减在损失里加参数范数惩罚。", "大模型预训练阶段通常不用 Dropout，因为数据量足够且单个样本只见一次。", "权重衰减仍然保留。"], "terms": ["Dropout 与权重衰减"], "id": "d18"}, {"topic": "优化", "q": "什么是 Adam 与 AdamW？", "tag": "定义", "key": "Adam 用梯度的一阶矩与二阶矩做逐参数自适应步长，AdamW 把权重衰减从梯度里分离，直接作用在参数上", "a": ["Adam 用梯度的一阶矩与二阶矩做逐参数自适应步长，AdamW 把权重衰减从梯度里分离，直接作用在参数上。", "Adam 里把 L2 正则加进梯度后会被二阶矩缩放，衰减强度因参数而异。", "AdamW 解耦后衰减可控，是大模型默认。"], "terms": ["Adam 与 AdamW"], "id": "d19"}, {"topic": "训练", "q": "什么是 混合精度 fp16 与 bf16？", "tag": "定义", "key": "前向与反向用 16 位浮点计算，主权重与优化器状态保留 32 位副本", "a": ["前向与反向用 16 位浮点计算，主权重与优化器状态保留 32 位副本。", "fp16 指数位只有 5 位，小梯度会下溢，需要损失缩放。", "bf16 指数位与 fp32 相同，动态范围一致，不需要损失缩放。"], "terms": ["混合精度 fp16 与 bf16"], "id": "d20"}, {"topic": "训练", "q": "什么是 预训练 Pre-training？", "tag": "定义", "key": "在大规模无标注语料上做自监督学习，目标通常是预测下一个 token", "a": ["在大规模无标注语料上做自监督学习，目标通常是预测下一个 token。", "决定模型的知识与能力上限，后训练只是把已有能力对齐到指令形式。"], "terms": ["预训练 Pre-training"], "id": "d21"}, {"topic": "训练", "q": "什么是 SFT 监督微调？", "tag": "定义", "key": "在指令与回答配对数据上做有监督的下一 token 预测，通常只在回答部分计算损失", "a": ["在指令与回答配对数据上做有监督的下一 token 预测，通常只在回答部分计算损失。", "质量比数量重要，少量高质量多样样本即可激活能力，低质量数据会引入风格噪声与事实错误。"], "terms": ["SFT 监督微调"], "id": "d22"}, {"topic": "训练", "q": "什么是 ICL 上下文学习？", "tag": "定义", "key": "在提示里给几个示例，模型不更新参数就能完成新任务", "a": ["在提示里给几个示例，模型不更新参数就能完成新任务。", "与 SFT 的区别是不改参数，成本低但受上下文长度限制，且效果对示例顺序敏感。"], "terms": ["ICL 上下文学习"], "id": "d23"}, {"topic": "训练", "q": "什么是 CoT 思维链？", "tag": "定义", "key": "让模型先写推理步骤再给答案", "a": ["让模型先写推理步骤再给答案。", "把一步映射变成多步计算，等价于给模型更多的计算预算。", "对需要多步推理的任务提升明显，对检索型任务几乎无用。"], "terms": ["CoT 思维链"], "id": "d24"}, {"topic": "训练", "q": "什么是 RLHF？", "tag": "定义", "key": "用人类偏好数据训奖励模型，再用 PPO 优化策略，同时用 KL 惩罚约束不偏离参考策略", "a": ["用人类偏好数据训奖励模型，再用 PPO 优化策略，同时用 KL 惩罚约束不偏离参考策略。", "需要策略、参考、奖励、价值四个模型同驻，工程复杂度高。"], "terms": ["RLHF"], "id": "d25"}, {"topic": "训练", "q": "什么是 DPO 直接偏好优化？", "tag": "定义", "key": "跳过奖励模型，直接在偏好对上优化一个由策略与参考策略对数比构成的损失", "a": ["跳过奖励模型，直接在偏好对上优化一个由策略与参考策略对数比构成的损失。", "只需策略与参考两个模型，稳定且实现简单。", "代价是离线训练，无法在策略自己的分布上纠偏。"], "terms": ["DPO 直接偏好优化"], "id": "d26"}, {"topic": "训练", "q": "什么是 GRPO 组相对策略优化？", "tag": "定义", "key": "对同一提示采样一组回复，用组内奖励的标准化值当优势，去掉价值模型", "a": ["对同一提示采样一组回复，用组内奖励的标准化值当优势，去掉价值模型。", "相比 PPO 少一个需要训练的模型，显存与工程复杂度明显下降。", "组内奖励全相同时优势退化为零，该提示对梯度无贡献。"], "terms": ["GRPO 组相对策略优化"], "id": "d27"}, {"topic": "训练", "q": "什么是 RLVR 可验证奖励强化学习？", "tag": "定义", "key": "奖励由规则或程序直接判定，例如答案比对、单元测试、格式校验", "a": ["奖励由规则或程序直接判定，例如答案比对、单元测试、格式校验。", "奖励无噪声且难被语言层面的讨好行为欺骗，可长时间大幅优化。", "限制是任务必须能自动验证。"], "terms": ["RLVR 可验证奖励强化学习"], "id": "d28"}, {"topic": "训练", "q": "什么是 奖励投机 Reward Hacking？", "tag": "定义", "key": "策略找到提高奖励模型分数但实际质量下降的捷径", "a": ["策略找到提高奖励模型分数但实际质量下降的捷径。", "典型表现是回答越写越长或刻意迎合评分偏好。", "缓解靠 KL 约束、多个异构奖励模型、定期用人评校准。"], "terms": ["奖励投机 Reward Hacking"], "id": "d29"}, {"topic": "训练", "q": "什么是 Scaling Law？", "tag": "定义", "key": "模型损失随参数量、数据量与计算量按幂律下降", "a": ["模型损失随参数量、数据量与计算量按幂律下降。", "Chinchilla 的结论是给定算力下参数量与训练 token 数应同比例增长，经验上约每个参数配 20 个 token。"], "terms": ["Scaling Law"], "id": "d30"}, {"topic": "训练", "q": "什么是 灾难性遗忘？", "tag": "定义", "key": "在新任务上微调后，模型在旧任务上的能力明显下降", "a": ["在新任务上微调后，模型在旧任务上的能力明显下降。", "缓解手段有混入少量通用数据做回放、降低学习率、只训练 LoRA 这类少量参数。"], "terms": ["灾难性遗忘"], "id": "d31"}, {"topic": "训练", "q": "什么是 数据、张量、流水线并行与 ZeRO？", "tag": "定义", "key": "数据并行切样本，张量并行切层内矩阵，流水线并行按层切模型，ZeRO 在数据并行内依次切优化器状态、梯度与参数", "a": ["数据并行切样本，张量并行切层内矩阵，流水线并行按层切模型，ZeRO 在数据并行内依次切优化器状态、梯度与参数。", "张量并行通信最密集，一般放在单机高速互联内。", "流水线并行有气泡，靠增加微批次压低。"], "terms": ["数据、张量、流水线并行与 ZeRO"], "id": "d32"}, {"topic": "注意力", "q": "什么是 全注意力 Full Attention？", "tag": "定义", "key": "每个位置的查询与序列里所有位置的键做点积，softmax 归一化后对值加权求和", "a": ["每个位置的查询与序列里所有位置的键做点积，softmax 归一化后对值加权求和。", "计算量与 KV 缓存都随序列长度平方增长，长上下文的主要瓶颈就在这里。"], "terms": ["全注意力 Full Attention"], "id": "d33"}, {"topic": "注意力", "q": "什么是 自注意力与交叉注意力？", "tag": "定义", "key": "自注意力的查询、键、值来自同一序列，交叉注意力的查询来自一个序列，键和值来自另一个序列", "a": ["自注意力的查询、键、值来自同一序列，交叉注意力的查询来自一个序列，键和值来自另一个序列。", "键值序列长度可以与查询不同。"], "terms": ["自注意力与交叉注意力"], "id": "d34"}, {"topic": "注意力", "q": "什么是 因果与双向？", "tag": "定义", "key": "因果注意力用上三角掩码禁止看未来位置，双向注意力不加掩码", "a": ["因果注意力用上三角掩码禁止看未来位置，双向注意力不加掩码。", "解码器用因果，编码器用双向。", "BERT 是双向，GPT 是因果。", "生成任务必须因果，否则训练与推理不一致。"], "terms": ["因果与双向"], "id": "d35"}, {"topic": "注意力", "q": "什么是 MHA 多头？", "tag": "定义", "key": "把隐维切成 h 份，每份独立做注意力，再拼接后线性投影", "a": ["把隐维切成 h 份，每份独立做注意力，再拼接后线性投影。", "多头让模型在不同子空间关注不同关系。", "头数乘头维等于隐维，参数量与单头一致。"], "terms": ["MHA 多头"], "id": "d36"}, {"topic": "注意力", "q": "什么是 MQA 与 GQA？", "tag": "定义", "key": "MQA 让所有查询头共享一组键值头，GQA 折中，每组查询头共享一组键值头", "a": ["MQA 让所有查询头共享一组键值头，GQA 折中，每组查询头共享一组键值头。", "目的都是压缩 KV 缓存。", "缓存量按分组数缩减，代价是表达多样性下降。", "Llama 2 起普遍用 GQA。"], "terms": ["MQA 与 GQA"], "id": "d37"}, {"topic": "注意力", "q": "什么是 MLA 多头隐注意力？", "tag": "定义", "key": "把键值先投影到低维隐空间，缓存只存隐向量，用时再上投影还原各头键值", "a": ["把键值先投影到低维隐空间，缓存只存隐向量，用时再上投影还原各头键值。", "与 GQA 削减头数不同，MLA 压的是维度，各头仍有独立参数。", "与 RoPE 结合要另加一段各头共享的位置键，这段不参与压缩。", "DeepSeek-V2 每层每 token 只缓存 576 维。"], "terms": ["MLA 多头隐注意力"], "id": "d38"}, {"topic": "注意力", "q": "什么是 滑动窗口 Sliding Window？", "tag": "定义", "key": "每个位置只看固定长度窗口内的历史，复杂度与序列长度成线性", "a": ["每个位置只看固定长度窗口内的历史，复杂度与序列长度成线性。", "堆叠多层后感受野随层数线性扩展。", "Mistral 用它配合滚动缓存控制显存。"], "terms": ["滑动窗口 Sliding Window"], "id": "d39"}, {"topic": "注意力", "q": "什么是 稀疏注意力 Sparse Attention？", "tag": "定义", "key": "只计算注意力矩阵里的一部分位置，其余视为零", "a": ["只计算注意力矩阵里的一部分位置，其余视为零。", "分固定模式（条带、块、全局 token）与内容相关的动态选择两类。", "动态选择精度高但引入不可导的 top-k，难高效实现。"], "terms": ["稀疏注意力 Sparse Attention"], "id": "d40"}, {"topic": "注意力", "q": "什么是 线性注意力 Linear Attention？", "tag": "定义", "key": "用核函数替换 softmax，利用矩阵乘法结合律先算键值外积再与查询相乘，复杂度降为线性", "a": ["用核函数替换 softmax，利用矩阵乘法结合律先算键值外积再与查询相乘，复杂度降为线性。", "本质是把注意力写成可递推的状态更新，因此可以像 RNN 那样常数显存流式推理。", "代价是精确检索能力弱于 softmax 注意力。"], "terms": ["线性注意力 Linear Attention"], "id": "d41"}, {"topic": "注意力", "q": "什么是 混合注意力 Hybrid Attention？", "tag": "定义", "key": "在同一模型里按层交替使用线性注意力与全注意力，多数层走线性，少数层走全注意力", "a": ["在同一模型里按层交替使用线性注意力与全注意力，多数层走线性，少数层走全注意力。", "线性层负责长程压缩与吞吐，全注意力层负责精确回忆。", "Qwen3-Next 与 Qwen3.5 采用约 75% 线性配 25% 全注意力的交替。", "MiniMax-01、Jamba 属同一思路。", "这是当前长上下文架构的主流答案。"], "terms": ["混合注意力 Hybrid Attention"], "id": "d42"}, {"topic": "注意力", "q": "什么是 Gated Attention 门控注意力？", "tag": "定义", "key": "在注意力输出上乘一个由输入算出的 sigmoid 门，控制该路信息通过多少", "a": ["在注意力输出上乘一个由输入算出的 sigmoid 门，控制该路信息通过多少。", "Qwen3-Next 的做法是把查询投影输出翻倍，一半做查询一半做门控。", "作用是抑制注意力汇聚到无信息 token。"], "terms": ["Gated Attention 门控注意力"], "id": "d43"}, {"topic": "注意力", "q": "什么是 FlashAttention？", "tag": "定义", "key": "分块计算注意力并在片上累加，不把完整的注意力矩阵写回显存", "a": ["分块计算注意力并在片上累加，不把完整的注意力矩阵写回显存。", "它是精确算法不是近似，省的是访存不是计算量。", "复杂度仍是平方，但常数大幅下降且显存从平方降到线性。"], "terms": ["FlashAttentio
